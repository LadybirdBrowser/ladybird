<!DOCTYPE html>
<html>
<head>
  <meta name="fuzzy" content="maxDifference=0-3;totalPixels=0-8000">
  <style>
    html {
      scrollbar-width: none;
    }
    fieldset {
      margin: 0;
      padding: 20px;
      border: 6px solid black;
      font-size: 40px;
      background: linear-gradient(#6d98cc, #8a64e5);
      background-clip: text;
      color: transparent;
    }
    legend {
      color: black;
    }
  </style>
</head>
<body>
<fieldset><legend>Legend</legend>Hello fieldset text</fieldset>
</body>
</html>
