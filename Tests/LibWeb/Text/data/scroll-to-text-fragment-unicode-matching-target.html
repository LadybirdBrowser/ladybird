<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Unicode text-fragment matching target</title>
<style>
.target {
    margin-block: 2000px;
}
</style>
</head>
<body>
<p>Top of page</p>
<p class="target" id="accent">café</p>
<p class="target" id="canonical">résumé</p>
<p class="target" id="cjk">ウィキペディアへようこそ</p>
<script>
const params = new URLSearchParams(location.search);
const resultKey = params.get("resultKey");
if (resultKey) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
        const target = document.getElementById(params.get("target"));
        const rect = target.getBoundingClientRect();
        localStorage.setItem(resultKey, String(scrollY > 0 && rect.top >= 0 && rect.top <= innerHeight));
        close();
    }));
}
</script>
</body>
</html>
