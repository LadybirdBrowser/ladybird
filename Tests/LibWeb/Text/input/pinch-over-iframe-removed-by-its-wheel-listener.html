<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body {
        margin: 0;
    }

    iframe {
        display: block;
        width: 200px;
        height: 150px;
        border: none;
    }

    #spacer {
        height: 2000px;
    }
</style>
<iframe id="iframe" srcdoc="<!DOCTYPE html><body style='margin: 0; height: 50px;'>iframe</body>"></iframe>
<div id="spacer"></div>
<script>
    promiseTest(async () => {
        const iframe = document.getElementById("iframe");
        await new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));

        let parentWheelEventCount = 0;
        window.addEventListener("wheel", () => parentWheelEventCount++, { passive: true });
        let iframeWheelEventCount = 0;
        iframe.contentWindow.addEventListener("wheel", () => {
            iframeWheelEventCount++;
            iframe.remove();
        }, { passive: false });
        await animationFrame();
        await animationFrame();

        internals.pinch(50, 50, 0.5);
        const scaleAfterPinch = visualViewport.scale;
        internals.resetZoom();

        println(`iframe wheel event count: ${iframeWheelEventCount}`);
        println(`parent wheel event count: ${parentWheelEventCount}`);
        println(`iframe removed: ${iframe.parentNode === null}`);
        println(`scale after pinch: ${scaleAfterPinch.toFixed(2)}`);
        println(`scale after reset: ${visualViewport.scale.toFixed(2)}`);
    });
</script>
