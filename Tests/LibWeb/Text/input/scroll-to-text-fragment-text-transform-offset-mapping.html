<!doctype html>
<meta charset="utf-8">
<title>Text fragment offset mapping through text-transform</title>
<link rel="help" href="https://wicg.github.io/scroll-to-text-fragment/#get-boundary-point-at-index">
<script src="wpt-import/resources/testharness.js"></script>
<script src="wpt-import/resources/testharnessreport.js"></script>

<style>
    #target { margin-top: 2000px; }
</style>

<p id="target" style="text-transform: uppercase">straße</p>

<script>
promise_test(async () => {
    await new Promise(resolve => addEventListener("load", resolve, { once: true }));

    location.href = "#:~:text=STRASSE";
    await new Promise(resolve => requestAnimationFrame(resolve));
    assert_greater_than(scrollY, 0, "the transformed match was scrolled into view");
}, "A match expanded by text-transform maps to valid DOM boundary offsets");
</script>
