<script>
    test(() => {
        const nodeLines = dump => dump.split("\n").filter(line => /^\s+\[[sc]\d+.*\] (transform|clip)=/.test(line) || line.startsWith("FillRect"));
        println("Named in print order:");
        println(nodeLines(internals.dumpDisplayList()).join("\n"));
        println("Named by index:");
        println(nodeLines(internals.dumpDisplayList({ rawNodeIndices: true })).join("\n"));
    });
</script>
