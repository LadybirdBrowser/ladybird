<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    .row { display: flex; flex-wrap: wrap; width: 400px; }
    .box { position: relative; width: 60px; height: 40px; margin: 2px; border: 1px solid #ccc; }
    #outer { overflow: auto; }
    #inner { overflow: auto; width: 40px; height: 20px; }
    .tall { height: 200px; }
</style>
<body id="body">
<div id="row" class="row"></div>
<div id="second-row" class="row"></div>
<script>
function nestedElementScrollers() {
    const nodes = internals.recordedAsyncScrollingState().scrollNodes.filter(node => !node.isViewport);
    return nodes.filter(node => nodes.some(parent => parent.documentID === node.parentDocumentID && parent.scrollNodeIndex === node.parentScrollNodeIndex)).length;
}
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        for (const id of ["row", "second-row"]) {
            const row = document.getElementById(id);
            for (let i = 0; i < 3; ++i) {
                const box = document.createElement("div");
                box.id = `${id}-${i}`;
                box.className = "box";
                box.textContent = `B${i}`;
                row.appendChild(box);
            }
        }
        const outer = document.getElementById("row-1");
        outer.id = "outer";
        outer.innerHTML = '<div id="inner"><div id="inner-content" class="tall"></div></div><div id="filler"></div>';
    },
    steps: [
        {
            name: "quiet before scrollability change",
            check: equal => { equal(nestedElementScrollers(), 0, "inner has no element scroller parent"); },
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            name: "change an unrelated box",
            mutate: () => { document.getElementById("row-2").style.color = "red"; },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      Box<DIV>#row.row/descendants(background-and-borders) ASSEMBLE
                        Box<DIV>#row.row/background/hit-test COPY
                        Box<DIV>#row.row/scroll-metadata COPY
                        Box<DIV>#row.row/background COPY
                        Box<DIV>#row.row/border COPY
                        BlockContainer<DIV>#row-0.box/descendants(background-and-borders) COPY
                        BlockContainer<DIV>#outer.box/descendants(background-and-borders) COPY
                        BlockContainer<DIV>#row-2.box/descendants(background-and-borders) ASSEMBLE
                      Box<DIV>#second-row.row/descendants(background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      Box<DIV>#row.row/descendants(foreground) ASSEMBLE
                        Box<DIV>#row.row/foreground/hit-test COPY
                        Box<DIV>#row.row/foreground COPY
                        BlockContainer<DIV>#row-0.box/descendants(foreground) COPY
                        BlockContainer<DIV>#outer.box/descendants(foreground) COPY
                        BlockContainer<DIV>#row-2.box/descendants(foreground) ASSEMBLE
                        Box<DIV>#row.row/outline COPY
                        Box<DIV>#row.row/overlay/hit-test COPY
                        Box<DIV>#row.row/overlay COPY
                      Box<DIV>#second-row.row/descendants(foreground) COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#row-0.box COPY
                    BlockContainer<DIV>#outer.box COPY
                    BlockContainer<DIV>#row-2.box ASSEMBLE
                      BlockContainer<DIV>#row-2.box/background/hit-test COPY
                      BlockContainer<DIV>#row-2.box/scroll-metadata COPY
                      BlockContainer<DIV>#row-2.box/background SKIP
                      BlockContainer<DIV>#row-2.box/border RECORD
                      BlockContainer<DIV>#row-2.box/foreground/hit-test COPY
                      BlockContainer<DIV>#row-2.box/foreground RECORD
                      BlockContainer<DIV>#row-2.box/outline SKIP
                      BlockContainer<DIV>#row-2.box/overlay/hit-test COPY
                      BlockContainer<DIV>#row-2.box/overlay SKIP
                    BlockContainer<DIV>#second-row-0.box COPY
                    BlockContainer<DIV>#second-row-1.box COPY
                    BlockContainer<DIV>#second-row-2.box COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "make outer scrollable",
            mutate: () => { filler.className = "tall"; },
            check: equal => { equal(nestedElementScrollers(), 1, "inner reports outer as its parent"); },
            expect: `
                damage: rows=8 moved=0 order=1 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      Box<DIV>#row.row/descendants(background-and-borders) REPLAN
                        Box<DIV>#row.row/background/hit-test COPY
                        Box<DIV>#row.row/scroll-metadata COPY
                        Box<DIV>#row.row/background COPY
                        Box<DIV>#row.row/border COPY
                        BlockContainer<DIV>#row-0.box/descendants(background-and-borders) COPY
                        BlockContainer<DIV>#outer.box/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#row-2.box/descendants(background-and-borders) COPY
                      Box<DIV>#second-row.row/descendants(background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      Box<DIV>#row.row/descendants(foreground) REPLAN
                        Box<DIV>#row.row/foreground/hit-test COPY
                        Box<DIV>#row.row/foreground COPY
                        BlockContainer<DIV>#row-0.box/descendants(foreground) COPY
                        BlockContainer<DIV>#outer.box/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#row-2.box/descendants(foreground) COPY
                        Box<DIV>#row.row/outline COPY
                        Box<DIV>#row.row/overlay/hit-test COPY
                        Box<DIV>#row.row/overlay COPY
                      Box<DIV>#second-row.row/descendants(foreground) COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#row-0.box COPY
                    BlockContainer<DIV>#outer.box ASSEMBLE
                      BlockContainer<DIV>#outer.box/background/hit-test RECORD
                      BlockContainer<DIV>#outer.box/scroll-metadata RECORD
                      BlockContainer<DIV>#outer.box/background SKIP
                      BlockContainer<DIV>#outer.box/border RECORD
                      BlockContainer<DIV>#inner/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#inner/background/hit-test RECORD
                        BlockContainer<DIV>#inner/scroll-metadata RECORD
                        BlockContainer<DIV>#inner/background SKIP
                        BlockContainer<DIV>#inner/border SKIP
                        BlockContainer<DIV>#inner-content.tall/descendants(background-and-borders) ASSEMBLE
                          BlockContainer<DIV>#inner-content.tall/background/hit-test COPY
                          BlockContainer<DIV>#inner-content.tall/scroll-metadata RECORD
                          BlockContainer<DIV>#inner-content.tall/background COPY
                          BlockContainer<DIV>#inner-content.tall/border COPY
                      BlockContainer<DIV>#filler.tall/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#filler.tall/background/hit-test RECORD
                        BlockContainer<DIV>#filler.tall/scroll-metadata RECORD
                        BlockContainer<DIV>#filler.tall/background SKIP
                        BlockContainer<DIV>#filler.tall/border SKIP
                      BlockContainer<DIV>#inner/descendants(floats) ASSEMBLE
                        BlockContainer<DIV>#inner-content.tall/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#filler.tall/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#inner/descendants(inline-background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#inner-content.tall/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#filler.tall/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#outer.box/foreground/hit-test RECORD (empty)
                      BlockContainer<DIV>#outer.box/foreground RECORD (empty)
                      BlockContainer<DIV>#inner/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#inner/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#inner/foreground RECORD (empty)
                        BlockContainer<DIV>#inner-content.tall/descendants(foreground) ASSEMBLE
                          BlockContainer<DIV>#inner-content.tall/foreground/hit-test COPY
                          BlockContainer<DIV>#inner-content.tall/foreground COPY
                          BlockContainer<DIV>#inner-content.tall/outline COPY
                          BlockContainer<DIV>#inner-content.tall/overlay/hit-test COPY
                          BlockContainer<DIV>#inner-content.tall/overlay COPY
                        BlockContainer<DIV>#inner/outline SKIP
                        BlockContainer<DIV>#inner/overlay/hit-test RECORD
                        BlockContainer<DIV>#inner/overlay RECORD
                      BlockContainer<DIV>#filler.tall/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#filler.tall/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#filler.tall/foreground RECORD (empty)
                        BlockContainer<DIV>#filler.tall/outline SKIP
                        BlockContainer<DIV>#filler.tall/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#filler.tall/overlay SKIP
                      BlockContainer<DIV>#outer.box/outline SKIP
                      BlockContainer<DIV>#outer.box/overlay/hit-test RECORD
                      BlockContainer<DIV>#outer.box/overlay RECORD
                    BlockContainer<DIV>#row-2.box COPY
                    BlockContainer<DIV>#second-row-0.box COPY
                    BlockContainer<DIV>#second-row-1.box COPY
                    BlockContainer<DIV>#second-row-2.box COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "insert scrollable box in second row",
            mutate: () => { const inserted = document.createElement("div"); inserted.id = "inserted"; inserted.className = "box"; inserted.style.overflow = "hidden"; inserted.innerHTML = '<div id="inserted-content" class="tall"></div>'; document.getElementById("second-row-1").after(inserted); },
            expect: `
                damage: rows=7 moved=3 order=4 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html REPLAN
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      Box<DIV>#row.row/descendants(background-and-borders) COPY
                      Box<DIV>#second-row.row/descendants(background-and-borders) REPLAN
                        Box<DIV>#second-row.row/background/hit-test COPY
                        Box<DIV>#second-row.row/scroll-metadata COPY
                        Box<DIV>#second-row.row/background COPY
                        Box<DIV>#second-row.row/border COPY
                        BlockContainer<DIV>#second-row-0.box/descendants(background-and-borders) COPY
                        BlockContainer<DIV>#second-row-1.box/descendants(background-and-borders) COPY
                        BlockContainer<DIV>#inserted.box/descendants(background-and-borders) RECORD
                        BlockContainer<DIV>#second-row-2.box/descendants(background-and-borders) ASSEMBLE
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      Box<DIV>#row.row/descendants(foreground) COPY
                      Box<DIV>#second-row.row/descendants(foreground) REPLAN
                        Box<DIV>#second-row.row/foreground/hit-test COPY
                        Box<DIV>#second-row.row/foreground COPY
                        BlockContainer<DIV>#second-row-0.box/descendants(foreground) COPY
                        BlockContainer<DIV>#second-row-1.box/descendants(foreground) COPY
                        BlockContainer<DIV>#inserted.box/descendants(foreground) RECORD
                        BlockContainer<DIV>#second-row-2.box/descendants(foreground) ASSEMBLE
                        Box<DIV>#second-row.row/outline COPY
                        Box<DIV>#second-row.row/overlay/hit-test COPY
                        Box<DIV>#second-row.row/overlay COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#row-0.box COPY
                    BlockContainer<DIV>#outer.box COPY
                    BlockContainer<DIV>#row-2.box COPY
                    BlockContainer<DIV>#second-row-0.box COPY
                    BlockContainer<DIV>#second-row-1.box COPY
                    BlockContainer<DIV>#inserted.box RECORD
                      BlockContainer<DIV>#inserted.box/background/hit-test RECORD
                      BlockContainer<DIV>#inserted.box/scroll-metadata RECORD
                      BlockContainer<DIV>#inserted.box/background SKIP
                      BlockContainer<DIV>#inserted.box/border RECORD
                      BlockContainer<DIV>#inserted-content.tall/descendants(background-and-borders) RECORD
                        BlockContainer<DIV>#inserted-content.tall/background/hit-test RECORD
                        BlockContainer<DIV>#inserted-content.tall/scroll-metadata RECORD
                        BlockContainer<DIV>#inserted-content.tall/background SKIP
                        BlockContainer<DIV>#inserted-content.tall/border SKIP
                      BlockContainer<DIV>#inserted-content.tall/descendants(floats) RECORD
                      BlockContainer<DIV>#inserted-content.tall/descendants(inline-background-and-borders) RECORD
                      BlockContainer<DIV>#inserted.box/foreground/hit-test RECORD (empty)
                      BlockContainer<DIV>#inserted.box/foreground RECORD (empty)
                      BlockContainer<DIV>#inserted-content.tall/descendants(foreground) RECORD
                        BlockContainer<DIV>#inserted-content.tall/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#inserted-content.tall/foreground RECORD (empty)
                        BlockContainer<DIV>#inserted-content.tall/outline SKIP
                        BlockContainer<DIV>#inserted-content.tall/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#inserted-content.tall/overlay SKIP
                      BlockContainer<DIV>#inserted.box/outline SKIP
                      BlockContainer<DIV>#inserted.box/overlay/hit-test RECORD (empty)
                      BlockContainer<DIV>#inserted.box/overlay RECORD (empty)
                    BlockContainer<DIV>#second-row-2.box ASSEMBLE
                      BlockContainer<DIV>#second-row-2.box/background/hit-test RECORD
                      BlockContainer<DIV>#second-row-2.box/scroll-metadata RECORD
                      BlockContainer<DIV>#second-row-2.box/background SKIP
                      BlockContainer<DIV>#second-row-2.box/border RECORD
                      BlockContainer<DIV>#second-row-2.box/foreground/hit-test RECORD
                      BlockContainer<DIV>#second-row-2.box/foreground RECORD
                      BlockContainer<DIV>#second-row-2.box/outline SKIP
                      BlockContainer<DIV>#second-row-2.box/overlay/hit-test RECORD (empty)
                      BlockContainer<DIV>#second-row-2.box/overlay SKIP
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        }
    ]
});
</script>
