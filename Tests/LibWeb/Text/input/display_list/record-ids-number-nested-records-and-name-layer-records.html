<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; }
    canvas { position: absolute; left: 20px; top: 20px; }
    #below { position: absolute; left: 0; top: 0; width: 300px; height: 10px; background: green; }
    #masked { position: absolute; left: 600px; top: 530px; width: 50px; height: 50px; background: blue; mask-image: linear-gradient(black, transparent); }
    #over { position: absolute; left: 100px; top: 60px; width: 40px; height: 500px; background: rgba(255, 255, 255, 0.5); }
</style>
<div id="below"></div>
<canvas id="canvas" width="200" height="120"></canvas>
<div id="masked"></div>
<div id="over"></div>
<script>
    test(() => {
        const context = canvas.getContext("2d");
        context.fillStyle = "blue";
        context.fillRect(0, 0, canvas.width, canvas.height);
        const dump = internals.dumpDisplayList({ recordIds: true });
        println(dump.slice(dump.indexOf("\nLayers") + 1));
    });
</script>
