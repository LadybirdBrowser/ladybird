<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; }
    canvas { position: absolute; top: 20px; }
    #left { left: 20px; }
    #right { left: 300px; }
    #over-both { position: absolute; left: 100px; top: 60px; width: 300px; height: 40px; background: rgba(255, 255, 255, 0.5); }
    #over-right { position: absolute; left: 400px; top: 100px; width: 50px; height: 20px; background: green; }
</style>
<canvas id="left" width="200" height="120"></canvas>
<canvas id="right" width="200" height="120"></canvas>
<div id="over-both"></div>
<div id="over-right"></div>
<script>
    test(() => {
        for (const canvas of document.querySelectorAll("canvas")) {
            const context = canvas.getContext("2d");
            context.fillStyle = "blue";
            context.fillRect(0, 0, canvas.width, canvas.height);
        }
        println(internals.dumpDisplayList());
    });
</script>
