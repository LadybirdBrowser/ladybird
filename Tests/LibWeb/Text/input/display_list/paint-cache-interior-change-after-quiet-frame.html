<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #container { display: flow-root; padding: 4px; }
    .card { display: flow-root; margin: 0 0 4px; padding: 4px; border: 1px solid #ccc; }
</style>
<body id="body">
<div id="container"></div>
<script>
displayListTest({
    setup: () => {
        removeBodyWhitespace();
        for (let i = 0; i < 2; ++i) {
            const card = document.createElement("div");
            card.id = `card${i}`;
            card.className = "card";
            card.textContent = `Card ${i}`;
            container.appendChild(card);
        }
    },
    steps: [
        {
            name: "first interior change",
            mutate: () => { card0.style.color = "red"; },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#container/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#container/background/hit-test COPY
                        BlockContainer<DIV>#container/scroll-metadata COPY
                        BlockContainer<DIV>#container/background COPY
                        BlockContainer<DIV>#container/border COPY
                        BlockContainer<DIV>#card0.card/descendants(background-and-borders) ASSEMBLE
                          BlockContainer<DIV>#card0.card/background/hit-test COPY
                          BlockContainer<DIV>#card0.card/scroll-metadata COPY
                          BlockContainer<DIV>#card0.card/background SKIP
                          BlockContainer<DIV>#card0.card/border RECORD
                        BlockContainer<DIV>#card1.card/descendants(background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#container/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#container/foreground/hit-test COPY
                        BlockContainer<DIV>#container/foreground COPY
                        BlockContainer<DIV>#card0.card/descendants(foreground) ASSEMBLE
                          BlockContainer<DIV>#card0.card/foreground/hit-test COPY
                          BlockContainer<DIV>#card0.card/foreground RECORD
                          BlockContainer<DIV>#card0.card/outline SKIP
                          BlockContainer<DIV>#card0.card/overlay/hit-test COPY
                          BlockContainer<DIV>#card0.card/overlay SKIP
                        BlockContainer<DIV>#card1.card/descendants(foreground) COPY
                        BlockContainer<DIV>#container/outline COPY
                        BlockContainer<DIV>#container/overlay/hit-test COPY
                        BlockContainer<DIV>#container/overlay COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "quiet recording",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            name: "second interior change",
            mutate: () => { card0.style.color = "blue"; },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#container/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#container/background/hit-test COPY
                        BlockContainer<DIV>#container/scroll-metadata COPY
                        BlockContainer<DIV>#container/background COPY
                        BlockContainer<DIV>#container/border COPY
                        BlockContainer<DIV>#card0.card/descendants(background-and-borders) ASSEMBLE
                          BlockContainer<DIV>#card0.card/background/hit-test COPY
                          BlockContainer<DIV>#card0.card/scroll-metadata COPY
                          BlockContainer<DIV>#card0.card/background SKIP
                          BlockContainer<DIV>#card0.card/border RECORD
                        BlockContainer<DIV>#card1.card/descendants(background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#container/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#container/foreground/hit-test COPY
                        BlockContainer<DIV>#container/foreground COPY
                        BlockContainer<DIV>#card0.card/descendants(foreground) ASSEMBLE
                          BlockContainer<DIV>#card0.card/foreground/hit-test COPY
                          BlockContainer<DIV>#card0.card/foreground RECORD
                          BlockContainer<DIV>#card0.card/outline SKIP
                          BlockContainer<DIV>#card0.card/overlay/hit-test COPY
                          BlockContainer<DIV>#card0.card/overlay SKIP
                        BlockContainer<DIV>#card1.card/descendants(foreground) COPY
                        BlockContainer<DIV>#container/outline COPY
                        BlockContainer<DIV>#container/overlay/hit-test COPY
                        BlockContainer<DIV>#container/overlay COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        }
    ]
});
</script>
