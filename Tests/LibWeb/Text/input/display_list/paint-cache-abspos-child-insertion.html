<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #container { position: relative; width: 300px; height: 100px; background: silver; }
    #existing, #sibling { position: relative; width: 100px; height: 40px; background: blue; }
    #inserted { position: absolute; left: 160px; top: 20px; width: 100px; height: 20px; background: green; }
</style>
<body id="body">
<div id="container"><div id="existing">Existing</div></div>
<div id="sibling">Sibling</div>
<script>
let previousLayoutCount;
const insertionStep = {
    // The new child fits inside its containing block without moving existing boxes
    // or changing overflow. Only its own paint and hit-test items need recording.
    name: "abspos insertion reuses all existing paint",
    mutate: () => {
        previousLayoutCount = internals.fullLayoutCount() + internals.partialLayoutCount();
        const inserted = document.createElement("div");
        inserted.id = "inserted";
        inserted.textContent = "New child";
        container.appendChild(inserted);
    },
    check: equal => {
        const layoutCount = internals.fullLayoutCount() + internals.partialLayoutCount();
        equal(layoutCount > previousLayoutCount, true, "insertion performed layout");
        equal(container.getBoundingClientRect().height, 100, "container height");
        equal(existing.getBoundingClientRect().top, 0, "existing child position");
        equal(sibling.getBoundingClientRect().top, 100, "sibling position");
        equal(document.elementFromPoint(170, 30).id, "inserted", "inserted child hit target");
    },
    expect: `
        damage: rows=5 moved=1 order=3 eligibility=0 all=false
        @canvas RECORD (empty)
        @viewport ASSEMBLE
          @viewport/preamble COPY
          @viewport/background/hit-test COPY
          @viewport/scroll-metadata COPY
          @viewport/background COPY
          @viewport/border COPY
          BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
          @viewport/foreground/hit-test COPY
          @viewport/foreground COPY
          BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
          BlockContainer<HTML>#html REPLAN
            BlockContainer<HTML>#html/preamble COPY
            BlockContainer<HTML>#html/background/hit-test COPY
            BlockContainer<HTML>#html/scroll-metadata COPY
            BlockContainer<HTML>#html/background COPY
            BlockContainer<HTML>#html/border COPY
            BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
              BlockContainer<BODY>#body/background/hit-test COPY
              BlockContainer<BODY>#body/scroll-metadata COPY
              BlockContainer<BODY>#body/background COPY
              BlockContainer<BODY>#body/border COPY
              BlockContainer<DIV>#container/descendants(background-and-borders) REPLAN
              BlockContainer<DIV>#sibling/descendants(background-and-borders) COPY
            BlockContainer<HTML>#html/foreground/hit-test COPY
            BlockContainer<HTML>#html/foreground COPY
            BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
              BlockContainer<BODY>#body/foreground/hit-test COPY
              BlockContainer<BODY>#body/foreground COPY
              BlockContainer<DIV>#container/descendants(foreground) REPLAN
              BlockContainer<DIV>#sibling/descendants(foreground) COPY
              BlockContainer<BODY>#body/outline COPY
              BlockContainer<BODY>#body/overlay/hit-test COPY
              BlockContainer<BODY>#body/overlay COPY
            BlockContainer<DIV>#container REPLAN
              BlockContainer<DIV>#container/background/hit-test COPY
              BlockContainer<DIV>#container/scroll-metadata COPY
              BlockContainer<DIV>#container/background COPY
              BlockContainer<DIV>#container/border COPY
              BlockContainer<DIV>#existing/descendants(background-and-borders) COPY
              BlockContainer<DIV>#inserted/descendants(background-and-borders) RECORD
              BlockContainer<DIV>#existing/descendants(floats) COPY
              BlockContainer<DIV>#inserted/descendants(floats) RECORD
              BlockContainer<DIV>#existing/descendants(inline-background-and-borders) COPY
              BlockContainer<DIV>#inserted/descendants(inline-background-and-borders) RECORD
              BlockContainer<DIV>#container/foreground/hit-test COPY
              BlockContainer<DIV>#container/foreground COPY
              BlockContainer<DIV>#existing/descendants(foreground) COPY
              BlockContainer<DIV>#inserted/descendants(foreground) RECORD
              BlockContainer<DIV>#container/outline COPY
              BlockContainer<DIV>#container/overlay/hit-test COPY
              BlockContainer<DIV>#container/overlay COPY
            BlockContainer<DIV>#existing COPY
            BlockContainer<DIV>#inserted RECORD
              BlockContainer<DIV>#inserted/background/hit-test RECORD
              BlockContainer<DIV>#inserted/scroll-metadata RECORD (empty)
              BlockContainer<DIV>#inserted/background RECORD
              BlockContainer<DIV>#inserted/border SKIP
              BlockContainer<DIV>#inserted/foreground/hit-test RECORD
              BlockContainer<DIV>#inserted/foreground RECORD
              BlockContainer<DIV>#inserted/outline SKIP
              BlockContainer<DIV>#inserted/overlay/hit-test RECORD (empty)
              BlockContainer<DIV>#inserted/overlay SKIP
            BlockContainer<DIV>#sibling COPY
            BlockContainer<HTML>#html/outline COPY
          @viewport/outline COPY
    `,
};
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet before abspos insertion",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `,
        },
        insertionStep,
        {
            name: "quiet after abspos insertion",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `,
        },
        {
            name: "abspos removal reuses all remaining paint",
            mutate: () => { inserted.remove(); },
            check: equal => {
                equal(sibling.getBoundingClientRect().top, 100, "sibling position");
                equal(document.elementFromPoint(170, 30).id, "container", "removed child no longer hit");
            },
            expect: `
                damage: rows=4 moved=0 order=2 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html REPLAN
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#container/descendants(background-and-borders) REPLAN
                      BlockContainer<DIV>#sibling/descendants(background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#container/descendants(foreground) REPLAN
                      BlockContainer<DIV>#sibling/descendants(foreground) COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#container REPLAN
                      BlockContainer<DIV>#container/background/hit-test COPY
                      BlockContainer<DIV>#container/scroll-metadata COPY
                      BlockContainer<DIV>#container/background COPY
                      BlockContainer<DIV>#container/border COPY
                      BlockContainer<DIV>#existing/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#existing/descendants(floats) COPY
                      BlockContainer<DIV>#existing/descendants(inline-background-and-borders) COPY
                      BlockContainer<DIV>#container/foreground/hit-test COPY
                      BlockContainer<DIV>#container/foreground COPY
                      BlockContainer<DIV>#existing/descendants(foreground) COPY
                      BlockContainer<DIV>#container/outline COPY
                      BlockContainer<DIV>#container/overlay/hit-test COPY
                      BlockContainer<DIV>#container/overlay COPY
                    BlockContainer<DIV>#existing COPY
                    BlockContainer<DIV>#sibling COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `,
        },
        {
            name: "quiet after abspos removal",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `,
        },
        { ...insertionStep, name: "abspos reinsertion after quiet frame reuses all existing paint" },
    ],
});
</script>
