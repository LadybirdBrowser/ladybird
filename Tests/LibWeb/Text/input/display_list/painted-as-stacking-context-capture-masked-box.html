<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #root { position: relative; width: 200px; mask-image: linear-gradient(black, transparent); }
    .row { height: 20px; }
</style>
<body id="body">
<div id="root"><div class="row" id="r0">R 0</div><div class="row" id="r1">R 1</div><div class="row" id="r2">R 2</div></div>
<script>
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet masked root",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) COPY
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) COPY
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) COPY
                    BlockContainer<DIV>#root ASSEMBLE
                      BlockContainer<DIV>#root/preamble RECORD
                        BlockContainer<DIV>#root/css-mask RECORD
                      BlockContainer<DIV>#root/background/hit-test COPY
                      BlockContainer<DIV>#root/scroll-metadata COPY
                      BlockContainer<DIV>#root/background COPY
                      BlockContainer<DIV>#root/border COPY
                      BlockContainer<DIV>#r0.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#r1.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#r2.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#root/foreground/hit-test COPY
                      BlockContainer<DIV>#root/foreground COPY
                      BlockContainer<DIV>#r0.row/descendants(foreground) COPY
                      BlockContainer<DIV>#r1.row/descendants(foreground) COPY
                      BlockContainer<DIV>#r2.row/descendants(foreground) COPY
                      BlockContainer<DIV>#root/outline COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "change inside masked root",
            mutate: () => { r1.style.color = "red"; },
            check: equal => { equal(document.elementFromPoint(10, 30).id, "r1", "hit target"); },
            expect: `
                damage: rows=5 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#root/descendants(background-and-borders) ASSEMBLE
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#root/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#root ASSEMBLE
                      BlockContainer<DIV>#root/preamble RECORD
                        BlockContainer<DIV>#root/css-mask RECORD
                      BlockContainer<DIV>#root/background/hit-test COPY
                      BlockContainer<DIV>#root/scroll-metadata COPY
                      BlockContainer<DIV>#root/background COPY
                      BlockContainer<DIV>#root/border COPY
                      BlockContainer<DIV>#r0.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#r1.row/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#r1.row/background/hit-test COPY
                        BlockContainer<DIV>#r1.row/scroll-metadata COPY
                        BlockContainer<DIV>#r1.row/background SKIP
                        BlockContainer<DIV>#r1.row/border SKIP
                      BlockContainer<DIV>#r2.row/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#root/foreground/hit-test COPY
                      BlockContainer<DIV>#root/foreground COPY
                      BlockContainer<DIV>#r0.row/descendants(foreground) COPY
                      BlockContainer<DIV>#r1.row/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#r1.row/foreground/hit-test COPY
                        BlockContainer<DIV>#r1.row/foreground RECORD
                        BlockContainer<DIV>#r1.row/outline SKIP
                        BlockContainer<DIV>#r1.row/overlay/hit-test COPY
                        BlockContainer<DIV>#r1.row/overlay SKIP
                      BlockContainer<DIV>#r2.row/descendants(foreground) COPY
                      BlockContainer<DIV>#root/outline COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        }
    ]
});
</script>
