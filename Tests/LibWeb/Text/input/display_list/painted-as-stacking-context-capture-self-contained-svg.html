<!doctype html>
<script src="../include.js"></script>
<style>
    body { margin: 0; }
    #root { position: relative; width: 100px; }
    svg { display: block; }
</style>
<div id="root"><svg width="100" height="100"><path id="p" d="M10 10h80v80h-80z" fill="red" stroke="blue"/><circle cx="50" cy="50" r="20" fill="green"/></svg></div>
<script>
    test(() => {
        internals.asyncScrollingState();
        internals.asyncScrollingState();
        const visitedQuiet = internals.paintCacheCaptureSiteVisitCount();

        p.setAttribute("fill", "blue");
        internals.asyncScrollingState();
        const visitedAfterChange = internals.paintCacheCaptureSiteVisitCount();
        const hit = document.elementFromPoint(15, 15).id;

        internals.asyncScrollingState();
        const visitedQuietAgain = internals.paintCacheCaptureSiteVisitCount();

        println(`quiet recording visits only the viewport root: ${visitedQuiet === 1}`);
        println(`a fill change walks the svg: ${visitedAfterChange > 1}`);
        println(`the path is hit-testable after the change: ${hit}`);
        println(`the next quiet recording hits the viewport root again: ${visitedQuietAgain === 1}`);
    });
</script>
