<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #box { width: 200px; }
    #floater { width: 50px; height: 20px; background: silver; }
</style>
<body id="body">
<div id="box"><div id="floater"></div><div id="text">text after</div></div>
<script>
// Floating a child moves it into the floats phase of its block, so the block's phases are
// replanned and the text that flows around it records at its new position.
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet before floating",
            check: equal => { equal(document.elementFromPoint(60, 10).id, "box", "hit target"); },
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            name: "float the child",
            mutate: () => { floater.style.float = "left"; },
            check: equal => { equal(document.elementFromPoint(60, 10).id, "text", "hit target"); },
            expect: `
                damage: rows=6 moved=3 order=5 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html REPLAN
                    BlockContainer<HTML>#html/preamble RECORD (empty)
                    BlockContainer<HTML>#html/background/hit-test RECORD
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<HTML>#html/background RECORD (empty)
                    BlockContainer<HTML>#html/border SKIP
                    BlockContainer<BODY>#body/descendants(background-and-borders) REPLAN
                      BlockContainer<BODY>#body/background/hit-test RECORD
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                      BlockContainer<BODY>#body/background SKIP
                      BlockContainer<BODY>#body/border SKIP
                      BlockContainer<DIV>#box/descendants(background-and-borders) RECORD
                        BlockContainer<DIV>#box/background/hit-test RECORD
                        BlockContainer<DIV>#box/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#box/background SKIP
                        BlockContainer<DIV>#box/border SKIP
                        BlockContainer<DIV>#floater/descendants(background-and-borders) RECORD
                        BlockContainer<DIV>#text/descendants(background-and-borders) RECORD
                          BlockContainer<DIV>#text/background/hit-test RECORD
                          BlockContainer<DIV>#text/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#text/background SKIP
                          BlockContainer<DIV>#text/border SKIP
                    BlockContainer<BODY>#body/descendants(floats) RECORD
                      BlockContainer<DIV>#box/descendants(floats) RECORD
                        BlockContainer<DIV>#floater/descendants(floats) RECORD
                          BlockContainer<DIV>#floater/background/hit-test RECORD
                          BlockContainer<DIV>#floater/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#floater/background RECORD
                          BlockContainer<DIV>#floater/border SKIP
                          BlockContainer<DIV>#floater/foreground/hit-test RECORD (empty)
                          BlockContainer<DIV>#floater/foreground RECORD (empty)
                          BlockContainer<DIV>#floater/outline SKIP
                          BlockContainer<DIV>#floater/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#floater/overlay SKIP
                        BlockContainer<DIV>#text/descendants(floats) RECORD
                    BlockContainer<HTML>#html/foreground/hit-test RECORD (empty)
                    BlockContainer<HTML>#html/foreground RECORD (empty)
                    BlockContainer<BODY>#body/descendants(foreground) REPLAN
                      BlockContainer<BODY>#body/foreground/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/foreground RECORD (empty)
                      BlockContainer<DIV>#box/descendants(foreground) RECORD
                        BlockContainer<DIV>#box/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#box/foreground RECORD (empty)
                        BlockContainer<DIV>#floater/descendants(foreground) RECORD
                        BlockContainer<DIV>#text/descendants(foreground) RECORD
                          BlockContainer<DIV>#text/foreground/hit-test RECORD
                          BlockContainer<DIV>#text/foreground RECORD
                          BlockContainer<DIV>#text/outline SKIP
                          BlockContainer<DIV>#text/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#text/overlay SKIP
                        BlockContainer<DIV>#box/outline SKIP
                        BlockContainer<DIV>#box/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#box/overlay SKIP
                      BlockContainer<BODY>#body/outline SKIP
                      BlockContainer<BODY>#body/overlay/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/overlay SKIP
                    BlockContainer<HTML>#html/outline SKIP
                  @viewport/outline COPY
            `
        },
        {
            name: "unfloat the child",
            mutate: () => { floater.style.float = "none"; },
            check: equal => { equal(document.elementFromPoint(60, 10).id, "box", "hit target"); },
            expect: `
                damage: rows=6 moved=3 order=5 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html REPLAN
                    BlockContainer<HTML>#html/preamble RECORD (empty)
                    BlockContainer<HTML>#html/background/hit-test RECORD
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<HTML>#html/background RECORD (empty)
                    BlockContainer<HTML>#html/border SKIP
                    BlockContainer<BODY>#body/descendants(background-and-borders) REPLAN
                      BlockContainer<BODY>#body/background/hit-test RECORD
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                      BlockContainer<BODY>#body/background SKIP
                      BlockContainer<BODY>#body/border SKIP
                      BlockContainer<DIV>#box/descendants(background-and-borders) RECORD
                        BlockContainer<DIV>#box/background/hit-test RECORD
                        BlockContainer<DIV>#box/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#box/background SKIP
                        BlockContainer<DIV>#box/border SKIP
                        BlockContainer<DIV>#floater/descendants(background-and-borders) RECORD
                          BlockContainer<DIV>#floater/background/hit-test RECORD
                          BlockContainer<DIV>#floater/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#floater/background RECORD
                          BlockContainer<DIV>#floater/border SKIP
                        BlockContainer<DIV>#text/descendants(background-and-borders) RECORD
                          BlockContainer<DIV>#text/background/hit-test RECORD
                          BlockContainer<DIV>#text/scroll-metadata RECORD (empty)
                          BlockContainer<DIV>#text/background SKIP
                          BlockContainer<DIV>#text/border SKIP
                    BlockContainer<HTML>#html/foreground/hit-test RECORD (empty)
                    BlockContainer<HTML>#html/foreground RECORD (empty)
                    BlockContainer<BODY>#body/descendants(foreground) REPLAN
                      BlockContainer<BODY>#body/foreground/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/foreground RECORD (empty)
                      BlockContainer<DIV>#box/descendants(foreground) RECORD
                        BlockContainer<DIV>#box/foreground/hit-test RECORD (empty)
                        BlockContainer<DIV>#box/foreground RECORD (empty)
                        BlockContainer<DIV>#floater/descendants(foreground) RECORD
                          BlockContainer<DIV>#floater/foreground/hit-test RECORD (empty)
                          BlockContainer<DIV>#floater/foreground RECORD (empty)
                          BlockContainer<DIV>#floater/outline SKIP
                          BlockContainer<DIV>#floater/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#floater/overlay SKIP
                        BlockContainer<DIV>#text/descendants(foreground) RECORD
                          BlockContainer<DIV>#text/foreground/hit-test RECORD
                          BlockContainer<DIV>#text/foreground RECORD
                          BlockContainer<DIV>#text/outline SKIP
                          BlockContainer<DIV>#text/overlay/hit-test RECORD (empty)
                          BlockContainer<DIV>#text/overlay SKIP
                        BlockContainer<DIV>#box/outline SKIP
                        BlockContainer<DIV>#box/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#box/overlay SKIP
                      BlockContainer<BODY>#body/outline SKIP
                      BlockContainer<BODY>#body/overlay/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/overlay SKIP
                    BlockContainer<HTML>#html/outline SKIP
                  @viewport/outline COPY
            `
        }
    ]
});
</script>
