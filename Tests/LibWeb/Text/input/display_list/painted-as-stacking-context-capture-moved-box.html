<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; font: 16px/20px monospace; }
    #a, #b { position: relative; width: 200px; }
    .row { height: 20px; }
</style>
<body id="body">
<div id="a"><div class="row" id="a0">A 0</div><div class="row" id="a1">A 1</div></div>
<div id="b"><div class="row" id="b0">B 0</div><div class="row" id="b1">B 1</div><div class="row" id="b2">B 2</div></div>
<script>
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet before moving B",
            check: equal => { equal(document.elementFromPoint(10, 110).id, "html", "hit target"); },
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            // Moving B changes its absolute paint coordinates; A retains its entire capture.
            name: "move B",
            mutate: () => { b.style.top = "20px"; },
            check: equal => { equal(document.elementFromPoint(10, 110).id, "b2", "hit target"); },
            expect: `
                damage: rows=4 moved=1 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata RECORD (empty)
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata RECORD (empty)
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#a/descendants(background-and-borders) COPY
                      BlockContainer<DIV>#b/descendants(background-and-borders) ASSEMBLE
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#a/descendants(foreground) COPY
                      BlockContainer<DIV>#b/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test RECORD (empty)
                      BlockContainer<BODY>#body/overlay SKIP
                    BlockContainer<DIV>#a COPY
                    BlockContainer<DIV>#b ASSEMBLE
                      BlockContainer<DIV>#b/background/hit-test RECORD
                      BlockContainer<DIV>#b/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#b/background SKIP
                      BlockContainer<DIV>#b/border SKIP
                      BlockContainer<DIV>#b0.row/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#b0.row/background/hit-test RECORD
                        BlockContainer<DIV>#b0.row/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#b0.row/background SKIP
                        BlockContainer<DIV>#b0.row/border SKIP
                      BlockContainer<DIV>#b1.row/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#b1.row/background/hit-test RECORD
                        BlockContainer<DIV>#b1.row/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#b1.row/background SKIP
                        BlockContainer<DIV>#b1.row/border SKIP
                      BlockContainer<DIV>#b2.row/descendants(background-and-borders) ASSEMBLE
                        BlockContainer<DIV>#b2.row/background/hit-test RECORD
                        BlockContainer<DIV>#b2.row/scroll-metadata RECORD (empty)
                        BlockContainer<DIV>#b2.row/background SKIP
                        BlockContainer<DIV>#b2.row/border SKIP
                      BlockContainer<DIV>#b0.row/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#b1.row/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#b2.row/descendants(floats) ASSEMBLE
                      BlockContainer<DIV>#b0.row/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#b1.row/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#b2.row/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#b/foreground/hit-test RECORD (empty)
                      BlockContainer<DIV>#b/foreground RECORD (empty)
                      BlockContainer<DIV>#b0.row/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#b0.row/foreground/hit-test RECORD
                        BlockContainer<DIV>#b0.row/foreground RECORD
                        BlockContainer<DIV>#b0.row/outline SKIP
                        BlockContainer<DIV>#b0.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b0.row/overlay SKIP
                      BlockContainer<DIV>#b1.row/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#b1.row/foreground/hit-test RECORD
                        BlockContainer<DIV>#b1.row/foreground RECORD
                        BlockContainer<DIV>#b1.row/outline SKIP
                        BlockContainer<DIV>#b1.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b1.row/overlay SKIP
                      BlockContainer<DIV>#b2.row/descendants(foreground) ASSEMBLE
                        BlockContainer<DIV>#b2.row/foreground/hit-test RECORD
                        BlockContainer<DIV>#b2.row/foreground RECORD
                        BlockContainer<DIV>#b2.row/outline SKIP
                        BlockContainer<DIV>#b2.row/overlay/hit-test RECORD (empty)
                        BlockContainer<DIV>#b2.row/overlay SKIP
                      BlockContainer<DIV>#b/outline SKIP
                      BlockContainer<DIV>#b/overlay/hit-test RECORD (empty)
                      BlockContainer<DIV>#b/overlay SKIP
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "quiet after moving B",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        }
    ]
});
</script>
