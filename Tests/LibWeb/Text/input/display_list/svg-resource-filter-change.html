<!doctype html>
<html id="html">
<script src="../include.js"></script>
<script src="recording-test.js"></script>
<style>
    body { margin: 0; }
    #filtered { width: 100px; height: 100px; filter: url(#f); }
    #other { width: 200px; height: 50px; background: blue; }
</style>
<body id="body">
<div id="filtered"></div><div id="other"></div>
<svg width="0" height="0"><filter id="f"><feFlood id="flood" flood-color="red"/></filter></svg>
<script>
// A content-generating SVG filter is triggered by a transparent fill over the filtered box's
// bounds. A quiet frame copies it, a size change records the preamble that paints it, and a
// change to the filter primitives pushes damage on the element using the filter.
displayListTest({
    setup: removeBodyWhitespace,
    steps: [
        {
            name: "quiet filtered box",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        },
        {
            name: "resize the filtered box",
            mutate: () => { filtered.style.width = "150px"; },
            expect: `
                damage: rows=4 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#filtered/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#other/descendants(background-and-borders) COPY
                      BlockContainer(anonymous)/descendants(background-and-borders) COPY
                    BlockContainer<BODY>#body/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#filtered/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#other/descendants(inline-background-and-borders) COPY
                      BlockContainer(anonymous)/descendants(inline-background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#filtered/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#other/descendants(foreground) COPY
                      BlockContainer(anonymous)/descendants(foreground) COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#filtered ASSEMBLE
                      BlockContainer<DIV>#filtered/preamble RECORD
                      BlockContainer<DIV>#filtered/background/hit-test RECORD
                      BlockContainer<DIV>#filtered/scroll-metadata RECORD (empty)
                      BlockContainer<DIV>#filtered/background SKIP
                      BlockContainer<DIV>#filtered/border SKIP
                      BlockContainer<DIV>#filtered/foreground/hit-test RECORD (empty)
                      BlockContainer<DIV>#filtered/foreground RECORD (empty)
                      BlockContainer<DIV>#filtered/outline SKIP
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "change the flood color",
            mutate: () => { flood.setAttribute("flood-color", "green"); },
            expect: `
                damage: rows=4 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport ASSEMBLE
                  @viewport/preamble COPY
                  @viewport/background/hit-test COPY
                  @viewport/scroll-metadata COPY
                  @viewport/background COPY
                  @viewport/border COPY
                  BlockContainer<HTML>#html/descendants(background-and-borders) ASSEMBLE
                  @viewport/foreground/hit-test COPY
                  @viewport/foreground COPY
                  BlockContainer<HTML>#html/descendants(foreground) ASSEMBLE
                  BlockContainer<HTML>#html ASSEMBLE
                    BlockContainer<HTML>#html/preamble COPY
                    BlockContainer<HTML>#html/background/hit-test COPY
                    BlockContainer<HTML>#html/scroll-metadata COPY
                    BlockContainer<HTML>#html/background COPY
                    BlockContainer<HTML>#html/border COPY
                    BlockContainer<BODY>#body/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<BODY>#body/background/hit-test COPY
                      BlockContainer<BODY>#body/scroll-metadata COPY
                      BlockContainer<BODY>#body/background COPY
                      BlockContainer<BODY>#body/border COPY
                      BlockContainer<DIV>#filtered/descendants(background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#other/descendants(background-and-borders) COPY
                      BlockContainer(anonymous)/descendants(background-and-borders) COPY
                    BlockContainer<BODY>#body/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#filtered/descendants(inline-background-and-borders) ASSEMBLE
                      BlockContainer<DIV>#other/descendants(inline-background-and-borders) COPY
                      BlockContainer(anonymous)/descendants(inline-background-and-borders) COPY
                    BlockContainer<HTML>#html/foreground/hit-test COPY
                    BlockContainer<HTML>#html/foreground COPY
                    BlockContainer<BODY>#body/descendants(foreground) ASSEMBLE
                      BlockContainer<BODY>#body/foreground/hit-test COPY
                      BlockContainer<BODY>#body/foreground COPY
                      BlockContainer<DIV>#filtered/descendants(foreground) ASSEMBLE
                      BlockContainer<DIV>#other/descendants(foreground) COPY
                      BlockContainer(anonymous)/descendants(foreground) COPY
                      BlockContainer<BODY>#body/outline COPY
                      BlockContainer<BODY>#body/overlay/hit-test COPY
                      BlockContainer<BODY>#body/overlay COPY
                    BlockContainer<DIV>#filtered ASSEMBLE
                      BlockContainer<DIV>#filtered/preamble RECORD
                      BlockContainer<DIV>#filtered/background/hit-test COPY
                      BlockContainer<DIV>#filtered/scroll-metadata COPY
                      BlockContainer<DIV>#filtered/background COPY
                      BlockContainer<DIV>#filtered/border COPY
                      BlockContainer<DIV>#filtered/foreground/hit-test COPY
                      BlockContainer<DIV>#filtered/foreground COPY
                      BlockContainer<DIV>#filtered/outline COPY
                    BlockContainer<HTML>#html/outline COPY
                  @viewport/outline COPY
            `
        },
        {
            name: "quiet after the filter changes",
            expect: `
                damage: rows=0 moved=0 order=0 eligibility=0 all=false
                @canvas RECORD (empty)
                @viewport COPY
            `
        }
    ]
});
</script>
