<!DOCTYPE html>
<script src="include.js"></script>
<style>
    p {
        font: 16px/20px monospace;
        margin: 0 0 60px;
    }
    .float {
        float: left;
        width: 40px;
        height: 50px;
    }
</style>
<p id="spans"><b class="float"></b><span>aaaaaaaaaaaaaaaaaaaaaaaaaa</span> <span id="spans-word">bbbbbbbbbbbbbbbbbbbbbbbbbb</span></p>
<p id="text"><b class="float"></b>aaaaaaaaaaaaaaaaaaaaaaaaaa bbbbbbbbbbbbbbbbbbbbbbbbbb</p>
<script>
    test(() => {
        // The second word goes beside the float whenever the word alone fits there: the space before it ends the
        // line above, so it takes up none of the room beside the float.
        const word = document.getElementById("spans-word").getBoundingClientRect().width;
        for (const id of ["spans", "text"]) {
            const p = document.getElementById(id);
            for (const slack of [0.5, 2, 5]) {
                p.style.width = `${40 + word + slack}px`;
                const range = document.createRange();
                const last = p.lastChild.nodeType === Node.TEXT_NODE ? p.lastChild : p.lastChild.firstChild;
                const offset = last.data.lastIndexOf("b");
                range.setStart(last, offset);
                range.setEnd(last, offset + 1);
                const rect = range.getBoundingClientRect();
                const top = rect.top - p.getBoundingClientRect().top;
                println(`${id}, ${slack}px to spare: second line ${top < 40 ? "beside" : "below"} the float`);
            }
        }
    });
</script>
