<!DOCTYPE quirks>
<script src="include.js"></script>
<script src="work-test.js"></script>
<style>
    body { margin: 0; }
    #container { width: 300px; height: 100px; }
    #cached { width: 200px; overflow: hidden; }
    #inner { width: 100px; height: 50%; }
</style>
<div id="container"><div id="cached"><div id="inner"></div></div></div>
<script>
    let heightBefore;
    layoutTest({
        steps: [
            {
                name: "changing the containing block height",
                mutate: () => {
                    heightBefore = inner.getBoundingClientRect().height;
                    // In quirks mode the auto-height parent forwards the percentage block basis.
                    container.style.height = "200px";
                },
                expect: `
                    layout FULL
                      @viewport/block RUN (cache=bypass)
                        BlockContainer<HTML>/block RUN (cache=miss)
                          BlockContainer<DIV>#cached/block RUN (cache=miss)
                `,
                check: equal => {
                    equal(heightBefore, 50, "height before");
                    equal(inner.getBoundingClientRect().height, 100, "height after");
                    equal(document.compatMode, "BackCompat", "compat mode");
                },
            },
        ],
    });
</script>
