    test(() => {
        const tag = new WebAssembly.Tag({ parameters: ["i32"] });
        let thrown = null;
        const exports = new WebAssembly.Instance(new WebAssembly.Module(bytes), {
            m: { tag, throws: () => { throw thrown; } },
        }).exports;

        println(`exported tags are Tags: ${exports.own instanceof WebAssembly.Tag}, imported tag is the same object: ${exports.imported === tag}`);

        try {
            exports.throwOwn(1, 2n);
        } catch (exception) {
            println(`thrown by WebAssembly: ${exception instanceof WebAssembly.Exception}, is own: ${exception.is(exports.own)}, is imported: ${exception.is(tag)}`);
            println(`arguments: ${exception.getArg(exports.own, 0)}, ${exception.getArg(exports.own, 1)}, stack: ${exception.stack}`);
        }

        thrown = new WebAssembly.Exception(tag, [5]);
        try {
            exports.callThrows();
        } catch (exception) {
            println(`an Exception thrown through WebAssembly is itself: ${exception === thrown}`);
        }
        println(`caught by its tag in WebAssembly: ${exports.catchImported()}`);

        thrown = new Error("from JavaScript");
        try {
            exports.callThrows();
        } catch (exception) {
            println(`a JavaScript exception thrown through WebAssembly is itself: ${exception === thrown}`);
        }
        println(`not caught by the imported tag: ${(() => { try { exports.catchImported(); } catch (exception) { return exception === thrown; } })()}`);

        const traced = new WebAssembly.Exception(tag, [1], { traceStack: true });
        println(`traceStack gives a stack: ${typeof traced.stack}`);

        const point = exports.makePoint(7);
        println(`struct: ${exports.pointX(point)}, same object again: ${exports.identity(point) === point}, prototype: ${Object.getPrototypeOf(point)}`);
        println(`anyref of numbers and strings: ${exports.identity(42)}, ${exports.identity(2 ** 31)}, ${exports.identity("text")}`);
