<!doctype html>
<script type="worker">
    onmessage = ({ data }) => postMessage(new WebAssembly.Instance(data).exports.f());
    onmessageerror = () => postMessage("messageerror");
</script>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        // (module (func (export "f") (result i32) (i32.const 1000)))
        // NB: The validator rewrites a constant whose immediate takes more than one byte.
        const bytes = new Uint8Array([
            0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01, 0x05, 0x01, 0x60, 0x00, 0x01, 0x7f, 0x03,
            0x02, 0x01, 0x00, 0x07, 0x05, 0x01, 0x01, 0x66, 0x00, 0x00, 0x0a, 0x07, 0x01, 0x05, 0x00, 0x41,
            0xe8, 0x07, 0x0b,
        ]);
        const module = new WebAssembly.Module(bytes);

        try {
            println(`structuredClone: ${new WebAssembly.Instance(structuredClone(module)).exports.f()}`);
        } catch (error) {
            println(`structuredClone: ${error}`);
        }

        const source = document.querySelector("[type=worker]").innerText;
        const worker = new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
        worker.onmessage = ({ data }) => {
            println(`worker: ${data}`);
            done();
        };
        worker.postMessage(module);
    });
</script>
