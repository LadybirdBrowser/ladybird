    test(() => {
        const exports = new WebAssembly.Instance(new WebAssembly.Module(bytes), {
            m: { tag: new WebAssembly.Tag({ parameters: ["i32"] }), throws: () => {} },
        }).exports;
        const point = exports.makePoint(1);

        // Sites whose caches saw additions to objects without a prototype, as Exported GC Objects are.
        function add(object) {
            "use strict";
            object.foo = 1;
        }
        function addByKey(object, key) {
            "use strict";
            object[key] = 1;
        }
        for (let i = 0; i < 20; ++i) {
            add(Object.create(null));
            addByKey(Object.create(null), "bar");
        }

        for (const [name, assign] of [
            ["named", () => add(point)],
            ["keyed", () => addByKey(point, "bar")],
        ]) {
            try {
                assign();
                println(`${name}: no exception`);
            } catch (exception) {
                println(`${name}: ${exception.name}`);
            }
        }
        println(`extensible: ${Object.isExtensible(point)}, own keys: ${Reflect.ownKeys(point).length}, x: ${exports.pointX(point)}`);
