    ]);

    async function collectGarbage() {
        for (let index = 0; index < 4; ++index) {
            await animationFrame();
            await internals.gcAsync();
        }
    }

    // Only wasm keeps the function and the struct, not the objects that stand for them.
    function markObjects(instance, weakMap) {
        instance.exports.table.get(0).expando = "kept";
        const point = instance.exports.make();
        weakMap.set(point, "kept");
        instance.exports.keep(point);
    }

    function createDroppedInstance() {
        const instance = new WebAssembly.Instance(new WebAssembly.Module(bytes));
        return new WeakRef(instance.exports.table.get(0));
    }

    asyncTest(async done => {
        const instance = new WebAssembly.Instance(new WebAssembly.Module(bytes));
        const weakMap = new WeakMap();
        markObjects(instance, weakMap);
        await collectGarbage();
        println(`exported function keeps its expando: ${instance.exports.table.get(0).expando}`);
        println(`exported GC object keeps its WeakMap entry: ${weakMap.get(instance.exports.kept())}`);

        const weakFunction = createDroppedInstance();
        await collectGarbage();
        println(`exported function collected with its instance: ${weakFunction.deref() === undefined}`);
        done();
    });
</script>
