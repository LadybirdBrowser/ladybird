    async function collectGarbage() {
        for (let index = 0; index < 4; ++index) {
            await animationFrame();
            await internals.gcAsync();
        }
    }

    // The frame's object refers to the frame's instance, whose global, table, and GC struct refer back to the object.
    function createCycleInRemovedFrame() {
        const frame = document.createElement("iframe");
        document.body.append(frame);
        const frameWindow = frame.contentWindow;
        const instance = new frameWindow.WebAssembly.Instance(new frameWindow.WebAssembly.Module(bytes));
        const object = new frameWindow.Object();
        object.instance = instance;
        instance.exports.global.value = object;
        instance.exports.table.set(0, object);
        instance.exports.box(object);
        println(`frame object is held by wasm: ${instance.exports.unbox() === object}`);
        const weakObject = new WeakRef(object);
        frame.remove();
        return weakObject;
    }

    asyncTest(async done => {
        const instance = new WebAssembly.Instance(new WebAssembly.Module(bytes));
        instance.exports.box({ name: "boxed object" });
        instance.exports.table.set(0, 42);
        instance.exports.global.value = "a string";
        await collectGarbage();
        println(`struct field after collection: ${instance.exports.unbox().name}`);
        println(`table element after collection: ${instance.exports.table.get(0)}`);
        println(`global after collection: ${instance.exports.global.value}`);

        const weakObject = createCycleInRemovedFrame();
        await collectGarbage();
        println(`frame object collected with its frame: ${weakObject.deref() === undefined}`);
        done();
    });
