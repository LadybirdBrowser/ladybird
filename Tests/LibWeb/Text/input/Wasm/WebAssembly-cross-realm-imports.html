    test(() => {
        const frameWindow = document.getElementById("frame").contentWindow;
        const FrameWebAssembly = frameWindow.WebAssembly;
        const answer = new FrameWebAssembly.Instance(new FrameWebAssembly.Module(frameBytes)).exports.answer;
        const memory = new FrameWebAssembly.Memory({ initial: 1, maximum: 4 });
        const table = new FrameWebAssembly.Table({ element: "anyfunc", initial: 1 });
        const global = new FrameWebAssembly.Global({ value: "i32", mutable: true }, 7);
        table.set(0, answer);

        const instance = new WebAssembly.Instance(new WebAssembly.Module(mainBytes), { m: { memory, table, global, f: answer } });
        const exports = instance.exports;

        new frameWindow.Uint8Array(memory.buffer)[0] = 123;
        println(`memory of another realm: ${exports.readMemory()}`);
        const oldBuffer = memory.buffer;
        println(`grown from WebAssembly: ${exports.growMemory()}, old buffer detached: ${oldBuffer.byteLength === 0}, new length: ${memory.buffer.byteLength}`);

        println(`table of another realm: ${exports.callTable()}`);

        println(`global of another realm: ${exports.getGlobal()}`);
        global.value = 9;
        exports.setGlobal(exports.getGlobal() + 1);
        println(`global written from both sides: ${global.value}`);

        println(`function of another realm: ${exports.callF()}`);
        println(`re-exported function is the same object: ${exports.f === answer}`);
        println(`re-exported function's realm: ${Object.getPrototypeOf(exports.f) === frameWindow.Function.prototype}`);
