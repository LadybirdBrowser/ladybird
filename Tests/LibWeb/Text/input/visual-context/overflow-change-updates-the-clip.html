<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; }
    svg { display: block; }
    #host { width: 50px; height: 50px; }
    #child { width: 100px; height: 50px; background: green; }
</style>
<div id="host"><div id="child"></div></div>
<svg id="outer" width="50" height="50"><rect id="outer-rect" width="100" height="50" fill="green"/></svg>
<svg width="100" height="50"><svg id="nested" width="50" height="50"><rect id="nested-rect" width="100" height="50" fill="green"/></svg></svg>
<script>
    test(() => {
        const targetAt = (x, y) => {
            const element = document.elementFromPoint(x, y);
            return element.id || element.tagName;
        };
        const host = document.getElementById("host");
        const outer = document.getElementById("outer");
        const nested = document.getElementById("nested");
        targetAt(0, 0);
        const fullBuilds = internals.accumulatedVisualContextTreeBuildCount();
        const lines = [];

        host.style.overflow = "clip";
        lines.push(`div content past the box after overflow becomes clip: ${targetAt(75, 10)}`);
        host.style.overflow = "visible";
        lines.push(`div content past the box after overflow becomes visible: ${targetAt(75, 10)}`);

        lines.push(`outer svg content past the viewport before overflow changes: ${targetAt(75, 60)}`);
        outer.style.overflow = "visible";
        lines.push(`outer svg content past the viewport after overflow becomes visible: ${targetAt(75, 60)}`);
        outer.style.overflow = "hidden";
        lines.push(`outer svg content past the viewport after overflow becomes hidden: ${targetAt(75, 60)}`);

        nested.setAttribute("overflow", "visible");
        lines.push(`nested svg content past the viewport after the overflow attribute becomes visible: ${targetAt(75, 110)}`);
        nested.style.overflow = "hidden";
        lines.push(`nested svg content past the viewport after overflow becomes hidden: ${targetAt(75, 110)}`);

        lines.push(`full builds: ${internals.accumulatedVisualContextTreeBuildCount() - fullBuilds}`);

        for (const line of lines)
            println(line);
    });
</script>
