<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    #box { width: 50px; height: 50px; }
    #box.lifted { transform: translateY(-2px); }
</style>
<div id="box"></div>
<script>
    const steps = [];
    for (let toggle = 1; toggle <= 6; ++toggle) {
        steps.push({
            name: `toggle ${toggle} lifts the box`,
            mutate: () => {
                internals.recordDisplayListForTesting();
                box.classList.add("lifted");
            },
            expect: toggle === 1
                ? `
                    update DIRTY-PATH
                      div#box.lifted transform ALLOCATED
                      recording NEEDED
                `
                : `
                    update DIRTY-PATH
                      div#box.lifted transform ALLOCATED (freed slot)
                      epoch NEW
                      recording NEEDED
                `,
        });
        steps.push({
            name: `toggle ${toggle} drops it`,
            mutate: () => box.classList.remove("lifted"),
            expect: `
                update DIRTY-PATH
                  div#box transform RELEASED
                  epoch NEW
                  recording NEEDED
            `,
        });
    }
    visualContextTest({
        setup: () => internals.forceIncompatibleVisualContextTreeRebuild(),
        steps,
    });
</script>
