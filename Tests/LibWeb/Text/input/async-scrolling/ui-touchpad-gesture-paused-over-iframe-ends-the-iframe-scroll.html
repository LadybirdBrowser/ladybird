<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body {
        margin: 0;
        height: 2000px;
    }

    iframe {
        display: block;
        width: 200px;
        height: 150px;
        border: 0;
    }
</style>
<script>
    promiseTest(async () => {
        const frame = document.createElement("iframe");
        const frameLoaded = new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));
        frame.srcdoc = "<body style='margin: 0; height: 300px'></body>";
        document.body.prepend(frame);
        await frameLoaded;
        await waitForCondition(() => internals.compositorWheelTargetAt(100, 75, 0, 50).document === frame.contentDocument);

        // A touchpad gesture whose steps stop arriving is over, and the frame gets the scrollend event of its scroll
        // even if the end of the gesture never arrives, as when it goes to the page instead.
        await scrollSettled(frame.contentDocument, async () => {
            await internals.wheelThroughUIProcess(100, 75, 0, 100, true, "ongoing");
            await internals.wheelThroughUIProcess(100, 75, 0, 100, true, "ongoing");
        });
        println(`frame scrollY: ${frame.contentWindow.scrollY}`);
    });
</script>
