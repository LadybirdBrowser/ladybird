<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A frame without a box is rendered while its own document waits for an animation frame.
    function animationFrameOf(frameWindow) {
        return new Promise(resolve => frameWindow.requestAnimationFrame(resolve));
    }

    async function scrollFrameAndReadWhereTheCompositorHasIt(description, style) {
        const iframe = document.createElement("iframe");
        iframe.style = style;
        const loaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
        iframe.srcdoc = `<style>body { margin: 0; height: 3000px; }</style>`;
        document.body.append(iframe);
        await loaded;
        await animationFrameOf(iframe.contentWindow);
        await animationFrameOf(iframe.contentWindow);

        iframe.contentWindow.scrollTo(0, 100);
        await animationFrameOf(iframe.contentWindow);
        await animationFrameOf(iframe.contentWindow);

        const scrollOffset = iframe.contentWindow.internals.compositorScrollState().scrollOffset;
        println(`${description}: compositor has the frame scrolled to ${scrollOffset ? `${scrollOffset.x},${scrollOffset.y}` : "nowhere, it took no display list"}`);
        iframe.remove();
    }

    promiseTest(async () => {
        await scrollFrameAndReadWhereTheCompositorHasIt("no box", "display: none");
        await scrollFrameAndReadWhereTheCompositorHasIt("empty box", "width: 0; height: 0; border: 0");
        await scrollFrameAndReadWhereTheCompositorHasIt("box without height", "width: 300px; height: 0; border: 0");
        await scrollFrameAndReadWhereTheCompositorHasIt("box without width", "width: 0; height: 200px; border: 0");
    });
</script>
