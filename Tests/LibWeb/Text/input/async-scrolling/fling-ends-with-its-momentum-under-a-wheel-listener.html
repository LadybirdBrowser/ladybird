<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body {
        margin: 0;
    }

    #scroller {
        width: 200px;
        height: 200px;
        overflow: scroll;
    }

    .content {
        height: 5000px;
    }
</style>
<div id="scroller"><div class="content"></div></div>
<div id="wheels"></div>
<script>
    promiseTest(async () => {
        const scroller = document.getElementById("scroller");
        const wheels = document.getElementById("wheels");
        // The listener leaves layout out of date as the momentum ends.
        let wheelCount = 0;
        scroller.addEventListener("wheel", () => (wheels.textContent = ++wheelCount), { passive: true });
        let scrollends = 0;
        scroller.addEventListener("scrollend", () => scrollends++);
        await animationFrame();
        await animationFrame();

        await internals.wheelThroughUIProcess(50, 50, 0, 0, true, "ongoing");
        for (let step = 0; step < 3; step++)
            await internals.wheelThroughUIProcess(50, 50, 0, 50, true, "ongoing");
        for (let step = 0; step < 5; step++) {
            await internals.wheelThroughUIProcess(50, 50, 0, 30, true, "momentum");
            await animationFrame();
        }
        internals.wheelThroughUIProcess(50, 50, 0, 30, true, "momentum");
        await internals.wheelThroughUIProcess(50, 50, 0, 0, true, "ended");
        for (let frame = 0; frame < 3; frame++)
            await animationFrame();
        println(`scrollend events within 3 frames of the end of the momentum: ${scrollends}`);
    });
</script>
