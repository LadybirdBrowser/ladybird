<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    #scroller {
        width: 200px;
        height: 200px;
        overflow: scroll;
        scroll-snap-type: y mandatory;
    }
    .item {
        width: 100%;
        height: 200px;
        scroll-snap-align: start;
    }
</style>
<div id="scroller">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>
<script>
    promiseTest(async () => {
        const scroller = document.getElementById("scroller");
        let scrollendEvents = 0;
        scroller.addEventListener("scrollend", () => ++scrollendEvents);

        await animationFrame();
        await animationFrame();

        println(`wheel target of a discrete step: ${internals.asyncScrollingStateWheelTargetAt(50, 50, 0, 10)}`);

        // The step's promise resolves once the snap scroll the compositor started for it has completed, so the
        // scrolling box already rests at the snap position when it does.
        await internals.wheel(50, 50, 0, 10);
        println(`scroll offset when the step's promise resolved: ${scroller.scrollLeft},${scroller.scrollTop}`);
        println(`scrollend events before the gesture settled: ${scrollendEvents}`);

        await scrollendEvent(scroller);
        println(`scroll offset after the gesture settled: ${scroller.scrollLeft},${scroller.scrollTop}`);
        println(`scrollend events after the gesture settled: ${scrollendEvents}`);
    });
</script>
