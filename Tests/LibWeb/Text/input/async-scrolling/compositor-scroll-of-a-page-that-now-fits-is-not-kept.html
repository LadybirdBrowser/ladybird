<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body {
        margin: 0;
        height: 3000px;
    }
</style>
<script>
    promiseTest(async () => {
        await animationFrame();
        await animationFrame();

        scrollTo(0, document.documentElement.scrollHeight);
        internals.synchronizeCompositor();
        await animationFrame();
        await animationFrame();
        const bottom = internals.compositorScrollState().scrollOffset.y;

        // The page comes to fit in the viewport, and beside this task the user scrolls the compositor's old page.
        document.body.style.height = "10px";
        document.documentElement.scrollHeight;
        internals.wheelThroughUIProcess(50, 50, 0, -30, true, "ongoing");
        const giveUpAt = performance.now() + 5000;
        while (internals.compositorScrollState().scrollOffset.y === bottom && performance.now() < giveUpAt)
            internals.synchronizeCompositor();

        await animationFrame();
        await animationFrame();
        await animationFrame();
        println(`scrollY once the page fits: ${scrollY}`);

        await internals.wheelThroughUIProcess(50, 50, 0, 0, true, "ended");
    });
</script>
