<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body {
        margin: 0;
        height: 2000px;
    }
</style>
<script>
    promiseTest(async () => {
        let wheelEvents = 0;
        let cancelableWheelEvents = 0;
        window.addEventListener("wheel", event => {
            ++wheelEvents;
            if (event.cancelable)
                ++cancelableWheelEvents;
        }, { passive: false });
        await animationFrame();
        await animationFrame();

        // The page sees every step first, cancels none of them, and the page still stretches past its top.
        await internals.wheelThroughUIProcess(400, 300, 0, -200, true, "ongoing");
        await internals.wheelThroughUIProcess(400, 300, 0, -200, true, "ongoing");
        println(`pulled past the top: viewport stretch=${internals.elasticOverscrollStretchY()} window.scrollY=${window.scrollY}`);
        println(`wheel events the page could have canceled: ${cancelableWheelEvents} of ${wheelEvents}`);

        await internals.wheelThroughUIProcess(400, 300, 0, 0, true, "ended");
        while (internals.elasticOverscrollStretchY() !== 0)
            await animationFrame();
        println(`sprung back: viewport stretch=${internals.elasticOverscrollStretchY()} window.scrollY=${window.scrollY}`);
    });
</script>
