<!DOCTYPE html>
<script src="../include.js"></script>
<style>body { margin: 0; height: 2000px; }</style>
<script>
    promiseTest(async () => {
        await animationFrame();
        internals.setManualRenderingOpportunities(true);
        try {
            const start = performance.now() + 1;
            async function frameAt(offset) {
                await new Promise(resolve => setTimeout(resolve, Math.max(0, start + offset - performance.now()) + 1));
                const painted = animationFrame();
                internals.injectRenderingOpportunity(start + offset);
                await painted;
                return scrollY;
            }
            internals.mouseDown(50, 50, 1, internals.BUTTON_MIDDLE);
            internals.mouseUp(50, 50, internals.BUTTON_MIDDLE);
            internals.mouseMove(50, 158);
            const before = await frameAt(0);
            const first = await frameAt(20);
            const second = await frameAt(60);
            println(`20ms with the pointer 108px below the origin: ${first - before}`);
            println(`40ms with the pointer 108px below the origin: ${second - first}`);
            const afterPause = await frameAt(260);
            println(`200ms with the pointer 108px below the origin: ${afterPause - second}`);
            internals.mouseMove(50, 98);
            const closer = await frameAt(280);
            println(`20ms with the pointer 48px below the origin: ${closer - afterPause}`);
            internals.mouseMove(50, 2);
            const reversed = await frameAt(300);
            println(`20ms with the pointer 48px above the origin: ${reversed - closer}`);
            internals.mouseMove(50, 50);
            println(`back at origin: ${await frameAt(320) - reversed}`);
        } finally {
            internals.setManualRenderingOpportunities(false);
        }
    });
</script>
