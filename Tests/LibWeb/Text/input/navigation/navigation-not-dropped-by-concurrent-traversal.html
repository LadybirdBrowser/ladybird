<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A cross-document navigation admitted after a traversal must supersede that traversal. The history-queue flush
    // makes the pushed entry deterministic; requesting back and navigation from one task then gives the UI process
    // an ordered traversal followed by a newer navigation without rewriting LocalNavigable's state in a test hook.
    asyncTest(async (done) => {
        const server = httpTestServer();

        const victim = await server.createEcho("GET", "/navigation-not-dropped-by-concurrent-traversal-victim", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!doctype html><script>top.postMessage("victim-loaded", "*")<\/script>`,
        });

        const trigger = await server.createEcho("GET", "/navigation-not-dropped-by-concurrent-traversal-trigger", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!doctype html><script>
                addEventListener("message", (e) => {
                    if (e.data === "push") {
                        history.pushState({}, "", "#pushed");
                        top.postMessage("history-pushed", "*");
                    } else if (e.data === "race") {
                        history.back();
                        location.href = "${victim}";
                    }
                });
                top.postMessage("trigger-ready", "*");
            <\/script>`,
        });

        let iframe;
        let stallTimer;
        window.addEventListener("message", async (e) => {
            if (e.data === "trigger-ready") {
                iframe.contentWindow.postMessage("push", "*");
            } else if (e.data === "history-pushed") {
                await internals.flushSessionHistoryTraversalQueue();
                iframe.contentWindow.postMessage("race", "*");
                stallTimer = setTimeout(() => {
                    println("FAIL: cross-document navigation was dropped");
                    done();
                }, 10000);
            } else if (e.data === "victim-loaded") {
                clearTimeout(stallTimer);
                println("victim-loaded");
                done();
            }
        });

        iframe = document.createElement("iframe");
        iframe.src = trigger;
        document.body.appendChild(iframe);
    });
</script>
