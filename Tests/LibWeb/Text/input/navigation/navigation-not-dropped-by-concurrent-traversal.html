<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A cross-document navigation started after a same-document traversal is not dropped by it, as in Chromium and
    // Gecko: the traversal applies, and the navigation goes on and commits after it, clearing the pushed entry as
    // forward history. The history-queue flush makes the pushed entry deterministic; requesting back and navigation
    // from one task then gives the UI process an ordered traversal followed by a newer navigation.
    asyncTest(async (done) => {
        const server = httpTestServer();

        const destination = await server.createEcho("GET", "/navigation-not-dropped-by-concurrent-traversal-destination", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!doctype html><script>top.postMessage(\`destination-loaded \${navigation.entries().length} entries\`, "*")<\/script>`,
        });

        const trigger = await server.createEcho("GET", "/navigation-not-dropped-by-concurrent-traversal-trigger", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!doctype html><script>
                addEventListener("message", (e) => {
                    if (e.data === "push") {
                        history.pushState({}, "", "#pushed");
                        top.postMessage("history-pushed", "*");
                    } else if (e.data === "race") {
                        history.back();
                        location.href = "${destination}";
                    }
                });
                top.postMessage("trigger-ready", "*");
            <\/script>`,
        });

        let iframe;
        let stallTimer;
        window.addEventListener("message", async (e) => {
            if (e.data === "trigger-ready") {
                iframe.contentWindow.postMessage("push", "*");
            } else if (e.data === "history-pushed") {
                await internals.flushSessionHistoryTraversalQueue();
                iframe.contentWindow.postMessage("race", "*");
                stallTimer = setTimeout(() => {
                    println("FAIL: cross-document navigation was dropped");
                    done();
                }, 10000);
            } else if (e.data.startsWith("destination-loaded")) {
                clearTimeout(stallTimer);
                println(e.data);
                done();
            }
        });

        iframe = document.createElement("iframe");
        iframe.src = trigger;
        document.body.appendChild(iframe);
    });
</script>
