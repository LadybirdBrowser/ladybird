<!doctype html>
<script src="../include.js"></script>
<script>
    // A navigation's response body is read through a stream created in the realm of the document that started the
    // navigation — and the new document's parser stays attached until its load event. So, the parser has to let go of
    // the body as soon as the body is exhausted. Otherwise, a load that stalls on a subresource — e.g. an image that
    // never arrives — keeps the replaced document alive for as long as the load stalls.
    promiseTest(async () => {
        const server = httpTestServer();
        // Repeated runs of this test share the echo server, so its echoes and the image's unblock token are per-run.
        const runId = crypto.randomUUID();
        const token = `stalled-load-${runId}`;
        const blockedImageURL = await server.createEcho("GET", "/stalled-load-image", {
            status: 404,
            headers: { "Cache-Control": "no-store" },
            body: "",
            wait_for_unblock: token,
        });
        const zerothURL = await server.createEcho("GET", "/stalled-load-zeroth", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: "<!DOCTYPE html><p>zeroth</p>",
        });
        const firstURL = await server.createEcho("GET", "/stalled-load-first", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: "<!DOCTYPE html><p>first</p>",
        });
        const secondURL = await server.createEcho("GET", "/stalled-load-second", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html>
                <img src="${blockedImageURL}">
                <script>
                    document.addEventListener("DOMContentLoaded", () => parent.postMessage("second document parsed", "*"));
                <\/script>`,
        });

        const iframe = document.createElement("iframe");
        document.body.append(iframe);

        const navigate = url =>
            new Promise(resolve => {
                iframe.addEventListener("load", resolve, { once: true });
                iframe.src = url;
            });

        // The first document is recorded in a nested function, so that it doesn't linger in a register of this
        // function's frame while it's expected to be collected. An expando preserves its wrapper for as long as the
        // document itself lives, so the weak reference tracks the document rather than a wrapper that JS may drop
        // early. And a zeroth document goes before it: the document that replaces the initial about:blank document
        // reuses that document's window, whose realm the navigable's WindowProxy keeps alive for as long as the
        // iframe lives.
        const weakFirstDocument = await (async () => {
            await navigate(zerothURL);
            await navigate(firstURL);
            const firstDocument = iframe.contentDocument;
            firstDocument.preserveWrapper = true;
            return new WeakRef(firstDocument);
        })();

        // The second document's body has been read to its end once DOMContentLoaded fires in it, while its load event
        // still waits on the blocked image.
        await new Promise(resolve => {
            window.addEventListener("message", function receive(event) {
                if (event.source !== iframe.contentWindow || event.data !== "second document parsed") return;
                window.removeEventListener("message", receive);
                resolve();
            });
            iframe.src = secondURL;
        });

        // Request teardown completes in asynchronous tasks. Wait for collection while the image remains blocked;
        // a retained document fails through the test harness timeout rather than a fixed number of task turns.
        do {
            await timeout(0);
            await internals.gcAsync();
        } while (weakFirstDocument.deref() !== undefined);
        println(
            `first document collected while the second load is stalled: ${weakFirstDocument.deref() === undefined}`
        );

        // Let the second load finish, so the test ends with the iframe settled.
        const secondLoaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
        await fetch(new URL(`/unblock/${token}`, blockedImageURL));
        await secondLoaded;
        iframe.remove();
    });
</script>
