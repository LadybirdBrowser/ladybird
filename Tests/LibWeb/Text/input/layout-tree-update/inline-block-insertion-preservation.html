<!doctype html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    .run,
    .item {
        display: inline-block;
    }

    .block-run {
        display: block;
    }

    .generated-parent::before,
    .generated-item::before {
        content: "before";
        display: inline-block;
    }

    .generated-parent::after,
    .generated-item::after {
        content: "after";
        display: inline-block;
    }

    .hidden {
        display: none;
    }

    .inline {
        display: inline;
    }

    .block {
        display: block;
    }

    .contents {
        display: contents;
    }

    .absolute {
        position: absolute;
    }

    .float {
        float: left;
    }

    .structural > .item:first-child {
        display: block;
    }
</style>
<div id="fixture"></div>
<script>
    const cases = [
        {
            name: "prepend inline-block leaf",
            markup: '<div class="run"><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.prepend(inserted);
                return [inserted];
            },
            tracked: ["run", "after"],
            expectedRoots: 1,
        },
        {
            name: "insert middle inline-block leaf",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 1,
        },
        {
            name: "append inline-block leaf",
            markup: '<div class="run"><i class="before item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.append(inserted);
                return [inserted];
            },
            tracked: ["run", "before"],
            expectedRoots: 1,
        },
        {
            name: "insert only inline-block child",
            markup: '<div class="run"></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.append(inserted);
                return [inserted];
            },
            tracked: ["run"],
            expectedRoots: 1,
        },
        {
            name: "insert inline-block into block flow parent",
            markup: '<div class="run block-run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 1,
        },
        {
            name: "insert inline-flex child",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted";
                inserted.style.display = "inline-flex";
                inserted.innerHTML = "<b>child</b>";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 1,
        },
        {
            name: "insert inline-grid child",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted";
                inserted.style.display = "inline-grid";
                inserted.innerHTML = "<b>child</b>";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 1,
        },
        {
            name: "insert inline-block subtree",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("section");
                inserted.className = "inserted item";
                inserted.innerHTML = "<b>child</b><em>child</em>";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 1,
        },
        {
            name: "insert inline-block sibling run",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const fragment = document.createDocumentFragment();
                const inserted = [];
                for (let index = 0; index < 3; ++index) {
                    const item = document.createElement("i");
                    item.className = "inserted item";
                    inserted.push(item);
                    fragment.append(item);
                }
                run.insertBefore(fragment, run.querySelector(".after"));
                return inserted;
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 3,
        },
        {
            name: "append inline-block before generated after",
            markup: '<div class="run generated-parent"><i class="before item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.append(inserted);
                return [inserted];
            },
            tracked: ["run", "before"],
            expectedRoots: 1,
        },
        {
            name: "insert inline-block with generated content",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item generated-item";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 1,
        },
        {
            name: "insert display-none child",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted hidden";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
            tracked: ["run", "before", "after"],
            expectedRoots: 0,
            insertedHasLayout: false,
        },
        {
            name: "insert inline-flow child conservatively",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted inline";
                inserted.textContent = "inline";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
        },
        {
            name: "insert block child conservatively",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted block";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
        },
        {
            name: "insert display-contents child conservatively",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted contents";
                inserted.innerHTML = '<b class="item"></b>';
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
        },
        {
            name: "insert text child conservatively",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createTextNode("text");
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
        },
        {
            name: "insert absolutely positioned child conservatively",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item absolute";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
        },
        {
            name: "insert floated child conservatively",
            markup: '<div class="run"><i class="before item"></i><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item float";
                run.insertBefore(inserted, run.querySelector(".after"));
                return [inserted];
            },
        },
        {
            name: "insert before structural display change conservatively",
            markup: '<div class="run structural"><i class="after item"></i></div>',
            mutate(run) {
                const inserted = document.createElement("i");
                inserted.className = "inserted item";
                run.prepend(inserted);
                return [inserted];
            },
        },
    ];

    function describeLayoutTreeBuilds(work) {
        if (!work.builds()) return "no layout tree build";
        const builds = work.builds() > 1 ? ` in ${work.builds()} builds` : "";
        if (work.rebuiltWholeTree()) return `rebuilt the whole tree${builds}`;
        return `rebuilt [${work.rebuiltRoots().join(", ")}]${work.escaped() ? ", escaped" : ""}${builds}`;
    }

    test(() => {
        const results = [];
        for (const case_ of cases) {
            fixture.innerHTML = case_.markup;
            const run = fixture.firstElementChild;

            const trackedNodes = (case_.tracked || []).map(className => ({
                label: className,
                node: className === "run" ? run : run.querySelector(`.${className}`),
            }));
            for (const { label, node } of trackedNodes) node.id = `tracked-${label}`;

            let inserted;
            const work = layoutTreeBuildWork(() => {
                inserted = case_.mutate(run);
            }, { tracked: trackedNodes.map(({ node }) => node) });

            results.push({
                name: case_.name,
                transitions: trackedNodes.map(({ label }, index) => ({ label, transition: work.transitions()[index] })),
                inserted: inserted.map(node => ({
                    value: internals.dumpLayoutTree(node) !== "(no layout node)",
                    expected: case_.insertedHasLayout ?? true,
                })),
                roots: work.rebuiltRoots().length,
                expectedRoots: case_.expectedRoots,
                builds: describeLayoutTreeBuilds(work),
                escaped: work.escaped(),
                matches: internals.compareLayoutTreeWithFullRebuild().matches,
            });
        }

        for (const result of results) {
            for (const { label, transition } of result.transitions)
                println(`${transition === "PRESERVED" ? "PASS" : "FAIL"}: ${result.name} | ${label} ${transition}`);
            if (result.expectedRoots !== undefined) {
                for (const inserted of result.inserted)
                    println(`${inserted.value === inserted.expected ? "PASS" : "FAIL"}: ${result.name} | inserted node layout state`);
                println(`${result.roots === result.expectedRoots ? "PASS" : "FAIL"}: ${result.name} | ${result.builds}`);
                println(`${!result.escaped ? "PASS" : "FAIL"}: ${result.name} | keep update within rebuild roots`);
            }
            println(`${result.matches ? "PASS" : "FAIL"}: ${result.name} | incremental tree matches full rebuild`);
        }
    });
</script>
