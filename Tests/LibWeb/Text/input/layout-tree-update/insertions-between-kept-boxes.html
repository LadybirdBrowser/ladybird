<!DOCTYPE html>
<script src="../include.js"></script>
<script src="resources/full-rebuild-comparison.js"></script>
<div id="fixture"></div>
<script>
    const style = `<style>
        .ib { display: inline-block; }
        .float { float: left; width: 10px; height: 10px; }
        .abs { position: absolute; }
        .contents { display: contents; }
        .flex { display: flex; }
        .counted { counter-reset: c; }
        .i { counter-increment: c; }
        .s::before { content: counter(c) " "; }
        .q { quotes: "<" ">"; }
        .open::before { content: open-quote; }
        .gen::before { content: "b"; display: inline-block; }
        .gen::after { content: "a"; display: inline-block; }
        .first-letter::first-letter { color: red; }
        .cell { display: table-cell; }
    </style>`;

    const inlineBlocks = n => Array.from({ length: n }, (_, i) => `<span id="e${i}" class="ib">${i}</span>`).join("");
    const blocks = n => Array.from({ length: n }, (_, i) => `<div id="e${i}">${i}</div>`).join("");
    const make = (tag, className, text = "n") => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        element.textContent = text;
        return element;
    };
    const fromMarkup = markup => {
        const template = document.createElement("template");
        template.innerHTML = markup;
        return template.content.firstChild;
    };
    const before = (id, node) => d => d.insertBefore(typeof node === "function" ? node() : node, d.querySelector(`#${id}`));

    const cases = [
        // New boxes between two boxes the list keeps.
        ["insert an inline-block between inline-blocks", `<div id="d">${inlineBlocks(4)}</div>`, before("e2", () => make("span", "ib"))],
        ["insert two adjacent inline-blocks between inline-blocks", `<div id="d">${inlineBlocks(4)}</div>`, d => {
            const next = d.querySelector("#e2");
            d.insertBefore(make("span", "ib", "m"), next);
            d.insertBefore(make("span", "ib", "n"), next);
        }],
        ["insert inline-blocks at two places", `<div id="d">${inlineBlocks(5)}</div>`, d => {
            d.insertBefore(make("span", "ib", "m"), d.querySelector("#e1"));
            d.insertBefore(make("span", "ib", "n"), d.querySelector("#e4"));
        }],
        ["insert an inline-block with children", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => fromMarkup(`<span class="ib"><span class="ib">x</span><b>y</b></span>`))],
        ["insert an inline-block with pseudo-elements", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => make("span", "ib gen"))],
        ["insert an inline element", `<div id="d"><span>a</span><span id="x">x</span></div>`, before("x", () => make("span", ""))],
        ["insert a block between blocks", `<div id="d">${blocks(3)}</div>`, before("e1", () => make("div", ""))],
        ["insert a flex item between items", `<div id="d" class="flex">${blocks(3)}</div>`, before("e1", () => make("div", ""))],
        ["insert an inline-block into an inline element", `<div><span id="d"><b id="a" class="ib">a</b><b id="x" class="ib">x</b></span></div>`, before("x", () => make("b", "ib"))],
        ["insert an inline-block into a list whose box has pseudo-elements", `<div id="d" class="gen">${inlineBlocks(3)}</div>`, before("e1", () => make("span", "ib"))],

        // New boxes at the ends of the list.
        ["insert an inline-block first", `<div id="d">${inlineBlocks(3)}</div>`, before("e0", () => make("span", "ib"))],
        ["insert an inline-block last", `<div id="d">${inlineBlocks(3)}</div>`, d => d.appendChild(make("span", "ib"))],

        // What the new box goes beside.
        ["insert an inline-block before text", `<div id="d"><span class="ib">a</span>text<span class="ib">b</span></div>`, d => d.insertBefore(make("span", "ib"), d.childNodes[1])],
        ["insert an inline-block after white space", `<div id="d"><span class="ib">a</span> <span id="x" class="ib">b</span></div>`, before("x", () => make("span", "ib"))],
        ["insert an inline-block before white space", `<div id="d"><span class="ib">a</span> <span class="ib">b</span></div>`, d => d.insertBefore(make("span", "ib"), d.childNodes[1])],
        ["insert white space between inline-blocks", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => document.createTextNode(" "))],
        ["insert text between inline-blocks", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => document.createTextNode("text"))],
        ["insert a block between inline-blocks", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => make("div", ""))],
        ["insert an inline-block between blocks", `<div id="d">${blocks(3)}</div>`, before("e1", () => make("span", "ib"))],
        ["insert a block between a block and a run of inline content", `<div id="d"><div>a</div>one<div id="x">x</div></div>`, before("x", () => make("div", ""))],
        ["insert a table cell between blocks", `<div id="d">${blocks(3)}</div>`, before("e1", () => make("div", "cell"))],
        ["insert a table cell between inline-blocks", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => make("span", "cell"))],
        ["insert a float between blocks", `<div id="d">${blocks(3)}</div>`, before("e1", () => make("div", "float"))],
        ["insert an absolutely positioned box between blocks", `<div id="d">${blocks(3)}</div>`, before("e1", () => make("div", "abs"))],
        ["insert a display: contents element between inline-blocks", `<div id="d">${inlineBlocks(3)}</div>`, before("e1", () => fromMarkup(`<span class="contents"><span class="ib">m</span>text</span>`))],
        ["insert an inline-block and remove the box before it", `<div id="d">${inlineBlocks(4)}</div>`, d => {
            d.insertBefore(make("span", "ib"), d.querySelector("#e2"));
            d.querySelector("#e1").remove();
        }],
        ["insert an inline-block and restyle its neighbor", `<div id="d">${inlineBlocks(4)}</div>`, d => {
            d.insertBefore(make("span", "ib"), d.querySelector("#e2"));
            d.querySelector("#e1").className = "";
        }],

        // Counters, quotes and the first letter.
        ["insert an incrementing inline-block before a counter user", `<div class="counted"><div id="d"><span class="ib i">a</span><span id="x" class="ib s">c</span></div></div>`, before("x", () => make("span", "ib i"))],
        ["insert an inline-block between counter users", `<div class="counted"><div id="d"><span class="ib i s">a</span><span id="x" class="ib i s">c</span></div></div>`, before("x", () => make("span", "ib"))],
        ["insert an opening quote between inline-blocks", `<div class="q"><div id="d"><span class="ib">a</span><span id="x" class="ib open">c</span></div></div>`, before("x", () => make("span", "ib open"))],
        ["insert an inline-block under a first-letter", `<div id="d" class="first-letter"><span class="ib">a</span><span id="x" class="ib">c</span></div>`, before("x", () => make("span", "ib"))],
        ["insert an inline-block into a list in a first-letter block", `<div class="first-letter"><div id="d">${inlineBlocks(3)}</div></div>`, before("e1", () => make("span", "ib"))],
    ].map(([name, markup, mutate]) => ({
        name,
        setup(fixture) {
            fixture.innerHTML = style + markup;
            const d = fixture.querySelector("#d");
            return () => mutate(d);
        },
    }));

    test(() => runLayoutTreeFullRebuildComparisonCases(cases));
</script>
