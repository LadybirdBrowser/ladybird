    function runsUnderInlineSizeMeasurements(events) {
        let runs = 0;
        const openInlineSizeMeasurementDepths = [];
        for (const event of events) {
            while (openInlineSizeMeasurementDepths.length && openInlineSizeMeasurementDepths.at(-1) >= event.depth)
                openInlineSizeMeasurementDepths.pop();
            if (event.event === "run" && openInlineSizeMeasurementDepths.length) runs++;
            if (event.event === "measure" && event.size.endsWith("inline")) openInlineSizeMeasurementDepths.push(event.depth);
        }
        return runs;
    }

            const result = [root.width, root.height];
            for (const element of container.querySelectorAll("*")) {
                for (const rect of element.getClientRects())
                    result.push(rect.x - root.x, rect.y - root.y, rect.width, rect.height);
            }
            container.remove();
            return JSON.stringify(result);

                const measuredWidth = scrollContainer.offsetWidth;
                println(`${whitespace}, ${width}: width ${measuredWidth}, runs under inline size measurements ${runsUnderInlineSizeMeasurements(work.events)}`);
                scrollContainer.remove();
            }
        }
        done();
    });
</script>
