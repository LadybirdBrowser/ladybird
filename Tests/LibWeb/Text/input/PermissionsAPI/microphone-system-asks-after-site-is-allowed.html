<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        internals.setSystemMicrophoneAuthorization("not-determined", "denied");
        internals.setNextPermissionPromptOutcome("microphone", "allow");
        println(`system denies, request: ${await internals.requestPermission("microphone")}`);
        println(`system denies, query: ${(await navigator.permissions.query({ name: "microphone" })).state}`);

        await internals.setPermission("microphone", "prompt");
        internals.setSystemMicrophoneAuthorization("not-determined", "authorized");
        internals.setNextPermissionPromptOutcome("microphone", "allow");
        println(`system allows, request: ${await internals.requestPermission("microphone")}`);
        println(`system allows, query: ${(await navigator.permissions.query({ name: "microphone" })).state}`);
        done();
    });
</script>
