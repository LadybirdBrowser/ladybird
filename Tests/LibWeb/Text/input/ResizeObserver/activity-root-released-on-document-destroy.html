<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const frame = document.createElement("iframe");
        document.body.append(frame);
        frame.contentDocument.body.innerHTML = `<div id="target" style="width: 100px; height: 100px"></div>`;

        const observer = new frame.contentWindow.ResizeObserver(() => {});
        observer.observe(frame.contentDocument.getElementById("target"));
        println(`root before destroy: ${internals.hasActivityRoot(observer)}`);
        frame.remove();
        // Child destruction now completes asynchronously through the UI process.
        let hasRoot = true;
        for (let i = 0; i < 100 && hasRoot; ++i) {
            await internals.gcAsync();
            hasRoot = internals.hasActivityRoot(observer);
        }
        println(`root after destroy: ${hasRoot}`);
    });
</script>
