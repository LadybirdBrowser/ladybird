<div class="container" id="vertical" style="writing-mode: vertical-rl; width: auto; height: 30px"><div class="left" style="height: 10px; width: 10px"></div><div class="left" style="height: 20px; width: 10px"></div><div class="x" style="overflow: hidden"><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div></div></div>
<script>
    test(() => {
        // The border box of a box that establishes a formatting context overlaps no float, however far down the box
        // reaches. So a box narrows to fit beside the widest float beside it, and goes below the floats where its
        // width can't give way.
        for (const container of document.querySelectorAll(".container")) {
            const origin = container.getBoundingClientRect();
            const rects = [...container.querySelectorAll(".x")].map(box => {
                const rect = box.getBoundingClientRect();
                return `${rect.left - origin.left},${rect.top - origin.top} ${rect.width}x${rect.height}`;
            });
            println(`${container.id}: ${rects.join(" | ")}`);
        }
    });
</script>
