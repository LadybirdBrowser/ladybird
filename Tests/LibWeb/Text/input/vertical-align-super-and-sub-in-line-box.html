<script>
promiseTest(async () => {
  await Promise.all([...document.images].map(i => i.decode()));
  document.querySelectorAll(".c").forEach((c, i) => {
    const parts = [c, ...c.children].map(e => { const r = e.getBoundingClientRect(); return `${Math.round(r.top - c.getBoundingClientRect().top)}+${Math.round(r.height)}`; });
