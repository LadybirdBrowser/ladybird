<!DOCTYPE html>
<script src="include.js"></script>
<div id="player">
    <iframe id="frame" srcdoc="<div id=inner tabindex=0>iframe content</div>"></iframe>
</div>
<script>
    asyncTest(async done => {
        const frame = document.getElementById("frame");
        if (!frame.contentDocument?.getElementById("inner"))
            await new Promise(resolve => frame.addEventListener("load", resolve, { once: true }));

        const keys = [];
        // The iframe keeps Escape for itself, while its container in this document is fullscreen.
        frame.contentDocument.addEventListener("keydown", event => {
            keys.push(`keydown ${event.key}`);
            event.preventDefault();
        });

        const player = document.getElementById("player");
        internals.grantTransientActivation();
        await player.requestFullscreen();
        const results = [
            `fullscreen element before Escape: ${document.fullscreenElement?.id}`,
            `iframe's own fullscreen element: ${frame.contentDocument.fullscreenElement}`,
        ];

        const exitedFullscreen = new Promise(resolve => {
            document.addEventListener("fullscreenchange", function listener() {
                if (document.fullscreenElement)
                    return;
                document.removeEventListener("fullscreenchange", listener);
                resolve();
            });
        });
        internals.sendKey(frame.contentDocument.getElementById("inner"), "Escape");
        await exitedFullscreen;
        results.push(`fullscreen element after Escape: ${document.fullscreenElement}`);
        results.push(`keydowns the iframe saw for that Escape: ${keys.length ? keys.join(", ") : "none"}`);

        for (const result of results)
            println(result);
        done();
    });
</script>
