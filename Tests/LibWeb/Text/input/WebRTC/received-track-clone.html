<!DOCTYPE html>
<script src="../include.js"></script>
<script>
// A clone of a received video track plays what the receiver receives, and is enabled and stopped independently of the
// receiver's own track.
asyncTest(async done => {
    internals.setAutoplayPolicy("allow-audio-and-video");
    // Use numeric host candidates so this loopback test does not depend on mDNS multicast.
    await internals.setPermission("microphone", "granted");

    const canvas = document.createElement("canvas");
    canvas.width = 64;
    canvas.height = 36;
    const context = canvas.getContext("2d");
    let color = "red";
    const drawing = setInterval(() => {
        context.fillStyle = color;
        context.fillRect(0, 0, canvas.width, canvas.height);
    }, 30);

    const probe = document.createElement("canvas");
    probe.width = 64;
    probe.height = 36;
    const probeContext = probe.getContext("2d", { willReadFrequently: true });
    const colorShownBy = video => {
        probeContext.drawImage(video, 0, 0, probe.width, probe.height);
        const [red, green, blue] = probeContext.getImageData(32, 18, 1, 1).data;
        if (red > 180 && green < 80 && blue < 80)
            return "red";
        if (red < 80 && green < 80 && blue > 180)
            return "blue";
        if (red < 30 && green < 30 && blue < 30)
            return "black";
        return `rgb(${red}, ${green}, ${blue})`;
    };
    const shows = (video, color) => new Promise((resolve, reject) => {
        const deadline = performance.now() + 15000;
        const check = () => {
            if (video.videoWidth > 0 && colorShownBy(video) === color)
                resolve();
            else if (performance.now() > deadline)
                reject(new Error(`the video never showed ${color}, but ${video.videoWidth > 0 ? colorShownBy(video) : "nothing"}`));
            else
                setTimeout(check, 20);
        };
        check();
    });
    const within = (promise, what) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(what)), 15000))]);
    const play = async track => {
        const video = document.createElement("video");
        document.body.append(video);
        video.srcObject = new MediaStream([track]);
        await within(video.play(), "the video didn't start playing");
        return video;
    };

    const a = new RTCPeerConnection();
    const b = new RTCPeerConnection();
    try {
        a.onicecandidate = event => event.candidate && b.addIceCandidate(event.candidate).catch(() => {});
        b.onicecandidate = event => event.candidate && a.addIceCandidate(event.candidate).catch(() => {});
        const received = new Promise(resolve => b.ontrack = event => resolve(event.track));
        a.addTrack(canvas.captureStream().getVideoTracks()[0]);
        await a.setLocalDescription(await a.createOffer());
        await b.setRemoteDescription(a.localDescription);
        await b.setLocalDescription(await b.createAnswer());
        await a.setRemoteDescription(b.localDescription);
        const remote = await within(received, "no track event");

        const clone = remote.clone();
        const cloneVideo = await play(clone);
        await shows(cloneVideo, "red");
        println("clone of the received track: red");

        const remoteVideo = await play(remote);
        await shows(remoteVideo, "red");
        clone.enabled = false;
        await shows(cloneVideo, "black");
        await shows(remoteVideo, "red");
        println("clone disabled: black, while the received track shows red");
        clone.enabled = true;
        await shows(cloneVideo, "red");
        println("clone enabled again: red");

        // Change the color to verify that the clone receives new frames after the original stops.
        remote.stop();
        color = "blue";
        await shows(cloneVideo, "blue");
        println(`received track stopped: the clone is ${clone.readyState} and shows what is sent now`);
    } catch (error) {
        println(`FAIL: ${error.message}`);
    } finally {
        clearInterval(drawing);
        a.close();
        b.close();
    }
    done();
});
</script>
