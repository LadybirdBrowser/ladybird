<!DOCTYPE html>
<script src="../include.js"></script>
<script>
// A transceiver learns its mid when a description that has it is applied, and its current direction from each
// answer. A receiver's track outlives the other end no longer sending on it.
asyncTest(async done => {
    // Use numeric host candidates so this loopback test does not depend on mDNS multicast.
    await internals.setPermission("microphone", "granted");
    const a = new RTCPeerConnection();
    const b = new RTCPeerConnection();
    a.onicecandidate = event => event.candidate && b.addIceCandidate(event.candidate).catch(() => {});
    b.onicecandidate = event => event.candidate && a.addIceCandidate(event.candidate).catch(() => {});
    internals.grantTransientActivation();
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const sentByA = context.createMediaStreamDestination();
    const sentByB = context.createMediaStreamDestination();
    oscillator.connect(sentByA);
    oscillator.connect(sentByB);
    oscillator.start();

    const describe = transceiver => `mid ${transceiver.mid}, current direction ${transceiver.currentDirection}`;
    const negotiate = async () => {
        await a.setLocalDescription(await a.createOffer());
        await b.setRemoteDescription(a.localDescription);
        await b.setLocalDescription(await b.createAnswer());
        await a.setRemoteDescription(b.localDescription);
    };
    const nextEvent = (target, name) => new Promise((resolve, reject) => {
        target.addEventListener(name, resolve, { once: true });
        setTimeout(() => reject(new Error(`no ${name} event`)), 10000);
    });

    try {
        const sending = a.addTransceiver(sentByA.stream.getAudioTracks()[0], { direction: "sendonly" });
        const receiving = a.addTransceiver("audio", { direction: "recvonly" });
        println(`before an offer: ${describe(sending)}; ${describe(receiving)}`);

        const offer = await a.createOffer();
        await a.setLocalDescription(offer);
        println(`with a local offer: ${describe(sending)}; ${describe(receiving)}`);

        const receivingOnB = b.addTransceiver("audio", { direction: "recvonly" });
        const sendingOnB = b.addTransceiver(sentByB.stream.getAudioTracks()[0], { direction: "sendonly", streams: [sentByB.stream] });
        await b.setRemoteDescription(a.localDescription);
        const track = receiving.receiver.track;
        const firstTrackEvent = nextEvent(a, "track");
        await b.setLocalDescription(await b.createAnswer());
        await a.setRemoteDescription(b.localDescription);
        println(`with an answer: ${describe(sending)}; ${describe(receiving)}`);
        println(`on the other end: ${describe(receivingOnB)}; ${describe(sendingOnB)}`);
        println(`track event on the receiving transceiver: ${(await firstTrackEvent).transceiver === receiving}`);

        sendingOnB.direction = "inactive";
        await negotiate();
        println(`after the other end stopped sending: ${describe(sending)}; ${describe(receiving)}`);
        println(`the receiver's track is still ${track.readyState}`);
    } catch (error) {
        println(`FAIL: ${error.name}: ${error.message}`);
    } finally {
        oscillator.stop();
        a.close(); b.close(); context.close(); done();
    }
});
</script>
