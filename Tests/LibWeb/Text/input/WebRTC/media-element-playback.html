<!DOCTYPE html>
<script src="../include.js"></script>
<script>
asyncTest(async done => {
    const a = new RTCPeerConnection();
    const b = new RTCPeerConnection();
    a.onicecandidate = event => event.candidate && b.addIceCandidate(event.candidate).catch(() => {});
    b.onicecandidate = event => event.candidate && a.addIceCandidate(event.candidate).catch(() => {});
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const destination = context.createMediaStreamDestination();
    oscillator.connect(destination);
    oscillator.start();
    const remote = new Promise(resolve => b.ontrack = event => resolve(event));
    try {
        a.addTrack(destination.stream.getAudioTracks()[0], destination.stream);
        await a.setLocalDescription(await a.createOffer());
        await b.setRemoteDescription(a.localDescription);
        await b.setLocalDescription(await b.createAnswer());
        await a.setRemoteDescription(b.localDescription);
        const { track, streams } = await remote;

        const audio = new Audio();
        const loadedMetadata = new Promise(resolve => audio.onloadedmetadata = resolve);
        audio.srcObject = streams[0];
        await audio.play();
        await loadedMetadata;
        println(`readyState: ${audio.readyState}`);
        println(`duration: ${audio.duration}`);
        println(`paused after play(): ${audio.paused}`);

        // The decoded audio reaches the remote track itself, so WebAudio can listen to it too.
        const analyser = context.createAnalyser();
        context.createMediaStreamSource(new MediaStream([track])).connect(analyser);
        const samples = new Float32Array(analyser.fftSize);
        let peak = 0;
        for (let attempt = 0; attempt < 100 && peak < 0.1; ++attempt) {
            await new Promise(resolve => setTimeout(resolve, 50));
            analyser.getFloatTimeDomainData(samples);
            peak = samples.reduce((max, sample) => Math.max(max, Math.abs(sample)), 0);
        }
        println(`remote track carries audio: ${peak >= 0.1}`);
        println(`currentTime advanced: ${audio.currentTime > 0}`);

        audio.volume = 0.5;
        audio.muted = true;
        audio.pause();
        println(`paused after pause(): ${audio.paused}`);
        await audio.play();
        println(`paused after playing again: ${audio.paused}`);
    } catch (error) {
        println(`FAIL: ${error.name}: ${error.message}`);
    } finally {
        oscillator.stop();
        a.close(); b.close(); context.close(); done();
    }
});
</script>
