<!DOCTYPE html>
<style>
    .box {
        display: flex;
        width: 60px;
    }
    .item {
        flex: 1 1 auto;
    }
    .item > * {
        box-sizing: border-box;
        display: block;
    }
    .percentage-width > * {
        width: 100%;
    }
    .percentage-max-width > * {
        max-width: 100%;
    }
</style>
<div class="box"><div class="item percentage-width" id="input"><input></div></div>
<div class="box"><div class="item percentage-width" id="textarea"><textarea cols="30"></textarea></div></div>
<div class="box"><div class="item percentage-max-width" id="input-max"><input></div></div>
<div class="box"><div class="item percentage-max-width" id="textarea-max"><textarea cols="30"></textarea></div></div>
<div class="box"><div class="item percentage-width" id="select"><select><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item percentage-max-width" id="select-max"><select><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item percentage-width" id="listbox"><select size="3"><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item percentage-max-width" id="listbox-max"><select size="3"><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item percentage-width" id="inline-flex-select"><select style="display: inline-flex"><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item" id="fit-content-select"><select style="width: fit-content(50%)"><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item" id="fit-content-input"><input style="width: fit-content(50%)"></div></div>
<div class="box"><div class="item" id="calc-select"><select style="width: calc(100% + 80px); padding: 0; border: 0"><option>A fairly long option text</option></select></div></div>
<div class="box"><div class="item" id="calc-input"><input style="width: calc(100% + 80px); padding: 0; border: 0"></div></div>
<script src="../include.js"></script>
<script>
    // A text input, a textarea, or a select with a percentage width is compressible: its min-content contribution
    // resolves that percentage against zero, so the flex item around it can shrink to its container, whatever the
    // control's display type. Only the percentage resolves against zero, so a length added to it still counts. A
    // percentage max-width doesn't compress the control, so the flex item around it keeps the control's default width.
    test(() => {
        const width = id => document.getElementById(id).getBoundingClientRect().width;
        for (const element of ["input", "textarea", "select", "listbox"]) {
            println(`flex item around a <${element}> with width: 100%: ${width(element)}px`);
            println(`flex item around a <${element}> with max-width: 100%: ${width(`${element}-max`)}px`);
        }
        println(`flex item around an inline-flex <select> with width: 100%: ${width("inline-flex-select")}px`);
        for (const element of ["select", "input"])
            println(`flex item around a <${element}> with width: calc(100% + 80px): ${width(`calc-${element}`)}px`);
        for (const element of ["select", "input"])
            println(`flex item around a <${element}> with width: fit-content(50%): ${width(`fit-content-${element}`)}px`);
    });
</script>
