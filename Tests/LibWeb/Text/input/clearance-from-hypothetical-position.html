<script>
    test(() => {
        // A box with "clear" gets clearance if its top border edge wouldn't be past the floats without it. That edge is
        // where the margins before it put it, so a negative margin can pull the box up beside a float that the flow is
        // already past, and a positive one can carry it past a float on its own. The margins of its first children
        // collapse with its own, and count the same way: at the sizes their percentages resolve to in the boxes they
        // are in, through the boxes before them that have no height, and for as long as none of them gets clearance
        // itself. But a float inside a box that the margin would move goes wherever the clearing box goes, so no
        // margin carries the box past it.
        for (const root of document.querySelectorAll(".root")) {
            const origin = root.getBoundingClientRect();
            const positions = [...root.querySelectorAll(".x")].map(box => {
                const rect = box.getBoundingClientRect();
                return `${rect.left - origin.left},${rect.top - origin.top}`;
            });
            println(`${root.id}: ${positions.join(" ")}`);
        }
    });
</script>
