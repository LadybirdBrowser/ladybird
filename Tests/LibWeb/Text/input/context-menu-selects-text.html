<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body {
        font: 20px SerenitySans, sans-serif;
        line-height: 32px;
    }
</style>
<div id="word">ordinary</div>
<div id="words">two words</div>
<div id="nbsp">two&nbsp;words</div>
<div id="url">ladybird.org/path?x=1</div>
<div id="prevented">prevented</div>
<div id="existing">existing selection</div>
<div id="other">other target</div>
<a id="anchor" href="https://example.com/">anchor selection</a>
<div><a id="link" href="https://example.com/">a <b id="nested">nested</b> link</a></div>
<div><span id="slotHost">slotted label</span></div>
<img id="image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" style="width: 20px; height: 20px;">
<div id="none" style="user-select: none;">hidden.org</div>
<div id="editable" contenteditable>one two</div>
<script>
    // Only macOS selects the word or link under the pointer when a context menu opens.
    const selectsText = navigator.platform.includes("Mac");

    slotHost.attachShadow({ mode: "open" }).innerHTML = '<a href="https://example.com/"><slot></slot></a>';

    function rightClick(element) {
        const rect = element.getBoundingClientRect();
        rightClickAt(rect.left + 8, rect.top + rect.height / 2);
    }

    function rightClickAt(x, y) {
        internals.click(x, y, 1, internals.BUTTON_RIGHT);
    }

    function textRect(node, start, end) {
        const range = document.createRange();
        range.setStart(node, start);
        range.setEnd(node, end);
        return range.getBoundingClientRect();
    }

    function rightClickText(node, start, end) {
        const rect = textRect(node, start, end);
        rightClickAt(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    function selectStartOfExisting() {
        const range = document.createRange();
        range.setStart(existing.firstChild, 0);
        range.setEnd(existing.firstChild, 8);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
    }

    function expectSelection(description, onMac, elsewhere = onMac) {
        const expected = selectsText ? onMac : elsewhere;
        const actual = internals.selectedTextForClipboard();
        println(`${description}: ${actual === expected ? "PASS" : `FAIL, expected "${expected}" but got "${actual}"`}`);
    }

    test(() => {
        rightClick(word);
        expectSelection("a word is selected on macOS only", "ordinary", "");

        getSelection().removeAllRanges();
        const wordRect = textRect(word.firstChild, 0, 8);
        rightClickAt(wordRect.right + 20, wordRect.top + wordRect.height / 2);
        expectSelection("nothing is selected next to a word", "");

        getSelection().removeAllRanges();
        const lastGlyphRect = textRect(words.firstChild, 2, 3);
        rightClickAt(lastGlyphRect.right - 2, lastGlyphRect.top + lastGlyphRect.height / 2);
        expectSelection("the end of a word selects it on macOS only", "two", "");

        getSelection().removeAllRanges();
        rightClickText(words.firstChild, 3, 4);
        expectSelection("nothing is selected between words", "");

        getSelection().removeAllRanges();
        rightClickText(nbsp.firstChild, 3, 4);
        expectSelection("nothing is selected on a non-breaking space between words", "");

        getSelection().removeAllRanges();
        const lineRect = word.getBoundingClientRect();
        rightClickAt(wordRect.left + 8, lineRect.top + 1);
        expectSelection("nothing is selected above the glyphs of a line", "");

        getSelection().removeAllRanges();
        rightClick(url);
        expectSelection("a URL is selected whole on macOS only", "ladybird.org/path?x=1", "");

        getSelection().removeAllRanges();
        prevented.addEventListener("contextmenu", event => event.preventDefault());
        rightClick(prevented);
        expectSelection("nothing is selected for a canceled context menu", "");

        selectStartOfExisting();
        rightClick(existing);
        expectSelection("a press inside the selection keeps it", "existing");

        selectStartOfExisting();
        rightClick(other);
        expectSelection("a press outside the selection replaces it on macOS and clears it elsewhere", "other", "");

        const anchorRange = document.createRange();
        anchorRange.setStart(anchor.firstChild, 0);
        anchorRange.setEnd(anchor.firstChild, 6);
        getSelection().removeAllRanges();
        getSelection().addRange(anchorRange);
        rightClick(anchor);
        expectSelection("a press inside a selection within a link keeps it", "anchor");

        getSelection().removeAllRanges();
        rightClickText(nested.firstChild, 0, 6);
        expectSelection("a link is selected whole on macOS only", "a nested link", "");

        getSelection().removeAllRanges();
        rightClickText(link.firstChild, 1, 2);
        expectSelection("a space between a link's words selects the link on macOS only", "a nested link", "");

        selectStartOfExisting();
        rightClickText(nested.firstChild, 0, 6);
        expectSelection("a press on a link replaces the selection on macOS and keeps it elsewhere", "a nested link", "existing");

        selectStartOfExisting();
        rightClickText(slotHost.firstChild, 0, 7);
        expectSelection("a press on a link's slotted text selects the word on macOS and keeps the selection elsewhere", "slotted", "existing");

        selectStartOfExisting();
        rightClick(image);
        expectSelection("a press on an image keeps the selection", "existing");

        getSelection().removeAllRanges();
        rightClick(none);
        expectSelection("nothing is selected where user-select is none", "");

        editable.focus();
        getSelection().collapse(editable.firstChild, 0);
        rightClickText(editable.firstChild, 4, 7);
        expectSelection("a word in editable text is selected on macOS only", "two", "");
    });
</script>
