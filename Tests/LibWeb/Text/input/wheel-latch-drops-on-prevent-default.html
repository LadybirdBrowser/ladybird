<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body {
        margin: 0;
        height: 2000px;
    }
    #scroller {
        width: 100px;
        height: 100px;
        overflow: scroll;
    }
    #scroller > div {
        height: 200px;
    }
</style>
<div id="scroller"><div></div></div>
<script>
    promiseTest(async () => {
        const cancelable = [];
        scroller.addEventListener("wheel", event => {
            cancelable.push(event.cancelable);
            if (cancelable.length == 1)
                event.preventDefault();
        }, { passive: false });
        await animationFrame();
        await animationFrame();

        await internals.wheel(50, 50, 0, 100);
        println(`scroller.scrollTop after the cancelled tick: ${scroller.scrollTop}`);

        // The cancelled event ended the gesture the scroller was latched for, so the page sees this tick first again,
        // and it is routed afresh.
        await internals.wheel(50, 50, 0, 100);
        println(`scroller.scrollTop after the tick following the cancelled one: ${scroller.scrollTop}`);

        // The page let the gesture through, so this tick does not wait for it, and the scroller at its extent keeps it.
        await internals.wheel(50, 50, 0, 100);
        println(`window.scrollY after the last tick: ${window.scrollY}`);
        println(`cancelable: ${cancelable.join(",")}`);
    });
</script>
