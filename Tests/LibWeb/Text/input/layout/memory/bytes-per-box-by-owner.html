<!doctype html>
<style>
    .item {
        margin: 1px;
    }
</style>
<body>
<script src="../../include.js"></script>
<script>
    // The layout memory each element adds, by owner: the report on a page of 1000 elements, less the one on the same
    // page of 500, over the 500 elements between. Per-document costs cancel out.
    function report() {
        document.body.offsetWidth;
        return internals.layoutMemoryReport();
    }

    function slopes(makeElement) {
        const container = document.createElement("div");
        document.body.appendChild(container);
        const reports = [];
        for (const count of [500, 1000]) {
            while (container.childElementCount < count)
                container.appendChild(makeElement(container.childElementCount));
            reports.push(report());
        }
        const elements = 500;
        const slopes = {};
        for (const owner in reports[1].owners)
            slopes[owner] = (reports[1].owners[owner] - reports[0].owners[owner]) / elements;
        return {
            rows: (reports[1].liveRows - reports[0].liveRows) / elements,
            layoutNodes: (reports[1].layoutNodes - reports[0].layoutNodes) / elements,
            slopes,
        };
    }

    // Bytes per element each owner may add, which a change that grows an owner past has to raise.
    const emptyBudgets = {
        nodeRows: 112,
        arenaColumns: 76,
        paintableRows: 224,
        committedLinks: 68,
        fragments: 220,
        visualContexts: 4,
        memos: 460,
    };
    // NB: The budgets for paintableRows and committedLinks cover the order a tree build with forced jobs gives the
    //     slots in (LIBWEB_VERIFY_LAYOUT_FORKS=reversed), where a page of the test's sizes ends on other chunks.
    const textBudgets = {
        nodeRows: 228,
        arenaColumns: 152,
        textRows: 312,
        paintableRows: 292,
        committedLinks: 84,
        fragments: 220,
        inlineContent: 904,
        visualContexts: 4,
        memos: 1156,
    };

    function check(name, budgets, makeElement) {
        const result = slopes(makeElement);
        // NB: The slots are left out: they come in chunks, so their slope tells where a chunk boundary falls.
        println(`${name}: ${result.rows} rows, ${result.layoutNodes} layout nodes per element`);
        for (const owner in result.slopes) {
            const budget = budgets[owner] ?? 0;
            const slope = result.slopes[owner];
            println(`  ${owner}: ${slope <= budget ? `within ${budget}` : `${slope} is over ${budget}`}`);
        }
    }

    test(() => {
        check("empty", emptyBudgets, () => {
            const element = document.createElement("div");
            element.className = "item";
            return element;
        });
        check("text", textBudgets, index => {
            const element = document.createElement("div");
            element.className = "item";
            element.textContent = `Item number ${index} of the list`;
            return element;
        });
    });
</script>
