<!DOCTYPE html>
<script src="include.js"></script>
<script src="layout-test.js"></script>
<style>
    body { margin: 0; }
    table { border-collapse: collapse; }
    td { padding: 0 4px; font: 12px monospace; vertical-align: top; }
</style>
<table id="table"><tbody id="rows"></tbody></table>
<script>
    test(() => {
        const ROWS = 20;
        const parts = [];
        for (let i = 0; i < ROWS; ++i)
            parts.push(`<tr><td class="index">${i}</td><td class="words">some words that wrap in a narrow column ${i}</td><td class="markup">text with <b>markup</b> ${i}</td></tr>`);
        document.getElementById("rows").innerHTML = parts.join("");
        const table = document.getElementById("table");

        // The cells of a column share a box name, so the names of the missed cells name their columns.
        const measure = width => {
            const work = layoutWork(() => table.style.width = `${width}px`);
            const misses = { event: "measure cell", cache: "miss" };
            const columns = work.boxes(misses);
            println(`${width}px: ${work.count(misses)} misses${columns.length ? ` in ${columns.join(", ")}` : ""}, height ${table.offsetHeight}`);
        };

        layoutWork(() => table.style.width = "1000px");
        // Wide enough for every cell to fit on one line: only cells with markup are measured again.
        measure(900);
        measure(950);
        // The middle column wraps: its cells are measured again, the text-only first column is not.
        measure(400);
        measure(350);
        // Back above the max-content widths of the text-only cells.
        measure(1000);
    });
</script>
