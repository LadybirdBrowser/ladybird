<!DOCTYPE html>
<script src="include.js"></script>
<style>
    #scroller {
        width: 200px;
        height: 200px;
        overflow: scroll;
        scroll-snap-type: y mandatory;
    }
    .item {
        width: 100%;
        height: 200px;
        scroll-snap-align: start;
    }
</style>
<div id="scroller">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
</div>
<script>
    promiseTest(async () => {
        const scroller = document.getElementById("scroller");

        await animationFrame();
        await animationFrame();

        let scrollendCount = 0;
        scroller.addEventListener("scrollend", () => ++scrollendCount);

        // The gesture goes quiet for longer than the settle timer's deadline without reporting an end.
        await internals.wheel(50, 50, 0, 120, true, "ongoing");
        await timeout(700);
        println(`scroll offset after pausing within the gesture: ${scroller.scrollLeft},${scroller.scrollTop}`);
        println(`scrollend events while the gesture is in progress: ${scrollendCount}`);

        // Input that reports no phase belongs to no gesture, so it releases the hold the abandoned gesture took.
        await internals.wheel(50, 50, 0, 120);
        for (let frame = 0; frame < 120 && scrollendCount === 0; ++frame)
            await animationFrame();
        println(`scrollend fired after a wheel that reports no phase: ${scrollendCount > 0}`);

        // How a step selects its snap position is not what this test pins down, so only the resting offset is reported.
        println(`the scrolling came to rest at a snap area: ${scroller.scrollTop % 200 === 0}`);
    });
</script>
