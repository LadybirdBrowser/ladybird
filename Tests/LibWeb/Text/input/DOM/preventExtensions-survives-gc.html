<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<script>
    test(() => {
        withCollectedWrapper(
            () => {
                const element = host.appendChild(document.createElement("span"));
                element.id = "prevent-extensions-probe";
                Object.preventExtensions(element);
                return element;
            },
            () => document.getElementById("prevent-extensions-probe"),
            element => println(`extensible=${Object.isExtensible(element)}`)
        );
    });
</script>
