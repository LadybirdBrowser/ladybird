<!DOCTYPE html>
<style>
    #scene {
        position: relative;
        width: 200px;
        height: 200px;
        transform-style: preserve-3d;
        background-color: blue;
    }

    #behind,
    #front {
        position: absolute;
        left: 0;
        top: 0;
        width: 200px;
    }

    #behind {
        height: 200px;
        transform: translateZ(-10px);
        background-color: red;
    }

    #front {
        height: 60px;
        transform: translateZ(10px);
        background-color: green;
    }
</style>
<script src="../include.js"></script>
<div id="scene">
    <div id="behind"></div>
    <div id="front"></div>
</div>

</script>
