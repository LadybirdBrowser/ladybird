<!doctype html>
<script src="../include.js"></script>
<style>
    body {
        margin: 0;
    }

    #target {
        cursor: pointer;
        height: 100px;
        left: 150px;
        position: absolute;
        top: 0;
        width: 100px;
    }
</style>
<div id="target"></div>
<script>
    function nextRenderingUpdate() {
        return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    // The element moves a rendering update after the move settled.
    asyncTest(async done => {
        internals.mouseMove(50, 50);
        await nextRenderingUpdate();
        println(`initial cursor: ${internals.currentCursor()}`);

        target.style.left = "0";
        await nextRenderingUpdate();
        internals.synchronizeCompositor();
        // The hover follows the frame between two tasks.
        await new Promise(resolve => setTimeout(resolve, 0));
        println(`cursor after element moves under mouse: ${internals.currentCursor()}`);
        done();
    });
</script>
