<!DOCTYPE html>
<script src="../include.js"></script>
<map name="leading">
    <area id="leading-default" shape="default" href="#default" alt="default">
    <area id="leading-rect" shape="rect" coords="0,0,50,50" href="#rect" alt="rect">
</map>
<map name="trailing">
    <area id="trailing-rect" shape="rect" coords="0,0,50,50" href="#rect" alt="rect">
    <area id="trailing-default" shape="default" href="#default" alt="default">
</map>
<img id="leading-image" usemap="#leading" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" width="100" height="100" alt="leading default">
<img id="trailing-image" usemap="#trailing" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" width="100" height="100" alt="trailing default">
<script>
    test(() => {
        const targetAt = (imageId, x, y) => {
            const imageRect = document.getElementById(imageId).getBoundingClientRect();
            return document.elementFromPoint(imageRect.x + x, imageRect.y + y).id;
        };

        println(`default area layered above a rect area covers the rect: ${targetAt("leading-image", 25, 25)}`);
        println(`default area layered above a rect area covers the image: ${targetAt("leading-image", 75, 75)}`);
        println(`default area layered below a rect area yields to the rect: ${targetAt("trailing-image", 25, 25)}`);
        println(`default area layered below a rect area covers the image: ${targetAt("trailing-image", 75, 75)}`);
    });
</script>
