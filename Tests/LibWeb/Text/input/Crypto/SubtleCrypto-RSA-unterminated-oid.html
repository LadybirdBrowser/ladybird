<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const algorithm = {
            name: "RSA-PSS",
            modulusLength: 1024,
            publicExponent: new Uint8Array([1, 0, 1]),
            hash: "SHA-256",
        };
        const pair = await crypto.subtle.generateKey(algorithm, true, ["sign", "verify"]);
        const message = new Uint8Array([42]);
        const signature = await crypto.subtle.sign({ name: "RSA-PSS", saltLength: 32 }, pair.privateKey, message);
        const canonical = new Uint8Array(await crypto.subtle.exportKey("spki", pair.publicKey));
        const rsaOid = [0x06, 0x09, 0x2a, 0x86, 0x48, 0x86, 0xf7, 0x0d, 0x01, 0x01, 0x01];
        const offset = canonical.findIndex((_, i) => rsaOid.every((byte, j) => canonical[i + j] === byte));

        async function importAndVerify(lastArcByte, name) {
            const end = offset + rsaOid.length;
            const encoded = new Uint8Array(canonical.length + 1);
            encoded.set(canonical.slice(0, end));
            encoded[end] = lastArcByte;
            encoded.set(canonical.slice(end), end + 1);
            encoded[offset + 1] += 1;
            encoded[offset - 1] += 1;
            encoded[2] += 1;
            try {
                const key = await crypto.subtle.importKey("spki", encoded, algorithm, false, ["verify"]);
                const verified = await crypto.subtle.verify(
                    { name: "RSA-PSS", saltLength: 32 },
                    key,
                    signature,
                    message
                );
                println(`${name}=imported,verified:${verified}`);
            } catch (error) {
                println(`${name}=${error.name}`);
            }
        }

        await importAndVerify(0x81, "trigger");
        await importAndVerify(0x01, "control");
    });
</script>
