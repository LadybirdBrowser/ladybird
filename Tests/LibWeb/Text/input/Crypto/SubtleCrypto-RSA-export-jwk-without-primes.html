<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        for (const [name, usages, privateUsage] of [
            ["RSASSA-PKCS1-v1_5", ["sign", "verify"], "sign"],
            ["RSA-PSS", ["sign", "verify"], "sign"],
            ["RSA-OAEP", ["encrypt", "decrypt"], "decrypt"],
        ]) {
            const algorithm = { name, hash: "SHA-256" };
            const { privateKey } = await crypto.subtle.generateKey(
                { ...algorithm, modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]) },
                true,
                usages
            );
            const { kty, n, e, d } = await crypto.subtle.exportKey("jwk", privateKey);
            const key = await crypto.subtle.importKey("jwk", { kty, n, e, d }, algorithm, true, [privateUsage]);
            const jwk = await crypto.subtle.exportKey("jwk", key);
            const members = ["n", "e", "d", "p", "q", "dp", "dq", "qi"].filter(member => member in jwk);
            println(`${name}: ${members.join(", ")}`);
        }
    });
</script>
