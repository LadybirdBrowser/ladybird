<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // The encodings, with either x-coordinate sign, of the points whose order divides Ed448's cofactor of 4: y = 0,
    // y = 1, and y = p - 1, for p = 2^448 - 2^224 - 1.
    function encoding(y, signBit) {
        const bytes = new Uint8Array(57);
        if (y === "1") {
            bytes[0] = 1;
        } else if (y === "p - 1") {
            bytes.fill(0xff, 0, 56);
            bytes[0] = 0xfe;
            bytes[28] = 0xfe;
        }
        if (signBit)
            bytes[56] = 0x80;
        return bytes;
    }

    async function verifies(publicKey, signature) {
        try {
            const key = await crypto.subtle.importKey("raw", publicKey, { name: "Ed448" }, false, ["verify"]);
            return await crypto.subtle.verify({ name: "Ed448" }, key, signature, new Uint8Array(0));
        } catch (e) {
            return e.name;
        }
    }

    asyncTest(async done => {
        for (const y of ["0", "1", "p - 1"]) {
            for (const signBit of [false, true]) {
                const point = encoding(y, signBit);
                const signature = new Uint8Array(114);
                signature.set(point, 0);
                println(`y = ${y}, sign bit ${signBit ? 1 : 0}, as the key and R: ${await verifies(point, signature)}`);
            }
        }
        done();
    });
</script>
