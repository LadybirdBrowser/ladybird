<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const message = new Uint8Array([42]);
        const known = await crypto.subtle.importKey("raw", new Uint8Array([0]), { name: "HMAC", hash: "SHA-256", length: 8 }, false, ["sign"]);
        const forgery = await crypto.subtle.sign("HMAC", known, message);

        for (const algorithm of [{ name: "HMAC", hash: "SHA-256" }, { name: "KMAC128" }]) {
            for (const [bytes, length] of [[[0xff], 7], [[0xff], 8], [[0xff, 0xff], 12]]) {
                let key;
                try {
                    key = await crypto.subtle.importKey("raw-secret", new Uint8Array(bytes), { ...algorithm, length }, true, ["sign", "verify"]);
                } catch (error) {
                    println(`${algorithm.name} length ${length}: ${error.name}`);
                    continue;
                }
                const exported = new Uint8Array(await crypto.subtle.exportKey("raw-secret", key));
                let line = `${algorithm.name} length ${length}: exported [${exported}], algorithm.length ${key.algorithm.length}`;
                if (algorithm.name === "HMAC")
                    line += `, empty-key forgery verifies: ${await crypto.subtle.verify("HMAC", key, forgery, message)}`;
                println(line);
            }
        }

        for (const size of [512, 513]) {
            let key;
            try {
                key = await crypto.subtle.importKey("raw-secret", new Uint8Array(size), { name: "KMAC128" }, false, ["sign"]);
            } catch (error) {
                println(`KMAC128 ${size}-byte key: ${error.name}`);
                continue;
            }
            let signResult = "ok";
            try {
                await crypto.subtle.sign({ name: "KMAC128", outputLength: 256 }, key, message);
            } catch (error) {
                signResult = error.name;
            }
            println(`KMAC128 ${size}-byte key: imported, algorithm.length ${key.algorithm.length}, sign: ${signResult}`);
        }
    });
</script>
