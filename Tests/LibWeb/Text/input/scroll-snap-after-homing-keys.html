<!DOCTYPE html>
<script src="include.js"></script>
<style>
    #scroller {
        width: 200px;
        height: 200px;
        overflow: scroll;
        scroll-snap-type: y mandatory;
    }
    .item {
        width: 100%;
        height: 200px;
        scroll-snap-align: start;
    }
    .gap {
        height: 300px;
    }
</style>
<div id="scroller" tabindex="0">
    <div class="item"></div>
    <div class="gap"></div>
    <div class="item"></div>
    <div class="gap"></div>
    <div class="item"></div>
    <div style="height: 200px"></div>
</div>
<script>
    promiseTest(async () => {
        const scroller = document.getElementById("scroller");

        await animationFrame();
        await animationFrame();

        await scrollSettled(scroller, () => internals.sendKey(scroller, "End"));
        println(`scroll offset after an end key press: ${scroller.scrollLeft},${scroller.scrollTop}`);

        await scrollSettled(scroller, () => internals.sendKey(scroller, "Home"));
        println(`scroll offset after a home key press: ${scroller.scrollLeft},${scroller.scrollTop}`);
    });
</script>
