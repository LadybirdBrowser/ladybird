<!DOCTYPE html>
<script src="include.js"></script>
<input id="target">
<script>
    test(() => {
        internals.updateStyle();
        target.focus();
        internals.beginRenderingTrace();

        document.body.classList.add("pending-style-change");
        target.focus();

        const styleUpdates = internals.takeRenderingTrace().split("\n").filter(line => line.startsWith("style stabilization epoch"));
        println(`active element preserved: ${document.activeElement === target}`);
        println(`style updates: [${styleUpdates.join(", ")}]`);
    });
</script>
