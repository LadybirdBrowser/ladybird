<!DOCTYPE html>
<script src="../include.js"></script>
<embed id="embed" src="../wpt-import/xhr/resources/delay.py?ms=3000">
<script>
    asyncTest(done => {
        // The embed's fetch starts in a queued task, and the server holds back its response headers for 3 seconds.
        setTimeout(() => {
            // Stopping the document stops the embed's fetch before it has a response.
            window.stop();
            let frames = 0;
            const check = () => {
                if (document.readyState === "complete" || ++frames === 60) {
                    println(`readyState: ${document.readyState}`);
                    done();
                    return;
                }
                requestAnimationFrame(check);
            };
            check();
        }, 100);
    });
</script>
