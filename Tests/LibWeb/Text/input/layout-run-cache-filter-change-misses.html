<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
    #spacer { width: 100px; height: 50px; }
    #cached {
        width: 300px;
        overflow: hidden;
    }
    #inner { width: 120px; height: 40px; }
</style>
<div id="spacer"></div>
<div id="cached">
    <div id="inner"></div>
</div>
<script>
    asyncTest(async (done) => {
        document.body.offsetHeight;

        // filter establishes a fixed-positioning containing block, so an effects
        // change must invalidate the subtree's cached run even though the box
        // geometry is unchanged.
        document.getElementById("cached").style.filter = "blur(1px)";
        const hitsBefore = internals.layoutRunCacheHitCount();
        document.getElementById("spacer").style.height = "80px";
        document.body.offsetHeight;

        const hitDelta = internals.layoutRunCacheHitCount() - hitsBefore;
        println(`hit delta after filter change: ${hitDelta}`);
        done();
    });
</script>
