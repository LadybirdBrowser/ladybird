<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; font: 20px/30px monospace; }
    textarea { display: block; font: inherit; width: 600px; height: 30px; padding: 0; border: 0; resize: none; }
    div { width: 600px; }
</style>
<textarea id="area">one txet two wrod quikc</textarea>
<div id="editable" contenteditable>speling lernword</div>
<span id="probe">xxxxxxxxxx</span>
<script>
    promiseTest(async () => {
        const probe = document.getElementById("probe");
        const characterWidth = probe.getBoundingClientRect().width / 10;
        probe.remove();
        const clickAt = (x, y, button = 0) => {
            internals.mouseDown(x, y, 1, button);
            internals.mouseUp(x, y, button);
        };
        const pointInTextControl = (element, index) => {
            const rect = element.getBoundingClientRect();
            return [rect.left + (index + 0.5) * characterWidth, rect.top + 15];
        };
        const pointInText = (text, index) => {
            const range = document.createRange();
            range.setStart(text, index);
            range.setEnd(text, index + 1);
            const rect = range.getBoundingClientRect();
            return [rect.left + rect.width / 2, rect.top + rect.height / 2];
        };
        // Checks run only on the user's behalf, so the user focuses fields with clicks.
        const leaveField = () => document.activeElement.blur();
        const ranges = node => internals.spellingErrorRanges(node) || "(none)";

        const area = document.getElementById("area");
        area.addEventListener("beforeinput", event => println(`area beforeinput ${event.inputType} data=${event.data}`));
        area.addEventListener("input", event => println(`area input ${event.inputType} data=${event.data}`));
        clickAt(...pointInTextControl(area, 0));
        await internals.spellCheckSettled();
        println(`area flagged: ${ranges(area)}`);

        clickAt(...pointInTextControl(area, 5), 2);
        println(`selection: ${area.selectionStart}-${area.selectionEnd}`);
        println(`menu on txet: ${await internals.activateSpellingMenuItem("guess", 0)}`);
        println(`value: ${area.value}`);
        await internals.spellCheckSettled();
        println(`area flagged: ${ranges(area)}`);

        clickAt(...pointInTextControl(area, 14), 2);
        println(`menu on wrod: ${await internals.activateSpellingMenuItem("none")}`);
        clickAt(...pointInTextControl(area, 19), 2);
        println(`menu on quikc: ${await internals.activateSpellingMenuItem("ignore")}`);
        println(`area flagged after ignore: ${ranges(area)}`);
        clickAt(...pointInTextControl(area, 1), 2);
        println(`menu on one: ${await internals.activateSpellingMenuItem("none")}`);
        leaveField();
        clickAt(...pointInTextControl(area, 0));
        await internals.spellCheckSettled();
        println(`area flagged after a new check: ${ranges(area)}`);

        const editable = document.getElementById("editable");
        clickAt(...pointInText(editable.firstChild, 0));
        await internals.spellCheckSettled();
        println(`editable flagged: ${ranges(editable.firstChild)}`);
        clickAt(...pointInText(editable.firstChild, 10), 2);
        println(`menu on lernword: ${await internals.activateSpellingMenuItem("learn")}`);
        println(`editable flagged after learn: ${ranges(editable.firstChild)}`);

        const cancel = event => event.preventDefault();
        editable.addEventListener("beforeinput", cancel);
        clickAt(...pointInText(editable.firstChild, 2), 2);
        println(`menu on speling: ${await internals.activateSpellingMenuItem("guess", 0)}`);
        println(`canceled replacement: ${editable.textContent}`);
        editable.removeEventListener("beforeinput", cancel);
        // A menu takes one action: Activating the guess again, with no new right-click, replaces nothing.
        println(`same menu again: ${await internals.activateSpellingMenuItem("guess", 0)}`);
        println(`after a second activation: ${editable.textContent}`);

        editable.addEventListener("input", event => println(`editable input ${event.inputType} data=${event.data}`));
        clickAt(...pointInText(editable.firstChild, 2), 2);
        println(`menu on speling: ${await internals.activateSpellingMenuItem("guess", 0)}`);
        println(`replaced: ${editable.textContent}`);
        document.execCommand("undo");
        println(`undone: ${editable.textContent}`);
        leaveField();
        clickAt(...pointInText(editable.firstChild, 0));
        await internals.spellCheckSettled();
        println(`editable flagged after a new check: ${ranges(editable.firstChild)}`);
    });
</script>
