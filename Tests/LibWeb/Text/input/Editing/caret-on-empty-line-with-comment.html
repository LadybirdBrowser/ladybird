<!DOCTYPE html>
<meta charset="utf-8">
<script src="../include.js"></script>
<div contenteditable="true" id="editor">first<p><!-- comment --><br></p><p>last</p></div>
<div contenteditable="true" id="image"><p>A</p><p><img contenteditable="false" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'/>"><br><br></p><p>B</p></div>
<div contenteditable="true" id="only-image"><p>A</p><p><img contenteditable="false" style="width: 100px; height: 20px" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='20'/>"></p><p>B</p></div>
<div contenteditable="true" id="only-inline-block"><p>A</p><p><span contenteditable="false" style="display: inline-block; width: 20px; height: 20px"></span></p><p>B</p></div>
<script>
    test(() => {
        const selection = getSelection();
        const editor = document.getElementById("editor");
        const name = node => node.nodeType === Node.TEXT_NODE ? `"${node.data}"` : node.nodeName;
        editor.focus();
        for (const [direction, granularity, node, offset] of [
            ["forward", "line", editor.firstChild, 5],
            ["forward", "character", editor.firstChild, 5],
            ["backward", "line", editor.lastChild.firstChild, 4],
            ["backward", "character", editor.lastChild.firstChild, 0],
        ]) {
            selection.collapse(node, offset);
            const stops = [];
            for (let i = 0; i < 2; i++) {
                selection.modify("move", direction, granularity);
                stops.push(`${name(selection.focusNode)}@${selection.focusOffset}`);
            }
            println(`${direction} by ${granularity}: ${stops.join(", ")}`);
        }

        // An image on a line of its own, ahead of an empty line, keeps a caret position on each side of it.
        const image = document.getElementById("image");
        image.focus();
        for (const granularity of ["character", "line"]) {
            selection.collapse(image.firstChild.firstChild, 1);
            const stops = [];
            for (let i = 0; i < 3; i++) {
                selection.modify("move", "forward", granularity);
                stops.push(`${name(selection.focusNode)}@${selection.focusOffset}`);
            }
            println(`image line, forward by ${granularity}: ${stops.join(", ")}`);
        }

        // Down from the line before a line that holds only an image moves onto that line, and a line that holds only a
        // non-editable inline-block keeps the caret position it has as an empty line.
        for (const [id, granularity] of [["only-image", "line"], ["only-inline-block", "character"]]) {
            const editor = document.getElementById(id);
            editor.focus();
            selection.collapse(editor.firstChild.firstChild, 1);
            const stops = [];
            for (let i = 0; i < 2; i++) {
                selection.modify("move", "forward", granularity);
                stops.push(`${name(selection.focusNode)}@${selection.focusOffset}`);
            }
            println(`${id}, forward by ${granularity}: ${stops.join(", ")}`);
        }
    });
</script>
