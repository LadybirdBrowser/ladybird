<!DOCTYPE html>
<meta charset="utf-8">
<style>
textarea { font: 16px monospace; width: 65px; }
#rich { width: 65px; font: 16px monospace; }
</style>
<input id="input" value="abcdef">
<textarea id="textarea">abc
def</textarea>
<div id="rich" contenteditable><p>ab<span>cd</span></p><p>ef</p></div>
<script src="../include.js"></script>
<script>
test(() => {
    const input = document.getElementById("input");
    const textarea = document.getElementById("textarea");
    const rich = document.getElementById("rich");
    if (!internals.sendTextEditingCommand) {
        println("Native text editing commands are unavailable");
        return;
    }
    function check(label, actual, expected) {
        println(`${label}: ${JSON.stringify(actual) === JSON.stringify(expected) ? "PASS" : JSON.stringify(actual)}`);
    }
    function control(label, target, command, offset, expected, extend = false) {
        target.focus();
        target.setSelectionRange(offset, offset);
        internals.sendTextEditingCommand(target, command, extend);
        check(label, [target.selectionStart, target.selectionEnd], expected);
    }
    control("input beginning", input, "MoveToBeginningOfParagraph", 3, [0, 0]);
    control("input end", input, "MoveToEndOfParagraph", 3, [6, 6]);
    control("textarea beginning", textarea, "MoveToBeginningOfParagraph", 5, [4, 4]);
    control("textarea end", textarea, "MoveToEndOfParagraph", 5, [7, 7]);
    control("extend backward", textarea, "MoveToBeginningOfParagraph", 5, [4, 5], true);
    check("backward direction", textarea.selectionDirection, "backward");
    internals.sendTextEditingCommand(textarea, "MoveToBeginningOfParagraph", true);
    check("repeated backward anchor", [textarea.selectionStart, textarea.selectionEnd, textarea.selectionDirection], [4, 5, "backward"]);
    internals.sendTextEditingCommand(textarea, "MoveToEndOfParagraph", true);
    check("reverse extension anchor", [textarea.selectionStart, textarea.selectionEnd, textarea.selectionDirection], [5, 7, "forward"]);
    control("extend forward", textarea, "MoveToEndOfParagraph", 5, [5, 7], true);
    check("forward direction", textarea.selectionDirection, "forward");
    textarea.value = "abcdef abcdef abcdef";
    control("soft wrap beginning", textarea, "MoveToBeginningOfParagraph", 10, [0, 0]);
    control("soft wrap end", textarea, "MoveToEndOfParagraph", 10, [20, 20]);
    textarea.value = "abc\n\ndef";
    control("empty paragraph beginning", textarea, "MoveToBeginningOfParagraph", 4, [4, 4]);
    control("empty paragraph end", textarea, "MoveToEndOfParagraph", 4, [4, 4]);
    control("single-line up", input, "MoveUp", 3, [0, 0]);
    control("single-line down", input, "MoveDown", 3, [6, 6]);
    textarea.style.height = "64px";
    textarea.style.lineHeight = "20px";
    textarea.value = "01\n02\n03\n04\n05\n06\n07\n08\n09\n10";
    textarea.focus();
    textarea.setSelectionRange(16, 16);
    internals.sendTextEditingCommand(textarea, "PageDown");
    check("textarea page distance", textarea.selectionStart > 16 && textarea.selectionStart < textarea.value.length, true);
    check("textarea page column", textarea.selectionStart % 3, 1);
    internals.sendTextEditingCommand(textarea, "PageUp");
    check("textarea page reverse", textarea.selectionStart, 16);
    input.readOnly = true;
    control("read-only movement", input, "MoveToBeginningOfParagraph", 3, [0, 0]);
    input.readOnly = false;
    rich.focus();
    const first = rich.firstChild.firstChild;
    const last = rich.firstChild.lastChild.firstChild;
    const selection = getSelection();
    selection.collapse(first, 1);
    internals.sendTextEditingCommand(rich, "MoveToEndOfParagraph");
    check("inline paragraph boundary", [selection.focusNode === last, selection.focusOffset], [true, 2]);
    internals.sendTextEditingCommand(rich, "MoveToBeginningOfParagraph");
    check("inline paragraph beginning", [selection.focusNode === first, selection.focusOffset], [true, 0]);
    selection.collapse(first, 1);
    internals.sendTextEditingCommand(rich, "MoveToEndOfParagraph", true);
    check("rich selection anchor", [selection.anchorNode === first, selection.anchorOffset], [true, 1]);
    check("rich selection text", selection.toString(), "bcd");
    rich.innerHTML = "ab<br>cd";
    selection.collapse(rich.lastChild, 1);
    internals.sendTextEditingCommand(rich, "MoveToBeginningOfParagraph");
    check("br paragraph beginning", [selection.focusNode === rich.lastChild, selection.focusOffset], [true, 0]);
    rich.innerHTML = '<span contenteditable="false">locked</span><span>ab</span>';
    selection.collapse(rich.lastChild.firstChild, 1);
    internals.sendTextEditingCommand(rich, "MoveToBeginningOfParagraph");
    check("noneditable boundary", selection.focusNode === rich.lastChild.firstChild, true);
    rich.innerHTML = '<p>ab</p><p><br></p><p>cd</p>';
    selection.collapse(rich.children[1], 0);
    internals.sendTextEditingCommand(rich, "MoveToEndOfParagraph");
    check("empty rich paragraph", rich.children[1].contains(selection.focusNode), true);
    rich.innerHTML = '<div contenteditable="false"><div contenteditable="true">nested</div></div>outside';
    const nested = rich.firstChild.firstChild;
    selection.collapse(nested.firstChild, 3);
    internals.sendTextEditingCommand(nested, "MoveToEndOfParagraph");
    check("nested host end", [selection.focusNode === nested.firstChild, selection.focusOffset], [true, 6]);
    internals.sendTextEditingCommand(nested, "MoveToBeginningOfParagraph");
    check("nested host beginning", [selection.focusNode === nested.firstChild, selection.focusOffset], [true, 0]);
    input.value = "\u05d0\u05d1\u05d2";
    input.dir = "rtl";
    control("RTL physical left", input, "MoveToLeftEndOfLine", 1, [3, 3]);
    control("RTL physical right", input, "MoveToRightEndOfLine", 1, [0, 0]);
    control("RTL logical beginning", input, "MoveToBeginningOfParagraph", 1, [0, 0]);
    control("RTL logical end", input, "MoveToEndOfParagraph", 1, [3, 3]);
    const hebrew = String.fromCodePoint(0x5d0, 0x5d1, 0x5d2);
    const bidiCases = [
        ["opposite RTL run", "ltr", hebrew, 3, 0],
        ["opposite LTR run", "rtl", "abc", 0, 3],
        ["mixed leading run", "ltr", hebrew + " abc", 3, 7],
        ["mixed trailing run", "ltr", "abc " + hebrew, 0, 4],
    ];
    for (const [label, direction, value, left, right] of bidiCases) {
        for (const target of [input, textarea]) {
            target.dir = direction;
            target.style.width = "300px";
            target.value = value;
            control(`${target.id} ${label} left`, target, "MoveToLeftEndOfLine", 1, [left, left]);
            control(`${target.id} ${label} right`, target, "MoveToRightEndOfLine", 1, [right, right]);
        }
        rich.dir = direction;
        rich.style.width = "300px";
        rich.textContent = value;
        rich.focus();
        for (const [edge, offset] of [["Left", left], ["Right", right]]) {
            selection.collapse(rich.firstChild, 1);
            internals.sendTextEditingCommand(rich, `MoveTo${edge}EndOfLine`);
            check(`rich ${label} ${edge.toLowerCase()}`, [selection.focusNode === rich.firstChild, selection.focusOffset], [true, offset]);
            const range = document.createRange();
            range.selectNodeContents(rich);
            const rect = range.getBoundingClientRect();
            const caret = internals.currentCaretRect();
            check(`rich ${label} ${edge.toLowerCase()} geometry`, caret !== null && Math.abs(caret.x - (edge === "Left" ? rect.left : rect.right)) < 1, true);
        }
    }

    const line = document.createElement("div");
    line.innerHTML = 'before<span contenteditable="true">edit</span>after';
    document.body.append(line);
    const inlineHost = line.children[0];
    inlineHost.focus();
    for (const [edge, offset] of [["Left", 0], ["Right", 4]]) {
        selection.collapse(inlineHost.firstChild, 2);
        internals.sendTextEditingCommand(inlineHost, `MoveTo${edge}EndOfLine`);
        check(`inline host ${edge.toLowerCase()} boundary`, [selection.focusNode === inlineHost.firstChild, selection.focusOffset], [true, offset]);
    }
});
</script>
