<!DOCTYPE html>
<script src="../include.js"></script>

    // This fixture uses the styled runs, empty blocks, and images from the SCEditor front-page demo. The expected DOM
    // and selection endpoints were recorded by driving Chromium through WebDriver with the same selections and keys.
    test(() => {
        const selection = getSelection();
        const failures = [];
        let assertionCount = 0;
        let host = null;

        const originalHTML = '<div id="first">Give it a try! <img id="smile" alt=":)"><br></div><div id="empty"><br></div><div id="colors"><font id="red" color="#ff00">Red text and </font><font id="blue" color="#3399ff">blue text!</font><br></div><div id="last">Just type <strong>:</strong>) and it will be converted into <img id="lastimg" alt=":)"> as you type.</div>';

        function newHost(html = originalHTML) {
            if (host)
                host.remove();
            host = document.createElement("div");
            host.contentEditable = "true";
            host.innerHTML = html;
            document.body.appendChild(host);
            host.focus();
        }

        function path(node) {
            if (!node)
                return "null";
            const segments = [];
            while (node !== host) {
                segments.unshift(Array.prototype.indexOf.call(node.parentNode.childNodes, node));
                node = node.parentNode;
            }
            return `host${segments.length ? "/" + segments.join("/") : ""}`;
        }

        function selectionString() {
            return `${path(selection.anchorNode)}@${selection.anchorOffset}->${path(selection.focusNode)}@${selection.focusOffset}`;
        }

        function expect(actual, expected, label) {
            ++assertionCount;
            if (actual !== expected)
                failures.push(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }

        function expectState(label, html, selectionState) {
            expect(host.innerHTML, html, `${label} DOM`);
            expect(selectionString(), selectionState, `${label} selection`);
        }

        const styledReplacement = '<div id="first">Give it a try! <img id="smile" alt=":)"><br></div><div id="empty"><br></div><div id="colors"><font id="red" color="#ff00">Red X</font><font id="blue" color="#3399ff">&nbsp;text!</font><br></div><div id="last">Just type <strong>:</strong>) and it will be converted into <img id="lastimg" alt=":)"> as you type.</div>';
        newHost();
        selection.setBaseAndExtent(host.querySelector("#red").firstChild, 4, host.querySelector("#blue").firstChild, 4);
        internals.sendText(host, "X");
        expectState("replace across styled runs", styledReplacement, "host/2/0/0@5->host/2/0/0@5");
        expect(document.execCommand("undo"), true, "undo styled replacement");
        expectState("undo styled replacement", originalHTML, "host/2/0/0@4->host/2/1/0@4");
        expect(document.execCommand("redo"), true, "redo styled replacement");
        expectState("redo styled replacement", styledReplacement, "host/2/0/0@5->host/2/0/0@5");

        const imageReplacement = '<div id="first">Give it a try! <img id="smile" alt=":)"><br></div><div id="empty"><br></div><div id="colors"><font id="red" color="#ff00">Red text and </font><font id="blue" color="#3399ff">blue text!</font><br></div><div id="last">Just type <strong>:</strong>) and it will be convertX&nbsp;you type.</div>';
        newHost();
        const image = host.querySelector("#lastimg");
        const lastLine = host.querySelector("#last");
        selection.setBaseAndExtent(lastLine.childNodes[2], 24, lastLine.childNodes[4], 3);
        internals.sendText(host, "X");
        expectState("replace across an image", imageReplacement, "host/3/2@25->host/3/2@25");
        expect(document.execCommand("undo"), true, "undo image replacement");
        expectState("undo image replacement", originalHTML, "host/3/2@24->host/3/4@3");
        expect(host.querySelector("#lastimg"), image, "undo restores the same image node");
        expect(document.execCommand("redo"), true, "redo image replacement");
        expectState("redo image replacement", imageReplacement, "host/3/2@25->host/3/2@25");

        const emptyBlockReplacement = '<div id="first">Give it a try! <img id="smile" alt=":)"><br></div><div id="empty"><font id="red" color="#ff00">Xtext and </font><font id="blue" color="#3399ff">blue text!</font></div><div id="last">Just type <strong>:</strong>) and it will be converted into <img id="lastimg" alt=":)"> as you type.</div>';
        newHost();
        selection.setBaseAndExtent(host.querySelector("#empty"), 0, host.querySelector("#red").firstChild, 4);
        internals.sendText(host, "X");
        expectState("replace from an empty block into styled text", emptyBlockReplacement, "host/1/0/0@1->host/1/0/0@1");
        expect(document.execCommand("undo"), true, "undo empty-block replacement");
        expectState("undo empty-block replacement", originalHTML, "host/1@0->host/2/0/0@4");
        expect(document.execCommand("redo"), true, "redo empty-block replacement");
        expectState("redo empty-block replacement", emptyBlockReplacement, "host/1/0/0@1->host/1/0/0@1");

        // Replacing text inside a link retains that link for every code unit in a single insertText command.
        // These DOM and selection results were checked in Chromium, including reverse selections and Unicode.
        for (const [markup, textPath] of [
            ["Cloud", "host/0/0/0"],
            ["<b>Cloud</b>", "host/0/0/0/0"],
            ['<img width="45" height="60">Cloud', "host/0/0/1"],
        ]) {
            for (const [start, end] of [[0, 2], [1, 4], [3, 5]]) {
                for (const value of ["X", "XYZ", "😀", "e\u0301"]) {
                    for (const backwards of [false, true]) {
                        const html = `<p><a href="https://example.com">${markup}</a><br></p>`;
                        newHost(html);
                        const anchor = host.querySelector("a");
                        const text = anchor.lastChild.nodeType === Node.TEXT_NODE ? anchor.lastChild : anchor.lastChild.firstChild;
                        const from = backwards ? end : start;
                        const to = backwards ? start : end;
                        selection.setBaseAndExtent(text, from, text, to);
                        const label = `replace ${markup}[${start},${end}] with ${JSON.stringify(value)} backwards=${backwards}`;
                        document.execCommand("insertText", false, value);
                        const replacement = "Cloud".slice(0, start) + value + "Cloud".slice(end);
                        const result = html.replace("Cloud", replacement);
                        const caret = start + value.length;
                        expectState(label, result, `${textPath}@${caret}->${textPath}@${caret}`);
                        expect(document.execCommand("undo"), true, `undo ${label}`);
                        expectState(`undo ${label}`, html, `${textPath}@${from}->${textPath}@${to}`);
                        expect(document.execCommand("redo"), true, `redo ${label}`);
                        expectState(`redo ${label}`, result, `${textPath}@${caret}->${textPath}@${caret}`);
                        if (end === 5) {
                            // The replacement context belongs only to that command. Later typing at its end exits the link.
                            document.execCommand("insertText", false, "Q");
                            expect(host.querySelector("a").textContent, replacement, `typing after ${label} leaves link`);
                            expect(host.textContent, replacement + "Q", `typing after ${label} inserts outside`);
                        }
                    }
                }
            }
        }

        // Invisible siblings do not create another editable line beyond the first or last paragraph.
        for (const invisible of ["  ", "<!--empty-->", '<span style="display:none">hidden</span>']) {
            for (const forward of [false, true]) {
                const html = `${invisible}<p>Cloud</p>${invisible}`;
                newHost(html);
                const text = host.querySelector("p").firstChild;
                selection.collapse(text, forward ? text.length : 0);
                const before = selectionString();
                document.execCommand(forward ? "forwardDelete" : "delete");
                expectState(`delete past invisible sibling ${invisible} forward=${forward}`, html, before);
            }
        }

                "host/0/0@2->host/0/0@2",
            ],
        };

        function perfumeScenarios() {
            const originalHTML =
                '<p><a href="https://www.fragrantica.com/perfume/Ariana-Grande/Cloud-Pink-83995.html"> <img width="45" height="60"> Cloud Pink Ariana Grande</a>&nbsp; <br></p>';
            const reset = (html = originalHTML) => newHost(html);
            function state(label) {
                const expected = perfumeExpectedStates[label];
                expectState(label, expected[0], expected[1]);
            }
            function command(name, value = "") {
                if (name === "insertText") internals.sendText(host, value);
                else if (name === "delete" || name === "forwardDelete")
                    internals.sendKey(host, name === "delete" ? "Backspace" : "Delete");
                else if (name === "ArrowLeft" || name === "ArrowRight")
                    internals.sendKey(host, name === "ArrowLeft" ? "Left" : "Right");
                else document.execCommand(name);
            }
            const link = () => host.querySelector("a");
            const name = () => link().lastChild;
            const points = {
                "before link": () => [host.firstChild, 0],
                "link start": () => [link(), 0],
                "before image": () => [link(), 1],
                "after image": () => [link(), 2],
                "name start": () => [name(), 0],
                "name middle": () => [name(), 12],
                "name end": () => [name(), name().length],
                "link end": () => [link(), link().childNodes.length],
                "after link": () => [host.firstChild, 1],
                "after space": () => [host.firstChild, 2],
            };
            for (const [label, point] of Object.entries(points)) {
                for (const action of ["insertText", "delete", "forwardDelete"]) {
                    reset();
                    selection.collapse(...point());
                    command(action, action === "insertText" ? "X" : "");
                    state(label + " " + action);
                }
            }
            reset();
            selection.collapse(host.firstChild, 2);
            for (let i = 0; i < 5; ++i) command("delete");
            state("shorten perfume name");
            command("insertText", "XYZ");
            state("type after shortening");
            command("undo");
            state("undo typing");
            command("undo");
            state("undo shortening");
            command("redo");
            state("redo shortening");
            command("redo");
            state("redo typing");
            reset();
            selection.collapse(host.firstChild, 2);
            for (let i = 0; i < 27; ++i) command("delete");
            state("backspace through perfume");
            command("insertText", "X");
            state("type after deleting perfume");
            for (const action of ["delete", "forwardDelete", "insertText"]) {
                for (const backwards of [false, true]) {
                    reset();
                    selection.setBaseAndExtent(link(), backwards ? 2 : 1, link(), backwards ? 1 : 2);
                    command(action, action === "insertText" ? "X" : "");
                    state("selected image " + action + " backwards=" + backwards);
                    command("undo");
                    state("undo selected image " + action + " backwards=" + backwards);
                    command("redo");
                    state("redo selected image " + action + " backwards=" + backwards);
                }
            }
            reset();
            selection.setBaseAndExtent(name(), 12, name(), name().length);
            command("insertText", "X");
            state("replace name suffix");
            reset();
            selection.setBaseAndExtent(link(), 1, name(), 12);
            command("insertText", "X");
            state("replace image and partial name");
            // Formatting, real line breaks, and editing boundaries must survive link-edge editing.
            for (const [label, html, selector, offset] of [
                ["bold link end", '<p><a href="https://example.com"><b>Cloud</b></a><br></p>', "b", 5],
                ["bold link middle", '<p><a href="https://example.com"><b>Cloud</b></a><br></p>', "b", 3],
                ["block link end", '<a style="display:block" href="https://example.com">Cloud</a>', "a", 5],
                ["link before internal break", '<p><a href="https://example.com">Cloud<br>Pink</a></p>', "a", 5],
                ["link before trailing break", '<p><a href="https://example.com">Cloud<br></a></p>', "a", 5],
                [
                    "adjacent links",
                    '<p><a href="https://example.com/1">Cloud</a><a href="https://example.com/2">Pink</a></p>',
                    "a",
                    5,
                ],
                ["unlinked anchor", '<p><a id="bookmark">Cloud</a><br></p>', "a", 5],
            ]) {
                reset(html);
                selection.collapse(host.querySelector(selector).firstChild, offset);
                command("insertText", "X");
                state(label);
            }
            for (const action of ["delete", "forwardDelete"]) {
                reset('<p><a href="https://example.com"><b><img width="45" height="60"></b>Cloud</a><br></p>');
                selection.collapse(host.querySelector("b"), action === "delete" ? 1 : 0);
                command(action);
                state("nested image " + action);
                command("undo");
                state("undo nested image " + action);
                command("redo");
                state("redo nested image " + action);
            }
            reset('<p><a href="https://example.com">Cloud🌸</a><br></p>');
            selection.collapse(link().firstChild, 7);
            command("delete");
            state("delete supplementary perfume character");
            command("insertText", "X");
            state("type after supplementary deletion");
            reset();
            selection.selectAllChildren(link());
            command("insertText", "X");
            state("replace complete link contents");
            reset();
            selection.selectAllChildren(host);
            command("delete");
            state("delete entire editor selection");
            command("insertText", "X");
            state("type after clearing editor");
            reset();
            selection.collapse(name(), 0);
            command("ArrowLeft");
            state("move left across image");
            command("ArrowRight");
            state("move right across image");
            command("ArrowRight");
            state("move into name");
            command("insertText", "X");
            state("type after moving into name");
            reset();
            selection.collapse(name(), name().length);
            command("ArrowLeft");
            state("move left inside link end");
            command("insertText", "X");
            state("type inside link after moving left");
            reset();
            selection.collapse(name(), name().length);
            command("ArrowRight");
            state("move right out of link");
            command("insertText", "X");
            state("type after moving out of link");
            reset();
            selection.collapse(link(), 2);
            host.addEventListener("beforeinput", event => event.preventDefault(), { once: true });
            command("delete");
            state("cancel image backspace");
            host.remove();
        }
        perfumeScenarios();

        if (failures.length)
            println(
                `FAIL: ${failures.length}/${assertionCount} SCEditor rich-editing assertions failed\n${failures.join("\n")}`
            );
        else println(`PASS: ${assertionCount} SCEditor rich-editing assertions match Chromium`);
    });
