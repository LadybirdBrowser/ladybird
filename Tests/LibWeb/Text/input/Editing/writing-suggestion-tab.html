<!DOCTYPE html>
<script src="../include.js"></script>
<input id="before">
<textarea id="area"></textarea>
<input id="after">
<script>
    promiseTest(async () => {
        const TAB = "";
        const area = document.getElementById("area");
        let log = [];
        for (const type of ["beforeinput", "input"])
            area.addEventListener(type, e => log.push(`${type} ${e.inputType} ${e.data}`));
        for (const type of ["keydown", "keypress"])
            area.addEventListener(type, e => log.push(`${type} ${e.key} ${e.keyCode} ${e.which}`));

        const reset = async () => {
            area.value = "";
            internals.sendText(area, "predi");
            await internals.writingSuggestionSettled();
            log = [];
        };
        const show = async label => {
            await internals.writingSuggestionSettled();
            println(`${label}:`);
            println(`  value: ${area.value}`);
            println(`  focus: ${document.activeElement.id}`);
            println(`  events: ${log.join(", ") || "(none)"}`);
            println(`  suggestion: ${internals.writingSuggestion()}`);
        };

        await reset();
        internals.sendText(area, TAB);
        await show("Tab with a suggestion");

        await reset();
        const cancelTab = e => {
            if (e.key === "Tab")
                e.preventDefault();
        };
        area.addEventListener("keydown", cancelTab);
        internals.sendText(area, TAB);
        await show("Tab canceled by the page");

        await reset();
        internals.sendText(area, TAB, internals.MOD_SHIFT);
        await show("Shift+Tab canceled by the page");

        await reset();
        internals.sendText(area, TAB, internals.MOD_ALT);
        await show("Alt+Tab canceled by the page");

        await reset();
        internals.sendText(area, TAB, internals.MOD_SUPER);
        await show("Super+Tab canceled by the page");
        area.removeEventListener("keydown", cancelTab);

        await reset();
        const moveCaret = e => {
            if (e.key === "Tab")
                area.setSelectionRange(0, 0);
        };
        area.addEventListener("keydown", moveCaret);
        internals.sendText(area, TAB);
        await show("Tab whose keydown moves the caret");
        area.removeEventListener("keydown", moveCaret);

        area.value = "";
        log = [];
        internals.sendText(area, TAB);
        await show("Tab without a suggestion");

        await reset();
        internals.sendText(area, TAB, internals.MOD_SHIFT);
        await show("Shift+Tab with a suggestion");

        await reset();
        const cancelInsertion = e => e.preventDefault();
        area.addEventListener("beforeinput", cancelInsertion);
        internals.sendText(area, TAB);
        await show("Insertion canceled by the page");
    });
</script>
