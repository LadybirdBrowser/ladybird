<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        // The buffer of a shared WebAssembly memory is a SharedArrayBuffer.
        const shared = new WebAssembly.Memory({ initial: 1, maximum: 1, shared: true }).buffer;
        const bytes = new Uint8Array(shared, 0, 16);
        bytes.forEach((_, index) => (bytes[index] = index * 3 + 1));
        // A triangle that covers the viewport.
        const positions = new Float32Array(shared, 64, 6);
        positions.set([-1, -1, 3, -1, -1, 3]);
        const floats = new Float32Array(shared, 128, 4);
        floats.set([0.2, 0.4, 0, 1]);
        const ints = new Int32Array(shared, 192, 2);
        ints.set([100, 2]);
        const unsigned = new Uint32Array(shared, 256, 2);
        unsigned.set([50, 3]);

        for (const version of ["webgl", "webgl2"]) {
            println(`${version}:`);
            const isWebGL2 = version === "webgl2";
            const canvas = document.createElement("canvas");
            canvas.width = canvas.height = 4;
            const gl = canvas.getContext(version);
            const run = (name, action) => {
                try {
                    println(`${name}: ${action()}`);
                } catch (e) {
                    println(`${name}: ${e.name}`);
                }
            };

            gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
            run("bufferData with a buffer", () => {
                gl.bufferData(gl.ARRAY_BUFFER, shared, gl.STATIC_DRAW);
                return gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE);
            });
            run("bufferData with a view", () => {
                gl.bufferData(gl.ARRAY_BUFFER, bytes, gl.STATIC_DRAW);
                return gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE);
            });
            // Zero the buffer, so that the contents below come from the two calls that follow.
            gl.bufferData(gl.ARRAY_BUFFER, new Uint8Array(16), gl.STATIC_DRAW);
            run("bufferSubData with a buffer", () => gl.bufferSubData(gl.ARRAY_BUFFER, 0, shared.slice(0, 8)));
            run("bufferSubData with a view", () => gl.bufferSubData(gl.ARRAY_BUFFER, 8, bytes.subarray(0, 8)));
            if (isWebGL2) {
                run("contents", () => {
                    const readBack = new Uint8Array(16);
                    gl.getBufferSubData(gl.ARRAY_BUFFER, 0, readBack);
                    return readBack.every((value, index) => value === bytes[index % 8]);
                });
            }

            const compile = (type, source) => {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            };
            const program = gl.createProgram();
            gl.attachShader(
                program,
                compile(
                    gl.VERTEX_SHADER,
                    `${isWebGL2 ? "#version 300 es\nin" : "attribute"} vec2 position;
                    void main() { gl_Position = vec4(position, 0.0, 1.0); }`
                )
            );
            gl.attachShader(
                program,
                compile(
                    gl.FRAGMENT_SHADER,
                    `${isWebGL2 ? "#version 300 es" : ""}
                    precision mediump float;
                    uniform vec2 floatValues;
                    uniform ivec2 intValues;
                    uniform mat2 matrix;
                    ${isWebGL2 ? "uniform uvec2 unsignedValues; out vec4 color;" : ""}
                    void main() {
                        float blue = float(intValues.x + intValues.y) ${isWebGL2 ? "+ float(unsignedValues.x + unsignedValues.y)" : ""};
                        ${isWebGL2 ? "color" : "gl_FragColor"} = vec4(floatValues, blue / 255.0, matrix[1][1]);
                    }`
                )
            );
            gl.linkProgram(program);
            gl.useProgram(program);

            run("vertices of a view", () => gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW));
            const position = gl.getAttribLocation(program, "position");
            gl.enableVertexAttribArray(position);
            gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

            const uniform = name => gl.getUniformLocation(program, name);
            run("uniform2fv", () => gl.uniform2fv(uniform("floatValues"), floats.subarray(0, 2)));
            run("uniform2iv", () => gl.uniform2iv(uniform("intValues"), ints));
            run("uniformMatrix2fv", () => gl.uniformMatrix2fv(uniform("matrix"), false, floats));
            if (isWebGL2) run("uniform2uiv", () => gl.uniform2uiv(uniform("unsignedValues"), unsigned));

            gl.drawArrays(gl.TRIANGLES, 0, 3);
            const pixel = new Uint8Array(4);
            gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
            println(`pixel: ${pixel.join(", ")}`);
            println(`error: ${gl.getError()}`);
        }
    });
</script>
