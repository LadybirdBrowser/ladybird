<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    function createContext() {
        const canvas = document.createElement("canvas");
        canvas.width = 4;
        canvas.height = 1;
        return canvas.getContext("webgl");
    }

    function createProgram(gl) {
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, "attribute vec2 position; void main() { gl_Position = vec4(position, 0, 1); gl_PointSize = 1.0; }");
        gl.compileShader(vertexShader);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, "precision mediump float; void main() { gl_FragColor = vec4(1, 0, 0, 1); }");
        gl.compileShader(fragmentShader);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.bindAttribLocation(program, 0, "position");
        gl.linkProgram(program);
        gl.useProgram(program);
    }

    function drawQuad(gl, vertices) {
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.clearColor(0, 0, 1, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function drawnPixels(gl) {
        const pixels = new Uint8Array(4 * 4);
        gl.readPixels(0, 0, 4, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        return [0, 1, 2, 3].map(index => Array.from(pixels.slice(index * 4, index * 4 + 4)).join(",")).join(" | ");
    }

    function drawLeftHalfInContextToBeDestroyed() {
        const gl = createContext();
        createProgram(gl);
        drawQuad(gl, [-1, -1, 0, -1, -1, 1, 0, 1]);
        println(`Other context, left half drawn: ${drawnPixels(gl)}`);
        return new WeakRef(gl.canvas);
    }

    asyncTest(async done => {
        await internals.gcAsync();
        await internals.gcAsync();

        const otherContext = drawLeftHalfInContextToBeDestroyed();

        const gl = createContext();
        createProgram(gl);
        const extension = gl.getExtension("OES_vertex_array_object");
        extension.bindVertexArrayOES(extension.createVertexArrayOES());
        gl.drawArrays(gl.POINTS, 0, 1);
        gl.getError();

        await collectGarbageUntilCleared([otherContext]);
        await internals.gcAsync();
        println(`Other context collected: ${otherContext.deref() === undefined}`);

        extension.bindVertexArrayOES(null);
        drawQuad(gl, [-1, -1, 1, -1, -1, 1, 1, 1]);
        println(`Whole quad drawn: ${drawnPixels(gl)}`);
        println(`Error: ${gl.getError()}`);
        done();
    });
</script>
