<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // Uploads a 2D canvas with an opaque white, an opaque orange, a half-transparent white and a transparent pixel as a
    // texture of the format, and reads back what sampling the texture gives for each of them.
    function sampledTexels(gl, format) {
        const source = document.createElement("canvas");
        source.width = 4;
        source.height = 1;
        const context = source.getContext("2d");
        context.fillStyle = "rgb(255, 255, 255)";
        context.fillRect(0, 0, 1, 1);
        context.fillStyle = "rgb(200, 100, 50)";
        context.fillRect(1, 0, 1, 1);
        context.fillStyle = "rgba(255, 255, 255, 0.5)";
        context.fillRect(2, 0, 1, 1);

        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, format, format, gl.UNSIGNED_BYTE, source);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        gl.clearColor(0.2, 0.4, 0.6, 0.8);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        const pixels = new Uint8Array(4 * 4);
        gl.readPixels(0, 0, 4, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        const texel = index => Array.from(pixels.slice(index * 4, index * 4 + 4)).join(",");
        return `white ${texel(0)} | orange ${texel(1)} | half-transparent white ${texel(2)} | transparent ${texel(3)} | error ${gl.getError()}`;
    }

    test(() => {
        const canvas = document.createElement("canvas");
        canvas.width = 4;
        canvas.height = 1;
        const gl = canvas.getContext("webgl");

        const target = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, target);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, gl.createFramebuffer());
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0);
        gl.viewport(0, 0, 4, 1);

        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, "attribute vec2 position; varying vec2 coordinate; void main() { coordinate = (position + 1.0) / 2.0; gl_Position = vec4(position, 0, 1); }");
        gl.compileShader(vertexShader);
        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, "precision mediump float; varying vec2 coordinate; uniform sampler2D source; void main() { gl_FragColor = texture2D(source, coordinate); }");
        gl.compileShader(fragmentShader);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const position = gl.getAttribLocation(program, "position");
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        for (const [name, format] of [["LUMINANCE", gl.LUMINANCE], ["LUMINANCE_ALPHA", gl.LUMINANCE_ALPHA], ["ALPHA", gl.ALPHA]])
            println(`${name}: ${sampledTexels(gl, format)}`);
    });
</script>
