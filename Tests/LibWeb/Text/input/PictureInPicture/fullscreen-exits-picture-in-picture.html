<!DOCTYPE html>
<script src="../include.js"></script>
<video src="../../../Assets/test-webm.webm"></video>
<script>
    asyncTest(async done => {
        const video = document.querySelector("video");
        if (video.readyState === HTMLMediaElement.HAVE_NOTHING)
            await new Promise(resolve => video.addEventListener("loadedmetadata", resolve, { once: true }));

        internals.grantTransientActivation();
        await video.requestPictureInPicture();
        println(`Picture-in-Picture element before: ${document.pictureInPictureElement === video ? "video" : document.pictureInPictureElement}`);

        const left = new Promise(resolve => video.addEventListener("leavepictureinpicture", resolve, { once: true }));
        internals.grantTransientActivation();
        await video.requestFullscreen();
        await left;

        println(`Picture-in-Picture element after: ${document.pictureInPictureElement}`);
        println(`Fullscreen element after: ${document.fullscreenElement === video ? "video" : document.fullscreenElement}`);
        done();
    });
</script>
