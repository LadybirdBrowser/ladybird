<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    table {

    }

    }
    .cell {
        display: table-cell;

<div id="cases">

<script src="include.js"></script>
<script>
    promiseTest(async () => {
        // The data: URL images decode asynchronously, so wait for them before measuring.
        await Promise.all([...document.images].map(image => image.decode()));
        const cases = document.querySelectorAll(".case");
        cases.forEach((c, index) => {
            const origin = c.getBoundingClientRect().top;
            const parts = [];
            for (const element of c.querySelectorAll(".m")) {
                const rect = element.getBoundingClientRect();
                parts.push(`${Math.round(rect.top - origin)}+${Math.round(rect.height)}`);
            }
            println(`${index + 1}: ${parts.join(" ")}`);
        });
        document.getElementById("cases").remove();
    });
</script>
