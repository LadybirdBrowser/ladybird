<div class="root" id="flex-item" style="display: flex"><div style="flex: 1"><div class="tall"></div><div class="last" style="margin-top: -30px"></div></div></div>

<div style="clear: both"></div>
<div class="root" id="abspos" style="position: absolute"><div class="tall" style="width: 50px"></div><div class="last" style="margin-top: -30px"></div></div>
<table class="root" id="table-with-caption" style="display: table; border-spacing: 0"><caption style="caption-side: bottom"><div class="tall"></div><div class="last" style="margin-top: -30px"></div></caption><tr><td style="padding: 0; height: 10px"></td></tr></table>
<fieldset class="root" id="fieldset" style="display: block; border: 0; padding: 0; margin: 0"><div class="tall"></div><div class="last" style="margin-top: -30px"></div></fieldset>
<div class="root" id="vertical" style="writing-mode: vertical-rl; height: 60px; width: auto"><div class="tall" style="width: 120px; height: auto"></div><div class="last" style="width: 10px; height: auto; margin-right: -30px"></div></div>
<script>
    test(() => {
        // The automatic height of a box that establishes a block formatting context ends where its flow ends: at the
        // bottom margin edge of its last in-flow child, however far up a negative margin pulls that child. A child
        // before it that reaches further down overflows the box, and can be scrolled to.
        for (const root of document.querySelectorAll(".root")) {
            const rect = root.getBoundingClientRect();
            const scroll = root.id == "overflow-auto" ? `, scroll height ${root.scrollHeight}` : "";
            println(`${root.id}: ${root.id == "vertical" ? rect.width : rect.height}${scroll}`);
        }
    });
</script>
