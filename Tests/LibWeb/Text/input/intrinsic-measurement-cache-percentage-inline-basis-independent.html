<!DOCTYPE html>
<script src="include.js"></script>
<script src="layout-test.js"></script>
<style>
    body { margin: 0; }
    #outer { display: flex; width: 300px; }
    #inner { display: flex; flex: none; }
    .item { padding: 5px; }
</style>
<div id="outer"><div id="inner"><div class="item" id="alpha">alpha beta</div><div class="item" id="gamma">gamma</div></div></div>
<script>
    test(() => {
        // #inner's intrinsic sizes were measured with #outer's width as their inline percentage
        // basis; nothing in #inner resolves against it, so the cached measurements still answer.
        const work = layoutWork(() => document.getElementById("outer").style.width = "400px");

        println(`measured again: ${work.boxes({ event: "measure", cache: "miss" }).join(", ") || "nothing"}`);
        println(`answered from the cache: ${work.boxes({ event: "measure", cache: "hit" }).join(", ")}`);
        println(`inner width: ${document.getElementById("inner").getBoundingClientRect().width}`);
    });
</script>
