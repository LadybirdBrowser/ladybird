<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const context = new OfflineAudioContext(1, 1536, 44100);
        const node = context.createScriptProcessor(256, 0, 1);
        node.connect(context.destination);

        let eventIndex = 0;
        let retainedOutput = null;
        node.onaudioprocess = event => {
            if (retainedOutput)
                println(`event ${eventIndex}: output array retained from the previous event is detached: ${retainedOutput.length === 0}`);

            const output = event.outputBuffer.getChannelData(0);
            output.fill(eventIndex + 1);
            retainedOutput = output;
            if (eventIndex === 2) {
                structuredClone(output.buffer, { transfer: [output.buffer] });
                println(`event ${eventIndex}: detached its output array`);
            }
            ++eventIndex;
        };

        const rendered = (await context.startRendering()).getChannelData(0);
        for (let block = 0; block < 6; ++block)
            println(`block ${block} plays ${rendered[block * 256]}`);
        done();
    });
</script>
