<!DOCTYPE html>
<script src="../include.js"></script>
<script>
asyncTest(async done => {
    // The page drops its source node right after connecting it, as Discord does with the microphone's.
    const producer = new AudioContext();
    const oscillator = producer.createOscillator();
    const destination = producer.createMediaStreamDestination();
    oscillator.connect(destination);
    oscillator.start();

    const consumer = new AudioContext();
    const analyser = consumer.createAnalyser();
    consumer.createMediaStreamSource(destination.stream).connect(analyser);

    internals.gc();
    internals.gc();

    const samples = new Float32Array(analyser.fftSize);
    let peak = 0;
    for (let attempt = 0; attempt < 100 && peak < 0.1; ++attempt) {
        await new Promise(resolve => setTimeout(resolve, 50));
        internals.gc();
        analyser.getFloatTimeDomainData(samples);
        peak = samples.reduce((max, sample) => Math.max(max, Math.abs(sample)), 0);
    }
    println(`audio still arrives after garbage collection: ${peak >= 0.1}`);

    oscillator.stop();
    await producer.close();
    await consumer.close();
    done();
});
</script>
