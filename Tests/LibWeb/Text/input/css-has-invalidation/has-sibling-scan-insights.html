<!DOCTYPE html>
<script src="../include.js"></script>
<script src="_helpers.js"></script>
<style id="test-style">
    .anchor:has(.match) { color: red; }
</style>
<div id="outer">
    <div id="anchor" class="anchor">
        <div><span id="target">target</span></div>
    </div>
    <div>unrelated sibling</div>
</div>
<script>
    test(() => {
        let anchor = document.getElementById("anchor");
        let target = document.getElementById("target");
        let style = document.getElementById("test-style");

        getComputedStyle(anchor).color;
        internals.updateStyle();
        resetCounters();

        target.classList.add("match");
        getComputedStyle(anchor).color;
        printCounters("descendant-only :has() sheet", 3);

        target.classList.remove("match");
        style.textContent += "\n.unused-anchor:has(+ .unused-match) { color: blue; }";
        getComputedStyle(anchor).color;
        resetCounters();

        target.classList.add("match");
        getComputedStyle(anchor).color;
        printCounters("sheet with sibling-sensitive :has()", 3);
    });
</script>
