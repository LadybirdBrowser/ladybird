<!doctype html>
<script src="include.js"></script>
<script>
    asyncTest(async done => {
        const view = new Int32Array(new SharedArrayBuffer(4));
        let retainedPromise;
        function createWait() {
            const frame = document.createElement("iframe");
            document.body.append(frame);
            frame.contentWindow.view = view;
            const result = frame.contentWindow.eval("Atomics.waitAsync(view, 0, 0)");
            retainedPromise = result.value;
            frame.remove();
        }
        try {
            createWait();
            for (let i = 0; i < 5; ++i) {
                await new Promise(resolve => setTimeout(resolve, 0));
                internals.gc();
                internals.gc();
            }
            println(`reachable waiters: ${Atomics.notify(view, 0)}`);
            println(`retained promise: ${await retainedPromise}`);
        } catch (error) {
            println(`${error.name}: ${error.message}`);
        }
        done();
    });
</script>
