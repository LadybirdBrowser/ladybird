<!DOCTYPE html>
<body>
<iframe srcdoc="<div id=target>first</div>"></iframe>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        const iframe = document.querySelector("iframe");
        iframe.onload = () => {
            const oldWindow = iframe.contentWindow;
            const OldIntersectionObserver = oldWindow.IntersectionObserver;
            const oldTarget = iframe.contentDocument.getElementById("target");
            const attachedObserver = new OldIntersectionObserver(() => {});
            attachedObserver.observe(oldTarget);

            iframe.onload = () => {
                // The first document is no longer any navigable's active document, so its window has no navigable.
                const observer = new OldIntersectionObserver(() => {});
                observer.observe(oldTarget);
                println(`root: ${observer.root}`);
                println(`records: ${observer.takeRecords().length}`);
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        println(`records after a frame: ${observer.takeRecords().length} ${attachedObserver.takeRecords().length}`);
                        done();
                    });
                });
            };
            iframe.srcdoc = "<div>second</div>";
        };
    });
</script>
</body>
