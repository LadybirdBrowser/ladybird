<!DOCTYPE html>
<script src="../include.js"></script>
<svg id="svg">
    <rect id="rect" width="100" height="100" fill="red">
        <set attributeName="fill" to="green" dur="2s"/>
    </rect>
</svg>
<script>
    asyncTest(async done => {
        const nextFrame = () => new Promise(requestAnimationFrame);
        await new Promise(resolve => window.addEventListener("load", resolve));
        svg.pauseAnimations();
        svg.setCurrentTime(1);
        await nextFrame();
        println(`before gc: ${getComputedStyle(rect).fill}`);
        internals.gc();
        await nextFrame();
        await nextFrame();
        println(`after gc: ${getComputedStyle(rect).fill}`);
        svg.setCurrentTime(3);
        await nextFrame();
        println(`after its end: ${getComputedStyle(rect).fill}`);
        svg.setCurrentTime(1);
        await nextFrame();
        println(`seeked back: ${getComputedStyle(rect).fill}`);
        done();
    });
</script>
