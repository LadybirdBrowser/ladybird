<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const image = new Image();
        image.src =
            "data:image/svg+xml," +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="green"/></svg>'
            );

        // Collect between loading tasks until the SVG is ready.
        while (!image.complete) await internals.gcAsync();
        await image.decode();

        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 20;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0);
        println(`Pixel: ${[...context.getImageData(0, 0, 1, 1).data]}`);
    });
</script>
