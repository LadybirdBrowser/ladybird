<!DOCTYPE quirks>
<style>
    body {
        margin: 0;
    }
    .case {
        margin-bottom: 10px;
        width: 600px;
        display: flow-root;
    }
</style>
<div id="cases">
<!-- 1: width=100% cellpadding cellspacing border -->
<div class="case"><table class="m" width="100%" cellpadding="4" cellspacing="2" border="1"><tr>
    <td class="m" width="100"><div style="height: 20px"></div></td>
    <td class="m"><div style="height: 30px"></div></td>
</tr></table></div>

<!-- 2: td width and height attributes -->
<div class="case"><table class="m" cellpadding="0" cellspacing="0"><tr>
    <td class="m" width="150" height="60"><div style="height: 10px"></div></td>
    <td class="m" width="50"><div style="height: 10px"></div></td>
</tr></table></div>

<!-- 3: table height attribute with td height attributes -->
<div class="case"><table class="m" height="300" cellpadding="0" cellspacing="0" width="200"><tr class="m">
    <td height="50"><div style="height: 10px"></div></td></tr><tr class="m"><td><div style="height: 10px"></div></td></tr><tr class="m"><td height="20"><div style="height: 10px"></div></td>
</tr></table></div>

<!-- 4: spacer images -->
<div class="case"><table class="m" cellpadding="0" cellspacing="0" border="0"><tr>
    <td class="m"><img class="m" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="120" height="1" style="display: block"></td>
    <td class="m"><img class="m" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="1" height="40" style="display: block"></td>
</tr></table></div>

<!-- 5: align=center table -->
<div class="case"><div style="width: 500px"><table class="m" align="center" width="200" cellspacing="0"><tr><td class="m"><div style="height: 20px"></div></td></tr></table></div></div>

<!-- 6: align=right table followed by block content -->
<div class="case"><div style="width: 500px"><table class="m" align="right" width="150" cellspacing="0"><tr><td class="m"><div style="height: 40px"></div></td></tr></table><div class="m" style="height: 20px"></div></div></div>

<!-- 7: center element around a table -->
<div class="case"><div style="width: 400px"><center><table class="m" width="50%" cellspacing="0"><tr><td class="m"><div style="height: 20px"></div></td></tr></table></center></div></div>

<!-- 8: valign attributes -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>
    <td class="m" valign="top"><div class="m" style="width: 20px; height: 20px"></div></td>
    <td class="m" valign="middle"><div class="m" style="width: 20px; height: 20px"></div></td>
    <td class="m" valign="bottom"><div class="m" style="width: 20px; height: 20px"></div></td>
    <td class="m"><div class="m" style="width: 20px; height: 20px"></div></td>
    <td class="m"><div style="width: 20px; height: 100px"></div></td>
</tr></table></div>

<!-- 9: align attribute on td with a block child -->
<div class="case"><table class="m" width="300" cellspacing="0" cellpadding="0"><tr>
    <td class="m" align="center"><div class="m" style="width: 50px; height: 20px"></div></td>
    <td class="m" align="right"><div class="m" style="width: 50px; height: 20px"></div></td>
</tr></table></div>

<!-- 10: three levels of nested layout tables -->
<div class="case"><table class="m" width="500" cellspacing="0" cellpadding="0"><tr>
    <td class="m" width="120"><div style="height: 10px"></div></td>
    <td class="m"><table class="m" width="100%" cellspacing="0" cellpadding="0"><tr>
        <td class="m"><table class="m" width="100%" cellspacing="0" cellpadding="0"><tr><td class="m"><div style="height: 40px"></div></td><td class="m" width="30%"><div style="height: 10px"></div></td></tr></table></td>
        <td class="m" width="80"><div style="height: 10px"></div></td>
    </tr></table></td>
</tr></table></div>

<!-- 11: table width attribute with percentage td widths -->
<div class="case"><table class="m" width="400" cellspacing="0" cellpadding="0"><tr>
    <td class="m" width="25%"><div style="height: 10px"></div></td>
    <td class="m" width="25%"><div style="height: 10px"></div></td>
    <td class="m"><div style="height: 10px"></div></td>
</tr></table></div>

<!-- 12: border attribute with cellspacing 0 -->
<div class="case"><table class="m" border="3" cellspacing="0" cellpadding="0"><tr>
    <td class="m"><div style="width: 40px; height: 20px"></div></td>
    <td class="m"><div style="width: 40px; height: 20px"></div></td>
</tr></table></div>

<!-- 13: iframe with width and height attributes in a cell -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>
    <td class="m"><iframe class="m" width="200" height="80" style="border: 0; display: block" src="about:blank"></iframe></td>
    <td class="m"><div style="width: 30px; height: 10px"></div></td>
</tr></table></div>

<!-- 14: percentage-width iframe in a cell -->
<div class="case"><table class="m" width="400" cellspacing="0" cellpadding="0"><tr>
    <td class="m"><iframe class="m" style="width: 100%; height: 50px; border: 0; display: block" src="about:blank"></iframe></td>
    <td class="m" width="100"><div style="height: 10px"></div></td>
</tr></table></div>

<!-- 15: rowspan larger than the number of rows -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>
    <td class="m" rowspan="5"><div style="width: 30px; height: 90px"></div></td><td class="m"><div style="width: 30px; height: 20px"></div></td>
</tr><tr><td class="m"><div style="width: 30px; height: 20px"></div></td></tr></table></div>

<!-- 16: colspan larger than the number of columns -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>
    <td class="m" colspan="10"><div style="width: 200px; height: 20px"></div></td>
</tr><tr><td class="m"><div style="width: 30px; height: 20px"></div></td><td class="m"><div style="width: 30px; height: 20px"></div></td></tr></table></div>

<!-- 17: rows with differing cell counts -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>
    <td class="m"><div style="width: 30px; height: 20px"></div></td>
</tr><tr><td class="m"><div style="width: 30px; height: 20px"></div></td><td class="m"><div style="width: 70px; height: 20px"></div></td><td class="m"><div style="width: 10px; height: 20px"></div></td></tr></table></div>

<!-- 18: empty cells and empty rows -->
<div class="case"><table class="m" width="300" cellspacing="2" cellpadding="3" border="1"><tr>
    <td class="m"></td><td class="m"><div style="height: 20px"></div></td>
</tr><tr class="m"></tr><tr><td class="m"></td><td class="m"></td></tr></table></div>

<!-- 19: th elements with padding and a caption -->
<div class="case"><table class="m" width="300" cellspacing="0"><caption class="m"><div style="height: 15px"></div></caption><tr>
    <th class="m" style="padding: 5px"><div style="height: 10px"></div></th><th class="m" style="padding: 5px"><div style="height: 20px"></div></th>
</tr><tr><td class="m"><div style="height: 10px"></div></td><td class="m"><div style="height: 10px"></div></td></tr></table></div>

<!-- 20: table with display: block -->
<div class="case"><table class="m" style="display: block; width: 300px" cellspacing="0"><tr><td class="m"><div style="width: 50px; height: 20px"></div></td><td class="m"><div style="width: 70px; height: 20px"></div></td></tr></table></div>

<!-- 21: td with display: block -->
<div class="case"><table class="m" width="300" cellspacing="0"><tr><td class="m" style="display: block"><div style="height: 20px"></div></td><td class="m" style="display: block"><div style="height: 30px"></div></td></tr></table></div>

<!-- 22: tr with display: block -->
<div class="case"><table class="m" width="300" cellspacing="0"><tr class="m" style="display: block"><td class="m"><div style="width: 50px; height: 20px"></div></td><td class="m"><div style="width: 50px; height: 20px"></div></td></tr></table></div>

<div class="case"><table class="m" style="table-layout: fixed" width="400" cellspacing="0" cellpadding="0"><tr>
    <td class="m" colspan="2" width="100"><div style="height: 10px"></div></td><td class="m"><div style="height: 10px"></div></td>
</tr><tr><td class="m" width="300"><div style="height: 10px"></div></td><td class="m"><div style="height: 10px"></div></td><td class="m"><div style="height: 10px"></div></td></tr></table></div>

<!-- 24: table-layout fixed without width -->
<div class="case"><table class="m" style="table-layout: fixed" cellspacing="0" cellpadding="0"><tr>
    <td class="m" width="100"><div style="height: 10px"></div></td><td class="m"><div style="width: 80px; height: 10px"></div></td>
</tr></table></div>

<!-- 25: hidden rows and columns -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><colgroup><col><col style="visibility: collapse"><col></colgroup><tr>

</tr><tr style="visibility: collapse"><td class="m"><div style="width: 30px; height: 40px"></div></td><td></td><td></td></tr><tr style="display: none"><td><div style="height: 50px"></div></td></tr></table></div>

<!-- 26: table width larger than its container -->
<div class="case"><div style="width: 200px"><table class="m" width="350" cellspacing="0"><tr><td class="m"><div style="height: 20px"></div></td></tr></table></div></div>

<!-- 27: unbreakable content wider than a percentage-width table -->
<div class="case"><div style="width: 300px"><table class="m" width="50%" cellspacing="0" cellpadding="0"><tr><td class="m"><div style="width: 250px; height: 20px"></div></td></tr></table></div></div>

<!-- 28: td nowrap with inline-blocks -->
<div class="case"><table class="m" width="200" cellspacing="0" cellpadding="0"><tr>
    <td class="m" nowrap style="font-size: 0"><div style="display: inline-block; width: 120px; height: 20px"></div><div style="display: inline-block; width: 120px; height: 20px"></div></td>
    <td class="m"><div style="height: 10px"></div></td>
</tr></table></div>

<!-- 29: inline-blocks wrapping in a narrow cell -->
<div class="case"><table class="m" width="200" cellspacing="0" cellpadding="0"><tr>
    <td class="m" style="font-size: 0"><div style="display: inline-block; width: 80px; height: 20px"></div><div style="display: inline-block; width: 80px; height: 20px"></div><div style="display: inline-block; width: 80px; height: 20px"></div></td>
    <td class="m" width="50"><div style="height: 10px"></div></td>
</tr></table></div>

<!-- 30: cellpadding with explicit padding on td overriding it -->
<div class="case"><table class="m" cellpadding="10" cellspacing="0"><tr>
    <td class="m"><div style="width: 30px; height: 20px"></div></td><td class="m" style="padding: 2px"><div style="width: 30px; height: 20px"></div></td>
</tr></table></div>

<!-- 31: table inside a float with width percentage -->

</tr></table></div>

<!-- 35: button with width 100% inside a fixed-width cell -->
<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>

</tr></table></div>

<div class="case"><table class="m" cellspacing="0" cellpadding="0"><tr>

<script src="include.js"></script>
<script>
    test(() => {
        const cases = document.querySelectorAll(".case");
        cases.forEach((c, index) => {
            const origin = c.getBoundingClientRect();
            const parts = [];
            for (const element of c.querySelectorAll(".m")) {
                const rect = element.getBoundingClientRect();
                parts.push(`${Math.round(rect.left - origin.left)},${Math.round(rect.top - origin.top)} ${Math.round(rect.width)}x${Math.round(rect.height)}`);
            }
            println(`${index + 1}: ${parts.join(" | ")}`);
        });
        document.getElementById("cases").remove();
    });
</script>
