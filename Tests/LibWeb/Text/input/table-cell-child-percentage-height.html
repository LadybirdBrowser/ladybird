<script>
function check() {
    for (const element of document.querySelectorAll('.in'))
        println(element.id + '=' + element.getBoundingClientRect().height);
    for (const id of ['middle', 'middle-half', 'positioned-cell', 'abspos', 'text-sibling', 'baseline', 'baseline-empty', 'baseline-sibling', 'baseline-shrink', 'baseline-small', 'baseline-sibling-reversed', 'baseline-empty-reversed', 'abspos-auto']) {
        const element = document.getElementById(id);
        println(id + '-offset=' + (element.getBoundingClientRect().top - element.parentElement.getBoundingClientRect().top));
    }
    for (const id of ['taller', 'baseline-empty', 'baseline-shrink']) {
        const element = document.getElementById(id);
        println(id + '-row-height=' + element.parentElement.getBoundingClientRect().height);
    }
    for (const element of document.querySelectorAll('.vertical'))
        println(element.id + '=' + element.getBoundingClientRect().width);
    println('abspos-height=' + document.getElementById('abspos').getBoundingClientRect().height);
    for (const mode of ['vertical-rl', 'vertical-lr'])
        println('orthogonal-' + mode + '-width=' + document.getElementById('orthogonal-' + mode).getBoundingClientRect().width);
    const table = document.createElement('div');
    table.className = 't';
    table.innerHTML = '<div class="c"><div class="in"></div></div><div class="c"><div class="tall"></div></div>';
    document.body.append(table);
    for (const height of ['300px', 'auto', '200px', '100%']) {
        table.style.height = height;
        println('resize-' + height + '=' + table.firstElementChild.firstElementChild.getBoundingClientRect().height);
    }
}
</script>
<script src="include.js"></script><script>test(check);</script>
