<!DOCTYPE html>
<script src="../../include.js"></script>
<script>
    promiseTest(async () => {
        const httpServer = httpTestServer();

        const childUrl = new URL(
            await httpServer.createEcho("GET", "/sandboxed-iframe-in-local-file-content", {
                status: 200,
                headers: { "Content-Type": "text/html" },
                body: "<!DOCTYPE html>child",
            })
        );
        childUrl.hostname = uniqueLocalhostHostname("sandboxed-iframe-in-local-file-content");

        for (const src of [childUrl, "../../../data/iframe-test-content-1.html"]) {
            const iframe = document.createElement("iframe");
            iframe.sandbox = "";
            iframe.src = src;
            const loaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
            document.body.appendChild(iframe);
            await loaded;
        }

        println(internals.dumpSiteIsolationProcessTree().trimEnd());
    });
</script>
