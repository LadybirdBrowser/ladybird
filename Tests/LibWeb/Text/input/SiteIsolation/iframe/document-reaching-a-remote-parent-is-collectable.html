<!DOCTYPE html>
<script src="../../include.js"></script>
<script>
    // A grandchild same origin with this page, under an isolated iframe, is hosted in this page's process. The first
    // script here to reach the isolated iframe's WindowProxy is the grandchild's, through parent. Once the grandchild
    // navigates to another document, that WindowProxy must not keep the grandchild's first document alive.
    // The grandchild reads no property of the WindowProxy, as the descriptors cached for cross-origin property access
    // keep the realm of the script that reads them alive.
    // This page is served over HTTP so that the grandchild can be same origin with it.
    promiseTest(async () => {
        const httpServer = httpTestServer();

        const secondGrandchildUrl = await httpServer.createEcho("GET", "/document-reaching-a-remote-parent-second", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>top.postMessage("second grandchild", "*");<\/script>`,
        });

        // The WeakRef comes from this page's realm, so that it does not keep the grandchild's realm alive itself.
        const firstGrandchildUrl = await httpServer.createEcho("GET", "/document-reaching-a-remote-parent-first", {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>
                document.preserveWrapper = true;
                top.weakFirstGrandchildDocument = new top.WeakRef(document);
                top.firstGrandchildReachedTheIsolatedIframe = parent === top.frames[0];
                location.replace(${JSON.stringify(secondGrandchildUrl)});
            <\/script>`,
        });

        const childUrl = new URL(
            await httpServer.createEcho("GET", "/document-reaching-a-remote-parent-child", {
                status: 200,
                headers: { "Content-Type": "text/html" },
                body: `<!DOCTYPE html><iframe src="${firstGrandchildUrl}"></iframe>`,
            })
        );
        childUrl.hostname = uniqueLocalhostHostname("document-reaching-a-remote-parent");

        const secondGrandchildLoaded = new Promise(resolve => {
            addEventListener("message", event => {
                if (event.data === "second grandchild") resolve();
            });
        });
        const iframe = document.createElement("iframe");
        iframe.src = childUrl;
        document.body.appendChild(iframe);
        await secondGrandchildLoaded;

        println(internals.dumpSiteIsolationProcessTree().trimEnd());
        println(`first grandchild reached the isolated iframe: ${firstGrandchildReachedTheIsolatedIframe}`);
        await collectGarbageUntilCleared([weakFirstGrandchildDocument]);
        println(`first grandchild's document collected: ${weakFirstGrandchildDocument.deref() === undefined}`);
    });
</script>
