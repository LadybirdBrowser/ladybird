<!DOCTYPE html>
<script src="../../include.js"></script>
<script>
    // A document with an opaque origin that is made from what its creator holds is in an agent cluster of its own,
    // hosted with the agent cluster of the navigation's initiator origin: a data: URL iframe and a sandboxed srcdoc
    // iframe stay with their parent.
    promiseTest(async () => {
        const dataIframe = document.createElement("iframe");
        const dataLoaded = new Promise(resolve => dataIframe.addEventListener("load", resolve, { once: true }));
        dataIframe.src = "data:text/html,<p>data</p>";
        document.body.appendChild(dataIframe);

        const sandboxedIframe = document.createElement("iframe");
        sandboxedIframe.sandbox = "";
        const sandboxedLoaded = new Promise(resolve => sandboxedIframe.addEventListener("load", resolve, { once: true }));
        sandboxedIframe.srcdoc = "<!DOCTYPE html>sandboxed";
        document.body.appendChild(sandboxedIframe);

        await Promise.all([dataLoaded, sandboxedLoaded]);
        println(internals.dumpSiteIsolationProcessTree().trimEnd());
    });
</script>
