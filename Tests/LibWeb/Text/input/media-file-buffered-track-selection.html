<!DOCTYPE html>
<script src="include.js"></script>
<script>
asyncTest(async done => {
    const video = document.createElement("video");
    document.body.append(video);
    await new Promise(resolve => {
        video.onsuspend = resolve;
        video.src = "../../../LibMedia/vp9_in_webm.webm";
    });

    // This shared demuxer fixture starts audio at 0.5 ms and video at 11 ms.
    const startWithVideo = video.buffered.start(0);
    println(`Video limits start: ${startWithVideo > 0}`);
    video.videoTracks[0].selected = false;
    const audioStart = video.buffered.start(0);
    println(`Audio-only starts earlier: ${audioStart < startWithVideo}`);
    video.videoTracks[0].selected = true;
    println(`Reselecting video restores start: ${video.buffered.start(0) === startWithVideo}`);
    video.audioTracks[0].enabled = false;
    println(`Video-only retains start: ${video.buffered.start(0) === startWithVideo}`);
    video.videoTracks[0].selected = false;
    println(`No active tracks: ${video.buffered.length === 0}`);
    video.audioTracks[0].enabled = true;
    println(`Re-enabling audio restores its range: ${video.buffered.start(0) === audioStart}`);
    done();
});
</script>
