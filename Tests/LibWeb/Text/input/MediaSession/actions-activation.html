<!DOCTYPE html>
<script src="../include.js"></script>
<script>internals.setAutoplayPolicy("allow-audio-and-video");</script>
<body>
<script>
promiseTest(async () => {
    internals.setTestTimeout(15000);
    const audio = document.createElement("audio");
    audio.loop = true;
    audio.src = "../../../Assets/test-webm-audio.ogg";
    document.body.append(audio);
    await audio.play();
    println(`activation before the action: ${navigator.userActivation.isActive}`);
    const paused = new Promise(resolve => audio.addEventListener("pause", resolve, { once: true }));
    internals.triggerMediaSessionAction("pause");
    await paused;
    println(`default pause grants activation: ${navigator.userActivation.isActive}`);
    audio.remove();
});
</script>
