<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
    #spacer { width: 100px; height: 50px; }
    #cached {
        width: 300px;
        overflow: hidden;
        text-transform: uppercase;
    }
</style>
<div id="spacer"></div>
<div id="cached" lang="en">istanbul</div>
<script>
    asyncTest(async (done) => {
        document.body.offsetHeight;

        // Locale-sensitive casing keys the rendered text on the language, so a lang
        // change must invalidate the subtree's cached run; replaying it would keep
        // the en-cased glyphs.
        document.getElementById("cached").setAttribute("lang", "tr");
        const hitsBefore = internals.layoutRunCacheHitCount();
        document.getElementById("spacer").style.height = "80px";
        document.body.offsetHeight;

        const hitDelta = internals.layoutRunCacheHitCount() - hitsBefore;
        println(`hit delta after lang change: ${hitDelta}`);
        done();
    });
</script>
