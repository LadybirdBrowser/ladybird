<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const url = await server.createEcho("GET", "/xhr-activity-root-release", {
            status: 200,
            headers: { "Content-Type": "text/plain" },
            body: "done",
            delay_ms: 500,
        });

        const frame = document.createElement("iframe");
        document.body.append(frame);

        const xhr = new frame.contentWindow.XMLHttpRequest();
        xhr.open("GET", url);
        xhr.send();
        println(`listenerless root: ${internals.hasActivityRoot(xhr)}`);

        const listener = () => {};
        xhr.addEventListener("progress", listener);
        println(`root with listener: ${internals.hasActivityRoot(xhr)}`);

        xhr.removeEventListener("progress", listener);
        println(`root after removing listener: ${internals.hasActivityRoot(xhr)}`);

        xhr.addEventListener("loadend", listener);
        frame.remove();
        // Child destruction now completes asynchronously through the UI process.
        let hasRoot = true;
        for (let i = 0; i < 100 && hasRoot; ++i) {
            await internals.gcAsync();
            hasRoot = internals.hasActivityRoot(xhr);
        }
        println(`root after destroy: ${hasRoot}`);
    });
</script>
