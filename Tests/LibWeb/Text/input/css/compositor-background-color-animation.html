<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    @keyframes legacy-color {
        from { background-color: rgba(255, 0, 0, 0); }
        to { background-color: blue; }
    }

    @keyframes modern-color {
        from { background-color: oklab(40% 0.1 0.1); }
        to { background-color: oklab(80% -0.1 -0.1); }
    }

    @keyframes delayed-color {
        from { background-color: rgba(1, 2, 3, 0); }
        to { background-color: rgb(4, 5, 6); }
    }

    @keyframes root-color {
        from { background-color: red; }
        to { background-color: transparent; }
    }

    @keyframes currentcolor-background {
        from { background-color: currentcolor; }
        to { background-color: blue; }
    }

    html {
        animation: root-color 1s steps(1, start) 100ms infinite both;
    }

    .target {
        width: 20px;
        height: 20px;
    }

    #legacy {
        animation: legacy-color 1s linear infinite;
    }

    #modern {
        animation: modern-color 1s linear infinite;
    }

    #unsupported-timing {
        animation: legacy-color 1s linear 2;
    }

    #transparent-delay {
        animation: delayed-color 1s linear 1s 1 both;
        border-radius: 7px;
    }

    #currentcolor {
        color: red;
        animation: currentcolor-background 1s linear infinite;
    }

    body,
    #text-clip,
    #blended {
        animation: legacy-color 1s linear infinite;
    }

    #text-clip {
        background-clip: text;
    }

    #blended {
        background-image: linear-gradient(white, white);
        background-blend-mode: multiply;
    }
</style>
<div id="legacy" class="target"></div>
<div id="modern" class="target"></div>
<div id="unsupported-timing" class="target"></div>
<div id="transparent-delay" class="target"></div>
<div id="currentcolor" class="target"></div>
<div id="text-clip" class="target">text</div>
<div id="blended" class="target"></div>
<script>
    function compositorAnimationDump() {
        const lines = internals.dumpCompositorAnimations().split("\n").filter(Boolean);
        const animations = lines.filter(line => /^(opacity|background-color|filter|transform) /.test(line)).sort();
        return [...animations, ...lines.filter(line => !animations.includes(line))];
    }

    function visualContextNodes(element) {
        return internals.dumpVisualContextNodes(element).replace(/^\[[sce]\d+\] /gm, "").split("\n").filter(Boolean);
    }

    function ownsCompositorBackgroundColorFrame(element) {
        return visualContextNodes(element).includes("compositor background-color frame");
    }

    function compositorAnimations() {
        return compositorAnimationDump().map(line => `  ${line}`).join("\n");
    }

    function nextTask() {
        const { promise, resolve } = Promise.withResolvers();
        const channel = new MessageChannel();
        channel.port1.onmessage = resolve;
        channel.port2.postMessage(null);
        return promise;
    }

    asyncTest(async done => {
        internals.updateStyle();
        internals.beginStyleTrace();
        internals.setManualRenderingOpportunities(true);
        await nextTask();
        let frameTime = performance.now();
        async function renderNextFrame() {
            frameTime += 16;
            internals.injectRenderingOpportunity(frameTime);
            await nextTask();
        }
        for (let i = 0; i < 4; ++i)
            await renderNextFrame();

        const initialSamples = parseStyleTrace(internals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
        const initialCompositorAnimations = compositorAnimations();
        const legacyNodes = visualContextNodes(document.querySelector("#legacy"));
        const displayList = internals.dumpDisplayList();
        const transparentFillIsRetained = displayList.split("\n").some(line =>
            line.startsWith("FillRectWithRoundedCorners") && line.includes("color=rgba(0, 0, 0, 0)"));
        const rootNodes = visualContextNodes(document.documentElement);
        const unsupportedTargets = [document.body, document.querySelector("#text-clip"), document.querySelector("#blended")];
        const unsupportedTargetsHaveNoMarker = !unsupportedTargets.some(ownsCompositorBackgroundColorFrame);
        const modernTarget = document.querySelector("#modern");
        const currentcolorTarget = document.querySelector("#currentcolor");
        const transparentTarget = document.querySelector("#transparent-delay");
        const unsupportedTimingTarget = document.querySelector("#unsupported-timing");
        let modernTargetNeverGetsMarker = true;
        let currentcolorTargetNeverGetsMarker = true;
        let unsupportedTimingTargetNeverGetsMarker = true;
        for (let i = 0; i < 4; ++i) {
            internals.updateCompositorAnimations();
            modernTargetNeverGetsMarker &&= !ownsCompositorBackgroundColorFrame(modernTarget);
            currentcolorTargetNeverGetsMarker &&= !ownsCompositorBackgroundColorFrame(currentcolorTarget);
            unsupportedTimingTargetNeverGetsMarker &&= !ownsCompositorBackgroundColorFrame(unsupportedTimingTarget);
        }

        document.documentElement.getAnimations()[0].cancel();
        modernTarget.getAnimations()[0].cancel();
        currentcolorTarget.getAnimations()[0].cancel();
        unsupportedTimingTarget.getAnimations()[0].cancel();
        for (const target of unsupportedTargets)
            target.getAnimations()[0].cancel();
        for (let i = 0; i < 2; ++i)
            await renderNextFrame();

        internals.beginStyleTrace();
        internals.beginRenderingTrace();
        for (let i = 0; i < 4; ++i)
            internals.updateCompositorAnimations();
        const stableSamples = parseStyleTrace(internals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
        const stablePumpRequests = internals.takeRenderingTrace().split("\n").filter(line => line.startsWith("animation frame pump request"));

        document.querySelector("#legacy").getAnimations()[0].cancel();
        transparentTarget.getAnimations()[0].cancel();
        internals.updateCompositorAnimations();
        const cancelledCompositorAnimations = compositorAnimations();

        println("background color animations use compositor:");
        println(initialCompositorAnimations);
        println(`background color marker does not create effects layer: [${legacyNodes.join(", ")}]`);
        println(`transparent background color retains animated fill: ${transparentFillIsRetained}`);
        println(`root background color stays on main thread: [${rootNodes.join(", ")}]`);
        println(`complex and propagated backgrounds stay on main thread: ${unsupportedTargetsHaveNoMarker}`);
        println(`modern color interpolation samples on the main thread: ${initialSamples.some(event => event.element === "div#modern.target")}`);
        println(`modern color creates no compositor marker: ${modernTargetNeverGetsMarker}`);
        println(`currentcolor creates no compositor marker: ${currentcolorTargetNeverGetsMarker}`);
        println(`unsupported timing creates no compositor marker: ${unsupportedTimingTargetNeverGetsMarker}`);
        println(`stable background color samples: [${stableSamples.map(event => event.element).join(", ")}]`);
        println(`stable background color frame requests: [${stablePumpRequests.join(", ")}]`);
        println("cancel removes background color animation:");
        if (cancelledCompositorAnimations)
            println(cancelledCompositorAnimations);
        internals.setManualRenderingOpportunities(false);
        done();
    });
</script>
