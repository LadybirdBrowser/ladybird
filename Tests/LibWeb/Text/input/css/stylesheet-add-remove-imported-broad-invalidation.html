<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<div id="target">target</div>
<script>
    function settleAndBeginTrace(triggerElement) {
        getComputedStyle(triggerElement).color;
        getComputedStyle(triggerElement).color;
        internals.updateStyle();
        internals.beginStyleTrace();
    }

    // Print the elements the passes since the trace began restyled, and whether one of them restyled every element.
    // Where a style element arrives with an @import, the style engine restyles for the element and for the imported
    // sheet in one pass or in two, depending on when the import loads, so the passes are not told apart.
    function verifyRestyled(label, trace = internals.takeStyleTrace()) {
        const events = parseStyleTrace(trace, { stylePassesOnly: true });
        const restyled = [...new Set(events.filter(event => event.event === "restyle" && event.outcome !== "kept").map(event => shortStyleName(event.element)))];
        const fullPass = events.some(event => event.event === "pass" && event.kind === "FULL");
        println(`${label}, restyled: [${restyled.join(", ")}]${fullPass ? " (full pass)" : ""}`);
    }

    function verifyTargetWasRecomputed(label) {
        const color = getComputedStyle(document.getElementById("target")).color;
        if (color === "rgb(0, 128, 0)")
            println(`PASS: ${label}`);
        else
            println(`FAIL: ${label} (${color})`);
    }

    async function waitForImportedSheet(styleElement) {
        while (styleElement.sheet.cssRules.length === 0 || styleElement.sheet.cssRules[0].styleSheet === null)
            await animationFrame();
    }

    promiseTest(async () => {
        const target = document.getElementById("target");
        settleAndBeginTrace(target);

        const layerImportStyle = document.createElement("style");
        layerImportStyle.textContent = `@import "data:text/css;base64,${btoa("@layer B, A;")}";`;
        document.head.appendChild(layerImportStyle);
        await waitForImportedSheet(layerImportStyle);

        getComputedStyle(target).color;
        // A layer order change can only move declarations that sit in layers, and nothing here does.
        verifyRestyled("imported layer-only stylesheet add restyles nothing");

        settleAndBeginTrace(target);
        layerImportStyle.remove();

        getComputedStyle(target).color;
        verifyRestyled("imported layer-only stylesheet remove restyles nothing");

        // With a declaration in a layer, reordering the layers has to reach the element it decides
        // for - and still not the whole document.
        const layeredStyle = document.createElement("style");
        layeredStyle.textContent = "@layer A, B; @layer A { #target { color: green } } @layer B { #target { color: blue } }";
        document.head.appendChild(layeredStyle);
        settleAndBeginTrace(target);

        document.head.insertBefore(layerImportStyle, layeredStyle);
        await waitForImportedSheet(layerImportStyle);

        getComputedStyle(target).color;
        const reorderTrace = internals.takeStyleTrace();
        verifyTargetWasRecomputed("imported layer reorder reaches the layered element");
        verifyRestyled("imported layer reorder restyles only the layered element", reorderTrace);
    });
</script>
