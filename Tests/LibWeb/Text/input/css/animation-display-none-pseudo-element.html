<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    #target::before {
        content: "";
        display: none;
        opacity: 0.3;
    }
</style>
<div id="target"></div>
<script>
    asyncTest(async done => {
        internals.updateStyle();
        const target = document.querySelector("#target");
        println(`pseudo-element is hidden: ${getComputedStyle(target, "::before").display === "none"}`);
        internals.beginStyleTrace();
        const animation = target.animate({ opacity: [0, 1] }, { duration: 1000, pseudoElement: "::before" });
        animation.pause();
        animation.currentTime = 500;
        await new Promise(requestAnimationFrame);

        const sampled = parseStyleTrace(internals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
        println(`hidden pseudo-element samples: [${sampled.map(event => event.element).join(", ")}]`);
        done();
    });
</script>
