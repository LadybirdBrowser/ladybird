<!doctype html>
<div id="target" style="--present: 10px; width: attr(data-value type(*), 20px)"></div>
<script src="../include.js"></script>
<script>
    test(() => {
        for (const value of [
            "attr(, 10px)",
            "var(--present, 30px)",
            "var(--present, attr())",
            "if(else: 10px; else: attr())",
        ]) {
            target.setAttribute("data-value", value);
            println(`${value}: ${getComputedStyle(target).width}`);
        }
    });
</script>
