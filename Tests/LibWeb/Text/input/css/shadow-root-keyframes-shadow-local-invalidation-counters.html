<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<div id="bystanders"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).opacity;
        getComputedStyle(triggerElement).opacity;
        internals.updateStyle();
        internals.resetStyleCounters();
    }

    // Print whether the style engine styled at most `maximum` elements since its counters were reset, or,
    // without a bound, how many it styled.
    function verifyStyledStaysBounded(label, maximum) {
        const styled = internals.styleCounters().styledElements;
        if (maximum === undefined)
            println(`${label}, styled: ${styled}`);
        else
            println(`${label}, styled <= ${maximum}: ${styled <= maximum}`);
    }

    test(() => {
        const host = document.getElementById("host");
        const bystanders = document.getElementById("bystanders");

        for (let i = 0; i < 25; ++i) {
            const bystander = document.createElement("div");
            bystander.textContent = `bystander ${i}`;
            bystander.style.animationName = "fade";
            bystander.style.animationDuration = "1s";
            bystander.style.animationFillMode = "both";
            bystanders.appendChild(bystander);
        }

        const shadowRoot = host.attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `
            <style>
                #target {
                    animation-name: fade;
                    animation-duration: 1s;
                    animation-fill-mode: both;
                }
            </style>
            <div id="target">shadow target</div>
        `;

        const target = shadowRoot.getElementById("target");
        const sheet = shadowRoot.querySelector("style").sheet;

        settleAndReset(target);
        sheet.insertRule(`
            @keyframes fade {
                from { opacity: 0.25; }
                to { opacity: 0.25; }
            }
        `, sheet.cssRules.length);
        getComputedStyle(target).opacity;
        verifyStyledStaysBounded("shadow-local keyframes insert ignores matching light-DOM bystanders", 4);
    });
</script>
