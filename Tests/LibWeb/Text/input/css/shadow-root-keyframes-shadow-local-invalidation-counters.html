<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<div id="bystanders"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).opacity;
        getComputedStyle(triggerElement).opacity;
        internals.resetStyleInvalidationCounters();
    }

    function verifyRecomputationsStayBounded(label, maximum) {
        const recomputations = internals.getStyleInvalidationCounters().elementStyleRecomputations;
        // The bound is what this asserts, so the bound is what it prints: recording the exact count
        // would make the expectation depend on a number no assertion here cares about.
        if (recomputations <= maximum)
            println(`PASS: ${label} (at most ${maximum} recomputations)`);
        else
            println(`FAIL: ${label} (${recomputations} recomputations, expected at most ${maximum})`);
    }

    test(() => {
        const host = document.getElementById("host");
        const bystanders = document.getElementById("bystanders");

        for (let i = 0; i < 25; ++i) {
            const bystander = document.createElement("div");
            bystander.textContent = `bystander ${i}`;
            bystander.style.animationName = "fade";
            bystander.style.animationDuration = "1s";
            bystander.style.animationFillMode = "both";
            bystanders.appendChild(bystander);
        }

        const shadowRoot = host.attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `
            <style>
                #target {
                    animation-name: fade;
                    animation-duration: 1s;
                    animation-fill-mode: both;
                }
            </style>
            <div id="target">shadow target</div>
        `;

        const target = shadowRoot.getElementById("target");
        const sheet = shadowRoot.querySelector("style").sheet;

        settleAndReset(target);
        sheet.insertRule(`
            @keyframes fade {
                from { opacity: 0.25; }
                to { opacity: 0.25; }
            }
        `, sheet.cssRules.length);
        getComputedStyle(target).opacity;
        verifyRecomputationsStayBounded("shadow-local keyframes insert ignores matching light-DOM bystanders", 4);
    });
</script>
