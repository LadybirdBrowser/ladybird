<!DOCTYPE html>
<style>
#grid {
    display: grid;
    position: relative;
    width: 200px;
    height: 200px;
    grid-template-columns: 100px 100px;
}
#a {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 50px;
    height: 50px;
}
#b {
    position: absolute;
    grid-column: 2;
    left: 10px;
    right: 10px;
    margin: 0 auto;
    width: 50px;
    height: 50px;
}
</style>
<div id="grid"><div id="a"></div><div id="b"></div></div>
<script src="../include.js"></script>
<script>
    test(() => {
        for (const element of [a, b]) {
            const style = getComputedStyle(element);
            println(`${element.id}: offset=${element.offsetLeft},${element.offsetTop} margin-left=${style.marginLeft} margin-right=${style.marginRight}`);
        }
    });
</script>
