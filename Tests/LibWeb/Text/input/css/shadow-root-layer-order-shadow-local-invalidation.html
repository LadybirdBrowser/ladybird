<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).color;
        getComputedStyle(triggerElement).color;
        internals.resetStyleInvalidationCounters();
    }

    function verifyRecomputationsStayBounded(label, maximum) {
        const recomputations = internals.getStyleInvalidationCounters().elementStyleRecomputations;
        // The bound is what this asserts, so the bound is what it prints: recording the exact count
        // would make the expectation depend on a number no assertion here cares about.
        if (recomputations <= maximum)
            println(`PASS: ${label} (at most ${maximum} recomputations)`);
        else
            println(`FAIL: ${label} (${recomputations} recomputations, expected at most ${maximum})`);
    }

    test(() => {
        const host = document.getElementById("host");
        for (let i = 0; i < 25; ++i) {
            const bystander = document.createElement("span");
            bystander.className = "shadow-target";
            bystander.textContent = `bystander ${i}`;
            document.body.appendChild(bystander);
        }

        const shadowRoot = host.attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `<div id="target" class="shadow-target">target</div>`;
        const target = shadowRoot.getElementById("target");

        const baseStyle = document.createElement("style");
        baseStyle.textContent = `
            @layer alpha {
                .shadow-target { color: rgb(255, 0, 0); }
            }

            @layer beta {
                .shadow-target { color: rgb(0, 128, 0); }
            }
        `;
        shadowRoot.appendChild(baseStyle);

        const layerOrderStyle = document.createElement("style");
        layerOrderStyle.textContent = "@layer beta, alpha;";

        settleAndReset(target);
        shadowRoot.appendChild(layerOrderStyle);
        getComputedStyle(target).color;
        verifyRecomputationsStayBounded("shadow-local layer-order add stays inside the shadow root", 4);

        settleAndReset(target);
        layerOrderStyle.remove();
        getComputedStyle(target).color;
        verifyRecomputationsStayBounded("shadow-local layer-order remove stays inside the shadow root", 4);
    });
</script>
