<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).color;
        getComputedStyle(triggerElement).color;
        internals.updateStyle();
        internals.resetStyleCounters();
    }

    // Print whether the style engine styled at most `maximum` elements since its counters were reset, or,
    // without a bound, how many it styled.
    function verifyStyledStaysBounded(label, maximum) {
        const styled = internals.styleCounters().styledElements;
        if (maximum === undefined)
            println(`${label}, styled: ${styled}`);
        else
            println(`${label}, styled <= ${maximum}: ${styled <= maximum}`);
    }

    test(() => {
        const host = document.getElementById("host");
        for (let i = 0; i < 25; ++i) {
            const bystander = document.createElement("span");
            bystander.className = "shadow-target";
            bystander.textContent = `bystander ${i}`;
            document.body.appendChild(bystander);
        }

        const shadowRoot = host.attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `<div id="target" class="shadow-target">target</div>`;
        const target = shadowRoot.getElementById("target");

        const baseStyle = document.createElement("style");
        baseStyle.textContent = `
            @layer alpha {
                .shadow-target { color: rgb(255, 0, 0); }
            }

            @layer beta {
                .shadow-target { color: rgb(0, 128, 0); }
            }
        `;
        shadowRoot.appendChild(baseStyle);

        const layerOrderStyle = document.createElement("style");
        layerOrderStyle.textContent = "@layer beta, alpha;";

        settleAndReset(target);
        shadowRoot.appendChild(layerOrderStyle);
        getComputedStyle(target).color;
        verifyStyledStaysBounded("shadow-local layer-order add stays inside the shadow root", 4);

        settleAndReset(target);
        layerOrderStyle.remove();
        getComputedStyle(target).color;
        verifyStyledStaysBounded("shadow-local layer-order remove stays inside the shadow root", 4);
    });
</script>
