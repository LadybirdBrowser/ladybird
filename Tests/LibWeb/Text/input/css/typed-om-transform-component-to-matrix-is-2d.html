<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    test(() => {
        // The matrix of a component has the is2D of the component.
        const components = {
            "CSSScale(2, 3)": new CSSScale(2, 3),
            "CSSScale(2, 3, 1)": new CSSScale(2, 3, 1),
            "CSSTranslate(1px, 2px)": new CSSTranslate(CSS.px(1), CSS.px(2)),
            "CSSTranslate(1px, 2px, 0px)": new CSSTranslate(CSS.px(1), CSS.px(2), CSS.px(0)),
            "CSSRotate(45deg)": new CSSRotate(CSS.deg(45)),
            "CSSRotate(0, 0, 1, 45deg)": new CSSRotate(CSS.number(0), CSS.number(0), CSS.number(1), CSS.deg(45)),
            "CSSSkew(10deg, 20deg)": new CSSSkew(CSS.deg(10), CSS.deg(20)),
            "CSSPerspective(none)": new CSSPerspective(new CSSKeywordValue("none")),
        };
        for (const [name, component] of Object.entries(components))
            println(`${name}: is2D ${component.is2D}, toMatrix().is2D ${component.toMatrix().is2D}`);
    });
</script>
