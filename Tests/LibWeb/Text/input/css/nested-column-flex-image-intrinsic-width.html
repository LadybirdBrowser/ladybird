<script>
promiseTest(async () => {
    await thumbnail.decode();
    for (const [label, scrollerWidth, imageHeight] of [
        ["natural size", "100px", "auto"],
        ["clamped width", "60px", "auto"],
        ["specified height", "100px", "50px"],
    ]) {
        document.querySelector(".scroller").style.maxWidth = scrollerWidth;
        thumbnail.style.height = imageHeight;
        println(label);
        for (const element of document.querySelectorAll(".thumbnails, .scroller, #thumbnail, .main")) {

            println(`${element.className || element.id}: ${rect.x}, ${rect.width} x ${rect.height}`);
