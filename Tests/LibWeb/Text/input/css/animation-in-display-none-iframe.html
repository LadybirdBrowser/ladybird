<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<div id="container" style="display: none"></div>
<script>
function frameRequests() {
    const lines = internals.takeRenderingTrace().split("\n").filter(line => line.startsWith("animation frame pump request"));
    return `[${[...new Set(lines.map(line => line.replace(/ x\d+$/, "")))].join(", ")}]`;
}

function sampledElements(frameInternals) {
    const events = parseStyleTrace(frameInternals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
    return `[${[...new Set(events.map(event => event.element))].join(", ")}]`;
}

asyncTest(async done => {
    internals.updateStyle();
    const frame = document.createElement("iframe");
    frame.srcdoc = `<!DOCTYPE html>
        <style>
            @keyframes spin { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 100; } }
            circle { animation: spin 100s linear infinite; }
        </style>
        <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" fill="none" stroke="red" stroke-dasharray="10 20" />
        </svg>`;
    const loaded = new Promise(resolve => frame.onload = resolve);
    container.append(frame);
    await loaded;

    const child = frame.contentWindow;
    const circle = frame.contentDocument.querySelector("circle");
    child.getComputedStyle(circle).strokeDashoffset;
    const animation = circle.getAnimations()[0];
    const frames = async () => {
        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);
    };
    await frames();
    internals.beginRenderingTrace();
    child.internals.beginStyleTrace();
    await frames();
    println(`hidden iframe frame requests: ${frameRequests()}`);
    println(`hidden iframe samples: ${sampledElements(child.internals)}`);

    animation.currentTime = 50000;
    println(`hidden iframe style read samples animation: ${Math.abs(parseFloat(child.getComputedStyle(circle).strokeDashoffset) - 50) < 1}`);
    await frames();
    internals.beginRenderingTrace();
    child.internals.beginStyleTrace();
    container.style.display = "block";
    await new Promise(resolve => setTimeout(resolve, 100));
    println(`shown iframe frame requests: ${frameRequests()}`);
    println(`shown iframe samples: ${sampledElements(child.internals)}`);

    container.style.display = "none";
    await frames();
    internals.beginRenderingTrace();
    await frames();
    println(`frame requests after hiding the iframe: ${frameRequests()}`);

    const listener = () => {};
    circle.addEventListener("animationiteration", listener);
    await frames();
    internals.beginRenderingTrace();
    await frames();
    const armedTimers = child.internals.dumpCompositorAnimations().split("\n").filter(line => line.endsWith("timer armed"));
    println(`hidden iframe iteration listener frame requests: ${frameRequests()}, armed timers: [${armedTimers.join(", ")}]`);
    circle.removeEventListener("animationiteration", listener);
    const iteration = new Promise(resolve => circle.addEventListener("animationiteration", () => resolve(true), { once: true }));
    animation.effect.updateTiming({ duration: 100 });
    animation.currentTime = 0;
    println(`hidden iframe dispatches iteration event: ${await Promise.race([iteration, new Promise(resolve => setTimeout(() => resolve(false), 2000))])}`);
    animation.cancel();

    const nested = child.document.createElement("iframe");
    nested.srcdoc = frame.srcdoc;
    const nestedLoaded = new Promise(resolve => nested.onload = resolve);
    child.document.body.append(nested);
    await nestedLoaded;
    const nestedChild = nested.contentWindow;
    const nestedCircle = nestedChild.document.querySelector("circle");
    nestedChild.getComputedStyle(nestedCircle).strokeDashoffset;
    await frames();
    internals.beginRenderingTrace();
    await frames();
    println(`nested iframe in a hidden ancestor iframe frame requests: ${frameRequests()}`);
    internals.beginRenderingTrace();
    container.style.display = "block";
    await new Promise(resolve => setTimeout(resolve, 100));
    println(`nested iframe in a shown ancestor iframe frame requests: ${frameRequests()}`);
    nestedCircle.getAnimations()[0].cancel();
    container.style.display = "none";
    await frames();
    const reversed = circle.animate({ strokeDashoffset: ["0", "100"] }, { duration: 100000, iterations: Infinity });
    reversed.currentTime = 500;
    reversed.playbackRate = -1;
    const finished = reversed.finished.then(() => true);
    println(`reversed infinite animation can finish while hidden: ${await Promise.race([finished, new Promise(resolve => setTimeout(() => resolve(false), 2000))])}`);
    reversed.cancel();

    const zeroDuration = circle.animate({ strokeDashoffset: ["0", "100"] }, {
        duration: 0,
        iterations: Infinity,
        endDelay: 1000,
    });
    const zeroDurationFinished = zeroDuration.finished.then(() => true);
    println(`zero-duration infinite animation finishes after its end delay while hidden: ${await Promise.race([zeroDurationFinished, new Promise(resolve => setTimeout(() => resolve(false), 2000))])}`);
    zeroDuration.cancel();
    frame.remove();
    done();
});
</script>
