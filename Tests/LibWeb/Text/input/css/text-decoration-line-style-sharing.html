<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    .underline { text-decoration-line: underline; }
    .overline { text-decoration-line: overline; }
    .line-through { text-decoration-line: line-through; }
</style>
<script>
    test(() => {
        internals.updateStyle();
        // Spans under differently decorated parents share one style, whether C++'s style sharing or
        // the style engine's first-record cache provides it.
        const sharedComputations = () => internals.getStyleInvalidationCounters().elementStyleSharedComputations
            + (internals.styleEngineCounters().engineComputedRecordSharedHits ?? 0)
            + (internals.styleEngineCounters().engineComputedRecordCohortHits ?? 0);
        const before = sharedComputations();
        for (const decoration of ["underline", "overline", "line-through"]) {
            const parent = document.createElement("div");
            parent.className = decoration;
            parent.append(document.createElement("span"));
            document.body.append(parent);
        }
        internals.updateStyle();
        const after = sharedComputations();

        for (const child of document.querySelectorAll("span"))
            println(getComputedStyle(child).textDecorationLine);
        println(`shared computations: ${after - before}`);
    });
</script>
