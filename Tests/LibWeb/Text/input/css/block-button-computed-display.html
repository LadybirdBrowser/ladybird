<script src="../include.js"></script>
<button id="target">Button</button>
<script>
    test(() => {
        for (const display of ["block", "flow-root", "flex", "grid"]) {
            target.style.display = display;

        }

        target.innerHTML = '<span style="float: left; width: 15px; height: 43px"></span>';
        println(target.offsetHeight);
    });
</script>
