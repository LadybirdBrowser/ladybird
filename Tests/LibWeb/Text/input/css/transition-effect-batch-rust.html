<!DOCTYPE html>
<style>
    #target {
        opacity: 0;
        width: 10px;
        transition: opacity 1s linear, width 1s linear;
    }
</style>
<div id="target"></div>
<script src="../include.js"></script>
<script>
    test(() => {
        internals.updateStyle();
        target.style.opacity = "1";
        target.style.width = "20px";

        internals.resetStyleFfiCounters();
        internals.updateStyle();
        const counters = internals.styleFfiCounters();
        const style = getComputedStyle(target);
        println(`opacity: ${style.opacity}`);
        println(`width: ${style.width}`);
        println(`transition decisions: ${counters.transitionDecisionEntries}`);
        println(`animation evaluations: ${counters.animationEvaluationEntries}`);
    });
</script>
