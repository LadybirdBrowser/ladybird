<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    .case {
        position: relative;
        width: 300px;
    }
    .wrapper {
        width: 200px;
    }
    .target {
        aspect-ratio: 2 / 1;
    }
    .fill {
        display: block;
        width: 100%;
        height: 100%;
    }
    .tall {
        width: 10px;
        height: 300px;
    }
</style>
<div id="cases"></div>
<script src="../include.js"></script>
<script>
    // Each case places a box with aspect-ratio inside a wrapper whose size is measured from its content, such as a flex
    // item or a float, and reports the sizes of the wrapper and the box.
    const containers = {
        "block": "display: block",
        "flex-column": "display: flex; flex-direction: column; align-items: center",
        "flex-column-stretch": "display: flex; flex-direction: column",
        "flex-row": "display: flex; align-items: flex-start",
        "grid": "display: grid; align-items: start",
        "inline-block": "display: inline-block",
        "float": "float: left",
        "abspos": "position: absolute",
        "table-cell": "display: table-cell",
    };
    const wrappers = {
        "one": 1,
        "two": 2,
    };
    const heights = {
        "100%": "100%",
        "calc": "calc(50% + 10px)",
        "auto": "auto",
    };
    const overflows = ["visible", "hidden"];
    const contents = ["empty", "canvas", "tall"];

    const round = value => Math.round(value * 100) / 100;

    test(() => {
        const casesElement = document.getElementById("cases");
        const cases = [];
        for (const [containerName, containerStyle] of Object.entries(containers)) {
            for (const [wrapperName, wrapperDepth] of Object.entries(wrappers)) {
                for (const [heightName, height] of Object.entries(heights)) {
                    for (const overflow of overflows) {
                        for (const content of contents) {
                            const caseElement = document.createElement("div");
                            caseElement.className = "case";
                            const container = document.createElement("div");
                            container.style.cssText = containerStyle;
                            const wrapper = document.createElement("div");
                            wrapper.className = "wrapper";
                            let parent = wrapper;
                            for (let i = 1; i < wrapperDepth; ++i) {
                                const inner = document.createElement("div");
                                inner.style.height = "100%";
                                parent.appendChild(inner);
                                parent = inner;
                            }
                            const target = document.createElement("div");
                            target.className = "target";
                            target.style.height = height;
                            target.style.overflow = overflow;
                            if (content === "canvas") {
                                const canvas = document.createElement("canvas");
                                canvas.width = 400;
                                canvas.height = 300;
                                canvas.className = "fill";
                                target.appendChild(canvas);
                            } else if (content === "tall") {
                                const tall = document.createElement("div");
                                tall.className = "tall";
                                target.appendChild(tall);
                            }
                            parent.appendChild(target);
                            container.appendChild(wrapper);
                            caseElement.appendChild(container);
                            casesElement.appendChild(caseElement);
                            const name = `${containerName} wrappers=${wrapperName} height=${heightName} overflow=${overflow} ${content}`;
                            cases.push({ name, wrapper, target });
                        }
                    }
                }
            }
        }
        // NB: Measure every case before printing, since printing modifies the document and forces a new layout.
        const lines = cases.map(({ name, wrapper, target }) => {
            const wrapperRect = wrapper.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            return `${name}: wrapper=${round(wrapperRect.width)}x${round(wrapperRect.height)} target=${round(targetRect.width)}x${round(targetRect.height)}`;
        });
        casesElement.remove();
        for (const line of lines)
            println(line);
    });
</script>
