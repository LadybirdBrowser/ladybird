<!DOCTYPE html>
<meta charset="utf-8">
<script src="../include.js"></script>
<style>
    #grid { display: grid; width: 200px; grid-template-columns: [雪] repeat(2, minmax(0, 1fr)) [雨]; grid-template-rows: 40px 60px; }
    #child { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid [子] [] [末]; }
</style>
<div id="grid"><div id="child"></div><div id="item"></div></div>
<script>
test(() => {
    const grid = document.getElementById("grid");
    const child = document.getElementById("child");
    const item = document.getElementById("item");
    const computed = getComputedStyle(grid);
    const dump = () => {
        println(`columns: ${computed.gridTemplateColumns}`);
        println(`rows: ${computed.gridTemplateRows}`);
        println(`subgrid: ${JSON.stringify(getComputedStyle(child).gridTemplateColumns)}`);
    };
    dump();
    grid.style.width = "300px";
    dump();
    grid.style.gridTemplateColumns = "[初] 2em [中] minmax(0, 1fr) [終]";
    grid.style.fontSize = "10px";
    dump();
    item.style.gridColumn = "calc(1 + 1) / span calc(2 - 1)";
    println(`placement: ${getComputedStyle(item).gridColumn}`);
    child.remove();
    grid.style.gridTemplateColumns = "none";
    item.remove();
    dump();
});
</script>
