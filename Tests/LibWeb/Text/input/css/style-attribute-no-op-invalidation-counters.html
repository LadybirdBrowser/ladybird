<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    #custom-property-target {
        height: var(--vh);
    }
</style>
<div id="target">target</div>
<div id="custom-property-target"></div>
<script>
    function settleAndReset() {
        internals.updateStyle();
        internals.updateStyle();
        internals.resetStyleCounters();
    }

    // Print whether the style engine styled at most `maximum` elements since its counters were reset, or,
    // without a bound, how many it styled.
    function report(label, maximum) {
        internals.updateStyle();
        const styled = internals.styleCounters().styledElements;
        if (maximum === undefined)
            println(`${label}, styled: ${styled}`);
        else
            println(`${label}, styled <= ${maximum}: ${styled <= maximum}`);
    }

    test(() => {
        const target = document.getElementById("target");

        target.setAttribute("style", "color: red");
        settleAndReset();

        target.setAttribute("style", "color: red");
        report("setting identical style text", 0);

        settleAndReset();
        target.setAttribute("style", "color: green");
        report("setting changed style text", 1);

        document.documentElement.style.setProperty("--vh", "9px");
        settleAndReset();

        document.documentElement.style.setProperty("--vh", "9px");
        report("setting identical custom property", 0);

        settleAndReset();
        document.documentElement.style.setProperty("--vh", "10px");
        // Only the root and the element reading --vh are styled; the others take the moved custom
        // property without computing again.
        report("setting changed custom property", 2);
    });
</script>
