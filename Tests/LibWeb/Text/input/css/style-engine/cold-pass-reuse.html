<!DOCTYPE html>
<style>
    .box { padding: 1px; }
    .a .label { color: rgb(1, 2, 3); }
    .b .label { color: rgb(4, 5, 6); }
    .framed { border: 2px solid rgb(200, 0, 0); }
    .inherits { border: inherit; margin: 3px; }
    .contents { display: contents; }
    .grid { display: grid; }
</style>
<div class="box a"><span class="label">a</span><span class="label">a</span></div>

<div class="framed"><p class="inherits">framed</p></div>
<div><p class="inherits">plain</p></div>
<div class="grid"><span class="box">grid item</span></div>
<div class="contents"><span class="box">contents child</span></div>
<div style="margin: 1px"><div style="margin: 1px"><div style="margin: 1px"><div style="margin: 1px">
    <div style="margin: 1px"><div style="margin: 1px">deep</div></div>
</div></div></div></div>

<script>
    test(() => {
        internals.updateStyle();
        const report = internals.styleColdPass();
        println(`computed every styled element: ${report.computedElements == report.elements}`);
        println(`reused some elements: ${report.reusedElements > 0}`);
        println(`differences: ${report.differences}`);
    });
</script>
