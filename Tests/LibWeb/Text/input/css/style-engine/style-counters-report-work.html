<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    @keyframes grow {
        from { width: 10px; }
        to { width: 110px; }
    }
    #animated {
        height: 10px;
        animation: grow 10s linear infinite;
    }
    .on {
        color: green;
    }
</style>
<div id="list">
    <span id="target"></span>
    <span id="sibling"></span>
    <span></span>
</div>
<div id="animated"></div>
<script>
    asyncTest(async done => {
        internals.updateStyle();

        internals.resetStyleCounters();
        let counters = internals.styleCounters();
        println(`keys: ${Object.keys(counters).join(", ")}`);
        println(`reset zeroes every counter: ${Object.values(counters).every(value => value === 0)}`);

        // A class change restyles the element it is on, and nothing beside it.
        target.classList.add("on");
        internals.updateStyle();
        counters = internals.styleCounters();
        println(`one pass: ${counters.passes === 1}`);
        println(`no full pass: ${counters.fullPasses === 0}`);
        println(`styled <= 1: ${counters.styledElements >= 1 && counters.styledElements <= 1}`);
        println(`changed <= styled: ${counters.changedElements <= counters.styledElements}`);
        println(`hinted <= 1: ${counters.hintedElements >= 1 && counters.hintedElements <= 1}`);
        println(`no cold pass or index build: ${counters.coldPasses === 0 && counters.indexBuilds === 0}`);

        const lastPass = internals.styleLastPass();
        println(`last pass full: ${lastPass.fullPass}`);
        println(`last pass styled: [${lastPass.styled.join(", ")}]`);
        println(`last pass changed: [${lastPass.changed.join(", ")}]`);

        internals.resetStyleCounters();
        counters = internals.styleCounters();
        println(`reset zeroes every counter again: ${Object.values(counters).every(value => value === 0)}`);
        println(`reset forgets the last pass: ${internals.styleLastPass().styled.length === 0}`);

        // Sampling the running animation composes it over the record of its element.
        await new Promise(requestAnimationFrame);
        internals.resetStyleInvalidationCounters();
        await new Promise(requestAnimationFrame);
        animated.getBoundingClientRect();
        println(`animation sample composed: ${internals.getStyleInvalidationCounters().animatedStyleOverlayBuilds > 0}`);

        // A stylesheet change restyles the elements its rules match, from a rule index updated in place.
        const style = document.createElement("style");
        style.textContent = "#sibling { color: blue; }";
        document.head.appendChild(style);
        internals.updateStyle();
        counters = internals.styleCounters();
        println(`stylesheet change: no full pass ${counters.fullPasses === 0}, no index build ${counters.indexBuilds === 0}, entries ${counters.indexedEntries >= 1}`);
        println(`stylesheet change last pass targeted: ${!internals.styleLastPass().fullPass}`);
        println(`stylesheet change changed sibling: ${internals.styleLastPass().changed.includes("sibling")}`);

        done();
    });
</script>
