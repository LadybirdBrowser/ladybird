<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #ancestor.hidden { display: none; }
    #target { color: green; }
</style>
<div id="ancestor"><span id="target">target</span></div>
<script>
    test(() => {
        getComputedStyle(target).color;

        ancestor.classList.add("hidden");
        getComputedStyle(ancestor).display;

        ancestor.classList.remove("hidden");
        println(`returning restores the style: ${getComputedStyle(target).color === "rgb(0, 128, 0)"}`);
    });
</script>
