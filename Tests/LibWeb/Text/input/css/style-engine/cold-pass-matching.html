<!DOCTYPE html>
<style>
    .theme .item { color: red; }
    .theme > .item { color: green; }
    #main .list li:nth-child(2n) { background: blue; }
    ul.list > li + li { margin-top: 1px; }
    li ~ li.last { font-weight: bold; }
    [data-kind="card"] span { padding: 2px; }
    :is(h1, h2) .title { text-decoration: underline; }
    div:not(.theme) > p { opacity: 0.5; }
    section a[href^="https"] { color: purple; }
    .unused-ancestor .item { color: orange; }
</style>
<div id="main" class="theme">
    <ul class="list">
        <li class="item">one</li>
        <li class="item">two</li>
        <li class="item last">three</li>
    </ul>
    <div data-kind="card"><span>card</span><p>paragraph</p></div>
    <h2><span class="title">title</span></h2>
    <section><a href="https://example.com">link</a><a href="http://example.com">plain</a></section>
    <p style="color: teal">inline</p>
</div>
<script src="../../include.js"></script>
<script>
    test(() => {
        internals.updateStyle();
        const report = internals.styleColdPass();
        println(`styled elements: ${report.elements > 15}`);
        println(`ancestor filter rejected a candidate: ${report.bloomRejections > 0}`);
        println(`computed every styled element: ${report.computedElements == report.elements}`);
        println(`computed some directly: ${report.directlyComputedElements > 0}`);
        println(`differences: ${report.differences}`);
    });
</script>
