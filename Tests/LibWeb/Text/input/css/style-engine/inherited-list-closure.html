<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .before { list-style-position: outside }
    .after { list-style-position: inside }
    #target { color: red }
</style>
<div id="parent" class="before">
    <div id="target"></div>
</div>
<script>
    test(() => {
        const parent = document.getElementById("parent");
        const target = document.getElementById("target");
        internals.updateStyle();

        parent.className = "after";
        internals.updateStyle();

        println(`color: ${getComputedStyle(target).color}`);
        println(`list position: ${getComputedStyle(target).listStylePosition}`);
    });
</script>
