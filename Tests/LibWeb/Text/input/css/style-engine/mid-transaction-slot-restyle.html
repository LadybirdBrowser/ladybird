<!DOCTYPE html>
<script src="../../include.js"></script>
<div id="host"><template shadowrootmode="open">
        <style>
            slot { --color: red; }
            ::slotted(span) { color: var(--color); }
        </style>
        <slot id="control-slot" name="control"></slot>
        <slot id="slot"></slot>
    </template><span id="slotted"></span></div>
<script>
    test(() => {
        const shadowRoot = document.getElementById("host").shadowRoot;
        const controlSlot = shadowRoot.getElementById("control-slot");
        const slot = shadowRoot.getElementById("slot");
        const slotted = document.getElementById("slotted");
        internals.updateStyle();

        controlSlot.style.setProperty("--color", "green");
        internals.updateStyle();

        slot.style.setProperty("--color", "green");
        internals.updateStyle();

        println("slotted color: " + getComputedStyle(slotted).color);
    });
</script>
