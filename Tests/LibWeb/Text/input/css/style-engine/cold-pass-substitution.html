<!DOCTYPE html>
<style>
    :root { --main: rgb(10, 20, 30); --gap: 4px; --border: 1px solid var(--main); --unset-me: 1px; }
    body { color: var(--main); font-family: var(--family, sans-serif); }
    .card { border: var(--border); margin: var(--gap) calc(var(--gap) * 2); --unset-me: initial; }
    .inner { padding: var(--unset-me, 3px); --main: inherit; background-color: var(--main); }
    .invalid { width: var(--missing); height: var(--gap); }
    details > p { border-radius: var(--gap); }
</style>
<div class="card"><div class="inner">inner</div><span class="invalid">invalid</span></div>
<details open><summary>summary</summary><p>slotted</p></details>
<script src="../../include.js"></script>
<script>
    test(() => {
        internals.updateStyle();
        const report = internals.styleColdPass();
        println(`computed every styled element: ${report.computedElements == report.elements}`);
        println(`differences: ${report.differences}`);
    });
</script>
