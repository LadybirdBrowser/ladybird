<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #descendant-anchor.active #descendant-target { color: red }
    #sibling-anchor.active ~ #sibling-target { color: red }
    #positional-target:nth-child(odd) { color: red }
    #relational-anchor:has(.witness) { color: red }
</style>
<div id="descendant-anchor"><div id="descendant-target"></div></div>
<div id="sibling-root"><div id="sibling-anchor"></div><div id="sibling-target"></div></div>
<div id="positional-root"><div id="positional-target"></div></div>
<div id="relational-anchor"></div>
<div id="filler-root"></div>
<script>
    test(() => {
        function measure(action, undo) {
            action();
            internals.updateStyle();
            undo();
            internals.updateStyle();

            internals.resetStyleCounters();
            action();
            internals.updateStyle();
            const counters = internals.styleCounters();
            const changed = internals.styleLastPass().changed.join(" ");
            undo();
            internals.updateStyle();
            return {
                styled: counters.styledElements,
                changed,
                fullPasses: counters.fullPasses,
            };
        }

        const descendantAnchor = document.getElementById("descendant-anchor");
        const siblingAnchor = document.getElementById("sibling-anchor");
        const positionalRoot = document.getElementById("positional-root");
        const positionalTarget = document.getElementById("positional-target");
        const positionalShift = document.createElement("div");
        const relationalAnchor = document.getElementById("relational-anchor");
        const witness = document.createElement("span");
        witness.className = "witness";
        const fillerRoot = document.getElementById("filler-root");

        internals.updateStyle();
        const measurements = [];
        for (const size of [256, 1024, 4096]) {
            const fragment = document.createDocumentFragment();
            for (let index = fillerRoot.childElementCount; index < size; ++index)
                fragment.appendChild(document.createElement("div"));
            fillerRoot.appendChild(fragment);
            internals.updateStyle();

            measurements.push({
                descendant: measure(
                    () => descendantAnchor.classList.add("active"),
                    () => descendantAnchor.classList.remove("active")),
                sibling: measure(
                    () => siblingAnchor.classList.add("active"),
                    () => siblingAnchor.classList.remove("active")),
                positional: measure(
                    () => positionalRoot.insertBefore(positionalShift, positionalTarget),
                    () => positionalShift.remove()),
                relational: measure(
                    () => relationalAnchor.appendChild(witness),
                    () => witness.remove()),
            });
        }

        for (const operator of ["descendant", "sibling", "positional", "relational"]) {
            const styled = measurements.map(measurement => measurement[operator].styled);
            println(`${operator} styled the same at every document size: ${styled.every(count => count === styled[0])}`);
            println(`${operator} full passes: ${measurements.map(measurement => measurement[operator].fullPasses).join(", ")}`);
            println(`${operator} changed: ${measurements.map(measurement => measurement[operator].changed).join(", ")}`);
        }
        println(`largest unrelated population: ${fillerRoot.childElementCount}`);
    });
</script>
