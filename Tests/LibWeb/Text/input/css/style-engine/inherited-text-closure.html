<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .before { color: red }
    .after { color: green }
    #target { font-size: 12px; border: 1px solid currentColor }
</style>
<div id="parent" class="before">
    <div id="target"></div>
</div>
<script>
    test(() => {
        const parent = document.getElementById("parent");
        const target = document.getElementById("target");
        internals.updateStyle();

        parent.className = "after";
        internals.updateStyle();

        println(`color: ${getComputedStyle(target).color}`);
        println(`border: ${getComputedStyle(target).borderTopColor}`);
    });
</script>
