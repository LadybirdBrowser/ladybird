<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    @font-feature-values FeatureFamily { @styleset { fancy: 1; } }
    #alternates { font-family: FeatureFamily, serif; font-variant-alternates: styleset(fancy); }
</style>
<div id="alternates">alternates</div>
<div id="plain">plain</div>
<script>
    // An edit to a @font-feature-values rule moves the feature values every font resolution reads.
    // Check the alternates still name the feature.
    test(() => {
        internals.updateStyle();
        document.styleSheets[0].cssRules[0].styleset.set("fancy", 2);
        internals.updateStyle();
        println(`font-variant-alternates: ${getComputedStyle(document.getElementById("alternates")).fontVariantAlternates}`);
    });
</script>
