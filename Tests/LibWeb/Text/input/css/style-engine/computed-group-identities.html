<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .item {
        color: rgb(20, 24, 28);
    }
    .even {
        --marker: even;
        background-color: rgb(40, 44, 48);
    }
    .odd {
        --marker: odd;
        background-color: rgb(60, 64, 68);
    }
    .odd::before {
        content: "";
    }
</style>
<div id="root"></div>
<script>
    test(() => {
        internals.updateStyle();
        const before = internals.styleEngineCounters();
        const root = document.getElementById("root");
        for (let index = 0; index < 100; ++index) {
            const item = document.createElement("div");
            item.className = `item ${index % 2 ? "odd" : "even"}`;
            root.appendChild(item);
        }

        internals.updateStyle();
        const after = internals.styleEngineCounters();

        println(`computed group handles cover the elements: ${after.computedGroupNodeHandlesPublished - before.computedGroupNodeHandlesPublished >= 100}`);
        println(`computed group sets are shared: ${after.computedGroupSetsReused - before.computedGroupSetsReused}`);
        println(`computed groups are shared: ${after.computedGroupsReused - before.computedGroupsReused}`);
        println(`inherited group handles cover the elements: ${after.inheritedGroupNodeHandlesPublished - before.inheritedGroupNodeHandlesPublished >= 100}`);
        println(`inherited group sets are shared: ${after.inheritedGroupSetsReused - before.inheritedGroupSetsReused}`);
        println(`custom property handles cover the elements: ${after.customPropertyEnvironmentNodeHandlesPublished - before.customPropertyEnvironmentNodeHandlesPublished >= 100}`);
        println(`custom property environments are shared: ${after.customPropertyEnvironmentsReused - before.customPropertyEnvironmentsReused}`);
        println(`computed fixed metadata handles cover the elements: ${after.computedFixedMetadataNodeHandlesPublished - before.computedFixedMetadataNodeHandlesPublished >= 100}`);
        println(`computed fixed metadata tuples are shared: ${after.computedFixedMetadataReused - before.computedFixedMetadataReused >= 148}`);
        println(`base style record handles cover the elements: ${after.styleRecordNodeHandlesPublished - before.styleRecordNodeHandlesPublished >= 100}`);
        println(`base style records are shared: ${after.styleRecordsReused - before.styleRecordsReused}`);
        println(`pseudo assignments are published sparsely: ${after.computedPseudoAssignmentsPublished - before.computedPseudoAssignmentsPublished >= 50}`);

        const laterItem = document.createElement("div");
        laterItem.className = "item even";
        root.appendChild(laterItem);
        internals.updateStyle();
        const afterLaterItem = internals.styleEngineCounters();
        println(`custom property environments survive transaction boundaries: ${afterLaterItem.customPropertyEnvironmentsReused > after.customPropertyEnvironmentsReused}`);

        document.styleSheets[0].deleteRule(3);
        internals.updateStyle();
        const withoutPseudos = internals.styleEngineCounters();
        println(`pseudo assignments are removed sparsely: ${withoutPseudos.computedPseudoAssignmentsRemoved - afterLaterItem.computedPseudoAssignmentsRemoved >= 50}`);
        println(`ordinary item: ${getComputedStyle(root.firstElementChild).color}`);
        println(`distinct non-inherited item: ${getComputedStyle(root.children[99]).backgroundColor}`);
    });
</script>
