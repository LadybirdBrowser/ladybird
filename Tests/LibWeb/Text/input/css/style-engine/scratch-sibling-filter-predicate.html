<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #siblings > .item { color: rgb(4, 5, 6); background-color: rgb(7, 8, 9); }
    #siblings > .item:nth-child(odd) { width: 11px; }
    #siblings > .item:nth-child(even) { width: 22px; }
    #siblings > p:nth-of-type(2) { height: 33px; }
    #siblings > .item:nth-child(odd of :has(> .flag)) { color: rgb(1, 2, 3); }
    #siblings > .item:nth-last-child(odd of :has(> .flag)) { background-color: rgb(10, 11, 12); }
</style>
<div id="siblings">
    <p class="item"><span class="flag"></span></p>
    <div class="item"><span></span></div>
    <p class="item"><span class="flag"></span></p>
    <div class="item"><span></span></div>
</div>
<script>
    test(() => {
        const parent = document.getElementById("siblings");
        const items = [...parent.children];
        const witnesses = items.map(item => item.firstElementChild);
        function check(label, forward, backward) {
            for (let i = 0; i < items.length; ++i) {
                const style = getComputedStyle(items[i]);
                if (style.color !== (forward.includes(i) ? "rgb(1, 2, 3)" : "rgb(4, 5, 6)"))
                    throw new Error(`${label}: forward rank ${i}`);
                if (style.backgroundColor !== (backward.includes(i) ? "rgb(10, 11, 12)" : "rgb(7, 8, 9)"))
                    throw new Error(`${label}: backward rank ${i}`);
                if (style.width !== (i % 2 ? "22px" : "11px"))
                    throw new Error(`${label}: unfiltered rank ${i}`);
                if (parent.children[i] !== items[i] || items[i].firstElementChild !== witnesses[i])
                    throw new Error(`${label}: sibling geometry changed`);
            }
            if (getComputedStyle(items[2]).height !== "33px")
                throw new Error(`${label}: type rank`);
            println(`PASS: ${label}`);
        }
        check("initial", [0], [2]);
        witnesses[1].className = "flag";
        check("filter enters without tree edits", [0, 2], [0, 2]);
        witnesses[0].className = "";
        check("filter leaves without tree edits", [1], [2]);
        witnesses[3].className = "flag";
        check("last filter enters without tree edits", [1, 3], [1, 3]);
        witnesses[1].className = "";
        witnesses[0].className = "flag";
        witnesses[3].className = "";
        check("filter restored without tree edits", [0], [2]);
    });
</script>
