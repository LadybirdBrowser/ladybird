<!DOCTYPE html>
<script src="../../include.js"></script>
<style id="sheet">
    html { font-size: 10px; }
    html.moved { font-size: 20px; }
    #plain { width: 2rem; }
</style>
<div id="plain">plain</div>
<script>
    test(() => {
        internals.updateStyle();
        const before = internals.styleEngineCounters();
        sheet.sheet.insertRule("@counter-style stars { system: cyclic; symbols: '*'; }");
        document.documentElement.classList.add("moved");
        internals.updateStyle();
        const after = internals.styleEngineCounters();
        println(`root font prepared: ${after.rootFontInputsPrepared > before.rootFontInputsPrepared}`);
        println(`plain width: ${getComputedStyle(plain).width}`);
    });
</script>
