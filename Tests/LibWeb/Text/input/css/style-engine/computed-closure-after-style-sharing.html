<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .changed { background-color: blue }
</style>
<span id="first"></span>
<span id="second"></span>
<script>
    test(() => {
        internals.updateStyle();

        const shared = internals.styleRecordIdentity(first) === internals.styleRecordIdentity(second);
        internals.resetStyleCounters();
        second.className = "changed";
        internals.updateStyle();
        const styled = internals.styleCounters().styledElements;

        println(`shared initial style: ${shared}`);
        println(`styled only the changed element: ${styled <= 1}`);
        println(`first background: ${getComputedStyle(first).backgroundColor}`);
        println(`second background: ${getComputedStyle(second).backgroundColor}`);
    });
</script>
