<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .margins { margin-inline-start: 10px; margin-left: 20px }
    .before { direction: ltr }
    .after { direction: rtl }
    .vertical { direction: ltr; writing-mode: vertical-rl }
    .margin-before { margin-inline-start: 10px }
    .margin-after { margin-inline-start: 30px }
</style>
<div id="target" class="margins before"></div>
<div id="margin-target" class="margin-before"></div>
<script>
    test(() => {
        internals.updateStyle();

        target.className = "margins after";
        internals.updateStyle();

        const style = getComputedStyle(target);
        println(`left margin: ${style.marginLeft}`);
        println(`right margin: ${style.marginRight}`);

        target.className = "margins vertical";
        internals.updateStyle();
        println(`top margin: ${getComputedStyle(target).marginTop}`);

        const marginTarget = document.getElementById("margin-target");
        marginTarget.className = "margin-after";
        internals.updateStyle();
        println(`changed logical margin: ${getComputedStyle(marginTarget).marginLeft}`);
    });
</script>
