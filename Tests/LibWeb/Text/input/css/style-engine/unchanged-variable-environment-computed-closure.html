<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #parent { --space: 20px; --color: green; }
    #target { margin-left: var(--space); color: var(--color); }
    #target.dimmed { opacity: 0.5; }
</style>
<div id="parent"><div id="target"></div></div>
<script>
    test(() => {
        const parent = document.getElementById("parent");
        const target = document.getElementById("target");
        internals.updateStyle();
        target.className = "dimmed";
        internals.updateStyle();
        println(`opacity: ${getComputedStyle(target).opacity}`);
        println(`margin: ${getComputedStyle(target).marginLeft}`);
        println(`color: ${getComputedStyle(target).color}`);

        target.style.setProperty("--space", "40px");
        internals.updateStyle();
        println(`changed own variable: ${getComputedStyle(target).marginLeft}`);

        parent.style.setProperty("--color", "red");
        internals.updateStyle();
        println(`changed inherited variable: ${getComputedStyle(target).color}`);
    });
</script>
