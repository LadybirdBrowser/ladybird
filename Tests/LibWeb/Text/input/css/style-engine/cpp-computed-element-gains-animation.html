<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    @keyframes grow { from { height: 10px; } to { height: 20px; } }
    #target.animated { animation: grow 100s linear paused; }
</style>
<div id="target" style="width: 10cqw"></div>
<script>
    test(() => {
        // A container unit in the element's own style keeps its record with C++, which binds no
        // cascade state. A rule that gives it an animation-name still starts the animation.
        const target = document.getElementById("target");
        internals.updateStyle();
        target.classList.add("animated");
        internals.updateStyle();
        println(`animation-name: ${getComputedStyle(target).animationName}`);
        println(`animations: ${target.getAnimations().length}`);
        println(`height: ${getComputedStyle(target).height}`);
    });
</script>
