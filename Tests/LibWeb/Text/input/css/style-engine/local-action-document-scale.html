<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target.active { color: red }
</style>
<div id="root"><div id="target"></div></div>
<script>
    test(() => {
        const root = document.getElementById("root");
        const target = document.getElementById("target");

        function toggleActive(active) {
            target.classList.toggle("active", active);
            internals.updateStyle();
        }

        function measureAddition() {
            // Establish the same retained answer and inactive starting state at every size.
            toggleActive(true);
            toggleActive(false);

            internals.resetStyleCounters();
            toggleActive(true);
            const counters = internals.styleCounters();
            const lastPass = internals.styleLastPass();
            toggleActive(false);
            return {
                passes: counters.passes,
                fullPasses: counters.fullPasses,
                styled: lastPass.styled,
                changed: lastPass.changed,
                hintedElements: counters.hintedElements,
                hintedSubtrees: counters.hintedSubtrees,
                invalidationVisits: counters.invalidationVisits,
                invalidationTests: counters.invalidationTests,
            };
        }

        function growTo(size) {
            const fragment = document.createDocumentFragment();
            const currentSize = root.childElementCount;
            for (let index = currentSize; index < size; ++index) {
                const filler = document.createElement("div");
                filler.className = "unrelated";
                fragment.appendChild(filler);
            }
            root.appendChild(fragment);
            internals.updateStyle();
        }

        internals.updateStyle();
        const measurements = [];
        // These sizes increase the unrelated document population by 16x.
        for (const size of [257, 1025, 4097]) {
            growTo(size);
            measurements.push(measureAddition());
        }

        const baseline = JSON.stringify(measurements[0]);
        println(`one pass: ${measurements[0].passes}`);
        println(`no full pass: ${measurements[0].fullPasses}`);
        println(`styled: ${measurements[0].styled}`);
        println(`changed: ${measurements[0].changed}`);
        println(`one hinted element: ${measurements[0].hintedElements}`);
        println(`no hinted subtree: ${measurements[0].hintedSubtrees}`);
        println(`physical work is document-scale invariant: ${measurements.every(measurement => JSON.stringify(measurement) === baseline)}`);
        println(`largest document elements: ${root.childElementCount}`);
    });
</script>
