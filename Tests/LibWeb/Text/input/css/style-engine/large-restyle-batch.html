<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="../../work-test.js"></script>
<script src="plan.js"></script>
<style>
    .theme .item { color: green }
</style>
<div id="guard"></div>
<script>
    test(() => {
        const guard = document.getElementById("guard");
        for (let i = 0; i < 1100; ++i) {
            const item = document.createElement("div");
            item.className = "item";
            guard.appendChild(item);
        }

        const work = styleWork(() => guard.classList.add("theme"));
        const isItem = element => /^div\.item(@\d+)?$/.test(element);
        println(`passes: ${work.passes().join(" | ")}`);
        println(`every item changed: ${work.changed().length === 1100 && work.changed().every(isItem)}`);
        println(`restyled besides the items: [${work.restyled().filter(element => !isItem(element)).join(", ")}]`);
    });
</script>
