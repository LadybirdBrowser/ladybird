<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .winner {
        color: green !important;
    }

    .loser-a {
        color: red;
    }

    .loser-b {
        color: blue;
    }
</style>
<div id="container"></div>
<script>
    test(() => {
        internals.resetStyleInvalidationCounters();
        const engineCountersBefore = internals.styleEngineCounters();
        const engineSharedBefore = (engineCountersBefore.engineComputedRecordSharedHits ?? 0) + (engineCountersBefore.engineComputedRecordCohortHits ?? 0);
        const first = document.createElement("span");
        first.className = "winner loser-a";
        const second = document.createElement("span");
        second.className = "winner loser-b";
        document.getElementById("container").append(first, second);
        document.body.offsetWidth;

        const counters = internals.getStyleInvalidationCounters();
        // The record is shared either by C++'s style sharing or by the style engine's first-record cache.
        const engineCounters = internals.styleEngineCounters();
        const engineShared = (engineCounters.engineComputedRecordSharedHits ?? 0) + (engineCounters.engineComputedRecordCohortHits ?? 0) - engineSharedBefore;
        println(`shared equivalent cascade: ${counters.elementStyleSharedComputations + engineShared >= 1}`);
        println(`first color: ${getComputedStyle(first).color}`);
        println(`second color: ${getComputedStyle(second).color}`);
    });
</script>
