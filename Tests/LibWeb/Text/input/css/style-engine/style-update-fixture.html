<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="resources/style-update-fixture.js"></script>
<script>
    test(() => {
        const messages = [];
        for (const scenario of ["connected", "detached"]) {
            const fixture = createStyleUpdateFixture(300, scenario, 1);
            for (let index = 0; index < 12; ++index) {
                const sample = fixture.step(index);
                messages.push(`${scenario}: ${sample.name}: PASS`);
            }
            fixture.dispose();
        }
        for (const message of messages)
            println(message);
    });
</script>
