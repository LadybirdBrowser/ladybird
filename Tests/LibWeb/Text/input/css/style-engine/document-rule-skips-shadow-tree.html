<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    :checked ~ div > * { color: green }
</style>
<div id="host"></div>
<script>
    test(() => {
        const shadowRoot = document.getElementById("host").attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `<div><input type="checkbox"><label id="label"></label><button id="button"></button></div>`;
        internals.updateStyle();
        internals.resetStyleCounters();

        // A document rule never matches inside a shadow tree, so checking a box there restyles
        // nothing through it.
        shadowRoot.querySelector("input").checked = true;
        internals.updateStyle();
        const pass = internals.styleLastPass();
        println(`full pass: ${pass.fullPass}`);
        println(`changed: [${pass.changed.join(", ")}]`);
        println(`styled only what changed: ${pass.styled.join() === pass.changed.join()}`);
    });
</script>
