<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #ancestor.hidden { display: none; }
    #target { color: green; }
</style>
<div id="ancestor"><span id="target">target</span></div>
<script>
    test(() => {
        getComputedStyle(target).color;
        const visibleIdentity = internals.styleRecordIdentity(target);
        println(`initial assignment is retained: ${visibleIdentity !== 0}`);

        ancestor.classList.add("hidden");
        getComputedStyle(ancestor).display;
        const hiddenIdentity = internals.styleRecordIdentity(target);
        println(`display-none propagation clears the assignment: ${hiddenIdentity === 0}`);

        ancestor.classList.remove("hidden");
        // The engine derives the record afresh; it holds the style the element had.
        println(`returning restores the style: ${getComputedStyle(target).color === "rgb(0, 128, 0)" && internals.styleRecordIdentity(target) !== 0}`);
    });
</script>
