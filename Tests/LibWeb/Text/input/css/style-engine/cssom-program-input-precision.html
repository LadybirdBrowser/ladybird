<!DOCTYPE html>
<script src="../../include.js"></script>
<div id="target"></div>
<div id="host"></div>
<script>
    test(() => {
        const sheet = new CSSStyleSheet();
        sheet.replaceSync("@layer base, theme; @layer base { #target { color: red } } @layer theme { #target { color: blue } }");
        const shadow = host.attachShadow({ mode: "open" });
        shadow.innerHTML = '<div id="target"></div>';
        const shadowTarget = shadow.firstElementChild;
        document.adoptedStyleSheets = [sheet];
        shadow.adoptedStyleSheets = [sheet];
        internals.updateStyle();

        // Print whether the change styled at most `maximum` elements, or, without a bound, how many it
        // styled and whether in a full pass.
        function mutate(label, mutation, maximum) {
            internals.resetStyleCounters();
            mutation();
            internals.updateStyle();
            const lastPass = internals.styleLastPass();
            if (maximum === undefined)
                println(`${label} styled: ${lastPass.styled.length}, full pass: ${lastPass.fullPass}`);
            else
                println(`${label} styled <= ${maximum}: ${lastPass.styled.length <= maximum}`);
            println(`${label} colors: ${getComputedStyle(target).color}, ${getComputedStyle(shadowTarget).color}`);
        }

        // Repeating and removing repeated layer statements restyles nothing, and every other change but the
        // font feature values only the two targets.
        mutate("repeat layers", () => sheet.insertRule("@layer base, theme;", 0), 0);
        mutate("remove repeated layers", () => sheet.deleteRule(0), 0);
        mutate("reorder layers", () => sheet.insertRule("@layer theme, base;", 0), 2);
        mutate("restore layers", () => sheet.deleteRule(0), 2);
        mutate("insert style rule", () => sheet.insertRule("#target { color: green; }", sheet.cssRules.length), 2);
        mutate("edit declarations", () => sheet.cssRules[sheet.cssRules.length - 1].style.color = "purple", 2);
        mutate("replace declarations", () => sheet.cssRules[sheet.cssRules.length - 1].style.cssText = "--color: olive; color: var(--color)", 2);
        mutate("edit custom property", () => sheet.cssRules[sheet.cssRules.length - 1].style.setProperty("--color", "green"), 2);
        mutate("delete style rule", () => sheet.deleteRule(sheet.cssRules.length - 1), 2);
        mutate("insert grouped rules", () => sheet.insertRule("@media all { #target { color: orange; } }", sheet.cssRules.length), 2);
        mutate("delete grouped rules", () => sheet.deleteRule(sheet.cssRules.length - 1), 2);
        mutate("insert nested rules", () => sheet.insertRule("#target { @media all { color: brown; } }", sheet.cssRules.length), 2);
        mutate("delete nested rules", () => sheet.deleteRule(sheet.cssRules.length - 1), 2);
        // A @font-feature-values rule for a family nobody uses restyles nothing.
        mutate("insert font feature values", () => sheet.insertRule("@font-feature-values PrecisionFont { @stylistic { alternate: 1; } }", sheet.cssRules.length));
        mutate("delete font feature values", () => sheet.deleteRule(sheet.cssRules.length - 1));
    });
</script>
