<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #container { container-type: inline-size; width: 100px; }
    @container (min-width: 200px) {
        #dependent { color: rgb(1, 2, 3); }
    }
</style>
<div id="container"><span id="dependent"></span></div>
<script>
    test(() => {
        const container = document.getElementById("container");
        const dependent = document.getElementById("dependent");
        document.body.offsetWidth;

        internals.resetStyleInvalidationCounters();
        container.style.width = "300px";
        document.body.offsetWidth;
        const layoutCounters = internals.getStyleInvalidationCounters();

        const color = getComputedStyle(dependent).color;
        const readCounters = internals.getStyleInvalidationCounters();

        println("dependent color: " + color);
        // Record verification can materialize a style that a later reaction would compute.
        println("layout recomputations within budget: " + (layoutCounters.elementStyleRecomputations <= 2));
        println("size-query scan visits: " + layoutCounters.sizeQueryContainerScanVisits);
        println("read recomputations: " + (readCounters.elementStyleRecomputations - layoutCounters.elementStyleRecomputations));
    });
</script>
