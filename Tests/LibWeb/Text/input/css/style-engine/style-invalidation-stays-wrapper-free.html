<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target {
        width: 10px;
    }

    #target.changed {
        width: 20px;
    }
</style>
<div id="target"></div>
<script>
    test(() => {
        document.body.offsetWidth;
        internals.resetStyleInvalidationCounters();

        target.classList.add("changed");
        target.offsetWidth;

        const counters = internals.getStyleInvalidationCounters();
        println(`computed width: ${getComputedStyle(target).width}`);
        println(`style invalidation minted wrappers: ${counters.longhandWrappersMinted}`);
    });
</script>
