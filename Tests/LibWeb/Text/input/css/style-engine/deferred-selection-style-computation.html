<!DOCTYPE html>
<script src="../../include.js"></script>
<style id="rules"></style>
<div id="container"></div>
<script>
    test(() => {
        for (let index = 0; index < 64; ++index) {
            const child = container.appendChild(document.createElement("div"));
            child.textContent = "selectable text";
        }
        internals.updateStyle();
        // FIXME: Check that no pass computes the selection styles of elements nothing selects or queries, here
        //        and after the deselected rule change below. The style engine styles ::selection for every element
        //        once the document shows a selection, not only for the selected subtrees.
        rules.sheet.insertRule("*::selection { color: rgb(10, 20, 30); background-color: rgb(40, 50, 60); }");
        internals.updateStyle();
        const target = container.firstElementChild;
        internals.resetStyleCounters();
        println(`unselected query: ${getComputedStyle(target, "::selection").color}`);
        // A highlight pseudo-element inherits from its ancestors', so a query computes that chain and nothing else.
        println(`query stays local: ${internals.styleCounters().styledElements < container.children.length}`);

        getComputedStyle(container.lastElementChild, "::selection").backgroundColor;
        target.getBoundingClientRect();
        const range = document.createRange();
        range.selectNodeContents(target);
        document.getSelection().addRange(range);
        internals.resetStyleCounters();
        const beforeActivation = internals.getStyleInvalidationCounters();
        internals.updateStyle();
        target.getBoundingClientRect();
        const afterActivation = internals.getStyleInvalidationCounters();
        const activation = internals.styleCounters();
        println(`activation preserves element styles: ${internals.styleLastPass().changed.length === 0}`);
        println(`activation stays local: ${activation.styledElements < 16}`);
        println(`activation preserves layout: ${afterActivation.relayoutsPerformed === beforeActivation.relayoutsPerformed}`);
        println(`selected query: ${getComputedStyle(target, "::selection").backgroundColor}`);

        internals.updateStyle();
        internals.resetStyleCounters();
        range.setEnd(target.nextElementSibling.firstChild, 3);
        internals.updateStyle();
        const extension = internals.styleCounters().styledElements;
        println(`extension updates only intersecting subtrees: ${extension > 0 && extension < 16}`);


        document.getSelection().removeAllRanges();
        rules.sheet.cssRules[0].style.backgroundColor = "rgb(70, 80, 90)";
        internals.updateStyle();
        println(`deselected query: ${getComputedStyle(target, "::selection").backgroundColor}`);

        internals.updateStyle();
        internals.resetStyleCounters();
        document.getSelection().addRange(range);
        internals.updateStyle();
        println(`reactivation preserves element styles: ${internals.styleLastPass().changed.length === 0}`);
        println(`reactivated query: ${getComputedStyle(target, "::selection").backgroundColor}`);
        println(`unselected query while active: ${getComputedStyle(container.lastElementChild, "::selection").backgroundColor}`);

        document.getSelection().removeAllRanges();
        internals.updateStyle();
        rules.sheet.insertRule(".changed { color: rgb(90, 100, 110); }");
        target.className = "changed";
        document.getSelection().addRange(range);
        internals.updateStyle();
        println(`activation with pending rule and class changes: ${getComputedStyle(target).color}`);

        document.getSelection().removeAllRanges();
        internals.updateStyle();
        target.style.color = "rgb(120, 130, 140)";
        document.getSelection().addRange(range);
        internals.updateStyle();
        println(`activation with pending inline style: ${getComputedStyle(target).color}`);
    });
</script>
