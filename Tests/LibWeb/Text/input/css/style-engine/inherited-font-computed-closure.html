<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #parent { font-size: 16px; }
    #child { margin-left: 2em; }
    #grandchild { padding-left: 3em; }
</style>
<div id="parent"><div id="child"><div id="grandchild"></div></div></div>
<script>
    test(() => {
        const parent = document.getElementById("parent");
        const child = document.getElementById("child");
        const grandchild = document.getElementById("grandchild");
        internals.updateStyle();
        parent.style.fontSize = "20px";
        internals.updateStyle();
        println(`child font: ${getComputedStyle(child).fontSize}`);
        println(`child margin: ${getComputedStyle(child).marginLeft}`);
        println(`grandchild font: ${getComputedStyle(grandchild).fontSize}`);
        println(`grandchild padding: ${getComputedStyle(grandchild).paddingLeft}`);
    });
</script>
