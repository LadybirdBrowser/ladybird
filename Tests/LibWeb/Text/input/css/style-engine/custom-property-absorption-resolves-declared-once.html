<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    :root {
        --theme-a: 1px;
        --theme-b: 2px;
        --theme-c: 3px;
        --theme-d: 4px;
        --theme-e: 5px;
        --theme-f: 6px;
        --theme-g: 7px;
        --theme-h: 8px;
    }

    .item {
        --local: var(--theme-a);
        margin-left: var(--local);
    }

<div id="host"></div>
<script>
    test(() => {
        const host = document.getElementById("host");
        host.innerHTML = '<div class="item">x</div>'.repeat(20);

        internals.updateStyle();

        println(`margin: ${getComputedStyle(host.firstElementChild).marginLeft}`);
    });
</script>
