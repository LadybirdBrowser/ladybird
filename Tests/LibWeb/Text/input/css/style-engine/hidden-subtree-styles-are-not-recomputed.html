<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #hidden { display: none; color: red; }
</style>
<div id="hidden">
    <div id="child"><span id="grandchild">hidden text</span></div>
</div>
<script>
test(() => {
    internals.updateStyle();

    // A CSSOM read materializes the styles of a hidden subtree.
    println(`hidden grandchild color: ${getComputedStyle(grandchild).color}`);
    println(`hidden grandchild has style after read: ${internals.styleRecordIdentity(grandchild) !== 0}`);

    // A moved inherited value of the hidden root clears the subtree's styles rather than computing them again.
    hidden.style.color = "green";
    internals.updateStyle();
    println(`hidden grandchild style is cleared: ${internals.styleRecordIdentity(grandchild) === 0}`);
    println(`hidden child style is cleared: ${internals.styleRecordIdentity(child) === 0}`);
    println(`hidden grandchild color after move: ${getComputedStyle(grandchild).color}`);
});
</script>
