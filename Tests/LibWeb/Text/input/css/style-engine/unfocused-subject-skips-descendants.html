<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .item.completed > div > :focus {
        color: rgb(0, 128, 0);
    }
</style>
<ul id="list"></ul>
<script>
    test(() => {
        for (let index = 0; index < 20; ++index) {
            const item = document.createElement("li");
            item.className = "item";
            const row = document.createElement("div");
            for (let field = 0; field < 5; ++field)
                row.appendChild(document.createElement("input"));
            item.appendChild(row);
            list.appendChild(item);
        }
        const probe = list.children[3].firstChild.children[2];
        internals.updateStyle();

        internals.resetStyleCounters();
        for (const item of list.children)
            item.classList.add("completed");
        println(`unfocused probe: ${getComputedStyle(probe).color}`);
        println(`styled with no focused element: ${internals.styleCounters().styledElements}`);

        for (const item of list.children)
            item.classList.remove("completed");
        probe.focus();
        getComputedStyle(probe).color;

        internals.resetStyleCounters();
        for (const item of list.children)
            item.classList.add("completed");
        println(`focused probe: ${getComputedStyle(probe).color}`);
        // The focused probe restyles with the elements of its user-agent shadow tree, which inherit its color.
        println(`styled with one focused element: ${internals.styleCounters().styledElements}`);
    });
</script>
