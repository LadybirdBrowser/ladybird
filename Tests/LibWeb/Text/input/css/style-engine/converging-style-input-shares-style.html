<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .old-a {
        color: red;
    }

    .old-b {
        color: blue;
    }

    .new {
        color: green;
    }
</style>
<div id="container">
    <span class="old-a">a</span>
    <span class="old-b">b</span>
    <span class="old-a">c</span>
</div>
<script>
    test(() => {
        const items = document.querySelectorAll("span");
        internals.updateStyle();

        internals.resetStyleCounters();
        for (const item of items)
            item.className = "new";
        internals.updateStyle();

        const counters = internals.styleCounters();
        println(`shared converging style: ${counters.sharedElements + counters.reusedElements >= 1}`);
        println(`colors became green: ${[...items].every(item => getComputedStyle(item).color === "rgb(0, 128, 0)")}`);
    });
</script>
