<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target {
        background-color: red;
    }

    #target::before {
        content: "before";
        color: red;
    }

    #target.pseudo-flip::before {
        content: "after";
        color: blue;
    }

    #target.element-flip {
        background-color: blue;
    }
</style>
<div id="target"></div>
<script>
    test(() => {
        internals.updateStyle();
        getComputedStyle(target, "::before").width;

        target.classList.add("pseudo-flip");
        internals.updateStyle();
        const pseudoStyle = getComputedStyle(target, "::before");

        println(`pseudo content changed: ${pseudoStyle.content}`);
        println(`pseudo color changed: ${pseudoStyle.color}`);

        target.classList.add("element-flip");
        internals.updateStyle();

        println(`element background changed: ${getComputedStyle(target).backgroundColor}`);
        println(`pseudo content preserved: ${getComputedStyle(target, "::before").content}`);
    });
</script>
