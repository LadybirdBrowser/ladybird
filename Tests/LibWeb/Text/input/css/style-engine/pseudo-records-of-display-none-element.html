<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target { display: none; }
    #target::before { content: "before"; color: rgb(0, 128, 0); }
    #target.changed::before { content: "changed"; }
</style>
<div id="target" style="--width: 10cqw; width: var(--width)"></div>
<script>
    test(() => {
        // The element's pseudo-elements settle beside a record C++ computed: a container unit
        // substituted into the element's own style keeps its record with C++, which the count of
        // C++ recomputations shows. The pseudo-element is still the engine's, display:none as the
        // element is.
        const target = document.getElementById("target");
        internals.updateStyle();
        const start = internals.styleEngineCounters();
        const startRecomputations = internals.getStyleInvalidationCounters().elementStyleRecomputations;
        target.className = "changed";
        internals.updateStyle();
        const end = internals.styleEngineCounters();
        println(`C++ recomputations: ${internals.getStyleInvalidationCounters().elementStyleRecomputations - startRecomputations}`);
        const before = getComputedStyle(target, "::before");
        println(`before: ${before.content} ${before.color}`);
        println(`engine pseudo records: ${end.engineComputedPseudoRecords - start.engineComputedPseudoRecords}`);
        println(`parent bails: ${end.engineComputedRecordBailRecordParent - start.engineComputedRecordBailRecordParent}`);
    });
</script>
