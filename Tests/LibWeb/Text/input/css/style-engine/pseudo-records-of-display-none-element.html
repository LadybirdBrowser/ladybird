<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target { display: none; }
    #target::before { content: "before"; color: rgb(0, 128, 0); }
    #target.changed::before { content: "changed"; }
</style>
<div id="target" style="--width: 10cqw; width: var(--width)"></div>
<script>
    test(() => {
        // The element's pseudo-elements settle beside its own record, which substitutes a
        // container unit and so stays out of every record cache. The pseudo-element is still the
        // engine's, display:none as the element is.
        const target = document.getElementById("target");
        internals.updateStyle();
        target.className = "changed";
        internals.updateStyle();
        const before = getComputedStyle(target, "::before");
        println(`before: ${before.content} ${before.color}`);
    });
</script>
