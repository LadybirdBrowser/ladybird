<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .item::before {
        content: "before";
        display: list-item;
        color: green;
    }
</style>
<div id="host"></div>
<script>
    // The marker of a list-item ::before takes the element's ::marker style, which the element holds
    // none of: the style engine derives it for the tree builder's read.
    test(() => {
        const host = document.getElementById("host");
        document.body.offsetWidth;
        const drives = () => internals.getStyleInvalidationCounters().computedLonghandDrivesStarted;
        const before = drives();
        const item = document.createElement("div");
        item.className = "item";
        host.appendChild(item);
        document.body.offsetWidth;
        println(`C++ style computations: ${drives() - before}`);
        println(`marker color: ${getComputedStyle(item, "::marker").color}`);
    });
</script>
