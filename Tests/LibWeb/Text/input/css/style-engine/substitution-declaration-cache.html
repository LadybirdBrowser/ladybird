<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    :root {
        --spacing: 7px;
    }

    .item {
        padding-left: var(--spacing);
    }
</style>
<div id="host"></div>
<script>
    test(() => {
        internals.updateStyle();
        internals.resetStyleFfiCounters();
        internals.resetStyleInvalidationCounters();

        const host = document.getElementById("host");
        for (let index = 0; index < 50; ++index) {
            const item = document.createElement("div");
            item.className = "item";
            // Keep style sharing from hiding repeated cascade work while leaving every item on
            // the same inherited custom-property environment.
            item.style.zIndex = index;
            host.appendChild(item);
        }
        internals.updateStyle();

        println(`shared environment value parses: ${internals.getStyleInvalidationCounters().substitutionValueParses}`);
        println(`shared value: ${getComputedStyle(host.lastElementChild).paddingLeft}`);

        internals.resetStyleFfiCounters();
        internals.resetStyleInvalidationCounters();
        host.lastElementChild.style.zIndex = 100;
        internals.updateStyle();
        println(`later transaction value parses: ${internals.getStyleInvalidationCounters().substitutionValueParses}`);
        println(`later transaction value: ${getComputedStyle(host.lastElementChild).paddingLeft}`);

        internals.resetStyleFfiCounters();
        internals.resetStyleInvalidationCounters();
        CSS.registerProperty({
            name: "--unrelated-registration",
            syntax: "<length>",
            inherits: false,
            initialValue: "0px",
        });
        internals.updateStyle();
        println(`registration change value parses: ${internals.getStyleInvalidationCounters().substitutionValueParses}`);
        println(`registration change value: ${getComputedStyle(host.lastElementChild).paddingLeft}`);

        internals.resetStyleFfiCounters();
        internals.resetStyleInvalidationCounters();
        host.firstElementChild.style.setProperty("--spacing", "9px");
        internals.updateStyle();
        println(`different environment value parses: ${internals.getStyleInvalidationCounters().substitutionValueParses}`);
        println(`changed value: ${getComputedStyle(host.firstElementChild).paddingLeft}`);
        println(`unchanged neighbour: ${getComputedStyle(host.lastElementChild).paddingLeft}`);
    });
</script>
