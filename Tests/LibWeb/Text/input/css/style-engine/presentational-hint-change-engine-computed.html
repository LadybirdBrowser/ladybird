<!DOCTYPE html>
<script src="../../include.js"></script>
<div id="target" align="left">text</div>
<font id="font" color="red">text</font>
<script>
    // A presentational hint is published where its attribute moves, so the engine computes the
    // element's new style itself.
    test(() => {
        internals.updateStyle();
        const before = internals.getStyleInvalidationCounters();
        document.getElementById("target").setAttribute("align", "right");
        document.getElementById("font").setAttribute("color", "green");
        internals.updateStyle();
        const after = internals.getStyleInvalidationCounters();
        println(`no C++ recomputation: ${after.elementStyleRecomputations - before.elementStyleRecomputations === 0}`);
        println(`text-align: ${getComputedStyle(document.getElementById("target")).textAlign}`);
        println(`color: ${getComputedStyle(document.getElementById("font")).color}`);
    });
</script>
