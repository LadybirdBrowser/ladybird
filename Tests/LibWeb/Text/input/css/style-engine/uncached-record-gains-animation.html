<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    @keyframes grow { from { height: 10px; } to { height: 20px; } }
    #target.animated { animation: grow 100s linear paused; }
</style>
<div id="target" style="--width: 10cqw; width: var(--width)"></div>
<script>
    test(() => {
        // The element's record substitutes a container unit and so stays out of every record
        // cache. A rule that gives it an animation-name still starts the animation.
        const target = document.getElementById("target");
        internals.updateStyle();
        const startRecomputations = internals.getStyleInvalidationCounters().elementStyleRecomputations;
        target.classList.add("animated");
        internals.updateStyle();
        println(`C++ recomputations: ${internals.getStyleInvalidationCounters().elementStyleRecomputations - startRecomputations}`);
        println(`animation-name: ${getComputedStyle(target).animationName}`);
        println(`animations: ${target.getAnimations().length}`);
        println(`height: ${getComputedStyle(target).height}`);
    });
</script>
