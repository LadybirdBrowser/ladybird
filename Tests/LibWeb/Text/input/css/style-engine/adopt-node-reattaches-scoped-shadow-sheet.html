<!DOCTYPE html>
<script src="../../include.js"></script>
<script>
    asyncTest(async done => {
        const iframe = document.createElement("iframe");
        const loaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
        document.body.appendChild(iframe);
        await loaded;

        const host = document.createElement("div");
        const registry = new CustomElementRegistry();
        const shadowRoot = host.attachShadow({ mode: "open", customElementRegistry: registry });
        const sheet = new CSSStyleSheet();
        sheet.replaceSync(".target { color: rgb(1, 2, 3); }");
        shadowRoot.adoptedStyleSheets = [sheet];
        shadowRoot.innerHTML = '<span class="target">target</span>';
        document.body.appendChild(host);
        internals.updateStyle();
        println(`before: ${getComputedStyle(shadowRoot.firstElementChild).color}`);

        const child = iframe.contentWindow;
        child.document.body.appendChild(child.document.adoptNode(host));
        child.internals.updateStyle();
        println(`after: ${child.getComputedStyle(shadowRoot.firstElementChild).color}`);
        done();
    });
</script>
