<!DOCTYPE html>
<style>
    .framed { border: 2px solid currentcolor; outline: 1px solid currentcolor; padding: 1em; display: block; }
    .red { color: rgb(200, 0, 0); }
    .blue { color: rgb(0, 0, 200); }
    .small { font-size: 10px; }
    .large { font-size: 30px; }
    .zoomed { zoom: 2; }
</style>
<div class="red"><span class="framed">a</span><span class="framed">b</span></div>
<div class="blue"><span class="framed">a</span><span class="framed">b</span></div>
<div class="small"><span class="framed">a</span></div>
<div class="large"><span class="framed">a</span></div>
<div class="zoomed"><span class="framed">a</span></div>
<div><span class="framed">a</span></div>

        println(`differences: ${report.differences}`);
    });
</script>
