<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    #target.changed { color: green; }
</style>
<div id="target"></div>
<script>
    test(() => {
        internals.updateStyle();
        internals.resetStyleCounters();

        for (let iteration = 0; iteration < 100; ++iteration)
            internals.updateStyle();

        println(`idle passes: ${internals.styleCounters().passes}`);

        target.className = "unnamed";
        internals.updateStyle();
        println(`unnamed class passes: ${internals.styleCounters().passes}`);

        target.className = "changed";
        internals.updateStyle();
        println(`changed passes: ${internals.styleCounters().passes}`);
        println(`changed color: ${getComputedStyle(target).color}`);

        const animation = target.animate({ opacity: [0, 1] }, 1000);
        animation.pause();
        internals.updateStyle();
        internals.resetStyleCounters();

        animation.currentTime = 500;
        internals.updateStyle();
        println(`animation passes: ${internals.styleCounters().passes}`);
        println(`animated opacity: ${getComputedStyle(target).opacity}`);
    });
</script>
