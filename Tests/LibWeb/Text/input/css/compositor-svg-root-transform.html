<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    body { margin: 0; }
    #spinner { display: block; width: 40px; height: 20px; transform-origin: 50% 50%; }
</style>
<svg id="spinner" viewBox="0 0 80 40"><path d="M0 0H80V40H0Z" fill="green" /></svg>
<script>
    function printCompositorAnimations(title) {
        println(title);
        for (const line of internals.dumpCompositorAnimations().split("\n").filter(Boolean))
            println(`  ${line}`);
    }

    asyncTest(async done => {
        internals.updateStyle();
        const timeline = internals.createInternalAnimationTimeline();
        const makeAnimation = target => {
            const animation = new Animation(new KeyframeEffect(target,
                [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }],
                { duration: 1000, iterations: Infinity }), timeline);
            animation.play();
            return animation;
        };
        const spinner = document.getElementById("spinner");
        const animation = makeAnimation(spinner);
        timeline.setTime(0);
        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);
        printCompositorAnimations("outer SVG uses compositor:");

        internals.beginStyleTrace();
        internals.beginRenderingTrace();
        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);
        const sampled = parseStyleTrace(internals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
        const pumpRequests = internals.takeRenderingTrace().split("\n").filter(line => line.startsWith("animation frame pump request"));
        println(`main-thread samples: [${sampled.map(event => event.element).join(", ")}]`);
        println(`main-thread frame requests: [${pumpRequests.join(", ")}]`);

        timeline.setTimeForObservation(250);
        const rect = spinner.getBoundingClientRect();
        println(`rotation uses CSS box center: ${Math.abs(rect.x - 10) < 0.1 && Math.abs(rect.y + 10) < 0.1 && Math.abs(rect.width - 20) < 0.1 && Math.abs(rect.height - 40) < 0.1}`);
        done();
    });
</script>
