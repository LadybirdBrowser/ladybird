<!DOCTYPE html>
<style>
    @font-face { font-family: Ahem; src: url("../wpt-import/fonts/Ahem.ttf"); }
    body { margin: 0; font: 20px/20px Ahem; }
    .s { font-size: 50px; line-height: 60px; }
    .case { position: relative; }
</style>
<div class="case" id="collapsible-space-at-wrap" style="width: 60px">xx <span class="s"></span>yy</div>
<div class="case" id="ltr-text-in-rtl-block" style="direction: rtl; width: 200px">ab <span class="s"></span>cd</div>
<div class="case" id="ltr-text-in-rtl-block-without-space" style="direction: rtl; width: 200px">ab<span class="s"></span>cd</div>
<div class="case" id="ltr-text-in-rtl-block-at-end" style="direction: rtl; width: 200px">ab cd<span class="s"></span></div>
<div class="case" id="ltr-text-in-indented-rtl-block" style="direction: rtl; width: 200px; text-indent: 20px">ab<span class="s"></span>cd</div>
<div class="case" id="ltr-text-in-indented-rtl-block-after-space" style="direction: rtl; width: 200px; text-indent: 20px">ab <span class="s"></span>cd</div>
<div class="case" id="ltr-block" style="width: 200px">ab <span class="s"></span>cd</div>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        await document.fonts.ready;
        for (const element of document.querySelectorAll(".case")) {
            const rect = element.getBoundingClientRect();
            const span = element.querySelector(".s").getBoundingClientRect();
            println(`${element.id}: ${rect.height} span at (${span.left - rect.left}, ${span.top - rect.top})`);
        }
    });
</script>
