<!DOCTYPE html>
<script src="../include.js"></script>
<div id="target" style="opacity: 0.25"></div>
<script>
    test(() => {
        const animation = target.animate({ opacity: [0, 1] }, { duration: 1000, iterations: 0, fill: "both" });
        animation.pause();
        animation.currentTime = 0;
        println(getComputedStyle(target).opacity);
    });
</script>
