<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<div id="target"></div>
<script>
    asyncTest(async done => {
        internals.updateStyle();
        target.animate({ opacity: [0.2, 0.8] }, 100000);
        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);

        internals.beginStyleTrace();
        internals.requestReentrantAnimationStyleFlushForTesting(target);
        await new Promise(requestAnimationFrame);

        const sampled = parseStyleTrace(internals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
        println(`reentrant style read queues a follow-up sample: [${sampled.map(event => event.element).join(", ")}]`);
        done();
    });
</script>
