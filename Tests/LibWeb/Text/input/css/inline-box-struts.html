<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        await document.fonts.ready;
        for (const element of document.querySelectorAll(".case")) {
            const rect = element.getBoundingClientRect();
            let line = `${element.id}: ${element.classList.contains("v") ? rect.width : rect.height}`;
            // NB: The cases that tell which line an inline box is on, or where it is on its line, print its rect.
            const span = element.querySelector("span.s");
            if (span && /wrap|close-after|open-before|two-lines|^wide/.test(element.id)) {
                const spanRect = span.getBoundingClientRect();
                line += ` span@(${spanRect.left - rect.left},${spanRect.top - rect.top} ${spanRect.width}x${spanRect.height})`;
            }
            println(line);
        }
    });
</script>
