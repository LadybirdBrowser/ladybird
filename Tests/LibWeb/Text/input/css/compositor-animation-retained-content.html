<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    @keyframes reveal-opacity {
        0%, 50% { opacity: 0; }
        100% { opacity: 1; }
    }

    @keyframes reveal-transform {
        0%, 50% { transform: scale(0); }
        100% { transform: scale(1); }
    }

    #opacity {
        background: rgb(21, 22, 23);
        animation: reveal-opacity 100s linear;
    }

    #transform {
        background: rgb(24, 25, 26);
        animation: reveal-transform 100s linear;
    }
</style>
<div id="opacity">opacity</div>
<div id="transform">transform</div>
<script>
    function compositorAnimationDump() {
        const lines = internals.dumpCompositorAnimations().split("\n").filter(Boolean);
        const animations = lines.filter(line => /^(opacity|background-color|filter|transform) /.test(line)).sort();
        return [...animations, ...lines.filter(line => !animations.includes(line))];
    }

    function printCompositorAnimations(title) {
        println(title);
        for (const line of compositorAnimationDump())
            println(`  ${line}`);
    }

    asyncTest(async done => {
        internals.updateStyle();
        const animations = document.getAnimations();
        animations.forEach(animation => animation.currentTime = 0);

        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);

        printCompositorAnimations("culled animations move immediately to compositor:");
        const displayList = internals.dumpDisplayList();
        println(`opacity-zero animation content is retained: ${displayList.includes("rgb(21, 22, 23)")}`);
        println(`singular-transform animation content is retained: ${displayList.includes("rgb(24, 25, 26)")}`);

        internals.beginStyleTrace();
        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);

        const sampled = parseStyleTrace(internals.takeStyleTrace()).filter(event => event.outcome?.startsWith("sampled"));
        println(`culled compositor animations sample: [${sampled.map(event => event.element).join(", ")}]`);
        done();
    });
</script>
