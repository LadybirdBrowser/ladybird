<!DOCTYPE html>
<script src="../include.js"></script>
<div id="target">target</div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).color;
        getComputedStyle(triggerElement).color;
        internals.updateStyle();
        internals.resetStyleCounters();
    }

    // Print whether the style engine styled at most `maximum` elements since its counters were reset, or,
    // without a bound, how many it styled.
    function verifyStyledStaysBounded(label, maximum) {
        const styled = internals.styleCounters().styledElements;
        if (maximum === undefined)
            println(`${label}, styled: ${styled}`);
        else
            println(`${label}, styled <= ${maximum}: ${styled <= maximum}`);
    }

    test(() => {
        const target = document.getElementById("target");
        settleAndReset(target);

        const inactiveStyle = document.createElement("style");
        // This sheet still contains a non-style rule that would publish broad
        // reactions if it were active, so keeping the counter at zero proves we
        // only consider effective rules after media evaluation.
        inactiveStyle.media = "print";
        inactiveStyle.textContent = "@layer B, A;";
        document.head.appendChild(inactiveStyle);

        getComputedStyle(target).color;
        verifyStyledStaysBounded("inactive media stylesheet add publishes no broad reactions", 1);

        settleAndReset(target);
        inactiveStyle.remove();

        getComputedStyle(target).color;
        verifyStyledStaysBounded("inactive media stylesheet remove publishes no broad reactions", 1);
    });
</script>
