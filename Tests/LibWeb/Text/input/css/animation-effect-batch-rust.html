<!DOCTYPE html>
<style>
    #target {
        opacity: 0.1;
        width: 0;
        color: black;
    }
</style>
<div id="target"></div>
<script src="../include.js"></script>
<script>
    test(() => {
        const animations = [
            target.animate({ opacity: [0.2, 0.4] }, 100),
            target.animate(
                [
                    { opacity: 0.1, composite: "add" },
                    { opacity: 0.3, composite: "add" },
                ],
                100
            ),
            target.animate({ width: ["10px", "30px"] }, 100),
            target.animate({ color: ["black", "white"] }, 100),
        ];
        for (const animation of animations) {
            animation.pause();
            animation.currentTime = 50;
        }

        internals.resetStyleFfiCounters();
        internals.updateStyle();
        const counters = internals.styleFfiCounters();
        const style = getComputedStyle(target);
        println(`opacity: ${style.opacity}`);
        println(`width: ${style.width}`);
        println(`color: ${style.color}`);

        println(`animation evaluations: ${counters.animationEvaluationEntries}`);
    });
</script>
