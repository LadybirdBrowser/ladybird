<!DOCTYPE html>
<style>
    #target {
        color: rgb(20, 40, 60);
        font-size: 4px;
    }
</style>
<div id="target"></div>
<script src="../include.js"></script>
<script>
    test(() => {
        internals.resetStyleFfiCounters();

        const filterAnimation = target.animate(
            {
                filter: [
                    "none",
                    "blur(calc(max(10em, 20px) / 2)) brightness(2) hue-rotate(calc(sign(10em - 20px) * 180deg)) drop-shadow(currentcolor 8px 12px 4px)",
                ],
            },
            100
        );
        filterAnimation.pause();
        filterAnimation.currentTime = 50;
        println(getComputedStyle(target).filter);
        filterAnimation.cancel();

        const backdropFilterAnimation = target.animate(
            { backdropFilter: ["blur(2px)", "blur(6px) saturate(3)"] },
            100
        );
        backdropFilterAnimation.pause();
        backdropFilterAnimation.currentTime = 50;
        println(getComputedStyle(target).backdropFilter);
        backdropFilterAnimation.cancel();

    });
</script>
