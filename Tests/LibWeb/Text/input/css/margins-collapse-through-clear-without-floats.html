<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    body { margin: 0; }
    .box { height: 20px; background: green; }
    .empty { margin-top: 8px; }
    .clear { clear: both; }
    .float { float: left; width: 50px; height: 50px; background: blue; }
</style>
<div id="noFloats">
    <div class="box"></div>
    <div class="empty clear"></div>
    <div class="empty clear"></div>
    <div class="empty clear"></div>
    <div id="afterClearNoFloats" class="box" style="margin-top: 24px"></div>
</div>
<div id="noClear">
    <div class="box"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <div id="afterNoClear" class="box" style="margin-top: 24px"></div>
</div>
<div id="withFloat">
    <div class="float"></div>
    <div class="empty clear"></div>
    <div id="afterClearance" class="box"></div>
</div>
<script>
    test(() => {
        const gap = (container, box) => box.offsetTop - container.offsetTop;
        println(`empty blocks with clear and no floats: ${gap(noFloats, afterClearNoFloats)}`);
        println(`empty blocks without clear: ${gap(noClear, afterNoClear)}`);
        println(`empty block that clears a float: ${gap(withFloat, afterClearance)}`);
    });
</script>
