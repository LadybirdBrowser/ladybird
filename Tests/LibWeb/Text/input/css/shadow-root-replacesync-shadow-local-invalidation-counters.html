<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).color;
        getComputedStyle(triggerElement).color;
        internals.resetStyleInvalidationCounters();
    }

    function verifyRecomputationsStayBounded(label, maximum) {
        const recomputations = internals.getStyleInvalidationCounters().elementStyleRecomputations;
        // The bound is what this asserts, so the bound is what it prints: recording the exact count
        // would make the expectation depend on a number no assertion here cares about.
        if (recomputations <= maximum)
            println(`PASS: ${label} (at most ${maximum} recomputations)`);
        else
            println(`FAIL: ${label} (${recomputations} recomputations, expected at most ${maximum})`);
    }

    test(() => {
        const host = document.getElementById("host");
        for (let i = 0; i < 25; ++i) {
            const lightDomBystander = document.createElement("span");
            lightDomBystander.className = "foo";
            lightDomBystander.textContent = `light bystander ${i}`;
            host.appendChild(lightDomBystander);
        }

        const shadowRoot = host.attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `<div id="shadow-target" class="foo">shadow target</div>`;
        const shadowTarget = shadowRoot.getElementById("shadow-target");

        const sheet = new CSSStyleSheet();
        shadowRoot.adoptedStyleSheets = [sheet];

        settleAndReset(shadowTarget);
        sheet.replaceSync(".foo { color: rgb(0, 128, 0); }");
        getComputedStyle(shadowTarget).color;
        verifyRecomputationsStayBounded("shadow-local replaceSync ignores matching light-DOM bystanders", 2);

        settleAndReset(shadowTarget);
        sheet.replaceSync(".foo { color: rgb(255, 0, 0); }");
        getComputedStyle(shadowTarget).color;
        verifyRecomputationsStayBounded("shadow-local replaceSync stays bounded on subsequent updates", 2);

        settleAndReset(shadowTarget);
        sheet.replaceSync("");
        getComputedStyle(shadowTarget).color;
        verifyRecomputationsStayBounded("shadow-local replaceSync clearing the sheet stays bounded", 2);
    });
</script>
