<!DOCTYPE html>
<script src="../include.js"></script>
<div id="host"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).color;
        getComputedStyle(triggerElement).color;
        internals.updateStyle();
        internals.resetStyleCounters();
    }

    // Print whether the style engine styled at most `maximum` elements since its counters were reset, or,
    // without a bound, how many it styled.
    function verifyStyledStaysBounded(label, maximum) {
        const styled = internals.styleCounters().styledElements;
        if (maximum === undefined)
            println(`${label}, styled: ${styled}`);
        else
            println(`${label}, styled <= ${maximum}: ${styled <= maximum}`);
    }

    test(() => {
        const host = document.getElementById("host");
        for (let i = 0; i < 25; ++i) {
            const lightDomBystander = document.createElement("span");
            lightDomBystander.className = "foo";
            lightDomBystander.textContent = `light bystander ${i}`;
            host.appendChild(lightDomBystander);
        }

        const shadowRoot = host.attachShadow({ mode: "open" });
        shadowRoot.innerHTML = `<div id="shadow-target" class="foo">shadow target</div>`;
        const shadowTarget = shadowRoot.getElementById("shadow-target");

        const sheet = new CSSStyleSheet();
        shadowRoot.adoptedStyleSheets = [sheet];

        settleAndReset(shadowTarget);
        sheet.replaceSync(".foo { color: rgb(0, 128, 0); }");
        getComputedStyle(shadowTarget).color;
        verifyStyledStaysBounded("shadow-local replaceSync ignores matching light-DOM bystanders", 2);

        settleAndReset(shadowTarget);
        sheet.replaceSync(".foo { color: rgb(255, 0, 0); }");
        getComputedStyle(shadowTarget).color;
        verifyStyledStaysBounded("shadow-local replaceSync stays bounded on subsequent updates", 2);

        settleAndReset(shadowTarget);
        sheet.replaceSync("");
        getComputedStyle(shadowTarget).color;
        verifyStyledStaysBounded("shadow-local replaceSync clearing the sheet stays bounded", 2);
    });
</script>
