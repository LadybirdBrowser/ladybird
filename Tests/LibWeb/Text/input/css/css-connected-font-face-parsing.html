<!DOCTYPE html>
<html>
    <style>
        @font-face {
            font-family: Ahem;
            src: url("./ahem.woff");
        }
        @font-face {
            font-family: ExplicitAuto;
            src: local(missing);
            font-weight: auto;
            font-style: auto;
            font-stretch: auto;
        }
    </style>
    <script src="../include.js"></script>
    <script>
        test(() => {
            const fontFace = Array.from(document.fonts)[0];

            println(fontFace.ascentOverride);
            println(fontFace.descentOverride);
            println(fontFace.display);
            println(fontFace.family);
            println(fontFace.featureSettings);
            println(fontFace.lineGapOverride);
            println(fontFace.stretch);
            println(fontFace.style);
            println(fontFace.unicodeRange);
            println(fontFace.weight);

            const explicit = [...document.fonts].find(face => face.family === "ExplicitAuto");
            println([explicit.weight, explicit.style, explicit.stretch].join(" "));
        });
    </script>
</html>
