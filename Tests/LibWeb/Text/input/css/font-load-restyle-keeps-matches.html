<!DOCTYPE html>
<script src="../include.js"></script>
<script src="../work-test.js"></script>
<style>
    #container > span {
        font-family: "LateFace", serif;
    }

    #container > span:nth-child(odd) {
        color: green;
    }
</style>
<div id="container"></div>
<script>
    promiseTest(async () => {
        const container = document.getElementById("container");
        for (let index = 0; index < 50; ++index)
            container.appendChild(document.createElement("span")).textContent = "x";
        internals.updateStyle();

        internals.beginStyleTrace();
        const face = new FontFace("LateFace", 'url("../../../Assets/HashSans.woff")');
        document.fonts.add(face);
        await face.load();
        internals.updateStyle();
        const trace = internals.takeStyleTrace();

        // A loaded face moves the fonts of the spans naming it, and no selector reads a font: the
        // spans are computed again from the rules they matched before.
        const events = parseStyleTrace(trace);
        const restyled = events.filter(event => event.event === "restyle");
        println(`style passes: ${events.filter(event => event.event === "pass").map(event => event.kind).join(", ")}`);
        println(`spans computed: ${restyled.filter(event => event.outcome === "computed").map(event => event.element).join(", ")}`);
        println(`spans sharing a style: ${restyled.filter(event => event.outcome === "shared").length}`);
        println(`spans whose style changed: ${restyled.filter(event => event.changed).length}`);
        println(`face loaded: ${face.status}`);
    });
</script>
