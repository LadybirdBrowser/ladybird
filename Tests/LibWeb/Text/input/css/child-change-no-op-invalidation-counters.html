<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    .plain {
        color: rgb(0, 0, 0);
    }
</style>
<div id="parent" class="plain"></div>
<script>
    function settleAndReset(triggerElement) {
        getComputedStyle(triggerElement).color;
        internals.updateStyle();
        internals.resetStyleCounters();
    }

    // Print whether the style engine styled at most `maximum` elements, the children that arrived, since
    // its counters were reset.
    function report(label, maximum) {
        const styled = internals.styleCounters().styledElements;
        println(`${label}: styled <= ${maximum}: ${styled <= maximum}`);
    }

    test(() => {
        const parent = document.getElementById("parent");

        settleAndReset(parent);
        const child = document.createElement("span");
        parent.appendChild(child);
        getComputedStyle(parent).color;
        report("appending a child to a parent without observable child-state pseudos", 1);

        settleAndReset(parent);
        parent.removeChild(child);
        getComputedStyle(parent).color;
        report("removing the only child from a parent without observable child-state pseudos", 0);

        settleAndReset(parent);
        const fragment = document.createDocumentFragment();
        fragment.appendChild(document.createElement("span"));
        fragment.appendChild(document.createElement("span"));
        parent.appendChild(fragment);
        getComputedStyle(parent).color;
        report("appending a fragment to a parent without observable child-state pseudos", 2);
    });
</script>
