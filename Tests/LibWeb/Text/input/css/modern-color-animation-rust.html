<!DOCTYPE html>
<div id="target"></div>
<script src="../include.js"></script>
<script>
    function sample(from, to) {
        const animation = target.animate(
            { backgroundColor: [from, to] },
            100
        );
        animation.pause();
        animation.currentTime = 50;
        println(getComputedStyle(target).backgroundColor);
        animation.cancel();
    }

    test(() => {
        internals.resetStyleFfiCounters();
        sample("color(srgb 0 0 0)", "color(srgb 1 1 1)");
        sample("oklab(none 0.2 0.3)", "oklab(0.5 0.6 0.7)");
        sample("oklab(none 0.2 0.3 / none)", "oklab(none 0.6 0.7 / none)");
        sample("oklch(0.2 none none)", "oklab(0.6 0.2 0.4)");
    });
</script>
