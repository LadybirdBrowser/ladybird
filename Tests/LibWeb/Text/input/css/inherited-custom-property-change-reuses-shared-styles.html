<!DOCTYPE html>
<style>
    #outer {
        --theme: 1px;
    }

    .child {
        --own: 2px;
        margin-left: var(--own);
    }
</style>
<div id="outer"></div>
<script src="../include.js"></script>
<script>
    test(() => {
        const outer = document.getElementById("outer");
        for (let i = 0; i < 20; i++) {
            const child = document.createElement("div");
            child.className = "child";
            child.textContent = "child";
            outer.append(child);
        }
        getComputedStyle(outer.lastChild).marginLeft;
        const before = internals.styleEngineCounters();
        outer.style.setProperty("--theme", "2px");
        println("margin after change: " + getComputedStyle(outer.lastChild).marginLeft);
        println("every child keeps its own margin: " + [...outer.children].every(child => getComputedStyle(child).marginLeft === "2px"));
        const after = internals.styleEngineCounters();
        const shared = (after.engineComputedRecordSharedHits ?? 0) + (after.engineComputedRecordCohortHits ?? 0)
            - (before.engineComputedRecordSharedHits ?? 0) - (before.engineComputedRecordCohortHits ?? 0);
        println("children reuse a shared style: " + (shared >= outer.children.length - 1));
    });
</script>
