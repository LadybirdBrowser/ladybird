<!DOCTYPE html>
<style>
    #decorationInheritor {
        text-decoration-line: inherit;
    }
    #transformInheritor {
        transform: inherit;
    }
</style>
<div id="plainContainer">
    <div><span>a</span></div>
    <div><span>b</span></div>
</div>
<div id="decorationContainer">
    <div id="decorationInheritor"><span>c</span></div>
</div>
<div id="transformContainer">
    <div id="transformInheritor"><span>d</span></div>
</div>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const keyframes = [{ transform: "translateY(0)" }, { transform: "translateY(-100px)" }];

        // What the style engine styled for an animation update of `container`, which composes the animated
        // values over the record of the container itself without restyling it.
        async function styledDuringAnimationUpdate(container) {
            const animation = container.animate(keyframes, { duration: 1000 });
            animation.pause();
            animation.currentTime = 250;
            await animation.ready;
            await animationFrame();
            internals.updateStyle();
            internals.resetStyleCounters();
            animation.currentTime = 500;
            getComputedStyle(container).transform;
            const styled = { count: internals.styleCounters().styledElements, elements: internals.styleLastPass().styled };
            animation.cancel();
            return styled;
        }

        println(`plain descendants styled <= 0: ${(await styledDuringAnimationUpdate(plainContainer)).count <= 0}`);
        // FIXME: This should style nothing, as the inheritor inherits text-decoration-line, which the
        //     animation does not move, but the style engine restyles an element inheriting a property explicitly
        //     whenever its parent's record changes, whichever properties change.
        println(`text-decoration-line inheritor styled: ${(await styledDuringAnimationUpdate(decorationContainer)).count}`);
        const transformStyled = await styledDuringAnimationUpdate(transformContainer);
        println(`transform inheritor restyled: ${transformStyled.elements.includes("transformInheritor")}`);
    });
</script>
