<!doctype html><meta charset="utf-8" /><style>
    @font-face {
        font-family: Ahem;
        src: url("../../../Ref/data/fonts/Ahem.ttf");
    }
    body {
        margin: 0;
    }
    .flex {
        display: flex;
        flex-direction: column;
        align-items: baseline;
        width: 200px;
        height: 300px;
        font: 20px/1 Ahem;
    }
    .flex > div {
        flex: none;
        width: 30px;
        height: 20px;
    }
</style>
<body>
    <script src="../include.js"></script>
    <script>
        const cases = [];
        const h = [{ style: "height:20px" }, { style: "height:50px" }];
        const widths = [{ style: "width:30px;height:20px" }, { style: "width:70px;height:50px" }];
        const edges = [
            { style: "width:30px;height:20px;margin:3px 7px 9px 11px;border:3px solid;padding:5px" },
            { style: "width:70px;height:50px;margin:13px 17px 19px 23px;border:7px solid;padding:11px" },
        ];
        const vertical = wm => [
            { style: `writing-mode:${wm};width:60px;height:90px;font-size:30px`, text: "XX<br>XX" },
            { style: `writing-mode:${wm};width:40px;height:90px;font-size:20px`, text: "XX<br>XX" },
        ];
        const mixed = [...vertical("vertical-rl"), { style: "width:40px;height:40px" }, ...vertical("vertical-lr")];
        const add = (name, style, items) => cases.push({ name, style, items });
        for (const wm of ["vertical-rl", "vertical-lr", "sideways-rl", "sideways-lr"]) {
            add(wm + " text", "", vertical(wm));
            add(
                wm + " sideways text",
                "",
                vertical(wm).map(i => ({ ...i, style: i.style + ";text-orientation:sideways" }))
            );
            for (const align of ["baseline", "last baseline"]) {
                add(wm + " overflow " + align, `align-items:${align}`, [
                    { style: `writing-mode:${wm};width:100px;height:90px;overflow:hidden`, text: "XX<br>XX" },
                    { style: `writing-mode:${wm};width:100px;height:90px`, text: "XX<br>XX" },
                ]);
                add(wm + " small overflow " + align, `align-items:${align}`, [
                    { style: `writing-mode:${wm};width:10px;height:90px;overflow:hidden`, text: "XX<br>XX" },
                    { style: `writing-mode:${wm};width:100px;height:90px`, text: "XX<br>XX" },
                ]);
            }
            for (const va of ["baseline", "middle", "text-top", "text-bottom", "top", "bottom"])
                add(wm + " atomic " + va, "", [
                    {
                        style: `writing-mode:${wm};width:auto;height:90px`,
                        text: `<span style="display:inline-block;width:10px;height:30px;vertical-align:${va}"></span>`,
                    },
                    { style: `writing-mode:${wm};width:auto;height:90px`, text: "XX" },
                ]);
        }
        for (const wm of ["vertical-rl", "vertical-lr"]) {
            for (const orientation of ["mixed", "sideways"]) {
                add(wm + " mixed orientations " + orientation, "", [
                    {
                        style: `writing-mode:${wm};width:auto;height:180px;text-orientation:${orientation}`,
                        text: 'X<span style="text-orientation:sideways">X</span><span style="text-orientation:mixed">X</span>',
                    },
                    {
                        style: `writing-mode:${wm};width:auto;height:180px;text-orientation:${orientation}`,
                        text: "XXX",
                    },
                ]);
            }
        }
        for (const wm of ["vertical-rl", "vertical-lr"]) {
            for (const display of ["flex", "grid"]) {
                add(wm + " empty first " + display, "", [
                    {
                        style: `writing-mode:${wm};width:auto;height:90px;display:${display};align-items:baseline;grid-auto-flow:column`,
                        text: '<div style="width:10px;height:20px"></div><div>XX</div>',
                    },
                    { style: `writing-mode:${wm};width:auto;height:90px`, text: "XX" },
                ]);
            }
        }
        for (const va of ["baseline", "middle", "text-top", "text-bottom", "top", "bottom"])
            add("vertical-lr sideways atomic " + va, "", [
                {
                    style: "writing-mode:vertical-lr;text-orientation:sideways;width:auto;height:90px",
                    text: `<span style="display:inline-block;width:10px;height:30px;vertical-align:${va}"></span>`,
                },
                { style: "writing-mode:vertical-lr;text-orientation:sideways;width:auto;height:90px", text: "XX" },
            ]);
        for (const wm of ["vertical-rl", "vertical-lr"])
            for (const va of ["6px", "-6px"])
                add(wm + " shifted " + va, "", [
                    {
                        style: `writing-mode:${wm};width:auto;height:90px`,
                        text: `X<span style="vertical-align:${va}">X</span>X`,
                    },
                    { style: `writing-mode:${wm};width:auto;height:90px`, text: "XXX" },
                ]);
        const elements = [];
        for (const { name, style, items } of cases) {
            const flex = document.createElement("div");
            flex.className = "flex";
            flex.style.cssText = style;
            for (const item of items) {
                const child = document.createElement("div");
                child.style.cssText = item.style;
                child.innerHTML = item.text || "";
                flex.append(child);
            }
            document.body.append(flex);
            elements.push({ name, flex });
        }

        const exportRow = document.createElement("div");
        exportRow.style = "display:flex;align-items:baseline;font:20px/1 Ahem";
        exportRow.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:flex-start"><div>XX</div><div style="font-size:50px;align-self:last baseline">XX</div></div><div style="font-size:40px">XX</div>';
        document.body.append(exportRow);
        promiseTest(async () => {
            await document.fonts.load("20px Ahem");
            await document.fonts.load("30px Ahem");
            await document.fonts.ready;
            for (const { name, flex } of elements) {
                const r = flex.getBoundingClientRect();
                const positions = Array.from(flex.children, e => {
                    const c = e.getBoundingClientRect();
                    return [c.x - r.x, c.y - r.y, c.width, c.height].map(v => Math.round(v * 1000) / 1000);
                });
                println(name + ": " + positions.map(row => row.join(",")).join("; "));
            }

            const rowRect = exportRow.getBoundingClientRect();
            const offsets = Array.from(exportRow.children, e => e.getBoundingClientRect().y - rowRect.y);
            println("exported baseline: " + offsets.join(","));
        });
    </script>
</body>
