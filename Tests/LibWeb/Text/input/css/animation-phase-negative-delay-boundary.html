<!DOCTYPE html>
<script src="../include.js"></script>
<div id="target"></div>
<script>
    test(() => {
        const animation = target.animate(
            { opacity: [0, 1] },
            { delay: -1000, duration: 1000, iterations: 3, direction: "alternate", fill: "both" },
        );
        animation.pause();
        animation.currentTime = 0;
        println(getComputedStyle(target).opacity);
    });
</script>
