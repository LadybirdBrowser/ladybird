<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    @keyframes move {
        from { transform: translateX(0px); }
        to { transform: translateX(100px); }
    }

    #target {
        animation: move 100s linear infinite;
        visibility: hidden;
    }
</style>
<div id="target"></div>
<script>
    function printTimelineEvents(title) {
        println(title);
        for (const line of internals.takeRenderingTrace().split("\n")) {
            if (line.startsWith("animation timeline"))
                println(`  ${line}`);
        }
    }

    asyncTest(async done => {
        for (let i = 0; i < 4; ++i)
            await new Promise(requestAnimationFrame);

        await new Promise(resolve => setTimeout(resolve, 0));
        internals.beginRenderingTrace();

        const animation = document.getAnimations()[0];
        animation.effect.getComputedTiming();
        animation.playState;
        animation.finished;
        document.timeline.currentTime;
        animation.currentTime;
        document.timeline.currentTime;
        printTimelineEvents("getters in one task:");

        internals.beginRenderingTrace();
        await new Promise(resolve => setTimeout(resolve, 0));
        animation.currentTime;
        printTimelineEvents("getter in the next task:");
        done();
    });
</script>
