<!doctype html>
<body>
<script src="../../include.js"></script>
<script>
    // The style memory a frame's document holds, by owner: the reports of blank same-origin iframes, each of whose
    // documents has an engine of its own. The mean over the second and third frame is what one more frame adds.
    // NB: A document's report counts what its engine shares with the other engines of the process, such as the user
    //     agent rules, as its own.
    function frameLoaded(iframe) {
        return new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
    }

    function report(iframe) {
        iframe.contentDocument.body.offsetWidth;
        return iframe.contentWindow.internals.styleMemoryReport();
    }

    // Bytes per document each owner may hold, which a change that grows an owner past has to raise.
    const budgets = {
        initial: 6216,
        ruleStore: 1216,
        ruleIndex: 1520,
        // NB: The user agent rules' index, which the engines of the process share and each document's report counts.
        userAgentIndex: 149568,
        sharedDeclarations: 14592,
        invalidation: 904,
        records: 1552,
        payloads: 7120,
        groupValueFacts: 672,
        retainedSlots: 540,
        recordCells: 112,
        installed: 1320,
        projection: 5408,
        hostTree: 4672,
        elementDeclarations: 16,
        heldRecordMaps: 1168,
        layoutStyleColumns: 104,
        otherMaps: 88,
        styleValues: 3632,
        // NB: The resolution of the initial font.
        fontResolutions: 712,
        // NB: The slots of the scratch each style thread keeps, of which only the calling thread's is made here, and
        //     the first chunk of restyle hints with its group.
        liveScratch: 1936,
        // NB: The host's memo of the record views it read, which grows with the views it is told.
        hostMemo: 256,
        cppInstalledStyles: 24,
    };

    // NB: What a transaction in flight holds of earlier generations, and the groups the style threads keep for the
    //     next pass, depend on when the report runs and on which threads styled what last.
    const transientOwners = ["projectionGenerations", "workerCaches"];

    asyncTest(async done => {
        const frames = [];
        for (let index = 0; index < 3; ++index) {
            const iframe = document.createElement("iframe");
            iframe.srcdoc = "<!doctype html><body>";
            const loaded = frameLoaded(iframe);
            document.body.appendChild(iframe);
            await loaded;
            frames.push(iframe);
        }
        const reports = frames.map(report);
        for (const owner in reports[1].owners) {
            if (transientOwners.includes(owner))
                continue;
            const bytes = (reports[1].owners[owner] + reports[2].owners[owner]) / 2;
            const budget = budgets[owner] ?? 0;
            println(`${owner}: ${bytes <= budget ? "within" : `OVER (${bytes.toFixed(0)})`} ${budget}`);
        }
        done();
    });
</script>
