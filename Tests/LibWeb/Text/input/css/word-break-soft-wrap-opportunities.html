<!doctype html>
<script src="../include.js"></script>
<style>
    @font-face {
        font-family: Ahem;
        src: url("../../../Ref/data/fonts/Ahem.ttf");
    }
    #text {
        font: 20px/20px Ahem;
        width: 0;
    }
</style>
<div id="text"></div>
<script>
    promiseTest(async () => {
        await document.fonts.load("20px Ahem");
        const text = document.getElementById("text");
        for (const [wordBreak, content] of [
            ["break-all", "\u1019\u102c\u1005\u102c"],
        ]) {
            text.style.wordBreak = wordBreak;
            text.textContent = content;
            let result = "";
            let previousCenter = null;
            for (let i = 0; i < content.length; ++i) {
                const range = document.createRange();
                range.setStart(text.firstChild, i);
                range.setEnd(text.firstChild, i + 1);
                // A range that starts at a line break can also cover the end of the line before it.
                const rects = range.getClientRects();
                const rect = rects[rects.length - 1];
                const center = rect.top + rect.height / 2;
                if (previousCenter !== null && Math.abs(center - previousCenter) > 10)
                    result += "|";
                previousCenter = center;
                result += content[i];
            }
            println(`${wordBreak} ${JSON.stringify(content)}: ${JSON.stringify(result)}`);
        }
    });
</script>
