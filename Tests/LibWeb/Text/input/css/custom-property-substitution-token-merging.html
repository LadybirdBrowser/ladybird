<!DOCTYPE html>
<script src="../include.js"></script>
<style>
@property --registered {
    syntax: "<color>";
    inherits: false;
    initial-value: red;
}
@property --universal {
    syntax: "*";
    inherits: false;
}
#a { --green: 128; --registered: rgb(0 var(--green)0); }
#b { --green: 128; --universal: rgb(0 var(--green)0); background-color: var(--universal); }
#c { --number: 12; --in-function: foo(var(--number)0); }
#d { --number: 12; --in-paren-block: (var(--number)0); }
#e { --number: 12; --in-square-block: [var(--number)0]; }
#f { --ident: gre; --idents-in-function: foo(var(--ident)en); }
</style>
<div id="a"></div>
<div id="b"></div>
<div id="c"></div>
<div id="d"></div>
<div id="e"></div>
<div id="f"></div>
<script>
    test(() => {
        const computedValue = (id, property) => getComputedStyle(document.getElementById(id)).getPropertyValue(property);
        println(computedValue("a", "--registered"));
        println(computedValue("b", "background-color"));
        println(computedValue("c", "--in-function"));
        println(computedValue("d", "--in-paren-block"));
        println(computedValue("e", "--in-square-block"));
        println(computedValue("f", "--idents-in-function"));
    });
</script>
