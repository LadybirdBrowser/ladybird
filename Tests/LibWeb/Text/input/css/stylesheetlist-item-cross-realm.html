<script>
    asyncTest(done => {
        const frame = document.createElement("iframe");
        frame.onload = () => {
            const styleSheets = document.styleSheets;
            const fromFrame = frame.contentWindow.Function("styleSheets", "return styleSheets.item(0);")(styleSheets);
            const fromParent = styleSheets.item(0);
            println(`parent-prototype=${Object.getPrototypeOf(fromFrame) === CSSStyleSheet.prototype}`);
            println(`same=${fromFrame === fromParent}`);
            done();
        };
        document.body.append(frame);
    });
</script>
