<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    .grid {
        display: grid;
        width: 200px;
    }
    .subgrid {
        display: grid;
        writing-mode: vertical-rl;
    }
</style>
<!-- The vertical subgrid's columns run vertically, so they subgrid the parent's rows. -->
<div class="grid" style="grid-template-columns: 100px; grid-template-rows: auto auto;">
    <div class="subgrid" style="grid-row: 1 / 3; grid-template-columns: subgrid;">
        <div id="a1" style="height: 30px;"></div>
        <div id="a2" style="height: 70px;"></div>
    </div>
</div>
<!-- The vertical subgrid's rows run horizontally, so they subgrid the parent's columns. -->
<div class="grid" style="grid-template-columns: auto auto; justify-content: start;">
    <div class="subgrid" style="grid-column: 1 / 3; grid-template-rows: subgrid;">
        <div id="b1" style="width: 30px;"></div>
        <div id="b2" style="width: 70px;"></div>
    </div>
</div>
<script src="../include.js"></script>
<script>
    test(() => {
        for (const id of ["a1", "a2", "b1", "b2"]) {
            const rect = document.getElementById(id).getBoundingClientRect();
            println(`${id}: x=${rect.x} y=${rect.y} width=${rect.width} height=${rect.height}`);
        }
    });
</script>
