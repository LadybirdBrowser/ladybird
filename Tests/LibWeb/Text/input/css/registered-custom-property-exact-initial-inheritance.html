<!doctype html>
<style>
    @property --tiny {
        syntax: "<number>";
        inherits: true;
        initial-value: 0.0000001;
    }

    #child {
        width: calc(var(--tiny) * 10000000px);
    }
</style>
<div id="parent">
    <div id="child"></div>
</div>
<script src="../include.js"></script>
<script>
    test(() => {
        println(getComputedStyle(document.getElementById("child")).width);
    });
</script>
