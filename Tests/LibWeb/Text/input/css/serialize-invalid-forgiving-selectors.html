<!DOCTYPE html>
<style id="style"></style>
<script src="../include.js"></script>
<script>
    test(() => {
        const selectors = [
            ":is(hello, !?)",
            ":is(what, :fake(:imaginary), really)",
        ];
        let stylesheet = document.styleSheets[0];
        for (let selector of selectors) {
            stylesheet.insertRule(`${selector} { }`);
            println(`${selector} -> ${stylesheet.cssRules[0].selectorText}`);
            stylesheet.deleteRule(0);
        }

        const whitespaceCases = [
            ["spaces", ":is(  :fake(:imaginary)  ,.x)"],
            ["tabs", ":is(\t:fake(:imaginary)\t,.x)"],
            ["newlines", ":is(\n:fake(:imaginary)\n,.x)"],
            ["comments", ":is(/* leading */:fake(:imaginary)/* trailing */,.x)"],
            ["mixed whitespace", ":where( \t/* before */\n!?/* after */\t , .x)"],
            ["only whitespace and comments", ":is( \t/* only */\n, .x)"],
        ];
        for (const [description, selector] of whitespaceCases) {
            stylesheet.insertRule(`${selector} { }`);
            println(`${description} -> ${JSON.stringify(stylesheet.cssRules[0].selectorText)}`);
            stylesheet.deleteRule(0);
        }
    });
</script>
