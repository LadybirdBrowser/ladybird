<!doctype html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const source = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' height='60' viewBox='0 0 2 1'%3E%3C/svg%3E";
        for (const [label, containerStyle, imageStyle] of [
            ["inline-block", "display:inline-block", ""],
            ["column-flex", "display:inline-flex;flex-direction:column;align-items:start", ""],
            ["max-content-grid", "display:grid;width:max-content;grid-template-columns:max-content", ""],
            ["column smaller minimum", "display:inline-flex;flex-direction:column;align-items:start", "min-width:40px"],
            ["column larger minimum", "display:inline-flex;flex-direction:column;align-items:start", "min-width:200px"],
            ["column block minimum", "display:inline-flex;flex-direction:column;align-items:start", "min-height:80px"],
            ["grid block minimum", "display:grid;width:max-content;grid-template-columns:max-content", "min-height:80px"],
            ["smaller minimum", "display:inline-block", "min-width:40px"],
            ["larger minimum", "display:inline-block", "min-width:200px"],
            ["block minimum", "display:inline-block", "min-height:80px"],
            ["maximum", "display:inline-block", "max-width:80px"],
            ["preferred ratio", "display:inline-block", "aspect-ratio:3"],
            ["definite space", "width:200px", "width:fit-content"],
            ["small definite space", "width:80px", "width:fit-content"],
        ]) {
            const container = document.body.appendChild(document.createElement("div"));
            container.style.cssText = containerStyle;
            const image = container.appendChild(document.createElement("img"));
            image.style.cssText = imageStyle;
            image.src = source;
            await image.decode();
            const rect = image.getBoundingClientRect();
            println(`${label}: container ${container.getBoundingClientRect().width}, image ${rect.width}x${rect.height}`);
            container.remove();
        }
        done();
    });
</script>
