<p style="line-height: 30px"><span id="span">Text in the font</span></p>
<div id="lines">Two lines of text in the font</div>
<script>
    asyncTest(async done => {
        await document.fonts.ready;
        // A font whose hhea table gives no ascent or descent takes them from its OS/2 table.
        println(`span height: ${Math.round(span.getBoundingClientRect().height)}`);
        // With line-height: normal, each line is as tall as the ascent and descent, so the two lines don't overlap.
        const lineHeight = Math.round(span.getBoundingClientRect().height);
        const linesHeight = Math.round(lines.getBoundingClientRect().height);
        println(`two lines with line-height: normal take up two lines: ${lineHeight > 0 && linesHeight >= 2 * lineHeight}`);
        done();
    });
</script>
