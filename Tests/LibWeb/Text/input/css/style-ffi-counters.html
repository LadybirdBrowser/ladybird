<!DOCTYPE html>
<style>
    #pseudo-target::before {
        content: "pseudo";
        color: rgb(12, 34, 56);
    }

    .retained-winner {
        border-left-style: solid;
        border-left-width: 3px;
    }

    .retained-winner.changed {
        border-left-width: 7px;
    }

    @keyframes measured-animation {
        from { color: rgb(0, 0, 0); opacity: 0.2; }
        to { color: rgb(255, 255, 255); opacity: 0.8; }
    }
</style>
<script src="../include.js"></script>
<script>
    test(() => {
        internals.updateStyle();
        internals.resetStyleFfiCounters();
        const afterReset = internals.styleFfiCounters();
        const keys = Object.keys(afterReset);
        println(`has counters: ${keys.length > 0}`);
        println(`all zero after reset: ${keys.every(key => afterReset[key] === 0)}`);
        println(`fallback properties empty after reset: ${internals.styleCppLonghandFallbacks().length === 0}`);

        const phaseCounters = [
            "completeStyleUpdateTransactionCallbacks",
            "completeStyleUpdateFlatTreeCallbacks",
            "completeStyleUpdateCascadeCallbacks",
            "completeStyleUpdateLonghandCallbacks",
            "completeStyleUpdateAnimationCallbacks",
            "completeStyleUpdateShorthandCallbacks",
        ];
        println(`has complete-update aggregates: ${
            "completeStyleUpdateCppCallbacks" in afterReset
            && "completeStyleUpdateSemanticCppCallbacks" in afterReset
            && "completeStyleUpdateOwnershipCppCallbacks" in afterReset
        }`);
        println(`has complete-update phase counters: ${phaseCounters.every(name => name in afterReset)}`);

        function measureUpdate(label, mutation) {
            internals.updateStyle();
            internals.resetStyleFfiCounters();
            mutation();
            internals.updateStyle();
            const counters = internals.styleFfiCounters();
            println(`${label} measured semantic callbacks: ${counters.completeStyleUpdateSemanticCppCallbacks > 0}`);
            println(`${label} kept ownership separate: ${
                counters.completeStyleUpdateCppCallbacks
                    === counters.completeStyleUpdateSemanticCppCallbacks
                        + counters.completeStyleUpdateOwnershipCppCallbacks
            }`);
            return counters;
        }

        const simple = document.createElement("div");
        const simpleCounters = measureUpdate("simple element", () => {
            simple.style.color = "green";
            document.body.appendChild(simple);
        });
        println(`transaction returned without callbacks: ${simpleCounters.completeStyleUpdateTransactionCallbacks === 0}`);
        println(`longhand computation measured: ${simpleCounters.completeStyleUpdateLonghandCallbacks > 0}`);
        println(`computed build stayed in Rust: ${simpleCounters.computedStyleBuildCppCallbacks === 0}`);
        const fallbackProperties = internals.styleCppLonghandFallbacks();
        println(`fallback property IDs recorded: ${fallbackProperties.length > 0}`);
        println(`fallback property IDs sorted: ${fallbackProperties.every((property, index) => index === 0 || fallbackProperties[index - 1] < property)}`);

        const inheritanceParent = document.createElement("div");
        const inheritanceChild = document.createElement("span");
        inheritanceParent.appendChild(inheritanceChild);
        document.body.appendChild(inheritanceParent);
        internals.updateStyle();
        measureUpdate("inherited partial restyle", () => {
            inheritanceParent.style.color = "blue";
        });

        const pseudoTarget = document.createElement("div");
        pseudoTarget.id = "pseudo-target";
        measureUpdate("pseudo-element", () => {
            document.body.appendChild(pseudoTarget);
        });

        CSS.registerProperty({
            name: "--measured-length",
            syntax: "<length>",
            inherits: false,
            initialValue: "1px",
        });
        const variables = document.createElement("div");
        const customPropertyCounters = measureUpdate("custom properties", () => {
            variables.style.cssText = `
                --unregistered-length: 5px;
                --measured-length: 7px;
                width: var(--unregistered-length);
                height: var(--measured-length);
            `;
            document.body.appendChild(variables);
        });
        println(`cascade callbacks measured: ${customPropertyCounters.completeStyleUpdateCascadeCallbacks > 0}`);

        const relativeLengths = document.createElement("div");
        measureUpdate("font and viewport lengths", () => {
            relativeLengths.style.cssText = "font-size: 2em; width: 10vw; min-height: 1rem";
            document.body.appendChild(relativeLengths);
        });

        const animated = document.createElement("div");
        animated.style.cssText = `
            animation: measured-animation 10s linear -5s paused;
            color: rgb(10, 20, 30);
            transition: color 10s linear, width 10s linear;
            width: 10px;
        `;
        animated.appendChild(document.createElement("span"));
        document.body.appendChild(animated);
        internals.updateStyle();
        const cssAnimation = animated.getAnimations()[0];
        const animationCounters = measureUpdate("animations and transitions", () => {
            cssAnimation.currentTime = 7500;
            animated.style.color = "rgb(30, 20, 10)";
            animated.style.width = "20px";
        });
        println(`animation computation measured: ${animationCounters.completeStyleUpdateAnimationCallbacks > 0}`);
        println(`flat-tree descendants returned without callbacks: ${animationCounters.completeStyleUpdateFlatTreeCallbacks === 0}`);

        const resourceBacked = document.createElement("div");
        measureUpdate("resource-backed value", () => {
            resourceBacked.style.backgroundImage = `url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>")`;
            document.body.appendChild(resourceBacked);
        });

        const retainedWinner = document.createElement("div");
        retainedWinner.className = "retained-winner";
        document.body.appendChild(retainedWinner);
        internals.updateStyle();
        const retainedCounters = measureUpdate("retained cascade winner", () => {
            retainedWinner.classList.add("changed");
        });
        println(`retained source-slot assignments returned without callbacks: ${
            !("retainedCascadeSourceSlotCallbacks" in retainedCounters)
            && getComputedStyle(retainedWinner).borderLeftWidth === "7px"
        }`);
    });
</script>
