<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="../../work-test.js"></script>
<script>
    function addBystanders(parent, count) {
        for (let i = 0; i < count; ++i) {
            const bystander = document.createElement("div");
            bystander.className = "bystander";
            bystander.textContent = `bystander ${i}`;
            parent.appendChild(bystander);
        }
    }

    test(() => {
        const style = document.createElement("style");
        style.textContent = `
            #container {
                container-type: size;
                width: 100px;
                height: 20px;
            }

            .bystander {
                color: rgb(0, 0, 0);
            }

            @container (min-width: 200px) {
                #target {
                    color: rgb(0, 128, 0);
                }
            }
        `;
        document.head.appendChild(style);

        const container = document.createElement("main");
        container.id = "container";
        document.body.appendChild(container);

        const target = document.createElement("div");
        target.id = "target";
        target.textContent = "target";
        container.appendChild(target);

        addBystanders(container, 30);
        addBystanders(document.body, 30);

        const readWork = mutate => styleWork(() => {
            mutate();
            getComputedStyle(target).color;
        }, internals, { flush: false });
        const names = elements => `[${elements.map(shortStyleName).join(", ")}]`;
        const unchanged = work => work.restyled().filter(element => !work.changed().includes(element));

        // styleWork() settles everything the page setup left pending before measuring, or what this
        // traces would depend on how much of that was still outstanding when the first read arrived.
        const initialWork = readWork(() => {});
        println(`initial target color: ${getComputedStyle(target).color}`);
        println(`initial read restyled: ${names(initialWork.restyled())}`);

        const dynamicWork = readWork(() => container.style.width = "300px");
        println(`dynamic target color: ${getComputedStyle(target).color}`);
        println(`dynamic read restyled: ${names(dynamicWork.restyled())}`);
        println(`dynamic read restyled without change: ${names(unchanged(dynamicWork))}`);
    });
</script>
