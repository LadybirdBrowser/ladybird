<!DOCTYPE html>
<meta charset="utf-8">
<script src="../../include.js"></script>
<script src="../../work-test.js"></script>
<div id="fancy" style="font-family: FancyFamily; font-variant-alternates: styleset(fancy)">fancy</div>
<script>
    function addBystanders(parent, count) {
        for (let i = 0; i < count; ++i) {
            const bystander = document.createElement("div");
            bystander.textContent = `bystander ${i}`;
            parent.appendChild(bystander);
        }
    }

    function addSheet(text) {
        const style = document.createElement("style");
        style.textContent = text;
        document.head.appendChild(style);
        return style;
    }

    function dumpWork(label, mutate) {
        const work = styleWork(mutate);
        const fullPass = work.passes().includes("FULL") ? " (full pass)" : "";
        println(`${label}: restyled [${work.restyled().map(shortStyleName).join(", ")}]${fullPass}`);
    }

    test(() => {
        addBystanders(document.body, 25);

        // Feature values for a family nobody uses restyle nothing, not even the arriving style element.
        dumpWork("@font-feature-values nobody uses", () => addSheet(`@font-feature-values UnusedFamily { @styleset { fancy: 1; } }`));

        // Feature values restyle the elements whose fonts name their family.
        let sheet;
        dumpWork("@font-feature-values one element uses", () => {
            sheet = addSheet(`@font-feature-values FancyFamily { @styleset { fancy: 2; } }`);
        });

        dumpWork("@font-feature-values removed", () => sheet.remove());
    });
</script>
