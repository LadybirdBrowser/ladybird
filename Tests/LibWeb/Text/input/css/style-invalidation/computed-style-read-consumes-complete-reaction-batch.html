<!DOCTYPE html>
<script src="../../include.js"></script>
<style>
    .context .target {
        color: rgb(12, 34, 56);
    }

    .unrelated {
        color: rgb(65, 43, 21);
    }
</style>
<div id="unrelated"></div>
<div class="context">
    <div><span class="target">target</span></div>
</div>
<script>
    test(() => {
        const unrelated = document.getElementById("unrelated");
        for (let i = 0; i < 100; ++i) {
            const child = document.createElement("span");
            child.className = "unrelated";
            unrelated.appendChild(child);
        }

        // A new element's style is either recomputed by C++ or derived as a record by the style engine.
        const styledElements = () => internals.getStyleInvalidationCounters().elementStyleRecomputations
            + (internals.styleEngineCounters().engineComputedRecordDeltas ?? 0);
        internals.resetStyleInvalidationCounters();
        const styledElementsBeforeRead = styledElements();
        println(`target color: ${getComputedStyle(document.querySelector(".target")).color}`);
        const styledElementsAfterTargetRead = styledElements();
        println(`unrelated color: ${getComputedStyle(unrelated.firstChild).color}`);
        const styledElementsAfterUnrelatedRead = styledElements();
        const completeBatchWasConsumed = styledElementsAfterTargetRead - styledElementsBeforeRead >= 100
            && styledElementsAfterUnrelatedRead === styledElementsAfterTargetRead;
        println(`PASS: the first style read consumed the complete reaction batch: ${completeBatchWasConsumed}`);
    });
</script>
