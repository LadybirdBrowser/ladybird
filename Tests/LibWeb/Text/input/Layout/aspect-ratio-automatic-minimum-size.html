<script>
    // The automatic minimum size in the ratio-dependent axis of a non-replaced box that is not a scroll container is its
    // min-content size, capped by its maximum size.
    asyncTest(async done => {
        await document.fonts.load("10px Ahem");
        for (const box of document.querySelectorAll("#host [id]")) {
            const rect = box.getBoundingClientRect();
            println(`${box.id}: ${rect.width}x${rect.height}`);
        }
        done();
    });
</script>
