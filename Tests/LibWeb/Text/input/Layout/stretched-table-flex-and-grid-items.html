<script>
    // The width and height of a display: table flex or grid item apply to the table box, which a stretched item
    // stretches along with its wrapper.
    asyncTest(async done => {
        await document.fonts.load("10px Ahem");
        for (const container of document.querySelectorAll("#host > div")) {
            const table = container.firstElementChild.getBoundingClientRect();
            const cell = container.querySelector("[style*=table-cell]");
            const cellText = cell ? ` cell y=${cell.getBoundingClientRect().y - table.y} h=${cell.getBoundingClientRect().height}` : "";
            println(`${container.id}: table ${table.width}x${table.height}${cellText}`);
        }
        done();
    });
</script>
