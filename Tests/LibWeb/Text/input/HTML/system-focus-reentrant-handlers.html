<!doctype html>
<script src="../include.js"></script>
<input id="original" />
<input id="redirected" />
<iframe id="frame"></iframe>
<script>
    test(() => {
        const originalInput = document.getElementById("original");
        const redirectedInput = document.getElementById("redirected");
        const frame = document.getElementById("frame");
        const events = [];
        for (const type of ["focus", "focusin"])
            document.addEventListener(type, event => events.push(`${event.target.id}.${type}`), true);
        for (const type of ["blur", "focus"]) {
            window.addEventListener(type, () => events.push(`window.${type}`));
            frame.contentWindow.addEventListener(type, () => events.push(`iframe window.${type}`));
        }

        originalInput.focus();
        events.length = 0;
        window.addEventListener("blur", () => internals.setPageFocus(true), { once: true });
        internals.setPageFocus(false);
        println(
            `Window blur handler restores system focus: ${events.splice(0).join(", ")}; original input still active=${document.activeElement === originalInput}; document.hasFocus()=${document.hasFocus()}`
        );

        internals.setPageFocus(false);
        events.length = 0;
        window.addEventListener("focus", () => redirectedInput.focus(), { once: true });
        internals.setPageFocus(true);
        println(
            `Window focus handler redirects focus without duplicate events: ${events.join(", ")}; redirected input active=${document.activeElement === redirectedInput}`
        );

        originalInput.focus();
        events.length = 0;
        originalInput.addEventListener("blur", () => frame.focus(), { once: true });
        internals.setPageFocus(false);
        println(
            `Input blur handler focuses iframe without system focus: ${events.splice(0).join(", ")}; iframe remains active=${document.activeElement === frame}; document.hasFocus()=${document.hasFocus()}`
        );
        internals.setPageFocus(true);
        println(`System focus returns to iframe: ${events.splice(0).join(", ")}`);

        originalInput.focus();
        events.length = 0;
        frame.addEventListener("focus", () => internals.setPageFocus(false), { once: true });
        frame.focus();
        println(
            `Iframe focus handler loses system focus without focusin: ${events.join(", ")}; document.hasFocus()=${document.hasFocus()}`
        );
        internals.setPageFocus(true);
    });
</script>
