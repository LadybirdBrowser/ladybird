<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const iframe = document.createElement("iframe");
        iframe.srcdoc = "<body><div id='target'></div></body>";
        const loaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
        document.body.appendChild(iframe);
        await loaded;

        const iframeWindow = iframe.contentWindow;
        const iframeDocument = iframe.contentDocument;
        const target = iframeDocument.getElementById("target");

        const fired = [];
        iframeWindow.addEventListener("click", () => fired.push("window listener"));
        iframeDocument.addEventListener("click", () => fired.push("document listener"));
        target.addEventListener("click", () => fired.push("element listener"));
        iframeWindow.onclick = () => fired.push("window handler");
        iframeDocument.onclick = () => fired.push("document handler");
        target.onclick = () => fired.push("element handler");

        iframeDocument.open();
        iframeDocument.close();

        println(`window handler after open: ${iframeWindow.onclick}`);
        println(`document handler after open: ${iframeDocument.onclick}`);
        println(`element handler after open: ${target.onclick}`);

        iframeWindow.dispatchEvent(new iframeWindow.Event("click"));
        iframeDocument.dispatchEvent(new iframeWindow.Event("click"));
        target.dispatchEvent(new iframeWindow.Event("click"));
        println(`fired: ${fired.length === 0 ? "(none)" : fired.join(", ")}`);

        iframe.remove();
        done();
    });
</script>
