<!doctype html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const server = httpTestServer();
        const scriptURL = new URL(
            await server.createEcho("GET", `/namespaced-script-type-${crypto.randomUUID()}.js`, {
                status: 200,
                headers: { "Content-Type": "text/javascript" },
                body: "window.didExecute = true;",
            })
        );
        scriptURL.hostname = uniqueLocalhostHostname("namespaced-script-type");

        const parentURL = await server.createEcho("GET", `/namespaced-script-type-${crypto.randomUUID()}.html`, {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<body><script>const script = document.createElement("script"); script.setAttributeNS("urn:test", "type", "text/javascript"); script.setAttributeNS(null, "type", "module"); script.onerror = () => top.postMessage("PASS", "*"); script.onload = () => top.postMessage(window.didExecute ? "LEAK" : "FAIL", "*"); script.src = "${scriptURL.href}"; document.body.appendChild(script);<\/script>`,
        });

        addEventListener(
            "message",
            event => {
                println(event.data);
                done();
            },
            { once: true }
        );
        const iframe = document.createElement("iframe");
        iframe.src = parentURL;
        document.body.appendChild(iframe);
    });
</script>
