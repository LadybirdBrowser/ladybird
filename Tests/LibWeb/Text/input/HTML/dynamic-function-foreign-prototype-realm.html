<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const sameOrigin = document.createElement("iframe");
        document.body.append(sameOrigin);
        const crossOrigin = document.createElement("iframe");
        crossOrigin.src = "data:text/html,<!DOCTYPE html>";
        await new Promise(resolve => {
            crossOrigin.onload = resolve;
            document.body.append(crossOrigin);
        });
        println(`same-process cross-origin frame: ${remoteFrameCount() === 0}`);

        const constructors = {
            Function: [Function, "return this", f => f()],
            GeneratorFunction: [Object.getPrototypeOf(function* () {}).constructor, "yield this", f => f().next().value],
            AsyncFunction: [Object.getPrototypeOf(async function () {}).constructor, "return this", f => f()],
            AsyncGeneratorFunction: [Object.getPrototypeOf(async function* () {}).constructor, "yield this", async f => (await f().next()).value],
        };
        for (const [label, prototype] of [["same-origin", sameOrigin.contentWindow], ["cross-origin", crossOrigin.contentWindow]]) {
            for (const [name, [constructor, body, thisOf]] of Object.entries(constructors)) {
                function NewTarget() {}
                NewTarget.prototype = prototype;
                const f = Reflect.construct(constructor, [body], NewTarget);
                const thisValue = await thisOf(f);
                println(`${label} ${name}: prototype from NewTarget: ${Object.getPrototypeOf(f) === prototype}, this is caller's global: ${thisValue === window}`);
            }
        }
        done();
    });
</script>
