<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<iframe srcdoc="hello" style="width: 20px; height: 20px"></iframe>
<div id="box" style="width: 10px; height: 0px; background: green"></div>
<script>
    // A document that hosts navigables renders in step with them, and its rendering updates leave no plan for a clock
    // lane to tick its animations with: its lane only follows the pointer.
    asyncTest(async done => {
        const state = await whileLaneAnimates(() => {
            return box.animate([{ height: "0px" }, { height: "100px" }], { duration: 10000, easing: "linear" });
        }, () => internals.clockLaneState(document));
        println(`lane as the task begins: ${state}`);
        done();
    });
</script>
