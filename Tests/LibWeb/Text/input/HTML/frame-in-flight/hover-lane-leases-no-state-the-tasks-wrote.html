<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #box { width: 100px; height: 100px; }
</style>
<div id="box"></div>
<script>
    // A task that writes to the document and reads its layout leaves a state the screen does not show, which a lease
    // would present before the rendering update does: no task after it leases the render state until that update.
    asyncTest(async done => {
        const result = await whileHoverLeased(async () => {
            box.style.width = "120px";
            const width = box.offsetWidth;
            // Tasks plan for a lease again once per display frame at most.
            const start = performance.now();
            while (performance.now() - start < 17) { }
            await nextTask();
            return { width, lease: internals.clockLeaseState(document) };
        });
        println(`box width read: ${result.width}`);
        println(`lease as a later task begins: ${result.lease}`);
        done();
    });
</script>
