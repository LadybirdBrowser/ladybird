<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #box { width: 100px; height: 100px; outline: 1px solid rgb(0, 0, 255); }
    #box:hover { width: 150px; outline-color: rgb(0, 128, 0); }
</style>
<div id="box"></div>
<div id="other"></div>
<script>
    // A task that reads the layout of the document ends the clock lease, which moved and presented nothing. The very next
    // task takes the lease up again, with no display frame between them, and hovers beside the task. A task that writes
    // to the document leaves the next one no lease: the state is no longer the one the screen shows.
    asyncTest(async done => {
        const result = await whileHoverLeased(async frameTime => {
            const states = [];
            for (let i = 0; i < 3; ++i) {
                box.offsetWidth;
                states.push(internals.clockLeaseState(document));
                await nextTask();
                states.push(internals.clockLeaseState(document));
            }
            internals.injectHoverPointer(50, 50, frameTime + 16);
            const onScreen = internals.presentedBorderBox(box)?.width;
            await nextTask();
            box.offsetWidth;
            other.textContent = "written";
            await nextTask();
            return { states, onScreen, afterWrite: internals.clockLeaseState(document) };
        });
        println(`lease after each read, and as the next task begins: ${result.states.join(", ")}`);
        println(`box width on screen: ${result.onScreen}`);
        println(`lease as a task after a write begins: ${result.afterWrite}`);
        done();
    });
</script>
