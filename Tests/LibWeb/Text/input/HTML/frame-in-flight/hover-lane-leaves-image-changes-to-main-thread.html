<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #box { width: 100px; height: 100px; background: rgb(0, 0, 255); }
    #box:hover { background: rgb(0, 128, 0) url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg==) no-repeat; }
</style>
<div id="box"></div>
<script>
    // A hover whose style change gives the box an image to load is the main thread's to finish: the hover beside the
    // task moves the hover facts, and the main thread's next style update loads the image.
    asyncTest(async done => {
        const presentedBy = await whileLaneHovers(() => {
            internals.injectHoverPointer(50, 50);
            return internals.lastFramePresentedBy(document);
        });
        println(`a tick presented the last frame: ${presentedBy === "clock"}`);
        await nextFrame();
        println(`box matches :hover: ${box.matches(":hover")}`);
        done();
    });
</script>
