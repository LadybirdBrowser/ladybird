<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #scroller { height: 400px; overflow: scroll; }
    #scroller > div { height: 500px; }
    #scroller > div:nth-child(odd) { background: #cde; }
    #box { position: fixed; top: 450px; left: 0; width: 50px; height: 100px; background: blue; }
</style>
<body>
<div id="scroller"></div>
<div id="box"></div>
<script>
    // As for the page, the compositor scrolls a scroller for a wheel after a tick of the lane presented a frame, while
    // a task blocks the main thread, and the lane records the frame its tick showed again where the scroller is.
    for (let i = 0; i < 12; ++i) {
        const block = document.createElement("div");
        block.textContent = "block " + i;
        scroller.appendChild(block);
    }
    asyncTest(async done => {
        await twoFramesLanded();
        const result = await whileLaneAnimates(() => {
            return box.animate([{ height: "100px" }, { height: "200px" }], { duration: 100000, easing: "linear" });
        }, frameTime => {
            internals.injectClockTick(frameTime + 1000);
            const tickPresentedBy = internals.lastFramePresentedBy(document);
            const windowOfTheTick = internals.displayListWindowScrollPositions(document);
            // NB: The lane takes no word of the compositor's while a test ticks it by hand.
            internals.setManualRenderingOpportunities(false);
            internals.wheelThroughUIProcess(50, 50, 0, 3000, true);
            while (internals.displayListWindowScrollPositions(document) === windowOfTheTick);
            const presentedBy = internals.lastFramePresentedBy(document);
            const windowWhereScrolled = internals.displayListWindowScrollPositions(document);
            // NB: The display's own ticks may reach the lane meanwhile, at times the test does not choose.
            const heightWhereScrolled = internals.presentedBorderBox(box).height;
            internals.setManualRenderingOpportunities(true);
            internals.injectClockTick(frameTime + 50000);
            return {
                tickPresentedBy,
                windowOfTheTick,
                presentedBy,
                windowWhereScrolled,
                laterTickPresented: internals.presentedBorderBox(box).height > heightWhereScrolled,
                presentedScrollOffset: internals.presentedScrollOffset(scroller).y,
                windowOfTheLaterTick: internals.displayListWindowScrollPositions(document),
                scrollTopOnTheMainThread: scroller.scrollTop,
                scrollTopOnTheCompositor: internals.compositorScrollState(scroller).scrollOffset.y,
            };
        });
        println(`the tick's frame was presented by: ${result.tickPresentedBy}`);
        println(`the display list of the tick's frame was recorded around: ${result.windowOfTheTick || "(0, 0)"}`);
        println(`frame presented beside the task by: ${result.presentedBy}`);
        println(`its display list was recorded around: ${result.windowWhereScrolled}`);
        println(`a later tick presented a frame with a taller box: ${result.laterTickPresented}`);
        println(`the later tick's frame was recorded with the scroller scrolled to: ${result.presentedScrollOffset}`);
        println(`the display list of the later tick's frame was recorded around: ${result.windowOfTheLaterTick}`);
        println(`the scroller is scrolled to ${result.scrollTopOnTheMainThread} on the main thread`);
        println(`the scroller is scrolled to ${result.scrollTopOnTheCompositor} on the compositor`);
        done();
    });
</script>
