<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
</style>
<div id="box">short</div>
<script>
    // A recording that flies without presenting its frame leaves it to the host, which presents it once a read waits for
    // the recording.
    asyncTest(async done => {
        const result = await whileRecordingInFlight(() => {
            internals.holdNextFrame("before-present");
            box.firstChild.data = "a much longer text";
        }, state => {
            // The text moved, so hit testing reads the hit-test list of the recording in flight, and waits for it.
            const hit = document.elementFromPoint(5, 5);
            return { state, hit: hit === box, presentedBy: internals.lastFramePresentedBy(document) };
        });
        println(`state in the next task: ${result.state}`);
        println(`hit test finds the box: ${result.hit}`);
        println(`presented by: ${result.presentedBy}`);
        done();
    });
</script>
