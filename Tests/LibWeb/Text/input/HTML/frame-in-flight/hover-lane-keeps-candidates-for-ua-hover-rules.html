<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #target { display: block; width: 300px; height: 100px; }
</style>
<button id="target"></button>
<script>
    // Default.css restyles a <button> on hover, so the lane has to restyle for one.
    asyncTest(async done => {
        const by = await whileLaneHovers(async frameTime => {
            internals.moveHoverPointer(50, 50);
            await nextTask();
            internals.injectClockTick(frameTime + 32);
            return internals.lastFramePresentedBy(document);
        });
        println(`hover presented by: ${by}`);
        done();
    });
</script>
