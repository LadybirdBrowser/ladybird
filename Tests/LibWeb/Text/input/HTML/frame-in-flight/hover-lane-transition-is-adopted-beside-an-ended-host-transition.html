<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #box { width: 100px; height: 100px; background-color: rgb(0, 0, 255); color: rgb(0, 0, 0); transition: background-color 5ms linear; }
    #box.green { background-color: rgb(0, 128, 0); }
    #box:hover { color: rgb(200, 0, 0); transition: color 100s linear; }
</style>
<div id="box"></div>
<script>
    // The host starts a short transition, which has ended by the time a hover beside a task starts a transition of
    // another property, though the host's timeline has yet to move past its end. The rendering update after the task
    // runs the hover's transition on from when the lane started it.
    asyncTest(async done => {
        if (document.readyState !== "complete")
            await new Promise(resolve => window.addEventListener("load", resolve, { once: true }));
        await twoFrames();
        // The rendering update that the lane follows starts the short transition.
        box.classList.add("green");
        let laneStart;
        await whileLaneHovers(frameTime => {
            laneStart = frameTime + 16;
            internals.injectHoverPointer(50, 50, laneStart, 1);
        });
        await twoFrames();
        const color = box.getAnimations().find(animation => animation.transitionProperty === "color");
        println(`the color transition runs: ${color !== undefined}`);
        println(`it runs from when the lane started it: ${color !== undefined && Math.abs(color.startTime - laneStart) < 1}`);
        done();
    });
</script>
