<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    div { width: 100px; height: 100px; }
    textarea { display: block; width: 100px; height: 100px; margin: 0; padding: 0; border: 0; }
    #control { cursor: move; }
</style>
<div id="target"></div>
<textarea id="control"></textarea>
<script>
    // Check which frame handles hover over the control and its sibling as disabled controls come and go.
    asyncTest(async done => {
        const run = async name => {
            println(`${name}: ${await hoverSeal(50, 50)}`);
            await twoFrames();
            internals.queueMouseMove(500, 500);
            await twoFrames();
        };
        await run("enabled");
        control.disabled = true;
        await run("disabled");
        const presenter = await hoverSeal(50, 150);
        println(`disabled control under the pointer: ${presenter}, cursor ${internals.currentCursor()}`);
        control.disabled = false;
        await run("enabled again");
        const another = document.createElement("textarea");
        another.disabled = true;
        document.body.append(another);
        await run("another disabled arrived");
        another.remove();
        await run("it left");
        done();
    });
</script>
