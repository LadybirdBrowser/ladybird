<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #target { display: block; width: 300px; height: 100px; }
</style>
<div id="target"></div>
<script>
    // No rule testing :hover can match an element here, Default.css's included, so the frame is read-only.
    asyncTest(async done => {
        const by = await whileLaneHovers(async frameTime => {
            internals.moveHoverPointer(50, 50);
            await nextTask();
            internals.injectClockTick(frameTime + 32);
            return internals.lastFramePresentedBy(document);
        });
        println(`hover presented by: ${by}`);
        done();
    });
</script>
