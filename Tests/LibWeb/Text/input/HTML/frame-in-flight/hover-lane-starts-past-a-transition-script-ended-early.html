<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<style>
    body { margin: 0; }
    #first { width: 100px; height: 50px; }
    #box { width: 100px; height: 100px; background-color: rgb(0, 0, 255); transition: opacity 1000ms linear; }
    #box.half { opacity: 0.5; }
    #first:hover ~ #box.half { opacity: 0; }
</style>
<div id="first"></div>
<div id="box"></div>
<script>
    // Script ends a host transition early with a negative end delay. A hover beside a task after that end, but before
    // the transition's duration has passed, starts a transition from the value the ended one left, not from the last
    // value a rendering update sampled of it.
    asyncTest(async done => {
        const opacity = await whileLaneAnimates(() => {
            box.classList.add("half");
            const [transition] = box.getAnimations();
            transition.effect.updateTiming({ endDelay: -500 });
            return transition;
        }, (frameTime, transition, startTime) => {
            const hoverTime = startTime + 700;
            internals.injectHoverPointer(50, 25, hoverTime);
            internals.injectClockTick(hoverTime + 500);
            return internals.presentedOpacity(box);
        });
        println(`box opacity halfway through the new transition: ${opacity}`);
        await twoFrames();
        const [transition] = box.getAnimations();
        println(`new transition starts from: ${transition.effect.getKeyframes()[0].opacity}`);
        done();
    });
</script>
