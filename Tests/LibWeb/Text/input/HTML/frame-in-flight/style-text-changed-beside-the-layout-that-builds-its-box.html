<!DOCTYPE html>
<script src="../../include.js"></script>
<script src="frame-in-flight.js"></script>
<div id="source"></div>
<script>
    // A rendered style element whose text changes beside the layout that builds its box shows the new text.
    asyncTest(async done => {
        const built = document.createElement("style");
        built.style.display = "block";
        await twoFramesLanded();
        internals.setManualRenderingOpportunities(true);
        requestAnimationFrame(() => {
            internals.holdNextFrame("layout");
            source.append(built);
        });
        internals.injectRenderingOpportunity(performance.now());
        while (internals.frameSchedulerState() !== "laying-out")
            await nextTask();
        built.textContent = "text";
        internals.releaseHeldFrame();
        while (internals.frameSchedulerState() !== "idle")
            await nextTask();
        internals.setManualRenderingOpportunities(false);
        await twoFramesLanded();
        println(`style has height: ${built.offsetHeight > 0}`);
        done();
    });
</script>
