<!DOCTYPE html>
<video id="video" src="../../../Assets/test-webm.webm"></video>
<script src="../include.js"></script>
<script>internals.setAutoplayPolicy("allow-audio-and-video");</script>
<script>
    asyncTest(async done => {
        const video = document.getElementById("video");
        await video.play();
        await new Promise(resolve => {
            video.addEventListener("timeupdate", function listener() {
                if (video.currentTime < 0.2)
                    return;
                video.removeEventListener("timeupdate", listener);
                resolve();
            });
        });

        // With the audio track disabled, deselecting and reselecting the video track in one task must not end playback.
        video.audioTracks[0].enabled = false;
        const track = video.videoTracks[0];
        track.selected = false;
        track.selected = true;

        await new Promise(resolve => setTimeout(resolve, 500));
        println(`ended: ${video.ended}`);
        println(`playing: ${!video.paused && video.currentTime < video.duration}`);
        done();
    });
</script>
