<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        let dataTransfer = new DataTransfer();
        println(`dropEffect: ${dataTransfer.dropEffect}`);
        println(`effectAllowed: ${dataTransfer.effectAllowed}`);

        let dataTransferItemList = dataTransfer.items;
        println(`length=${dataTransferItemList.length}, types=${dataTransfer.types}`);

        let stringItem = dataTransferItemList.add("well hello friends", "custom-type");
        println(`stringItem: kind=${stringItem.kind}, type=${stringItem.type}`);
        println(`length=${dataTransferItemList.length}, types=${dataTransfer.types}`);
        dataTransfer.setData("Text", "well hello \u{1f980}");
        println(`getData(Text): data=${dataTransfer.getData("Text")}`);

        if (dataTransferItemList[0] !== stringItem) {
            println("FAILED");
        }

        let promise = new Promise((resolve, reject) => {
            stringItem.getAsString(data => {
                println(`stringItemAsString: data=${data}`);
                resolve();
            });
        });
        await promise;

        try {
            dataTransferItemList.add("well hello friends", "custom-type");
            println("FAILED");
        } catch (e) {}

        let file = new File(["well hello friends"], "file.txt", {
            type: "text/plain",
        });

        let fileItem = dataTransferItemList.add(file);
        println(`fileItem: kind=${fileItem.kind}, type=${fileItem.type}`);
        println(`length=${dataTransferItemList.length}, types=${dataTransfer.types}`);

        let fileItemAsFile = fileItem.getAsFile();
        println(`fileItemAsFile: name=${fileItemAsFile.name}, type=${fileItemAsFile.type}`);

        let fileItemAsEntry = fileItem.webkitGetAsEntry();
        println(`fileItemAsEntry: name=${fileItemAsEntry.name}, file=${fileItemAsEntry.isFile}, directory=${fileItemAsEntry.isDirectory}`);

        if (dataTransferItemList[2] !== fileItem) {
            println("FAILED");
        }

        if (dataTransferItemList[3] !== undefined) {
            println("FAILED");
        }

        let callbackRan = false;
        const queuedData = new Promise(resolve => {
            stringItem.getAsString(data => {
                callbackRan = true;
                resolve(data);
            });
        });
        dataTransferItemList.remove(0);
        println(`item indices after removal: ${Object.keys(dataTransferItemList).join(",")}`);
        println(`surviving file item keeps its identity: ${dataTransferItemList[1] === fileItem}`);
        println(`removed item kind: ${JSON.stringify(stringItem.kind)}`);
        println(`callback ran before yielding: ${callbackRan}`);
        println(`queued string after removal: ${await queuedData}`);

        removeTestErrorHandler();
        const reportedError = new Promise(resolve => {
            window.addEventListener("error", event => {
                event.preventDefault();
                resolve(event.error.message);
            }, { once: true });
        });
        dataTransferItemList.add("thrown", "text/thrown").getAsString(() => {
            throw new Error("getAsString callback error");
        });
        println(`reported callback error: ${await reportedError}`);
    });
</script>
