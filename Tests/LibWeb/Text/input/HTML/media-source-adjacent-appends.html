<!DOCTYPE html>
<!-- Allow autoplay so the scripted play() works without a user gesture, independent of the browser's
     autoplay policy that test-web would otherwise inherit. -->
<script>internals.setAutoplayPolicy("allow-audio-and-video");</script>
<video id="video"></video>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        function step(name) {
            println(`PASS: ${name}`);
        }

        function fail(name, error) {
            println(`FAIL: ${name}: ${error}`);
            done();
        }

        function topLevelBoxes(bytes) {
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const boxes = [];
            for (let offset = 0; offset + 8 <= bytes.length;) {
                const size = view.getUint32(offset);
                boxes.push({ offset, type: String.fromCharCode(...bytes.subarray(offset + 4, offset + 8)) });
                offset += size;
            }
            return boxes;
        }

        try {
            const video = document.getElementById("video");
            const mimeType = 'video/mp4;codecs="av01.0.00M.08,mp4a.40.2"';
            if (!MediaSource.isTypeSupported(mimeType)) {
                fail("isTypeSupported", `${mimeType} not supported`);
                return;
            }

            const mediaSource = new MediaSource();
            video.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener("sourceopen", async () => {
                try {
                    const sourceBuffer = mediaSource.addSourceBuffer(mimeType);

                    const response = await fetch("../../../Assets/av1-aac-fragmented.mp4");
                    if (!response.ok) {
                        fail("fetch media", `HTTP ${response.status}`);
                        return;
                    }
                    const data = new Uint8Array(await response.arrayBuffer());

                    const boxes = topLevelBoxes(data);
                    const movieFragments = boxes.filter(box => box.type === "moof").map(box => box.offset);
                    const mediaEnd = boxes.find(box => box.type === "mfra")?.offset ?? data.length;
                    const initializationSegment = data.subarray(0, movieFragments[0]);
                    const mediaSegments = movieFragments.map((start, index) =>
                        data.subarray(start, index + 1 < movieFragments.length ? movieFragments[index + 1] : mediaEnd));

                    function formatRanges() {
                        const buffered = sourceBuffer.buffered;
                        const ranges = [];
                        for (let i = 0; i < buffered.length; i++)
                            ranges.push(`${buffered.start(i)}-${buffered.end(i)}`);
                        return `[${ranges.join(", ")}]`;
                    }

                    async function append(bytes) {
                        await new Promise((resolve, reject) => {
                            sourceBuffer.addEventListener("updateend", resolve, { once: true });
                            sourceBuffer.addEventListener("error", () =>
                                reject(new Error("error event on SourceBuffer")), { once: true });
                            sourceBuffer.appendBuffer(bytes);
                        });
                    }

                    await append(initializationSegment);

                    // Appending the second half of the media first leaves the two halves in coded frame groups
                    // of their own, since the decode timestamps run backwards when the first half arrives.
                    for (const segment of mediaSegments.slice(2))
                        await append(segment);
                    const seam = sourceBuffer.buffered.start(0);
                    println(`buffered after the second half: ${formatRanges()}`);

                    for (const segment of mediaSegments.slice(0, 2))
                        await append(segment);

                    // The halves meet in presentation time, so they buffer as one range and playback has to
                    // read straight out of the first group and into the second.
                    println(`buffered after both halves: ${formatRanges()}`);

                    await new Promise(resolve => {
                        mediaSource.addEventListener("sourceended", resolve);
                        mediaSource.endOfStream();
                    });

                    video.addEventListener("error", () => {
                        fail("playback", video.error?.message ?? "unknown error");
                    });

                    await new Promise(resolve => {
                        video.addEventListener("seeked", resolve, { once: true });
                        video.currentTime = seam - 0.1;
                    });
                    step("seeked into the first group");

                    await video.play();
                    await new Promise(resolve => {
                        const check = () => {
                            if (video.currentTime > seam + 0.1)
                                resolve();
                            else
                                requestAnimationFrame(check);
                        };
                        check();
                    });
                    video.pause();
                    step("played into the second group");

                    done();
                } catch (e) {
                    fail("sourceopen handler", e);
                }
            });
        } catch (e) {
            fail("setup", e);
        }
    });
</script>
