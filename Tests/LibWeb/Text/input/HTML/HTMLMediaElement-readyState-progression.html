<!DOCTYPE html>
<script src="../include.js"></script>
<script src="HTMLMediaElement-include.js"></script>
<video id="video"></video>
<script>
    const video = document.getElementById("video");

    function logEvent(name) {
        let entry = `${name}: ${formatReadyStateExpectation(video, name)}`;
        println(entry);
    }

    for (const name of [
        "loadstart", "loadedmetadata", "loadeddata",
        "canplay", "canplaythrough",
    ]) {
        video.addEventListener(name, () => logEvent(name));
    }

    asyncTest(async done => {
        video.addEventListener("canplaythrough", () => {
            done();
        })
        video.src = "../../../Assets/test-webm.webm";
    });
</script>
