<!DOCTYPE html>
<!-- Allow autoplay so the scripted play() works without a user gesture, independent of the browser's
     autoplay policy that test-web would otherwise inherit. -->
<script>internals.setAutoplayPolicy("allow-audio-and-video");</script>
<video id="video"></video>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        function step(name) {
            println(`PASS: ${name}`);
        }

        function fail(name, error) {
            println(`FAIL: ${name}: ${error}`);
            done();
        }

        try {
            const video = document.getElementById("video");

            // The intrinsic size is only known once a frame has been presented, which the resize event signals.
            const videoSize = new Promise(resolve => {
                video.addEventListener("resize", () => resolve(`${video.videoWidth}x${video.videoHeight}`), { once: true });
            });

            const mimeType = 'video/mp4;codecs="av01.0.00M.08,mp4a.40.2"';
            if (!MediaSource.isTypeSupported(mimeType)) {
                fail("isTypeSupported", `${mimeType} not supported`);
                return;
            }
            step("isTypeSupported");

            const mediaSource = new MediaSource();
            video.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener("sourceopen", async () => {
                try {
                    const sourceBuffer = mediaSource.addSourceBuffer(mimeType);
                    step("addSourceBuffer succeeded");

                    const response = await fetch("../../../Assets/av1-aac-fragmented.mp4");
                    if (!response.ok) {
                        fail("fetch media", `HTTP ${response.status}`);
                        return;
                    }
                    const data = new Uint8Array(await response.arrayBuffer());
                    step(`loaded media data (${data.length} bytes)`);

                    function printBuffered(label) {
                        const buffered = sourceBuffer.buffered;
                        const ranges = [];
                        for (let i = 0; i < buffered.length; i++)
                            ranges.push(`${buffered.start(i)}-${buffered.end(i)}`);
                        println(`buffered after ${label}: [${ranges.join(", ")}]`);
                    }

                    async function appendSlice(slice, label) {
                        await new Promise((resolve, reject) => {
                            sourceBuffer.addEventListener("updateend", resolve, { once: true });
                            sourceBuffer.addEventListener("error", () =>
                                reject(new Error("error event on SourceBuffer")), { once: true });
                            sourceBuffer.appendBuffer(slice);
                        });
                        printBuffered(label);
                    }

                    // Slice the file at offsets that don't line up with the boundaries of its segments, so that
                    // the parser has to wait for the rest of a segment before it can demux it.
                    const numSlices = 5;
                    const sliceSize = Math.ceil(data.length / numSlices);
                    for (let i = 0; i < numSlices; i++) {
                        const start = i * sliceSize;
                        const end = Math.min(start + sliceSize, data.length);
                        await appendSlice(data.subarray(start, end), `slice ${i + 1}/${numSlices}`);
                    }

                    println(`duration: ${mediaSource.duration}`);
                    for (const track of video.videoTracks)
                        println(`video track: kind=${track.kind}, label=${track.label}, language="${track.language}"`);
                    for (const track of video.audioTracks)
                        println(`audio track: kind=${track.kind}, label=${track.label}, language="${track.language}"`);

                    await new Promise(resolve => {
                        mediaSource.addEventListener("sourceended", resolve);
                        mediaSource.endOfStream();
                    });
                    step("endOfStream succeeded");

                    video.addEventListener("error", () => {
                        fail("playback", video.error?.message ?? "unknown error");
                    });

                    await video.play();
                    step("play() promise resolved");

                    await new Promise(resolve => {
                        if (!video.paused)
                            resolve();
                        else
                            video.addEventListener("playing", resolve);
                    });
                    step("playing");
                    println(`video size: ${await videoSize}`);
                    done();
                } catch (e) {
                    fail("sourceopen handler", e);
                }
            });
        } catch (e) {
            fail("setup", e);
        }
    });
</script>
