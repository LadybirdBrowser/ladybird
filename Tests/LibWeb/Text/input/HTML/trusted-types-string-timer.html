<!doctype html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const pageURL = await httpTestServer().createEcho("GET", `/trusted-types-string-timer-${crypto.randomUUID()}`, {
            status: 200,
            headers: {
                "Content-Type": "text/html",
                "Content-Security-Policy":
                    "require-trusted-types-for 'script'; script-src 'unsafe-inline' 'unsafe-eval'",
            },
            body: `<script>setTimeout('top.postMessage("LEAK", "*")', 0); setTimeout(() => top.postMessage("PASS", "*"), 25);<\/script>`,
        });
        const message = new Promise(resolve => addEventListener("message", resolve, { once: true }));
        const iframe = document.createElement("iframe");
        iframe.src = pageURL;
        document.body.appendChild(iframe);
        println((await message).data);
    });
</script>
