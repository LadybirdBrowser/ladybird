<script>
    function colorName([red, green, blue]) {
        if (red > 200 && green > 200 && blue < 80)
            return "yellow";
        if (red > 200)
            return "red";
        if (green > 200)
            return "lime";
        if (blue > 200)
            return "blue";
        return `${red},${green},${blue}`;
    }

    function corners(source, width, height) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        context.drawImage(source, 0, 0);
        const at = (x, y) => colorName(context.getImageData(x, y, 1, 1).data);
        return [at(2, 2), at(width - 3, 2), at(2, height - 3), at(width - 3, height - 3)].join(" ");
    }

    promiseTest(async () => {
        const image = document.getElementById("image");
        await image.decode();
        println(`natural size: ${image.naturalWidth}x${image.naturalHeight}`);
        println(`drawImage corners: ${corners(image, image.naturalWidth, image.naturalHeight)}`);
        const bitmap = await createImageBitmap(image);
        println(`createImageBitmap: ${bitmap.width}x${bitmap.height}, corners ${corners(bitmap, bitmap.width, bitmap.height)}`);
    });
</script>
