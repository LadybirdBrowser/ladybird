<!DOCTYPE html>
<!-- Allow autoplay so the scripted play() works without a user gesture, independent of the browser's
     autoplay policy that test-web would otherwise inherit. -->
<script>internals.setAutoplayPolicy("allow-audio-and-video");</script>
<audio id="audio"></audio>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        function fail(name, error) {
            println(`FAIL: ${name}: ${error}`);
            done();
        }

        try {
            const audio = document.getElementById("audio");
            const mimeType = 'audio/mp4;codecs="mp4a.40.2"';
            const mediaSource = new MediaSource();
            audio.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener("sourceopen", async () => {
                try {
                    const sourceBuffer = mediaSource.addSourceBuffer(mimeType);

                    const response = await fetch("../../../Assets/aac-encoder-delay-tfdt.mp4");
                    if (!response.ok) {
                        fail("fetch", `HTTP ${response.status}`);
                        return;
                    }
                    const data = await response.arrayBuffer();

                    // Append the whole second of audio, and never signal endOfStream(), so that playback runs
                    // out of data at its end. With no video, only the audio output can report the stall.
                    await new Promise((resolve, reject) => {
                        sourceBuffer.addEventListener("updateend", resolve, { once: true });
                        sourceBuffer.addEventListener("error", () => reject(new Error("error")), { once: true });
                        sourceBuffer.appendBuffer(data);
                    });
                    const bufferedEnd = sourceBuffer.buffered.end(0);

                    await new Promise(resolve => {
                        audio.addEventListener("seeked", resolve, { once: true });
                        audio.currentTime = bufferedEnd - 0.3;
                    });

                    // play() itself fires waiting if the seek left readyState below HAVE_FUTURE_DATA, so only start
                    // listening once playback is underway.
                    await new Promise(resolve => {
                        audio.addEventListener("playing", resolve, { once: true });
                        audio.play();
                    });

                    audio.addEventListener("waiting", () => {
                        println(`waiting fired while playing: ${!audio.paused}`);
                        println(`readyState is at most HAVE_CURRENT_DATA: ${audio.readyState <= HTMLMediaElement.HAVE_CURRENT_DATA}`);
                        println(`stopped near the end of the appended data: ${Math.abs(audio.currentTime - bufferedEnd) < 0.1}`);
                        done();
                    }, { once: true });
                } catch (e) {
                    fail("sourceopen handler", e);
                }
            });
        } catch (e) {
            fail("setup", e);
        }
    });
</script>
