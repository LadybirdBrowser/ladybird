<!doctype html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const server = httpTestServer();
        const run = crypto.randomUUID();
        const targetURL = new URL(
            await server.createEcho("GET", `/download-referrer-policy-${run}.txt`, {
                status: 200,
                headers: {
                    "Content-Disposition": "attachment; filename=proof.txt",
                    "Content-Type": "application/octet-stream",
                },
                body: "download",
            })
        );
        targetURL.hostname = uniqueLocalhostHostname("download-referrer-policy");

        const scriptStartTag = "<scr" + "ipt";
        const scriptEndTag = "</scr" + "ipt>";
        const pageURL = await server.createEcho("GET", `/download-referrer-policy-${run}.html`, {
            status: 200,
            headers: {
                "Content-Type": "text/html",
                "Referrer-Policy": "unsafe-url",
            },
            body: `<!DOCTYPE html>
                <a id="download" download="proof.txt" referrerpolicy="no-referrer" href="${targetURL.href}">download</a>
                ${scriptStartTag}>download.click();${scriptEndTag}`,
        });

        const frame = document.createElement("iframe");
        frame.src = `${pageURL}?private=capability`;
        document.body.appendChild(frame);

        const recordedURL = `${server.baseURL}/recorded-request-headers${targetURL.pathname}`;
        let response;
        while (true) {
            try {
                response = await fetch(recordedURL);
                if (response.ok) break;
            } catch {}
        }

        const headers = await response.json();
        const referer = headers.Referer?.[0] ?? null;
        println(`${referer === null ? "PASS" : "FAIL"}: download link honored no-referrer`);
        done();
    });
</script>
