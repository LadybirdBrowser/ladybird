<!DOCTYPE html>
<script src="../include.js"></script>
<iframe id="iframe"></iframe>
<script>
    test(() => {
        const iframeDocument = document.getElementById("iframe").contentDocument;
        iframeDocument.open();
        iframeDocument.write("<body><p>first</p><script>document.close();<\/script>");
        println(`After close: ${iframeDocument.body.innerHTML}`);

        iframeDocument.write("<style></style><p>second</p>");
        println(`After write: ${iframeDocument.documentElement.outerHTML}`);
        iframeDocument.close();
    });
</script>
