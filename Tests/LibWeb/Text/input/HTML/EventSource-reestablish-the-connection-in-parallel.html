<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const url = await server.createEcho("GET", "/event-source-reestablish-the-connection-in-parallel", {
            status: 200,
            headers: { "Content-Type": "text/event-stream", "Access-Control-Allow-Origin": "*" },
            body: "data: one\n\n",
        });

        const source = new EventSource(url);
        await new Promise(resolve => {
            source.onmessage = event => println(`message: ${event.data}`);
            source.onerror = () => {
                println(`readyState: ${source.readyState}`);
                println(`resource timing entries: ${performance.getEntriesByName(url).length}`);
                source.close();
                resolve();
            };
        });
    });
</script>
