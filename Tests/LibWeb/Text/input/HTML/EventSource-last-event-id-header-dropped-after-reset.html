<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const url = server.getStaticURL(`Text/input/HTML/EventSource-last-event-id-reset.py?token=${crypto.randomUUID()}`);

        const source = new EventSource(url);
        await new Promise(resolve => {
            source.onmessage = event => {
                println(event.data);
                if (event.data.startsWith("Last-Event-ID is"))
                    resolve();
            };
        });
        source.close();
    });
</script>
