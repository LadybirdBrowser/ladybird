<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const iframe = document.createElement("iframe");
        iframe.src = "data:text/html,<!DOCTYPE html>";
        await new Promise(resolve => {
            iframe.onload = resolve;
            document.body.append(iframe);
        });
        const crossOriginWindow = iframe.contentWindow;
        println(`same-process frame: ${remoteFrameCount() === 0}`);

        function thrown(f) {
            try {
                f();
                return "no exception";
            } catch (e) {
                return `${e.name}, caller realm: ${e instanceof Object}`;
            }
        }

        const blobSize = Object.getOwnPropertyDescriptor(Blob.prototype, "size").get;
        const textContent = Object.getOwnPropertyDescriptor(Node.prototype, "textContent");
        const iteratorNext = Object.getPrototypeOf(new URLSearchParams().entries()).next;
        const members = {
            "URLSearchParams entries": receiver => URLSearchParams.prototype.entries.call(receiver),
            "URLSearchParams iterator next": receiver => iteratorNext.call(receiver),
            "Node textContent getter": receiver => textContent.get.call(receiver),
            "Node textContent setter": receiver => textContent.set.call(receiver, ""),
            "EventCounts entries": receiver => EventCounts.prototype.entries.call(receiver),
            "Highlight has": receiver => Highlight.prototype.has.call(receiver, new Range()),
            "Blob size getter": receiver => blobSize.call(receiver),
            "WebSocket send": receiver => WebSocket.prototype.send.call(receiver, ""),
        };
        for (const [name, member] of Object.entries(members)) {
            println(`Window to ${name}: ${thrown(() => member(crossOriginWindow))}`);
            println(`Location to ${name}: ${thrown(() => member(crossOriginWindow.location))}`);
        }
        done();
    });
</script>
