<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const srcdocs = {
            "no doctype": "<p>x</p>",
            "quirks doctype": '<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 3.2 Final//EN"><p>x</p>',
        };
        for (const [name, srcdoc] of Object.entries(srcdocs)) {
            const iframe = document.createElement("iframe");
            iframe.srcdoc = srcdoc;
            const loaded = new Promise(resolve => iframe.addEventListener("load", resolve, { once: true }));
            document.body.appendChild(iframe);
            await loaded;

            // An iframe srcdoc document stays in no-quirks mode whatever its DOCTYPE says, or if it has none.
            println(`${name}: ${iframe.contentDocument.compatMode}`);
        }

        // A document parsed from the same markup is not an iframe srcdoc document.
        println(`DOMParser: ${new DOMParser().parseFromString("<p>x</p>", "text/html").compatMode}`);
        done();
    });
</script>
