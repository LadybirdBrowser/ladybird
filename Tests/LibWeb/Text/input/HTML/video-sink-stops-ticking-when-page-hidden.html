<!doctype html>
<script src="../include.js"></script>
<script src="frame-in-flight/frame-in-flight.js"></script>
<video id="video" muted loop></video>
<script>
    const video = document.getElementById("video");

    async function committedFrame() {
        internals.setManualRenderingOpportunities(true);
        try {
            const frame = animationFrame();
            internals.injectRenderingOpportunity(performance.now());
            await frame;
            do await nextTask();
            while (internals.frameSchedulerState() !== "idle" || internals.clockLaneIsComing(document));
        } finally {
            internals.setManualRenderingOpportunities(false);
        }
    }

    asyncTest(async done => {
        video.src = "../../../Assets/test-webm.webm";
        await new Promise(resolve => video.addEventListener("loadedmetadata", resolve, { once: true }));
        await video.play();
        await committedFrame();
        println(`ticking while visible: ${internals.mediaElementVideoSinkIsTicking(video)}`);

        await setSystemVisibilityState("hidden");
        println(`document.hidden: ${document.hidden}`);
        println(`ticking while hidden: ${internals.mediaElementVideoSinkIsTicking(video)}`);

        const videoCreatedWhileHidden = document.createElement("video");
        videoCreatedWhileHidden.muted = true;
        videoCreatedWhileHidden.src = "../../../Assets/test-webm.webm";
        await new Promise(resolve =>
            videoCreatedWhileHidden.addEventListener("loadedmetadata", resolve, { once: true })
        );
        println(
            `ticking for a sink created while hidden: ${internals.mediaElementVideoSinkIsTicking(videoCreatedWhileHidden)}`
        );

        video.getBoundingClientRect();
        await setSystemVisibilityState("visible");
        println(`ticking after becoming visible: ${internals.mediaElementVideoSinkIsTicking(video)}`);
        document.body.appendChild(videoCreatedWhileHidden);
        await committedFrame();
        println(
            `ticking for the late sink after a committed frame: ${internals.mediaElementVideoSinkIsTicking(videoCreatedWhileHidden)}`
        );
        done();
    });
</script>
