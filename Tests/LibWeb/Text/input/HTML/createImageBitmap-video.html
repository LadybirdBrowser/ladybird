<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const video = document.createElement("video");
        video.preload = "auto";
        await new Promise((resolve, reject) => {
            video.oncanplaythrough = resolve;
            video.onerror = reject;
            video.src = "../wpt-import/html/canvas/element/manual/wide-gamut-canvas/resources/sRGB-BB0000.webm";
        });

        const bitmap = await createImageBitmap(video);
        println(`ImageBitmap size: ${bitmap.width}x${bitmap.height}`);

        const cropped = await createImageBitmap(video, 10, 20, 30, 40);
        println(`Cropped ImageBitmap size: ${cropped.width}x${cropped.height}`);

        for (const colorSpace of ["srgb", "display-p3"]) {
            const canvas = document.createElement("canvas");
            canvas.width = 4;
            canvas.height = 4;
            const context = canvas.getContext("2d", { colorSpace });
            context.drawImage(bitmap, 0, 0);
            const [red, green, blue, alpha] = context.getImageData(1, 1, 1, 1).data;
            const expected = colorSpace === "srgb" ? [187, 0, 0] : [171, 35, 23];
            const matches = Math.abs(red - expected[0]) <= 3 && Math.abs(green - expected[1]) <= 3 && Math.abs(blue - expected[2]) <= 3 && alpha === 255;
            println(`Pixel in a ${colorSpace} canvas is the color of the video: ${matches}`);
        }

        video.removeAttribute("src");
        video.load();
        try {
            await createImageBitmap(video);
            println("FAIL: a video without a media resource made an ImageBitmap");
        } catch (error) {
            println(`A video without a media resource: ${error.name}`);
        }
        done();
    });
</script>
