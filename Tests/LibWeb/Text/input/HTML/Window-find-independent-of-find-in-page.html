<!DOCTYPE html>
<script src="../include.js"></script>
<p>needle other needle</p>
<script>
    test(() => {
        internals.findInPage("needle");
        const firstResult = window.find("needle");
        const secondResult = window.find("needle");

        getSelection().removeAllRanges();
        internals.findInPage("needle");
        const otherResult = window.find("other");
        internals.findInPageNextMatch();

        println(`window.find("needle"): ${firstResult}`);

        println(`Selection after the next find-in-page match: "${selectedText}"`);
    });
</script>
