<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    function readWhileResolving(animation, name) {
        let inner;
        Object.defineProperty(animation, "then", {
            configurable: true,
            get() {
                delete animation.then;
                inner = animation[name];
                return undefined;
            },
        });
        const outer = animation[name];
        println(`${name}: read while resolving is the same promise: ${inner === outer}, later read too: ${animation[name] === outer}`);
    }

    test(() => {
        readWhileResolving(new Animation(), "ready");
    });
</script>
