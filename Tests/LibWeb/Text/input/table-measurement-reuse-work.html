<!doctype html>
<script src="include.js"></script>
<script src="layout-test.js"></script>
<style>
    body { margin: 0; }
    #host { display: flex; width: 100px; }
    #item { display: flex; flex-direction: column; flex: 1 1 auto; }
    table { table-layout: fixed; width: 100%; border-spacing: 0; }
    td { padding: 0; position: relative; }
    td > div { width: 40px; height: 20px; }
    .control { position: absolute; width: 10px; height: 10px; }
</style>
<div id="host"><div id="item"><table id="table"><tbody><tr><td id="cell"><div></div></td><td><div></div></td></tr></tbody></table></div></div>
<script>
    layoutTest({
        steps: [
            {
                name: "adding an out-of-flow control reuses table cell measurements",
                mutate: () => {
                    const control = document.createElement("span");
                    control.className = "control";
                    cell.append(control);
                },
                expect: `
                    layout FULL
                      @viewport/block RUN (cache=bypass)
                        BlockContainer<HTML>/block RUN (cache=miss)
                          Box<DIV>#host/flex RUN (cache=miss)
                            Box<DIV>#item/flex (measurement, intrinsic) RUN (cache=bypass)
                              TableWrapper(anonymous)/block (measurement, intrinsic) RUN (cache=bypass)
                                Box<TABLE>#table/table (measurement, intrinsic) RUN (cache=bypass)
                                  BlockContainer<TD>#cell/block (measurement, intrinsic) RUN (cache=bypass)
                              TableWrapper(anonymous)/block (measurement, intrinsic) RUN (cache=bypass)
                                Box<TABLE>#table/table (measurement, intrinsic) RUN (cache=bypass)
                                Box<TABLE>#table/table (measurement, intrinsic) RUN (cache=bypass)
                                  BlockContainer<TD>#cell/block (measurement, intrinsic) RUN (cache=bypass)
                            Box<DIV>#item/flex (measurement, intrinsic) RUN (cache=bypass)
                              TableWrapper(anonymous)/block (measurement, intrinsic) RUN (cache=bypass)
                                Box<TABLE>#table/table (measurement, intrinsic) RUN (cache=bypass)
                                Box<TABLE>#table/table (measurement, intrinsic) RUN (cache=bypass)
                            Box<DIV>#item/flex (measurement, intrinsic) RUN (cache=bypass)
                              TableWrapper(anonymous)/block (measurement, intrinsic) RUN (cache=bypass)
                                Box<TABLE>#table/table (measurement, intrinsic) RUN (cache=bypass)
                                  BlockContainer<TD>#cell/block (measurement, intrinsic) RUN (cache=bypass)
                            Box<DIV>#item/flex RUN (cache=miss)
                              TableWrapper(anonymous)/block RUN (cache=miss)
                                Box<TABLE>#table/table RUN (cache=miss)
                                  BlockContainer<TD>#cell/block (measurement) RUN (cache=bypass)
                                  BlockContainer<TD>#cell/block RUN (cache=miss)
                                  BlockContainer<TD>/block REUSE SUBTREE
                                  BlockContainer<SPAN>.control/block RUN (cache=miss)
                `,
                check: equal => {
                    equal(table.getBoundingClientRect().width, 100, "table width");
                    equal(table.getBoundingClientRect().height, 20, "table height");
                    equal(cell.getBoundingClientRect().height, 20, "cell height");
                },
            },
            {
                name: "removing the control preserves table sizing",
                mutate: () => cell.querySelector(".control").remove(),
                // The control was positioned against the cell, so nothing is laid out again when it leaves.
                expect: ``,
                check: equal => {
                    equal(table.getBoundingClientRect().width, 100, "table width");
                    equal(table.getBoundingClientRect().height, 20, "table height");
                },
            },
        ],
    });
</script>
