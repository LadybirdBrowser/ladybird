<!DOCTYPE html>
<script src="../include.js"></script>
<script src="gamepad-helper.js"></script>
<script>
    promiseTest(async () => {
        startUsingGamepads();
        const gamepad = internals.connectVirtualGamepad();
        await pumpGamepadEvents();
        listenForGamepadConnected();

        gamepad.setButton(gamepad.buttons[0], true);
        gamepad.setButton(gamepad.buttons[0], false);
        await pumpGamepadEvents();
        println(`Gamepads after a press released before the page read it: ${navigator.getGamepads().length}`);

        gamepad.setButton(gamepad.buttons[0], true);
        await pumpGamepadEvents();
        println(`Gamepads after a held press: ${navigator.getGamepads().length}`);

        gamepad.disconnect();
        await pumpGamepadEvents();
    });
</script>
