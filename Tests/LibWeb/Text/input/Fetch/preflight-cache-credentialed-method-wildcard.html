<!doctype html>
<script src="../include.js"></script>
<script>
    async function createEndpoint(server, path, credentialed) {
        const allowOrigin = credentialed ? location.origin : "*";
        const preflightHeaders = {
            "Access-Control-Allow-Methods": "PUT, *",
            "Access-Control-Allow-Origin": allowOrigin,
            "Access-Control-Max-Age": "600",
        };
        const responseHeaders = { "Access-Control-Allow-Origin": allowOrigin };
        if (credentialed) {
            preflightHeaders["Access-Control-Allow-Credentials"] = "true";
            responseHeaders["Access-Control-Allow-Credentials"] = "true";
        }

        await server.createEcho("OPTIONS", path, { status: 204, headers: preflightHeaders });
        await server.createEcho("DELETE", path, { status: 200, headers: responseHeaders });
        return server.createEcho("PUT", path, { status: 200, headers: responseHeaders });
    }

    async function run(server, name, credentials) {
        const path = `/preflight-cache-credentialed-method-wildcard-${crypto.randomUUID()}`;
        const url = await createEndpoint(server, path, credentials === "include");

        const primed = await fetch(url, { method: "PUT", credentials });
        println(`${name} PUT: ${primed.status}`);
        try {
            const response = await fetch(url, { method: "DELETE", credentials });
            println(`${name} DELETE: ${response.status}`);
        } catch {
            println(`${name} DELETE: blocked`);
        }
    }

    promiseTest(async () => {
        const server = httpTestServer();
        await run(server, "Without credentials", "omit");
        await run(server, "With credentials", "include");
    });
</script>
