<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // Reloading after the user stops a navigation before its document is activated makes that navigation again — and
    // from the same source. So a navigation this page started is fetched again as this page's: with the Sec-Fetch-Site
    // and the referrer it first went out with, rather than as a URL the user agent supplied.
    asyncTest(async done => {
        const server = httpTestServer();
        const id = crypto.randomUUID();

        // The response is held back long enough for the navigation to still be in flight when it's stopped, and the
        // 204 it ends with leaves this page in place to read what the server recorded.
        const slowURL = await server.createEcho("GET", `/sec-fetch-site-reload-after-stop-${id}`, {
            status: 204,
            delay_ms: 1000,
            headers: { "Cache-Control": "no-store" },
        });

        // The server keeps the headers of the last request only, so a fetch() between the stopped navigation and the
        // reload tells the two navigation requests apart.
        async function recorded(mode) {
            const url = `${server.baseURL}/recorded-request-headers/echo/sec-fetch-site-reload-after-stop-${id}`;
            for (let attempt = 0; attempt < 200; ++attempt) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        const headers = await response.json();
                        if (headers["Sec-Fetch-Mode"]?.[0] === mode)
                            return headers;
                    }
                } catch {}
                await timeout(25);
            }
            return null;
        }
        function describe(headers) {
            const referer = headers?.["Referer"]?.[0];
            return `Sec-Fetch-Site ${headers?.["Sec-Fetch-Site"]?.[0]}, Referer ${referer === location.href ? "this page" : referer}`;
        }

        // NB: This page's own fetches wait while a navigation of it is in flight, so what the server recorded is read
        //     once the navigation is stopped, or has ended.
        location.href = slowURL;
        await timeout(300);
        internals.stopLoadingThroughUIProcess();
        await timeout(100);
        println(`navigation, stopped: ${describe(await recorded("navigate"))}`);

        fetch(slowURL).catch(() => {});
        await recorded("cors");

        internals.reloadThroughUIProcess();
        await timeout(1500);
        println(`navigation, made again by Reload: ${describe(await recorded("navigate"))}`);
        done();
    });
</script>
