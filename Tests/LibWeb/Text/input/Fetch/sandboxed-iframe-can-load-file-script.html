<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(done => {
        const canaryURL = new URL("file-script-canary.js", window.location.href).href;

        const markup = `
            <script src="${canaryURL}"><\/script>
            <script>
                let storage;
                try {
                    storage = localStorage ? "reachable" : "null";
                } catch (e) {
                    storage = e.name;
                }
                parent.postMessage({ canary: String(globalThis.fileScriptCanary ?? null), storage }, "*");
            <\/script>
        `;

        window.addEventListener("message", event => {
            println(`canary: ${event.data.canary}`);
            println(`localStorage: ${event.data.storage}`);
            done();
        });

        const iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts";
        iframe.srcdoc = markup;
        document.body.appendChild(iframe);
    });
</script>
