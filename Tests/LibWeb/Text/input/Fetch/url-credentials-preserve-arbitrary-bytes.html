<!doctype html>
<script src="../include.js"></script>
<iframe></iframe>
<script>
    promiseTest(async () => {
        const server = httpTestServer();
        const path = `/url-credentials-preserve-arbitrary-bytes-${crypto.randomUUID()}`;
        const challengeURL = await server.createEcho("GET", path, {
            status: 401,
            headers: { "WWW-Authenticate": 'Basic realm="test"' },
        });
        const parsedURL = new URL(challengeURL);
        document.querySelector("iframe").src = `${parsedURL.protocol}//u%ff:p@${parsedURL.host}${parsedURL.pathname}`;

        const recordedURL = `${parsedURL.origin}/recorded-request-headers${parsedURL.pathname}`;
        for (let attempt = 0; attempt < 100; ++attempt) {
            try {
                const response = await fetch(recordedURL);
                if (response.ok) {
                    const authorization = (await response.json())["Authorization"]?.[0];
                    if (authorization) {
                        println(`Authorization: ${authorization}`);
                        return;
                    }
                }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10));
        }

        println("Authorization: Missing");
    });
</script>
