<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // A redirect gives the navigation's history entry a new document state (step 19 of "create navigation params by
    // fetching"), which must keep the user-agent-supplied flag — or the browser's Back button, traversing back to that
    // entry, re-fetches the redirect target as site-controlled, rather than with the Sec-Fetch-Site:none the typed
    // address got.
    asyncTest(async done => {
        const server = httpTestServer();
        const runId = new URLSearchParams(location.search).get("run");

        if (runId) {
            const response = await fetch(`${server.baseURL}/recorded-request-headers/echo/sec-fetch-site-redirect-target-${runId}`);
            const headers = response.ok ? await response.json() : null;
            println(`redirect target, fetched again by the traversal: ${headers?.["Sec-Fetch-Site"]?.[0]} (${headers?.["Sec-Fetch-Mode"]?.[0]})`);
            done();
            return;
        }

        const id = crypto.randomUUID();
        const back = new URL(location.href);
        back.search = `?run=${id}`;

        const nextURL = await server.createEcho("GET", `/sec-fetch-site-redirect-next-${id}`, {
            status: 200,
            headers: { "Content-Type": "text/html" },
            body: `<!DOCTYPE html><script>onload = () => setTimeout(() => internals.traverseHistoryThroughUIProcess(-1));<\/script>`,
        });
        // The unload handler keeps the target's document from being kept for the traversal, which then fetches it again.
        const targetURL = await server.createEcho("GET", `/sec-fetch-site-redirect-target-${id}`, {
            status: 200,
            headers: { "Content-Type": "text/html", "Cache-Control": "no-store" },
            body: `<!DOCTYPE html><script>
                onunload = () => {};
                if (sessionStorage.getItem(${JSON.stringify(id)}))
                    location.href = ${JSON.stringify(back.href)};
                else
                    onload = () => setTimeout(() => { sessionStorage.setItem(${JSON.stringify(id)}, "1"); location.href = ${JSON.stringify(nextURL)}; });
            <\/script>`,
        });
        const redirectURL = await server.createEcho("GET", `/sec-fetch-site-redirect-${id}`, {
            status: 302,
            headers: { "Location": targetURL },
        });

        internals.loadURL(redirectURL);
    });
</script>
