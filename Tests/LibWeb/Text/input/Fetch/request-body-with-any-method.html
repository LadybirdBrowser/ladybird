<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const server = httpTestServer();
        for (const method of ["POST", "PROPFIND", "REPORT"]) {
            const url = await server.createEcho(method, `/request-body-${method}`, {
                status: 200,
                headers: { "Content-Type": "text/plain", "Access-Control-Allow-Origin": "*" },
                body: "$BODY",
            });
            const response = await fetch(url, { method, body: `<${method.toLowerCase()}/>` });
            println(`fetch ${method}: ${await response.text()}`);
        }

        const url = await server.createEcho("PROPFIND", "/request-body-xhr", {
            status: 200,
            headers: { "Content-Type": "text/plain", "Access-Control-Allow-Origin": "*" },
            body: "$BODY",
        });
        const xhr = new XMLHttpRequest();
        xhr.open("PROPFIND", url);
        xhr.send("<xhr-propfind/>");
        await new Promise(resolve => (xhr.onloadend = resolve));
        println(`XHR PROPFIND: ${xhr.responseText}`);
        done();
    });
</script>
