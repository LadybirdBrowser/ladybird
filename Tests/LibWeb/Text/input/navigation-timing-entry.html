<!DOCTYPE html>
<script src="include.js"></script>
<script>
    asyncTest(async done => {
        const nextTask = () => new Promise(resolve => {
            const channel = new MessageChannel();
            channel.port1.onmessage = resolve;
            channel.port2.postMessage(null);
        });

        const entries = performance.getEntriesByType("navigation");
        println(`entry count: ${entries.length}`);

        const entry = entries[0];
        println(`constructor: ${entry.constructor.name}`);
        println(`name matches location: ${entry.name === location.href}`);
        println(`entryType: ${entry.entryType}`);
        println(`startTime: ${entry.startTime}`);
        println(`responseStart is non-negative: ${entry.responseStart >= 0}`);
        println(`type: ${entry.type}`);
        println(`redirectCount: ${entry.redirectCount}`);
        println(`navigation is supported: ${PerformanceObserver.supportedEntryTypes.includes("navigation")}`);
        println(`domInteractive is non-negative: ${entry.domInteractive >= 0}`);

        const loaded = new Promise(resolve => addEventListener("load", () => nextTask().then(resolve), { once: true }));
        await nextTask();
        println(`DOMContentLoaded timestamps are ordered: ${entry.domContentLoadedEventStart >= entry.domInteractive && entry.domContentLoadedEventEnd >= entry.domContentLoadedEventStart}`);

        await loaded;
        println(`load timestamps are ordered: ${entry.domComplete >= entry.domContentLoadedEventEnd && entry.loadEventStart >= entry.domComplete && entry.loadEventEnd >= entry.loadEventStart}`);
        println(`duration matches loadEventEnd: ${entry.duration === entry.loadEventEnd}`);
        done();
    });
</script>
