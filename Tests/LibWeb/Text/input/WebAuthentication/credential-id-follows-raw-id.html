<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    function command(name, parameters) {
        const result = JSON.parse(internals.virtualAuthenticatorCommandForTesting(name, JSON.stringify(parameters)));
        if ("error" in result)
            throw new Error(result.error);
        return result.value;
    }

    function base64url(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer))).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
    }

    asyncTest(async done => {
        const authenticatorId = command("addVirtualAuthenticator", {
            protocol: "ctap2",
            transport: "internal",
            hasResidentKey: true,
            hasUserVerification: true,
            isUserVerified: true,
        });
        const credential = await navigator.credentials.create({
            publicKey: {
                rp: { name: "Test" },
                user: { id: new Uint8Array([1, 2, 3, 4]), name: "user", displayName: "User" },
                challenge: new Uint8Array(16),
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
            },
        });

        const idAtFirst = credential.id;
        println(`id is the base64url encoding of rawId: ${idAtFirst === base64url(credential.rawId)}`);

        new Uint8Array(credential.rawId)[0] ^= 0xff;
        println(`id changes when the bytes of rawId change: ${credential.id !== idAtFirst}`);
        println(`id is the base64url encoding of the changed rawId: ${credential.id === base64url(credential.rawId)}`);
        const json = credential.toJSON();
        println(`toJSON() has the same id and rawId: ${json.id === json.rawId && json.id === credential.id}`);

        command("removeVirtualAuthenticator", { authenticatorId });
        done();
    });
</script>
