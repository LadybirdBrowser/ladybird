<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    function command(name, parameters) {
        const result = JSON.parse(internals.virtualAuthenticatorCommandForTesting(name, JSON.stringify(parameters)));
        if ("error" in result)
            throw new Error(result.error);
        return result.value;
    }

    function base64url(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer))).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
    }

    asyncTest(async done => {
        const authenticatorId = command("addVirtualAuthenticator", {
            protocol: "ctap2",
            transport: "usb",
            hasResidentKey: true,
            hasUserVerification: true,
            isUserVerified: true,
        });

        const keys = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]);
        const privateKey = base64url(await crypto.subtle.exportKey("pkcs8", keys.privateKey));
        const credential = (id, signCount) => ({
            authenticatorId,
            credentialId: base64url(new Uint8Array(16).fill(id)),
            isResidentCredential: false,
            rpId: location.hostname,
            privateKey,
            signCount,
        });
        command("addCredential", credential(1, null));
        command("addCredential", credential(2, 7));

        const signCounts = () =>
            JSON.stringify(command("getCredentials", { authenticatorId }).map(credential => credential.signCount));
        println(`Signature counters: ${signCounts()}`);

        for (const id of [1, 2]) {
            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: new Uint8Array(16),
                    allowCredentials: [{ type: "public-key", id: new Uint8Array(16).fill(id) }],
                },
            });
            const signCount = new DataView(assertion.response.authenticatorData).getUint32(33);
            println(`Signature counter of the assertion of credential ${id}: ${signCount}`);
        }
        println(`Signature counters after the assertions: ${signCounts()}`);

        try {
            command("addCredential", credential(3, "many"));
            println("FAIL: A signature counter that is no number was taken");
        } catch (error) {
            println(`Signature counter that is no number: ${error.message}`);
        }

        try {
            command("addCredential", { ...credential(4, 0), rpId: "not a domain" });
            println("FAIL: An RP ID that is no domain was taken");
        } catch (error) {
            println(`RP ID that is no domain: ${error.message}`);
        }

        try {
            command("addVirtualAuthenticator", { protocol: "ctap2", transport: "usb", extensions: ["largeBlob"] });
            println("FAIL: An authenticator with an extension that it does not have was added");
        } catch (error) {
            println(`Authenticator with an extension that it does not have: ${error.message}`);
        }

        command("removeVirtualAuthenticator", { authenticatorId });
        done();
    });
</script>
