<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const read = (bytes, encoding) =>
            new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsText(new Blob([new Uint8Array(bytes)]), encoding);
            });

        println(await read([0xff, 0xfe, 0x61, 0x00]));
        println(await read([0xfe, 0xff, 0x00, 0x62]));
        println(await read([0xef, 0xbb, 0xbf, 0x63], "utf-16le"));
        done();
    });
</script>
