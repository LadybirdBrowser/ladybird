<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const frame = document.createElement("iframe");
        document.body.append(frame);

        const webSocket = new frame.contentWindow.WebSocket(`ws://localhost:${internals.getEchoServerPort()}/`);
        println(`listenerless root: ${internals.hasActivityRoot(webSocket)}`);

        webSocket.onclose = () => {};
        await new Promise(resolve => webSocket.addEventListener("open", resolve, { once: true }));
        println(`root with listener: ${internals.hasActivityRoot(webSocket)}`);

        webSocket.onclose = null;
        println(`root after removing listener: ${internals.hasActivityRoot(webSocket)}`);

        webSocket.onclose = () => {};
        frame.remove();
        await internals.gcAsync();
        println(`root after destroy: ${internals.hasActivityRoot(webSocket)}`);
        done();
    });
</script>
