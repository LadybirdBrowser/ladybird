<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    promiseTest(async () => {
        const frame = document.createElement("iframe");
        document.body.append(frame);

        const webSocket = new frame.contentWindow.WebSocket(`ws://localhost:${internals.getEchoServerPort()}/`);
        println(`listenerless: ${internals.hasPendingActivity(webSocket)}`);

        webSocket.onclose = () => {};
        await new Promise(resolve => webSocket.addEventListener("open", resolve, { once: true }));
        println(`with listener: ${internals.hasPendingActivity(webSocket)}`);

        webSocket.onclose = null;
        println(`after removing listener: ${internals.hasPendingActivity(webSocket)}`);

        webSocket.onclose = () => {};
        await new Promise(resolve => {
            frame.contentWindow.addEventListener("unload", resolve, { once: true });
            frame.remove();
        });
        // Collect after the unload task has finished destroying the document.
        await internals.gcAsync();
        println(`after destroy: ${internals.hasPendingActivity(webSocket)}`);
    });
</script>
