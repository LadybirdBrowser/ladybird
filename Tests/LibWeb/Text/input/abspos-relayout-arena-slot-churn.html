<!DOCTYPE html>
<script src="include.js"></script>
<style>
    body { margin: 0; }
    #stage { position: relative; width: 400px; height: 300px; }
    #boundary {
        position: absolute;
        left: 40px;
        top: 30px;
        width: 200px;
    }
    #inner div { height: 5px; }
</style>
<div id="stage">
    <div id="boundary">
        <div id="inner"></div>
    </div>
</div>
<script>
    // Structural partial relayout frees the replaced layout nodes before allocating their
    // replacements. The arena reuses those slots, keeping the per-pass used values store
    // bounded without periodic full passes to compact a separate index space.
    promiseTest(async () => {
        document.body.offsetHeight;

        const iterations = 400;
        const partialBefore = internals.partialLayoutCount();
        const fullBefore = internals.fullLayoutCount();
        const inner = document.getElementById("inner");
        for (let i = 0; i < iterations; ++i) {
            const children = [];
            for (let j = 0; j < 8; ++j)
                children.push(document.createElement("div"));
            inner.replaceChildren(...children);
            document.body.offsetHeight;
        }
        const partialDelta = internals.partialLayoutCount() - partialBefore;
        const fullDelta = internals.fullLayoutCount() - fullBefore;

        const boundaryRect = document.getElementById("boundary").getBoundingClientRect();
        println(`all-passes-partial=${partialDelta === iterations}`);
        println(`no-full-passes=${fullDelta === 0}`);
        println(`boundary=${boundaryRect.left},${boundaryRect.top},${boundaryRect.width},${boundaryRect.height}`);
        println(partialDelta === iterations
            && fullDelta === 0
            && boundaryRect.height === 40 ? "PASS" : "FAIL");
    });
</script>
