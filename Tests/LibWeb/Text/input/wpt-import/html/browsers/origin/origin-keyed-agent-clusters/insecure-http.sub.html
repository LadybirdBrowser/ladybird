<!DOCTYPE html>
<meta charset="utf-8">
<title>Parent requests origin-keying, child requests origin-keying, child is same-origin with the parent, but all over insecure HTTP</title>
<script src="../../../../resources/testharness.js"></script>
<script src="../../../../resources/testharnessreport.js"></script>

<div id="log"></div>

<script type="module">
import {
  insertIframe,
  testSameAgentCluster,
  testGetter
} from "./resources/helpers.mjs";

promise_setup(async () => {
  // NB: The text runner assigns this fixture an isolated insecure host. Keep its child on that host.
  await insertIframe(location.host, "?1");
});

// All origin-keying requests are ignored, since this is over insecure HTTP.
// So both end up in the site-keyed agent cluster.
testSameAgentCluster([self, 0]);

testGetter(self, false, "parent");
testGetter(0, false, "child");
</script>
