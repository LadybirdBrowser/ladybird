<h1>2d.color.space.toBlob.convert</h1>

<script>

promise_test(async t => {
  const canvas = document.createElement('canvas');
  canvas.width = 100;
  canvas.height = 50;
  const ctx = canvas.getContext('2d', {colorSpace: "srgb"});

  const color_style_1 = 'color(srgb 0 1 1)';
  const color_style_2 = 'color(srgb 0.8 0.2 0.8)';
  const color_spaces = ['srgb', 'srgb-linear', 'display-p3', 'display-p3-linear'];
  const expected_pixels_1 = {'srgb': [0, 255, 255, 255], 'srgb-linear': [0, 255, 255, 255], 'display-p3': [117, 251, 253, 255], 'display-p3-linear': [45, 247, 251, 255]};
  const expected_pixels_2 = {'srgb': [204, 51, 204, 255], 'srgb-linear': [154, 8, 154, 255], 'display-p3': [188, 64, 198, 255], 'display-p3-linear': [128, 13, 143, 255]};
  const epsilon = 2;

  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, 1, 1);
  ctx.fillStyle = color_style_1;
  ctx.fillRect(1, 0, 1, 1);
  ctx.fillStyle = color_style_2;
  ctx.fillRect(0, 1, 1, 1);
  ctx.fillStyle = 'white';
  ctx.fillRect(1, 1, 1, 1);

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1));
  const img = await createImageBitmap(blob);

  for (const dst_cs of color_spaces) {
    const dst_canvas = document.createElement('canvas');
    dst_canvas.width = 2;
    dst_canvas.height = 2;
    const dst_ctx = dst_canvas.getContext('2d', {colorSpace: dst_cs});
    dst_ctx.drawImage(img, 0, 0);

    const image_data = dst_ctx.getImageData(0, 0, 2, 2, {colorSpace: dst_cs});
    _assertSame(image_data.colorSpace, dst_cs, "image_data.colorSpace", "dst_cs");
    const pixels = image_data.data;
    const expected = [
      [0, 0, 0, 255],
      expected_pixels_1[dst_cs],
      expected_pixels_2[dst_cs],
      [255, 255, 255, 255]
    ];
    for (let i = 0; i < 4; ++i) {
      for (let c = 0; c < 4; ++c) {
        assert_approx_equals(pixels[4 * i + c], expected[i][c], epsilon,
            `Pixel ${i} component ${c} mismatch for dst: ${dst_cs}`);
      }
    }
  }
}, "Test toBlob color space preservation and conversion from a srgb canvas");
