<link rel="help" href="https://drafts.csswg.org/css-grid-1/#line-placement">
<meta name="assert" content="Auto-placed items with 'span &lt;integer&gt;' occupy that many tracks, and items whose only placement is a span for a named line ('span &lt;custom-ident&gt;', with or without an integer) are treated as spanning one track, in sparse and dense row and column flows.">

<style>
.grid {
    grid-auto-rows: 50px;
    grid-auto-columns: 100px;
}

.gridNamedGridLinesColumns {
    grid-template-columns: 50px 100px [line] 200px [line];
}

.gridNamedGridLinesRows {
    grid-template-rows: 50px 100px [line] 200px [line];
}

.autoRowAutoColumnSpanning3 {
    background-color: teal;
    grid-column: span 3;
    grid-row: auto;
}

.autoRowSpanning2AutoColumn {
    background-color: aqua;
    grid-column: auto;
    grid-row: span 2;
}

.autoRowSpanning3AutoColumn {
    background-color: salmon;
    grid-column: auto;
    grid-row: span 3;
}

.autoRowSpanning2AutoColumnSpanning2 {
    background-color: olive;
    grid-column: span 2;
    grid-row: span 2;
}

.autoRowAutoColumnSpanningLine {
    background-color: indigo;
    grid-column: span line; /* This is treated as "span 1". */
    grid-row: auto;
}

.autoRowSpanningLineAutoColumn {
    background-color: moccasin;
    grid-column: auto;
    grid-row: span line; /* This is treated as "span 1". */
}

.autoRowAutoColumnSpanning2Line {
    background-color: sienna;
    grid-column: span 2 line; /* This is treated as "span 1". */
    grid-row: auto;
}

.autoRowSpanning2LineAutoColumn {
    background-color: tomato;
    grid-column: auto;
    grid-row: span 2 line; /* This is treated as "span 1". */
}
</style>
<body onload="document.fonts.ready.then(() => { checkLayout('.grid'); })">
