<!doctype html>
<meta charset="utf-8">
<title>'page' property</title>
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#dom-stylepropertymap-get">
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#dom-stylepropertymap-set">
<link rel="help" href="https://drafts.css-houdini.org/css-typed-om-1/#property-stle-value-normalization">
<script src="../../../../resources/testharness.js"></script>
<script src="../../../../resources/testharnessreport.js"></script>
<script src="../../resources/testhelper.js"></script>
<script src="resources/testsuite.js"></script>
<body>
<div id="log"></div>
<script>
'use strict';

runPropertyTests('page', [
  { syntax: 'auto' },
  // FIXME: This should be <custom-ident>, but the test harness doesn't
  // currently support it.
  { syntax: 'custom-ident' },
  // 'row' is a keyword of other properties, but page has no such keyword, so
  // here it is an ordinary <custom-ident>: <custom-ident> excludes only the
  // CSS-wide keywords and 'default'. ('auto', tested above, is page's own
  // keyword and so is excluded as a page name.)
  { syntax: 'row' },
]);

// 'default' is excluded from every <custom-ident>.
runInvalidKeywordTests('page', [
  'default',
]);

</script>
