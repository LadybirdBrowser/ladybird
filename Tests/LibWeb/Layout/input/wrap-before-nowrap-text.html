<!DOCTYPE html>
<style>
    @font-face {
        font-family: Ahem;
        src: url("../../Ref/data/fonts/Ahem.ttf");
    }
    div {
        font: 10px/10px Ahem;
        width: 100px;
        margin-bottom: 10px;
        display: flow-root;
    }
    .float {
        float: left;
        width: 50px;
        height: 30px;
    }
    .nowrap {
        white-space: nowrap;
    }
</style>
