<!DOCTYPE html>
<style>
    body {
        margin: 0;
        font: 16px/1.5 monospace;
    }

    ul {
        margin: 0;
        padding-left: 100px;
    }

    li.flow-root {
        display: flow-root list-item;

        overflow: hidden;
        height: 40px;
    }
</style>

    <li class="flow-root">flow-root list item</li>

</ul>
