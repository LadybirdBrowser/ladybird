<!DOCTYPE html>
<style>
    button { font: inherit; overflow: hidden; padding: 0; border: 0; background: none; text-decoration: underline; }
    .padded { padding: 4px 8px; border: 2px solid; }
    .short { height: 30px; width: 40px; line-height: 20px; border: 2px solid; }
    .raised { height: 30px; border: 2px solid; }
    .raised span { display: block; margin-top: -40px; }
</style>
<p>Read the <button>terms</button> and the <button class="padded">privacy policy</button> before you agree.</p>
<p>x<button class="short">one two three four</button>y</p>
<p>x<button class="raised"><span>raised</span></button>y</p>
