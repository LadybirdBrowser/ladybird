<!DOCTYPE html>
<style>
.grid {
    display: grid;
    width: 300px;
}
.item {
    aspect-ratio: 2;
    background: green;
}
.content {
    width: 60px;
    height: 60px;
}
</style>
<!-- The item does not stretch to its row. -->
<div class="grid" style="grid-template-rows: 50px"><div class="item" style="overflow: hidden"></div></div>
<!-- The content-based minimum height grows the row. -->
<div class="grid" style="grid-template-columns: 50px"><div class="item"><div class="content"></div></div></div>
<!-- The columns are sized again from the row's block size. -->
<div class="grid" style="grid-template-columns: min-content"><div class="item"><div class="content"></div></div></div>
<!-- An automatic height behaves as auto for the minimum contribution. -->
<div class="grid" style="grid-template-rows: 0fr; height: 40px"><div class="item" style="overflow: hidden"></div></div>
<!-- A collapsed row collapses the column through the ratio. -->
<div class="grid" style="grid-template-columns: min-content; grid-template-rows: 0fr; height: 40px"><div class="item" style="overflow: hidden"><div class="content"></div></div></div>
<!-- A percentage of an indefinite size does not limit the item's content-based minimum. -->
<div class="grid" style="grid-template-columns: min-content; grid-template-rows: 20%"><div class="item"><div class="content"></div></div></div>
<!-- A fixed maximum of the row limits the content-based minimum. -->
<div class="grid" style="grid-template-rows: minmax(auto, 50px)"><div class="item"><div class="content" style="height: 200px"></div></div></div>
<!-- The transferred maximum limits the column sized from the row. -->
<div class="grid" style="grid-template-columns: min-content; grid-template-rows: 100px"><div class="item" style="max-height: 20px; overflow: hidden"></div></div>
<!-- An intrinsic height is not definite, so the item still fills its column. -->
<div class="grid"><div class="item" style="height: max-content"></div></div>
