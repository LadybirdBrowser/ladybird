<!DOCTYPE html>
<style>
.grid {
    display: grid;
    width: 200px;
}
.item {
    width: fit-content;
    background: green;
}
.box {
    display: inline-block;
    width: 40px;
    height: 40px;
}
</style>
<!-- The item contributes its min-content size. -->
<div class="grid" style="grid-template-columns: min-content"><div class="item"><span class="box"></span><span class="box"></span></div></div>
<!-- The automatic minimum size is zero for an item spanning flexible tracks. -->
<div class="grid" style="width: min-content; grid-template-columns: 1fr 1fr"><div class="item" style="grid-column: span 2"><span class="box"></span></div></div>
