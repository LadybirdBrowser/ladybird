<!DOCTYPE html>
<style>
    * {
        font-family: SerenitySans;
    }

    .grid {
        display: grid;
        grid-template-columns: auto 1px;
        width: 10px;
        height: 10px;
    }

    .item {
        aspect-ratio: 2;
        height: 40px;
    }

    .marker {
        width: 1px;
        height: 1px;
    }
</style>
<div class="grid">
    <div class="item">XXXXXXXXXX</div>
    <div class="marker"></div>
</div>
