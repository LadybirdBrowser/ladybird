<!DOCTYPE html>
<style>
.grid {
    display: grid;
    width: 300px;
}
.definite {
    height: 300px;
}
.item {
    aspect-ratio: 2;
    height: 100%;
    overflow: hidden;
    background: green;
}
.content {
    width: 60px;
    height: 60px;
}
</style>
<!-- The width transfers from the percentage height resolved against a fixed row. -->
<div class="grid definite" style="grid-template-columns: 1fr; grid-template-rows: 50px"><div class="item"></div></div>
<!-- A percentage does not resolve against the grid container while the columns are sized. -->
<div class="grid definite" style="grid-template-columns: min-content; grid-template-rows: min-content"><div class="item"><div class="content"></div></div></div>
<!-- The columns are sized again once the row is known. -->
<div class="grid definite" style="grid-template-columns: 1fr; grid-template-rows: 1fr"><div class="item"></div></div>
<!-- A percentage row of an indefinite grid resolves only after the rows are sized. -->
<div class="grid" style="grid-template-columns: 1fr; grid-template-rows: 20%"><div class="item"></div></div>
