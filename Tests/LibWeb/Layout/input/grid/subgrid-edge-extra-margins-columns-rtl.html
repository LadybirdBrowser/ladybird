<!DOCTYPE html>
<style>
    body {
        margin: 0;
        font: 20px SerifPro;
    }

    .parent {
        display: grid;
        grid-template-columns: repeat(5, auto);
        width: max-content;
        direction: rtl;
    }

    .subgrid {
        display: grid;
        grid-column: 2 / 5;
        grid-template-columns: subgrid;
        margin-inline: 5px 7px;
        border-style: solid;
        border-width: 0;
        border-inline-width: 3px 4px;
        padding-inline: 40px 30px;
        background: lightgray;
    }
</style>
<div class="parent">
    <div style="grid-column: 1">Before</div>
    <div class="subgrid">
        <div style="grid-column: 1">First</div>
        <div style="grid-column: 2">Middle</div>
        <div style="grid-column: 3">Last</div>
    </div>
    <div style="grid-column: 5">After</div>
</div>
