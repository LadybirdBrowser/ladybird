<!DOCTYPE html>
<style>
.grid {
    display: grid;
    grid-template-columns: 1fr min-content 1fr;
    width: 200px;
}
.item {
    grid-column: 2;
    display: flex;
    overflow: hidden;
}
.content {
    width: 58px;
    height: 58px;
    background: green;
}
</style>
<div class="grid"><div class="item"><div class="content"></div></div></div>
