<!DOCTYPE html>
<style>
    :modal {
        display: flex;
    }
</style>

<dialog id="modal">
    <span>I'm a node</span>
</dialog>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        let modal = document.getElementById('modal');
        getComputedStyle(modal).display;
        modal.showModal();
    });
</script>
