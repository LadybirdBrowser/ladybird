<!DOCTYPE html>
<svg id="svg" width="100" height="100">
    <switch id="non-svg-first">
        <rect id="chosen-1" width="10" height="10"/>
        <circle r="5"/>
    </switch>
    <switch id="hidden-first">
        <rect style="display: none" width="10" height="10"/>
        <circle id="chosen-2" r="5"/>
        <rect width="10" height="10"/>
    </switch>
    <switch id="conditional-attributes">
        <rect systemLanguage="xx-unknown" width="10" height="10"/>
        <g id="chosen-3"><rect width="5" height="5"/></g>
        <rect width="10" height="10"/>
    </switch>
    <switch id="text-and-comments">
        text<!-- comment --><text id="chosen-4" y="20">svg text</text>
        <rect width="10" height="10"/>
    </switch>
</svg>
<script>
    // NB: The HTML parser cannot put an HTML element inside <svg>, so insert one from script.
    const div = document.createElement("div");
    div.textContent = "html";
    document.getElementById("non-svg-first").prepend(div);
</script>
