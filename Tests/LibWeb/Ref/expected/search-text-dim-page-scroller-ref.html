<!DOCTYPE html>
<style>
#scroller,
#scroller-over-dim {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 300px;
    height: 70px;
    overflow: hidden;
    font-size: 20px;
    line-height: 30px;
}
.dim {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-color: rgb(26 26 26 / calc(64 / 255));
}
.over-dim {
    z-index: 2;
    visibility: hidden;
}
.hole,
.current {
    visibility: visible;
}
.hole,
.hole > span,
.current,
.current > span {
    border-radius: 3px;
}
.hole {
    box-shadow: 0 0 0 1px white, 0 0 1px 1px rgb(0 0 0 / 50%);
}
.current {
    box-shadow: 0 0 0 1px white, 0 1px 4px 1px rgb(0 0 0 / 40%);
}
.current,
.current > span {
    margin: -2px;
    padding: 2px;
}
.hole > span {
    background-color: white;
}
.current > span {
    background-color: orange;
}
</style>
<div id="scroller"><br>needle<br>needle<br>needle</div>
<div class="dim"></div>
<div id="scroller-over-dim" class="over-dim"><br><span class="current"><span>needle</span></span><br><span class="hole"><span>needle</span></span><br><span class="hole"><span>needle</span></span></div>
<script>
document.getElementById("scroller").scrollTop = 15;
document.getElementById("scroller-over-dim").scrollTop = 15;
</script>
