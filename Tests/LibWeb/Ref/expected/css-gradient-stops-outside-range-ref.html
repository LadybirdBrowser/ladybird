<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    div {
        float: left;
        width: 100px;
        height: 100px;
        margin: 0 10px 10px 0;
    }
</style>
<div style="background: linear-gradient(rgb(100, 100, 100), rgb(200, 200, 200))"></div>
<div style="background: linear-gradient(black, rgb(100, 100, 100))"></div>
<div style="background: linear-gradient(90deg, rgb(50, 50, 50), rgb(100, 100, 100))"></div>
<div style="background: radial-gradient(circle 50px, rgb(100, 100, 100), rgb(200, 200, 200))"></div>
<div style="background: radial-gradient(circle 50px, black, rgb(200, 200, 200))"></div>
<div style="background: conic-gradient(rgb(100, 100, 100), rgb(200, 200, 200))"></div>
<div style="background: conic-gradient(black, rgb(100, 100, 100))"></div>
