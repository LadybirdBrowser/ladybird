<!DOCTYPE html>
<html class="reftest-wait">
<style>
    body { margin: 0; background: #303030; color: #ffffff; font-size: 40px; }
    #offset { text-shadow: 4px 4px 0 #000000; }
    #outline { text-shadow: -2px 0 1px #000000, 2px 0 1px #000000, 0 -2px 1px #000000, 0 2px 1px #000000; }
</style>
<div id="offset">shadowed</div>
<div id="outline">outlined</div>
<script>
    // The same page with force-dark off. It must render identically to the test.
    if (window.internals)
        internals.setForceDarkEnabled(false);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.documentElement.classList.remove("reftest-wait");
        });
    });
</script>
</html>
