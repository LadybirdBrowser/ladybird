<!DOCTYPE html>
<html class="reftest-wait">
<style>
    body { margin: 0; background: #808080; }
    div { position: absolute; top: 0; width: 100px; height: 100px; background: rgb(18, 18, 18); }
    #a { left: 0; }
    #b { left: 100px; }
</style>
<div id="a"></div>
<div id="b"></div>
<script>
    if (window.internals)
        internals.setForceDarkEnabled(false);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.documentElement.classList.remove("reftest-wait");
        });
    });
</script>
</html>
