<!DOCTYPE html>
<style>
body {
    margin: 0;
    background: white;
}
.backdrop {
    position: absolute;
    left: 0;
    top: 0;
    width: 400px;
    height: 300px;
    background: rgb(0, 255, 0);
}
.inverted {
    position: absolute;
    top: 50px;
    width: 100px;
    height: 100px;
    background: rgb(255, 0, 255);
}
.tinted {
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 255, 0.5);
}
#a { left: 0; }
#b { left: 150px; }
#c {
    left: 270px;
    opacity: 0.5;
}
</style>
<div class="backdrop"></div>
<div id="a" class="inverted"></div>
<div id="b" class="inverted"><div class="tinted"></div></div>
<div id="c" class="inverted"></div>
