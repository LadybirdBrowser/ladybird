<!DOCTYPE html>
<style>
body {
    margin: 0;
    background: white;
}
.backdrop {
    position: absolute;
    left: 0;
    top: 0;
    width: 300px;
    height: 200px;
    background: rgb(0, 255, 0);
}
.filtered {
    position: absolute;
    left: 100px;
    top: 50px;
    width: 50px;
    height: 50px;
    border-radius: 10px;
    transform: scale(2);
    background: rgb(255, 0, 255);
    opacity: 0.5;
}
</style>
<div class="backdrop"></div>
<div class="filtered"></div>
