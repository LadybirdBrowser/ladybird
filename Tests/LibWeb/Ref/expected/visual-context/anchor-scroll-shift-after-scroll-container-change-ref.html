<!DOCTYPE html>
<style>
    body { margin: 0; }
    #cb { position: relative; width: 300px; height: 300px; }

    #anchor { margin-top: -10px; width: 20px; height: 20px; background: gray; }
    #spacer { height: 500px; }

</style>
<div id="cb">
    <div id="container"><div id="anchor"></div><div id="spacer"></div></div>
    <div id="target"></div>
</div>
