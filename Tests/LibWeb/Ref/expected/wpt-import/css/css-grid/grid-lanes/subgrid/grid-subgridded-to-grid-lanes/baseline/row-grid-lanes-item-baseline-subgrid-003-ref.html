<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid {
    display: inline grid;
    grid-template-rows: auto;
    grid-template-columns: auto auto;
    writing-mode: vertical-rl;
    font: 16px/1 Ahem;
    border: 1px solid black;
    align-items: baseline;
  }
  .subgrid {
    display: grid;
    grid: subgrid / auto;
    align-items: baseline;
    margin-block-start: 15px;
    border-block-start: 9px solid blue;
    padding-block-start: 6px;
  }
  .b { text-decoration: underline; }
  .big   { font-size: 24px; }
  .small { font-size: 20px; }
</style>
<div class="grid">
  <div class="b big">X</div>
  <div class="subgrid"><div class="b small">X</div></div>
</div>
