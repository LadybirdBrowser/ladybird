<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid {
    display: inline grid;
    grid-template-rows: 60px minmax(40px, auto) repeat(2, auto);
    grid-template-columns: auto auto;
    font: 16px/1 Ahem;
    border: 1px solid black;
    place-content: start;
    align-items: baseline;
  }
  .subgrid {
    grid-row: 1 / -1;
    display: grid;
    grid: subgrid / auto;
    grid-auto-flow: column;
    align-items: baseline;
  }
  .b { text-decoration: underline; }
  .big   { font-size: 40px; }
  .med   { font-size: 28px; }
  .small { font-size: 20px; }
  .r1 { grid-row: 1; }
  .r2 { grid-row: 2; }
  .r3 { grid-row: 3; }
  .r4 { grid-row: 4; }
</style>
<div class="grid">
  <div class="b small r1">X</div>
  <div class="b small r2">X</div>
  <div class="b small r3">X</div>
  <div class="b small r4">X</div>
  <div class="subgrid">
    <div class="b med">X</div>
    <div class="b big">X</div>
    <div class="b med">X</div>
    <div class="b big">X</div>
  </div>
</div>
