<!DOCTYPE html>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<style>
  body { margin: 0; }
  .lanes {
    background: #cdd5e0;
    display: grid-lanes;
    gap: 20px;
    grid-lanes-direction: row;
    grid-template-rows: repeat(2, 60px);
    width: max-content;
  }
  .lanes > div {
    background: #5b8def;
    grid-row: 1;
    width: 40px;
  }
  .lanes > .spanner {
    background: #8a6df0;
    grid-row: 1 / -1;
  }
</style>
<div class="lanes">
  <div></div>
  <div class="spanner"></div>
  <div></div>
</div>
