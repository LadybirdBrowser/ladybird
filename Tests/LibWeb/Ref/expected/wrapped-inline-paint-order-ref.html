<!doctype html>
<link rel="stylesheet" href="../data/fonts/ahem.css">
<style>
    body { margin: 40px; font: 20px/20px Ahem; }
    div { width: 100px; margin-bottom: 60px; }
    span { border: 2px solid black; background: lightgray; padding: 10px; position: relative; z-index: 0; }
    .first { border-right: 0; padding-right: 0; }
    .last { border-left: 0; padding-left: 0; }
    .atomic { display: inline-block; width: 60px; height: 20px; background: blue; position: relative; z-index: 0; }
</style>
<div><span class="first">XXX</span><br><span class="last">XXX</span></div>
<div><span class="first">XXX</span><br><span class="last">XXX</span></div>
<div style="opacity: .5"><span class="first">XXX</span><br><span class="last">XXX</span></div>
<div><i class="atomic"></i><br><span>XXX</span></div>
<div><span>XXX</span><br><i class="atomic"></i></div>
