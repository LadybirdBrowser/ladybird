<!DOCTYPE html>
<style>
body { margin: 0; }
.grid { display: grid; width: 170px; grid-template-columns: repeat(auto-fit, 50px); grid-auto-rows: 50px; column-gap: 10px; }
.grid > div { background: gray; }
.rule { position: absolute; left: 50px; top: 0; width: 10px; height: 50px; background: green; }
</style>
<div class="grid"><div style="grid-column: 1"></div><div style="grid-column: 3"></div></div>
<div class="rule"></div>
