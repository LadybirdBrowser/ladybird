<!DOCTYPE html>
<html class="reftest-wait">
<style>
    body { margin: 0; }
    #scroller { position: absolute; left: 0; top: 0; width: 800px; height: 600px; overflow: auto; }
    #toolbar { position: sticky; top: 0; height: 60px; }
    #label { position: absolute; left: 10px; top: 10px; width: 100px; height: 40px; background: green; }
    #spinner { position: absolute; left: 650px; top: 10px; width: 40px; height: 40px; background: orange; transform: rotate(45deg); }
    .card { position: relative; height: 200px; margin-bottom: 20px; background: blue; }
</style>
<div id="scroller">
    <div id="toolbar"><div id="label"></div><div id="spinner"></div></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
</div>
<script>
    const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
    window.onload = async () => {
        document.getElementById("scroller").scrollTop = 100;
        for (let i = 0; i < 4; ++i)
            await frame();
        if (window.internals)
            internals.signalTestIsDone("PASS");
        else
            document.documentElement.classList.remove("reftest-wait");
    };
</script>
