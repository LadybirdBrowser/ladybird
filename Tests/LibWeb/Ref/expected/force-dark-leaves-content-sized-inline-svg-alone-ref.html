<!DOCTYPE html>
<html class="reftest-wait">
<style>
    body { margin: 0; background: #808080; }
    svg { display: block; }
</style>
<svg width="100" height="100">
    <rect width="100" height="100" fill="#ffffff"></rect>
    <rect x="10" y="10" width="30" height="30" fill="#000000"></rect>
    <rect x="60" y="10" width="30" height="30" fill="#000000"></rect>
    <rect x="10" y="60" width="30" height="30" fill="#000000"></rect>
    <path d="M 60 60 L 90 60 L 90 90 Z" fill="none" stroke="#000000" stroke-width="4"></path>
</svg>
<svg width="65" height="20"><rect width="65" height="20" fill="#000000"></rect></svg>
<svg width="20" height="65"><rect width="20" height="65" fill="#000000"></rect></svg>
<svg width="60" height="60" style="padding: 4px"><rect width="60" height="60" fill="#000000"></rect></svg>
<svg width="200" height="50">
    <svg width="40" height="40"><rect width="40" height="40" fill="#000000"></rect></svg>
</svg>
<script>
    // The same page with force-dark off. It must render identically to the test.
    if (window.internals)
        internals.setForceDarkEnabled(false);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.documentElement.classList.remove("reftest-wait");
        });
    });
</script>
</html>
