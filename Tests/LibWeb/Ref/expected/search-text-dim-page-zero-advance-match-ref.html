<!DOCTYPE html>
<style>
@font-face {
    font-family: Ahem;
    src: url("../data/fonts/Ahem.ttf");
}
p {
    position: absolute;
    top: 20px;
    left: 20px;
    margin: 0;
    font: 20px/1 Ahem;
    letter-spacing: -20px;
    color: green;
}
.dim {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-color: rgb(26 26 26 / calc(64 / 255));
}
.over-dim {
    z-index: 2;
    color: black;
}
</style>
<p>x</p>
<div class="dim"></div>
<p class="over-dim">x</p>
