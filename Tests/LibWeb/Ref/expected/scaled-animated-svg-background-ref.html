<!DOCTYPE html>
<html class="reftest-wait">
<style>
body { margin: 0; }
.box { position: absolute; left: 8px; width: 96px; height: 96px; overflow: hidden; }
.strip { width: 192px; height: 100%; background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' preserveAspectRatio='none'><circle cx='12' cy='12' r='10' fill='none' stroke='blue' stroke-width='1'/></svg>"); background-size: 96px 96px; background-repeat: repeat-x; }
.first { top: 8px; }
.second { top: 112px; width: 48px; height: 48px; }
.third { left: 112px; top: 8px; }
.fourth { left: 112px; top: 112px; }
.first .strip { background-position: -8px 0; }
.second .strip { width: 96px; background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='none' stroke='blue' stroke-width='1'/></svg>"); background-size: 48px 24px; background-position: -4px 0; }
.fourth .strip { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><circle cx='48' cy='48' r='40' fill='none' stroke='blue' stroke-width='4'/></svg>"); background-size: auto; }
</style>
<div class="box first"><div class="strip"></div></div>
<div class="box second"><div class="strip"></div></div>
<div class="box third"><div class="strip"></div></div>
<div class="box fourth"><div class="strip"></div></div>
<script>
requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(() => {
    document.documentElement.classList.remove("reftest-wait");
})));
</script>
</html>
