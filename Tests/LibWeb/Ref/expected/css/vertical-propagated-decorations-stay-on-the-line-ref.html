<style>
body { margin: 10px; display: flex; gap: 20px; }
div { font: 20px/3 serif; height: 200px; }

.o { text-decoration: overline 3px green; text-decoration-skip-ink: none; }
.shifted { line-height: 0; color: transparent; }
</style>
