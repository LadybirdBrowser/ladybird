<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }

    .stage {
        position: relative;
        width: 400px;
        height: 300px;
        perspective: 300px;
    }

    .tilted {
        position: absolute;
        left: 100px;
        top: 50px;
        width: 200px;
        height: 200px;
        transform: rotateX(50deg) rotate(30deg);
    }

    svg {
        display: block;
        width: 200px;
        height: 200px;
    }
</style>
<div>
    <div class="stage">
        <div class="tilted">
            <svg viewBox="0 0 20 20">
                <rect width="20" height="20" fill="green" />
                <circle cx="3" cy="3" r="3" fill="blue" />
                <circle cx="17" cy="17" r="3" fill="blue" />
                <circle cx="17" cy="3" r="3" fill="blue" />
                <circle cx="3" cy="17" r="3" fill="blue" />
            </svg>
        </div>
    </div>
</div>
