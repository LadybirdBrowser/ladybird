<!DOCTYPE html>
<style>
    body {
        margin: 0;

    #scroller {
        position: relative;
        width: 300px;
        height: 150px;
        background: red;
    }

    #target {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 40px;
        height: 40px;
        background: green;
    }
</style>
<div id="scroller"><div id="target"></div></div>
