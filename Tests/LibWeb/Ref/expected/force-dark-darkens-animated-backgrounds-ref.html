<!DOCTYPE html>
<html class="reftest-wait">
<style>
    body { margin: 0; background: #ffffff; }
    .box { width: 80px; height: 40px; margin: 8px; background: rgb(240, 240, 200); }
</style>
<div class="box"></div>
<script>
    if (window.internals)
        internals.setForceDarkEnabled(true);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.documentElement.classList.remove("reftest-wait");
        });
    });
</script>
</html>
