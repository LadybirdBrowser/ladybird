<!DOCTYPE html>
<style>
    body { margin: 40px; }
    div {
        width: 120px;
        height: 20px;
        margin-bottom: 80px;
        transform-origin: 0 0;
        background-image: linear-gradient(green, green);
        background-size: 20px 200px;
    }
    #rotated { transform: rotate(25deg); }
    #skewed { transform: skew(25deg); }
</style>
<div id="rotated"></div>
<div id="skewed"></div>
