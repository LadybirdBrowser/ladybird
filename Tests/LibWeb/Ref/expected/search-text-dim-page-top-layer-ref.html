<!DOCTYPE html>
<style>
body {
    font-size: 20px;
    line-height: 1.5;
}
.dialog {
    position: fixed;
    inset: 0;
    width: 200px;
    height: 60px;
    margin: auto;
    padding: 10px;
    border: 2px solid black;
    background-color: white;
    color: black;
}
.backdrop {
    position: fixed;
    inset: 0;
    background-color: rgb(0 0 255 / 25%);
}
.dim {
    position: fixed;
    inset: 0;
    background-color: rgb(26 26 26 / calc(64 / 255));
}
.over-dim {
    border-color: transparent;
    background-color: transparent;
    visibility: hidden;
}
.current {
    visibility: visible;
    box-shadow: 0 0 0 1px white, 0 1px 4px 1px rgb(0 0 0 / 40%);
}
.current,
.current span {
    margin: -2px;
    padding: 2px;
    border-radius: 3px;
}
.current span {
    background-color: orange;
}
</style>
<div class="backdrop"></div>
<div class="dialog">needle</div>
<div class="dim"></div>
<div class="dialog over-dim"><span class="current"><span>needle</span></span></div>
