<!doctype html>
<style>
    body {
        margin: 0;
        font: 20px/24px monospace;
    }

    .case {
        overflow: hidden;
        margin-bottom: 8px;
    }

    .two-lines {
        width: 12ch;
    }

    .one-line {
        width: 10ch;
    }

    .narrow-one-line {
        width: 100px;
        font: 16px/20px monospace;
    }

    .atom {
        display: inline-block;
        width: 2ch;
        height: 16px;
        background: green;
    }

    .nested {
        color: maroon;
    }

    .text-overflow {
        width: 10.1ch;
        padding: 4px;
        font: 16px/32px monospace;
    }

    .effects {
        text-shadow: 2px 2px blue;
        text-decoration: green solid underline overline 1px;
    }

    .propagated-decoration {
        text-decoration: line-through 2px purple;
    }

    .rtl-text {
        direction: rtl;
        unicode-bidi: isolate;
        background: lightblue;
    }

    .rtl-paragraph {
        direction: rtl;
    }

    .blank-line {
        position: relative;
        left: 10px;
        width: 12ch;
        padding: 0 12px;
        white-space: pre;
    }

    .following-abspos {
        position: relative;
    }

    .preserved {
        white-space: pre;
    }

    .overlay {
        position: absolute;
        top: 0;
        right: 0;
        width: 20px;
        height: 20px;
        background: green;
    }

    .fragmented-text-overflow {
        width: 9ch;
        white-space: nowrap;
    }

    .trailing-inline-padding span {
        background: lightblue;
    }
</style>
