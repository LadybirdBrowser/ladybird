<!DOCTYPE html>
<style>
    body {
        margin: 0;
    }
    #rotated {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 100px;
        height: 60px;
        transform: rotate(90deg);
    }
    #visible {
        margin-top: 10px;
        width: 100px;
        height: 40px;
        background: green;
    }
</style>
<div id="rotated"><div id="visible"></div></div>
