<!DOCTYPE html>
<link rel="match" href="../expected/text-overflow-ellipsis-on-a-later-line-ref.html">
<style>
    @font-face { font-family: Ahem; src: url("../data/fonts/Ahem.ttf"); }
    div { width: 100px; font: 20px/20px Ahem; overflow: hidden; text-overflow: ellipsis; margin-bottom: 10px; }
    span { color: green; }
</style>
<!-- The word that overflows is on the second line, so that line ends in the ellipsis, at its end edge. The word is green
     and the ellipsis takes the block's black, so a line drawn without the ellipsis, or with one in the word's style, doesn't
     match. -->
<div>ab <span>abcdefghijklmnopqrstu</span> cd</div>
<div dir="rtl">ab <span>abcdefghijklmnopqrstu</span> cd</div>
