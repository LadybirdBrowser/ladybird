<!DOCTYPE html>
<link rel="match" href="../expected/svg-text-decoration-positioning-ref.html" />
<style>
    @font-face {
        font-family: Ahem;
        src: url("../data/fonts/Ahem.ttf");
    }
    body { margin: 0; }
    svg {
        display: block;
        font: 10px Ahem;
    }
    text {
        text-decoration: dashed underline;
        text-decoration-thickness: 2px;
    }
</style>
<svg width="200" height="200">
    <text x="20" y="20" dx="0 0 0 0">ABCD</text>
    <text x="20" y="50" dx="0 0 0 0" style="text-decoration-style: wavy">ABCD</text>
    <text x="20" y="80" dx="0 0 10 0">ABCD</text>
    <text x="20" y="110" dx="0 0 -5 0">ABCD</text>
    <text x="20" y="140" dy="0 0 10 0">ABCD</text>
    <text x="20" y="180" textLength="70">ABCD</text>
</svg>
