<!DOCTYPE html>
<link rel="match" href="../expected/iframe-composited-drop-shadow-of-content-outside-its-clip-ref.html">
<style>
    iframe { display: block; width: 200px; height: 150px; border: 0; }
</style>
<iframe srcdoc="<!DOCTYPE html>
    <style>
        body { margin: 0; }
        .clip { position: relative; overflow: hidden; width: 200px; height: 150px; }
        .box { position: absolute; left: -50px; top: 20px; width: 40px; height: 40px; background: black; }
        canvas { position: absolute; left: 100px; top: 100px; }
    </style>
    <div class='clip'>
        <div style='filter: drop-shadow(80px 0 0 blue)'>
            <div class='box'></div>
            <canvas width='20' height='20'></canvas>
        </div>
    </div>
    <script>
        const context = document.querySelector('canvas').getContext('2d');
        context.fillStyle = 'lime';
        context.fillRect(0, 0, 20, 20);
    </script>"></iframe>
