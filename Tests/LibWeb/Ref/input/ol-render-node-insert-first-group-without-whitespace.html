<!DOCTYPE html>
<head>
    <link rel="match" href="../expected/ol-render-node-insert-first-group-without-whitespace-ref.html" />
</head>
<html class="reftest-wait">
<body>
<ol id="list"><li id="three">Three</li><li>Four</li></ol>
<script>
    // Two nested requestAnimationFrame() calls to force code execution _after_ initial paint
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            const group = document.createElement("div");
            group.innerHTML = "<li>One</li><li>Two</li>";
            document.getElementById("list").insertBefore(group, document.getElementById("three"));
            document.documentElement.classList.remove("reftest-wait");
        });
    });
</script>
</body>
</html>
