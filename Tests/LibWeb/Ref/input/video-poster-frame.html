<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../expected/object-image-late-load-ref.html">
<style>
    body {
        margin: 0;
    }
    video {
        display: block;
        width: 100px;
        height: 100px;
    }
</style>
<video id="video" poster="../data/smiley.png"></video>
<script>
    const image = new Image();
    image.src = "../data/smiley.png";
    image.decode().then(() => {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (window.internals)
                    internals.signalTestIsDone("PASS");
                else
                    document.documentElement.classList.remove("reftest-wait");
            });
        });
    });
</script>
</html>
