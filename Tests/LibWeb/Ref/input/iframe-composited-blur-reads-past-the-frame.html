<!DOCTYPE html>
<link rel="match" href="../expected/iframe-composited-blur-reads-past-the-frame-ref.html">
<style>
    iframe { display: block; width: 200px; height: 150px; border: 0; }
</style>
<iframe srcdoc="<!DOCTYPE html>
    <style>
        body { margin: 0; }
        .box { position: absolute; left: -100px; top: 25px; width: 200px; height: 100px; background: black; }
        canvas { position: absolute; left: 160px; top: 25px; }
    </style>
    <div style='filter: blur(12px)'>
        <div class='box'></div>
        <canvas width='20' height='20'></canvas>
    </div>
    <script>
        const context = document.querySelector('canvas').getContext('2d');
        context.fillStyle = 'lime';
        context.fillRect(0, 0, 20, 20);
    </script>"></iframe>
