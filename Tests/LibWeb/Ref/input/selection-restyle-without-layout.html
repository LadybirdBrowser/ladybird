        margin: 10px 0;
    }

        background-color: transparent;
        color: green;
    }

<p id="target">Restyled after the selection was painted</p>

    range.selectNodeContents(document.getElementById("target").firstChild);
    getSelection().addRange(range);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.getElementById("target").className = "restyled";
            requestAnimationFrame(() => {
                if (window.internals)
                    internals.signalTestIsDone("PASS");
                else
                    document.documentElement.classList.remove("reftest-wait");
            });
        });
    });
