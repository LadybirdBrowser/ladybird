<!DOCTYPE html>
<link rel="match" href="../expected/overflow-x-clip-in-column-reverse-scroll-container-ref.html" />
<style>
body {
    margin: 0;
}
#scroller {
    width: 300px;
    height: 200px;
    overflow-y: auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column-reverse;
}
#content {
    flex-shrink: 0;
    overflow-x: clip;
}
#content > div {
    height: 100px;
}
</style>
<div id="scroller">
    <div id="content">
        <div style="background: red"></div>
        <div style="background: orange"></div>
        <div style="background: yellow"></div>
        <div style="background: green"></div>
        <div style="background: blue"></div>
    </div>
</div>
<script>
    document.getElementById("scroller").scrollTop = -150;
</script>
