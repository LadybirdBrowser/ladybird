<!DOCTYPE html>
<link rel="match" href="../expected/border-image-svg-ref.html">
<style>
body {
    margin: 0;
}

/* An SVG border image is sliced and drawn like a raster one: Its corners go to the corners, and its edges are repeated
   along the edges as border-image-repeat says. Each edge here is half green and half blue, at 20px by 20px. */
div {
    height: 20px;
    margin: 10px;
    border: 20px solid transparent;
    border-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' shape-rendering='crispEdges'><rect width='30' height='30' fill='lime'/><rect width='10' height='10' fill='red'/><rect x='20' width='10' height='10' fill='red'/><rect y='20' width='10' height='10' fill='red'/><rect x='20' y='20' width='10' height='10' fill='red'/><rect x='10' width='5' height='10' fill='green'/><rect x='15' width='5' height='10' fill='blue'/><rect x='10' y='20' width='5' height='10' fill='green'/><rect x='15' y='20' width='5' height='10' fill='blue'/></svg>") 10;
}
</style>
<div style="width: 60px; border-image-repeat: stretch"></div>
<div style="width: 50px; border-image-repeat: repeat"></div>
<div style="width: 66px; border-image-repeat: round"></div>
<div style="width: 46px; border-image-repeat: space"></div>
