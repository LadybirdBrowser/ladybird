<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../expected/force-dark-leaves-clipped-photos-alone-ref.html">
<style>
    body { margin: 0; background: #808080; }
    #clip {
        width: 40px;
        height: 30px;
        background-image: url("../data/force-dark-flat-white-square.png");
        background-size: 400px 300px;
        background-repeat: repeat;
        image-rendering: pixelated;
    }
</style>
<div id="clip"></div>
<script>
    // The border box clips this background to a sliver of the 400x300 area it's laid out at. A photo doesn't become
    // an icon by being mostly clipped away — classification must judge the layout size and the full decoded frame.
    if (window.internals)
        internals.setForceDarkEnabled(true);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.documentElement.classList.remove("reftest-wait");
        });
    });
</script>
</html>
