<!doctype html>
<link rel="match" href="../expected/background-attachment-local-fractional-far-edge-ref.html">
<style>
body { margin: 0; }
.scroller {
    position: absolute;
    width: 100px;
    height: 100px;
    overflow: hidden;
    background: linear-gradient(green, green) 0 0 / 4px 4px local;
}
.scroller > div { width: 200px; height: 200px; }
.both { left: 10.75px; top: 10.75px; }
.horizontal { left: 130.75px; top: 10px; }
.vertical { left: 250px; top: 10.75px; }
.negative { left: -0.25px; top: 130.75px; }
</style>
<div class="scroller both"><div></div></div>
<div class="scroller horizontal"><div></div></div>
<div class="scroller vertical"><div></div></div>
<div class="scroller negative"><div></div></div>
<script>
for (const scroller of document.querySelectorAll(".scroller")) {
    scroller.scrollLeft = scroller.scrollWidth;
    scroller.scrollTop = scroller.scrollHeight;
}
</script>
