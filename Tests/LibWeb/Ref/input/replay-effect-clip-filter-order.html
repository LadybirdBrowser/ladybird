<!DOCTYPE html>
<link rel="match" href="../expected/replay-effect-clip-filter-order-ref.html">
<style>
    html { background: white; }
    body { margin: 0; }
    #outer { overflow: hidden; width: 80px; height: 80px; }
    #effect { margin: 20px; width: 40px; height: 20px; filter: blur(4px); }
    #inner { overflow: hidden; width: 20px; height: 20px; }
    #content { width: 40px; height: 20px; background: red; }
</style>
<!-- The inner clip trims the input, but must not trim the blurred layer output. -->
<div id="outer"><div id="effect"><div id="inner"><div id="content"></div></div></div></div>
