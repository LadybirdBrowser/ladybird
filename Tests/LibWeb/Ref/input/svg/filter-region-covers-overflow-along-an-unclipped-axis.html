<!DOCTYPE html>
<link rel="match" href="../../expected/svg/filter-region-covers-overflow-along-an-unclipped-axis-ref.html" />
<style>
    body { margin: 0; }
    #parent { margin-top: 100px; width: 100px; height: 100px; overflow-x: clip; overflow-y: visible; filter: url(#identity); }
    #child { position: relative; top: -100px; width: 100px; height: 100px; background: green; }
</style>
<svg width="0" height="0" style="position: absolute">
    <filter id="identity" x="0" y="0" width="1" height="1">
        <feOffset dx="0" dy="0" />
    </filter>
</svg>
<!-- The parent clips only horizontally, so the child above it still counts toward its filter region. -->
<div id="parent"><div id="child"></div></div>
