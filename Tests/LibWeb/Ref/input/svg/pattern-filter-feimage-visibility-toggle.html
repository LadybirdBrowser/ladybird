<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../../expected/svg/green-square-100-ref.html">
<style>
    #target {
        visibility: hidden;
    }
    #preload {
        display: none;
    }
</style>
<img id="preload" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAD0lEQVR4nGNgaGBAIOI4ANA0CAF5jtVRAAAAAElFTkSuQmCC">
<svg width="100" height="100">
    <defs>
        <filter id="image-filter" x="0" y="0" width="100%" height="100%">
            <feImage href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAD0lEQVR4nGNgaGBAIOI4ANA0CAF5jtVRAAAAAElFTkSuQmCC" />
        </filter>
        <pattern id="tile" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="red" filter="url(#image-filter)" />
        </pattern>
    </defs>
    <rect id="target" width="100" height="100" fill="url(#tile)" />
</svg>
<script>
    const target = document.getElementById("target");
    const finish = () => {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (window.internals)
                    internals.signalTestIsDone("PASS");
                else
                    document.documentElement.classList.remove("reftest-wait");
            });
        });
    };
    const showTargetAfterPaint = () => {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                target.style.visibility = "visible";
                finish();
            });
        });
    };
    const preload = document.getElementById("preload");
    if (preload.complete)
        showTargetAfterPaint();
    else
        preload.addEventListener("load", showTargetAfterPaint, { once: true });
</script>
</html>
