        <feFlood flood-color="white" />
    </filter>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
        <rect id="child" width="50" height="100" filter="url(#flood)" />
    </mask>
    <rect width="100" height="100" fill="green" mask="url(#m)" />
</svg>
<script>

            document.getElementById("child").setAttribute("width", "100");

                if (window.internals)
                    internals.signalTestIsDone("PASS");

                    document.documentElement.classList.remove("reftest-wait");

        });
