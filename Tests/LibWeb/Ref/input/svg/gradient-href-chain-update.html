<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../../expected/svg/green-square-100-ref.html" />
<svg width="100" height="100">
    <linearGradient id="base">
        <stop id="s" offset="0" stop-color="red" />
    </linearGradient>
    <linearGradient id="g" href="#base" />
    <rect width="100" height="100" fill="url(#g)" />
</svg>
<script>
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.getElementById("s").setAttribute("stop-color", "green");
            requestAnimationFrame(() => {
                if (window.internals)
                    internals.signalTestIsDone("PASS");
                else
                    document.documentElement.classList.remove("reftest-wait");
            });
        });
    });
</script>
</html>
