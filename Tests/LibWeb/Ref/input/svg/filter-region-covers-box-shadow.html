<style>
    body { margin: 0; }
    #box { margin-left: 100px; width: 100px; height: 100px; background: green; box-shadow: -100px 0 green; filter: url(#identity); }
</style>
<svg width="0" height="0" style="position: absolute">
    <filter id="identity" x="0" y="0" width="1" height="1">
        <feOffset dx="0" dy="0" />
    </filter>
</svg>

<div id="box"></div>
