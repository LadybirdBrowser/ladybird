<!DOCTYPE html>
<link rel="match" href="../../expected/svg/filter-region-of-an-inline-box-covers-its-boxes-ref.html" />
<style>
    body { margin: 0; }
    div { padding-left: 150px; }
    #filtered { filter: url(#identity); }
    #moved { display: inline-block; position: relative; left: -100px; width: 50px; height: 50px; background: green; }
</style>
<svg width="0" height="0" style="position: absolute">
    <filter id="identity" x="0" y="0" width="1" height="1">
        <feOffset dx="0" dy="0" />
    </filter>
</svg>
<!-- The inline-block inside the filtered inline box is moved out past its left edge, where the filter region still
     covers it. -->
<div><span id="filtered"><span id="moved"></span></span></div>
