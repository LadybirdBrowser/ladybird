<!DOCTYPE html>
<link rel="match" href="../../expected/visual-context/backdrop-filter-blur-reads-only-border-box-ref.html">
<style>
body {
    margin: 0;
    background: black;
}
.neighbor {
    position: absolute;
    width: 50px;
    height: 40px;
    background: white;
}
.filtered {
    position: absolute;
    left: 100px;
    width: 100px;
    height: 40px;
    backdrop-filter: blur(20px);
}
</style>
<!-- The blur mirrors at the border box and reads nothing outside it, so the white boxes next to each
     filtered box stay out of its black backdrop, on the paths with and without an effects layer, under a
     mask, and where an ancestor clips the box so that the white box above it is inside the box but clipped away. -->
<div class="neighbor" style="left: 50px; top: 20px"></div>
<div class="neighbor" style="left: 200px; top: 20px"></div>
<div class="neighbor" style="left: 50px; top: 100px"></div>
<div class="neighbor" style="left: 200px; top: 100px"></div>
<div class="neighbor" style="left: 50px; top: 180px"></div>
<div class="neighbor" style="left: 200px; top: 180px"></div>
<div class="neighbor" style="left: 50px; top: 260px"></div>
<div class="neighbor" style="left: 200px; top: 260px"></div>
<div class="neighbor" style="left: 50px; top: 340px"></div>
<div class="neighbor" style="left: 200px; top: 340px"></div>
<div class="neighbor" style="left: 100px; top: 420px; width: 100px; height: 20px"></div>
<div class="filtered" style="top: 20px"></div>
<div class="filtered" style="top: 100px; border-radius: 10px"></div>
<div class="filtered" style="top: 180px; opacity: 0.5"></div>
<div class="filtered" style="top: 260px; transform: translateX(1px) scaleX(0.98)"></div>
<div class="filtered" style="top: 340px; mask-image: linear-gradient(black, black)"></div>
<div style="position: absolute; left: 100px; top: 440px; width: 100px; height: 40px; overflow: hidden">
    <div class="filtered" style="left: 0; top: -20px; height: 60px"></div>
</div>
