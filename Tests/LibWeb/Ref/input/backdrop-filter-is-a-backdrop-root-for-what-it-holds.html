<!DOCTYPE html>
<link rel="match" href="../expected/backdrop-filter-is-a-backdrop-root-for-what-it-holds-ref.html">
<style>
    body { margin: 0; background: cyan; }
    div { position: absolute; width: 50px; height: 50px; }
    /* Each outer box reads its backdrop, so what is inside it reads only what the box paints, not the cyan behind it.
       The inner boxes sit beside the outer one, where it paints nothing, so inverting what they read leaves the cyan. */
    .outer { top: 0; background: green; backdrop-filter: invert(0); }
    #opaque-outer { left: 0; }
    #translucent-outer { left: 150px; opacity: 0.99; }
    .inverting { left: 50px; backdrop-filter: invert(1); }
    .blending { top: 60px; left: 0; background: black; mix-blend-mode: difference; }
</style>
<div class="outer" id="opaque-outer"><div class="inverting"></div><div class="blending"></div></div>
<div class="outer" id="translucent-outer"><div class="inverting"></div></div>
