<img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='black' d='M0 0h1v32h-1zM2 0h1v32h-1zM4 0h1v32h-1zM6 0h1v32h-1zM8 0h1v32h-1zM10 0h1v32h-1zM12 0h1v32h-1zM14 0h1v32h-1zM16 0h1v32h-1zM18 0h1v32h-1zM20 0h1v32h-1zM22 0h1v32h-1zM24 0h1v32h-1zM26 0h1v32h-1zM28 0h1v32h-1zM30 0h1v32h-1z'/></svg>">
<div></div>
<script>
    // At a zoom of 4, frames raster the page at 4 times its device pixels. The SVG image and the repeated SVG tiles
    // are rastered at that scale too, so that their stripes stay sharp.
    const animationFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
    window.addEventListener("load", async () => {
        await animationFrame();
        await animationFrame();
        internals.pinchThroughUIProcess(0, 0, 3.0);
        while (window.visualViewport.scale !== 4)
            await animationFrame();
        await animationFrame();
        await animationFrame();
        document.documentElement.classList.remove("reftest-wait");
    });
</script>
</html>
