<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: subgrid item baseline alignment across intrinsic size rows</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#subgrid-item-contribution">
<link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/subgrid/grid-subgridded-to-grid-lanes/baseline/row-grid-lanes-item-baseline-subgrid-005-ref.html">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-rows: 60px minmax(40px, auto) repeat(2, auto);
    font: 16px/1 Ahem;
    border: 1px solid black;
    place-content: start;
    flow-tolerance: 0;
    align-items: baseline;
  }
  .subgrid {
    grid-row: 1 / -1;
    display: grid;
    grid: subgrid / auto;
    grid-auto-flow: column;
    align-items: baseline;
  }
  .b { text-decoration: underline; }
  .big   { font-size: 40px; }
  .med   { font-size: 28px; }
  .small { font-size: 20px; }
  .r1 { grid-row: 1; }
  .r2 { grid-row: 2; }
  .r3 { grid-row: 3; }
  .r4 { grid-row: 4; }
</style>
<div class="grid-lanes">
  <div class="b small r1">X</div>
  <div class="b small r2">X</div>
  <div class="b small r3">X</div>
  <div class="b small r4">X</div>
  <div class="subgrid">
    <div class="b med">X</div>
    <div class="b big">X</div>
    <div class="b med">X</div>
    <div class="b big">X</div>
  </div>
</div>
