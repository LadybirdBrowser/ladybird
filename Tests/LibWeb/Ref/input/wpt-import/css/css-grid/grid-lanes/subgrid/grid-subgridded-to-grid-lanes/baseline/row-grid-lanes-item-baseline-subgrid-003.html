<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: subgrid item baseline alignment in the subgridded row axis in a vertical writing mode</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#subgrid-item-contribution">
<link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/subgrid/grid-subgridded-to-grid-lanes/baseline/row-grid-lanes-item-baseline-subgrid-003-ref.html">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-rows: auto;
    writing-mode: vertical-rl;
    font: 16px/1 Ahem;
    border: 1px solid black;
    align-items: baseline;
    flow-tolerance: 0;
  }
  .subgrid {
    display: grid;
    grid: subgrid / auto;
    align-items: baseline;
    margin-block-start: 15px;
    border-block-start: 9px solid blue;
    padding-block-start: 6px;
  }
  .b { text-decoration: underline; }
  .big   { font-size: 24px; }
  .small { font-size: 20px; }
</style>
<div class="grid-lanes">
  <div class="b big">X</div>
  <div class="subgrid"><div class="b small">X</div></div>
</div>
