<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Grid Lanes Test: align-items: baseline/last baseline with explicit placement</title>
  <link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#masonry-baseline-alignment">
  <link rel="match" href="../../../../../../expected/wpt-import/css/css-grid/grid-lanes/baseline/column-grid-lanes-container-baseline-007b-ref.html">
  <style>
    .container {
      display: flex;
      gap: 20px;
      border: 2px solid blue;
      width: 400px;
      padding: 10px;
      font-size: 16px;
      text-decoration: underline;
    }

    .first-baseline {
      align-items: baseline;
    }

    .last-baseline {
      align-items: last baseline;
    }

    .grid-lanes-explicit {
      display: grid-lanes;
      grid-template-columns: repeat(4, 80px);
      border: 1px solid purple;
    }

    .grid-lanes-explicit .explicit-item1 {
      grid-column: 1 / 3;
      background: lightsteelblue;
      font-size: 12px;
      height: 30px;
    }

    .grid-lanes-explicit .explicit-item2 {
      grid-column: 3 / 5;
      background: lightgoldenrodyellow;
      font-size: 18px;
      height: 30px;
    }

    .grid-lanes-explicit .explicit-item3 {
      grid-column: 1;
      background: lightseagreen;
      font-size: 12px;
      height: 20px;
    }

    .grid-lanes-explicit .explicit-item4 {
      grid-column: 2 / 4;
      background: lightsalmon;
      font-size: 20px;
      height: 35px;
    }

    .grid-lanes-explicit .explicit-item5 {
      grid-column: 4;
      background: lightblue;
      font-size: 14px;
      height: 22px;
    }

    .grid-lanes-explicit .explicit-item6 {
      grid-column: 1 / 5;
      background: lightcyan;
      font-size: 22px;
      height: 40px;
    }
  </style>
</head>
<body>
<div class="container first-baseline">
  <div>Ref</div>
  <div class="grid-lanes-explicit">
    <div class="grid-lanes-item explicit-item1">Item 1</div>
    <div class="grid-lanes-item explicit-item2">Item 2</div>
    <div class="grid-lanes-item explicit-item3">Item 3</div>
    <div class="grid-lanes-item explicit-item4">Item 4</div>
    <div class="grid-lanes-item explicit-item5">Item 5</div>
    <div class="grid-lanes-item explicit-item6">Item 6</div>
  </div>
</div>
<div class="container last-baseline">
  <div>Ref</div>
  <div class="grid-lanes-explicit">
    <div class="grid-lanes-item explicit-item1">Item 1</div>
    <div class="grid-lanes-item explicit-item2">Item 2</div>
    <div class="grid-lanes-item explicit-item3">Item 3</div>
    <div class="grid-lanes-item explicit-item4">Item 4</div>
    <div class="grid-lanes-item explicit-item5">Item 5</div>
    <div class="grid-lanes-item explicit-item6">Item 6</div>
  </div>
</div>
</body>
</html>
