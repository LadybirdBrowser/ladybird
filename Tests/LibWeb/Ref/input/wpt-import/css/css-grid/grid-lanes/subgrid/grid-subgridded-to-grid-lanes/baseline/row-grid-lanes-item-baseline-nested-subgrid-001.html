<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: nested subgrid item baseline alignment in the subgridded row axis</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#subgrid-item-contribution">
<link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/subgrid/grid-subgridded-to-grid-lanes/baseline/row-grid-lanes-item-baseline-nested-subgrid-001-ref.html">
<meta name="assert" content="Items in a subgrid nested inside other subgrids baseline-align in the subgridded row axis without being displaced by unresolved nested-subgrid baselines.">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: repeat(4, 50px);
    font: 16px/1 Ahem;
    border: 1px solid black;
    place-content: start;
    flow-tolerance: 0;
    align-items: baseline;
  }
  .subgrid {
    display: grid;
    grid: subgrid / auto;
    grid-row: 1 / span 3;
    justify-items: baseline;
  }
  .b { text-decoration: underline; }
  .big   { font-size: 40px; }
  .med   { font-size: 28px; }
  .small { font-size: 20px; }
  .r1 { grid-row: 1; }
  .r2 { grid-row: 2; }
  .r3 { grid-row: 3; }
</style>
<div class="grid-lanes">
  <div class="subgrid">
    <div class="subgrid">
      <div class="subgrid">
        <div class="b r1 big">X</div>
        <div class="b r2 small">X</div>
        <div class="b r3 med">X</div>
      </div>
    </div>
  </div>
</div>
