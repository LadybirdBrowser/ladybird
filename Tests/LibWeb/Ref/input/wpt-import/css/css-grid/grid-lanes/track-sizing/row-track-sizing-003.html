<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3">
<link rel="author" title="Alison Maher" href="mailto:almaher@microsoft.com">
<link rel="match" href="../../../../../../expected/wpt-import/css/css-grid/grid-lanes/track-sizing/../../../../../../expected/wpt-import/css/css-grid/grid-lanes/track-sizing/row-track-sizing-003-ref.html">
<style>
.grid-lanes {
    display: grid-lanes;
    grid-template-rows: 1fr 5fr 3fr 1fr;
    width: 100px;
    height: 100px;
}
</style>
<body>
  <p>Test that grid-lanes tracks are correctly sized, and flexible tracks are expanded.</p>
  <div class="grid-lanes">
    <div style="background-color: orange; width: 100px;"></div>
    <div style="background-color: yellow; width: 100px;"></div>
    <div style="background-color: blue; width: 100px;"></div>
    <div style="background-color: purple; width: 100px;"></div>
  </div>
</body>
</html>
