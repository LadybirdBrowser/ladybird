<!DOCTYPE html>
<html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: Explicitly-placed items do not move the auto-placement cursor with fit-tolerance: infinite</title>
<link rel="author" title="Sammy Gill" href="mailto:sammy.gill@apple.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-layout-algorithm">
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/13987">
<link rel="match" href="../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/item-placement/flow-tolerance/column-fit-tolerance-infinite-explicit-placement-ref.html">
<style>
.grid-lanes {
    display: grid-lanes;
    background: gray;
    grid-template-columns: repeat(3, 60px);
    fit-tolerance: infinite;
    gap: 10px;
    padding: 10px;
    width: 200px;
    font: 10px/1 monospace;
}

.item {
    width: 60px;
}
</style>
<body>
  <p>Test that an explicitly-placed item does not advance the auto-placement cursor when
     fit-tolerance is infinite. Item 1 is placed in column 2, so the cursor stays in
     column 1 and items 2, 3 and 4 fill columns 1, 2 and 3 in order.</p>
  <div class="grid-lanes">
    <div class="item" style="grid-column: 2; height: 40px; background: lightskyblue">1</div>
    <div class="item" style="height: 10px; background: lightcoral">2</div>
    <div class="item" style="height: 20px; background: lightgreen">3</div>
    <div class="item" style="height: 30px; background: gold">4</div>
  </div>
</body>
</html>
