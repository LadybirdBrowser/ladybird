<style>
#grid-lanes {
  display: grid-lanes;
  font: 50px/1 Ahem;
  grid-template-rows: auto auto;
  justify-content: start;
  align-content: start;
}
</style>
<p>Ensure `order` property affects grid-lanes layout correctly</p>
<div id="grid-lanes">
  <div id="magenta" style="color: magenta; order: 10;">M</div>
  <div id="lime" style="color: lime; order: 5;">L</div>
  <div id="yellow" style="color: yellow; order: 1;">Y</div>
  <div id="blue" style="color: blue;">B</div>
</div>
