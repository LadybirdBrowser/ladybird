<html><head>
  <meta charset="utf-8">
  <title>CSS Grid Test: Grid Lanes layout with a subgrid (grid-lanes-subgrid-002d)</title>
  <link rel="author" title="Mats Palmgren" href="mailto:mats@mozilla.com">
  <link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
  <link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/subgrid/grid-subgridded-to-grid-lanes/column/grid-lanes-subgrid-002d-ref.html">
<style>
html,body {
  color:black; background-color:white; font:10px/1 monospace; padding:0; margin:0;
}

grid-lanes {
  display: inline grid-lanes;
  grid-template-columns: 40px 30px 20px;
  gap: 4px 2px;
  padding: 1px 3px 5px 7px;
  border: solid;
  border-width: 3px 5px 1px 1px;
  background: lightgrey content-box;
}
item {
  background: grey;
  width: 3ch;
  position: relative;
}
item:nth-child(2n) { background:purple; width:auto; }
item:nth-child(1) {
  border: solid;
  border-width: 3px 5px 1px 1px;
  margin: 7px 1px 5px 3px;
}
subgrid {
  display: grid;
  grid-column: auto/span 3;
  grid: auto / subgrid;
  grid-gap: 6px 8px;
  background: yellow;
}
</style>
</head>
<body>
<!-- auto-placed subgrid inhibits subgridding when parent is doing grid-lanes layout ... -->
<grid-lanes>
  <item>1</item>
  <item>2</item>
  <item>3</item>
  <subgrid>
    <item>4a</item>
    <item>4b</item>
    <item>4c</item>
  </subgrid>
  <item>5</item>
</grid-lanes>
</body>
</html>
