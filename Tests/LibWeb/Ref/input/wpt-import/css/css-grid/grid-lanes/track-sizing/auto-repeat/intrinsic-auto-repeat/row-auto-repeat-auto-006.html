<!DOCTYPE html>
<title>Checks that the min-height is reflected through the aspect-ratio for determining auto repeat tracks with auto size.</title>
<link rel="help" href="https://drafts.csswg.org/css-grid-3">
<link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/track-sizing/auto-repeat/intrinsic-auto-repeat/../row-auto-repeat-003-ref.html">

<style>
.grid-lanes {
    display: inline grid-lanes;
    background: green;
    aspect-ratio: 1/1;
    grid-template-rows: repeat(auto-fill, auto);
    min-height: 60px;
}
</style>
<p>Test passes if there is a filled green square.</p>
<div class="grid-lanes">
    <div style="width: 1px; height: 50px;"></div>
</div>
