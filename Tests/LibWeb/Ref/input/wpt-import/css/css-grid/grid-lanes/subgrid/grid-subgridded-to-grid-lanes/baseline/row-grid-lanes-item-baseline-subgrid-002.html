<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: subgrid item last baseline alignment in the subgridded row axis</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="help" href="https://drafts.csswg.org/css-grid-2/#subgrid-item-contribution">
<link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/subgrid/grid-subgridded-to-grid-lanes/baseline/row-grid-lanes-item-baseline-subgrid-002-ref.html">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid-lanes {
    display: inline grid-lanes;
    grid-template-rows: auto;
    height: 100px;
    font: 16px/1 Ahem;
    border: 1px solid black;
    flow-tolerance: 0;
    align-items: last baseline;
  }
  .subgrid { display: grid; grid: subgrid / auto; grid-auto-flow: column; align-items: last baseline; }
  .b { text-decoration: underline; }
  .big   { font-size: 24px; }
  .med   { font-size: 28px; }
  .small { font-size: 20px; }
  .mbp   { border: 2px solid blue; padding-block-start: 8px; }
</style>
<div class="grid-lanes">
  <div class="b big">X</div>
  <div class="subgrid">
    <div class="b small">X</div>
    <div class="b med">X</div>
    <div class="b small mbp">X</div>
  </div>
</div>
