<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>CSS Grid Test: Verify that fully spanning blocks take presedence over indefinite ones.</title>
    <link rel="author" title="Brandon Stewart" href="mailto:brandonstewart@apple.com">
    <link rel="help" href="https://drafts.csswg.org/css-grid-3/#track-sizing">
    <link rel="match" href="../../../../../../expected/wpt-import/css/css-grid/grid-lanes/track-sizing/../../../../../../expected/wpt-import/css/css-grid/grid-lanes/track-sizing/grid-lanes-track-sizing-span-row-ref.html">
</head>

<body>
<style>
    grid {
        display: grid-lanes;
        grid-template-columns: 50px 1fr;
        width: 300px;
        height: 100px;
    }

    box1 {
        height: 50px;
        width: 50px;
        background-color: blue;
    }

    box2 {
        height: 50px;
        background-color: red;
    }

    box3 {
        width: 100px;
        height: 50px;
        background-color: purple;
        z-index: 1;
    }

    box4 {
        height: 50px;
        width: 300px;
        grid-column: span 2;
        background-color: green;
    }
</style>

<grid>
    <box1>1</box1>
    <box2>2</box2>
    <box4>4</box4>
    <box3>3</box3>
</grid>

</body>
</html>
