<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Grid Lanes Test: baseline alignment across the root grid lanes container and every nested subgrid level in the subgridded row axis</title>
<link rel="author" title="Yanling Wang" href="mailto:yanlingwang@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#subgrids">
<link rel="match" href="../../../../../../../../expected/wpt-import/css/css-grid/grid-lanes/subgrid/grid-subgridded-to-grid-lanes/baseline/row-grid-lanes-item-baseline-nested-subgrid-002-ref.html">
<link rel="stylesheet" type="text/css" href="../../../../../../fonts/ahem.css">
<style>
  html, body { color: black; background: white; padding: 0; margin: 0; }
  .grid-lanes {
    display: grid-lanes;
    grid-template-rows: repeat(4, 50px);
    font: 16px/1 Ahem;
    border: 1px solid black;
    place-content: start;
    flow-tolerance: 0;
    align-items: baseline;
  }
  .subgrid {
    display: grid;
    grid-template-rows: subgrid;
    grid-template-columns: auto auto;
    grid-row: 1 / span 3;
    justify-items: baseline;
  }
  .b { text-decoration: underline; }
  .big   { font-size: 40px; }
  .med   { font-size: 28px; }
  .small { font-size: 20px; }
  .tiny  { font-size: 12px; }
  .r1 { grid-row: 1; }
  .r2 { grid-row: 2; }
  .r3 { grid-row: 3; }
  .c1 { grid-column: 1; }
  .c2 { grid-column: 2; }
</style>
<div class="grid-lanes">
  <div class="b r1 big">X</div>
  <div class="subgrid">
    <div class="b r1 c1 small">X</div>
    <div class="b r3 c1 med">X</div>
    <div class="subgrid c2">
      <div class="b r2 c1 big">X</div>
      <div class="subgrid c2">
        <div class="b r1 c1 med">X</div>
        <div class="b r2 c2 tiny">X</div>
        <div class="b r3 c2 big">X</div>
      </div>
    </div>
  </div>
</div>
