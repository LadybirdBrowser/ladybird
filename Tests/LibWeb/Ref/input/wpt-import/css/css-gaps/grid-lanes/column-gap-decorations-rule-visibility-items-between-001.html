<!DOCTYPE html>
<title>CSS Gap Decorations: rule-visibility-items between with occupied first and third column grid-lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<link rel="match" href="../../../../../expected/wpt-import/css/css-gaps/grid-lanes/column-gap-decorations-rule-visibility-items-between-001-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(3, 60px);
    gap: 20px;
    width: max-content;
    background: #cdd5e0;
    column-rule: 4px solid blue;
    column-rule-break: none;
    column-rule-visibility-items: between;
  }
  .lanes > div {
    height: 60px;
    background: #5b8def;
  }
  .first { grid-column: 1; }
  .third { grid-column: 3; }
</style>
<div class="lanes">
  <div class="first"></div>
  <div class="third"></div>
</div>
