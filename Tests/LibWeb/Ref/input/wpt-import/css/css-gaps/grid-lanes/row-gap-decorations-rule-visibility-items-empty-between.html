<!DOCTYPE html>
<title>CSS Gap Decorations: rule-visibility-items between hides rules in empty row grid lanes</title>
<link rel="author" title="Javier Contreras" href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/#visibility">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#grid-lanes-model">
<link rel="match" href="../../../../../expected/wpt-import/css/css-gaps/grid-lanes/row-gap-decorations-rule-visibility-items-empty-between-ref.html">
<style>
  body { margin: 0; }
  .lanes {
    display: grid-lanes;
    grid-template-rows: repeat(3, 60px);
    grid-lanes-direction: row;
    gap: 20px;
    background: #cdd5e0;
    width: 120px;
    height: 220px;
    column-rule: 4px solid blue;
    row-rule: 4px solid gold;
    rule-break: none;
    rule-visibility-items: between;
  }
</style>
<div class="lanes"></div>
