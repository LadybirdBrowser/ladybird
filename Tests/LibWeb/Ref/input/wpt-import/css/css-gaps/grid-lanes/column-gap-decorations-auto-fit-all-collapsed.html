<!DOCTYPE html>
<title>
  CSS Gap Decorations: no rules paint when all auto-fit tracks collapse in
  grid lanes
</title>
<link rel="author" title="Javier Contreras"
      href="mailto:javiercon@microsoft.com">
<link rel="help" href="https://drafts.csswg.org/css-gaps-1/">
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#repeat-auto-fit">
<link rel="match"
      href="../../../../../expected/wpt-import/css/css-gaps/grid-lanes/column-gap-decorations-auto-fit-all-collapsed-ref.html">
<style>
  body { margin: 0; }
  /* Six auto-fit tracks fit. There are no items, so all six collapse. */
  .lanes {
    display: grid-lanes;
    grid-template-columns: repeat(auto-fit, 50px);
    gap: 10px;
    width: 350px;
    height: 90px;
    background: #cdd5e0;
    column-rule: 4px solid blue;
    row-rule: 4px solid gold;
  }
</style>
<div class="lanes"></div>
