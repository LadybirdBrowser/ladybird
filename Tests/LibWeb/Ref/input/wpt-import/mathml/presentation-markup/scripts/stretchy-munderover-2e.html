<!DOCTYPE html>
<html>
  <head>
    <title>Stretchy munderover</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="match" href="../../../../../expected/wpt-import/mathml/presentation-markup/scripts/stretchy-munderover-2-ref.html"/>
    <link rel="help" href="https://bugzilla.mozilla.org/show_bug.cgi?id=687807"/>
    <link rel="stylesheet" href="../../../fonts/ahem.css" />
    <style>
      @font-face {
        font-family: operators;
        src: url("../../../fonts/math/operators.woff");
      }
      math {
        font: 25px/1 Ahem;
      }
      mo {
        font-family: operators;
      }
    </style>
  </head>
  <body>
    <math>
      <msup>
        <mrow>
          <munderover>
            <mo stretchy="true">&#x2192;</mo>
            <mtext>AAAAAA</mtext>
            <mtext>BBBBBB</mtext>
          </munderover>
        </mrow>
        <mtext>CCCCCC</mtext>
      </msup>
    </math>
  </body>
</html>
