<!DOCTYPE html>
<link rel="match" href="../expected/nested-overflow-clips-in-rotated-element-ref.html" />
<style>
    body {
        margin: 0;
    }
    #rotated {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 100px;
        height: 60px;
        transform: rotate(90deg);
        overflow: hidden;
    }
    #inner {
        margin-top: 10px;
        width: 150px;
        height: 40px;
        overflow: hidden;
    }
    #content {
        width: 300px;
        height: 300px;
        background: green;
    }
</style>
<div id="rotated"><div id="inner"><div id="content"></div></div></div>
