<!DOCTYPE html>
<html class="reftest-wait">
<link rel="match" href="../expected/writing-suggestion-color-change-ref.html">
<style>
    div { font: 20px/1.5 sans-serif; caret-color: transparent; }
</style>
<div id="editable" contenteditable></div>
<script>
    const editable = document.getElementById("editable");
    editable.focus();

    internals.sendText(editable, "I like predi");
    internals.writingSuggestionSettled().then(() => {
        // Restyling the editable while the suggestion shows keeps the suggestion faded.
        editable.offsetWidth;
        editable.style.color = "blue";
        requestAnimationFrame(() => requestAnimationFrame(() => internals.signalTestIsDone("PASS")));
    });
</script>
</html>
