<!DOCTYPE html>
<!-- Building and laying out boxes recurses once per nesting level. 8000 levels overflowed an 8 MiB stack. -->
<body>
<script>
    let deepest = document.body;
    for (let depth = 0; depth < 8000; ++depth)
        deepest = deepest.appendChild(document.createElement("div"));
    deepest.textContent = "leaf";
    document.body.offsetHeight;
</script>
</body>
