<!DOCTYPE html>
<html class="test-wait">
<svg width="100" height="100">
    <clipPath id="c"><circle id="circle" cx="50" cy="50" r="40" /></clipPath>
    <rect id="clipped" width="100" height="100" clip-path="url(#c)" />
</svg>
<script>
    requestAnimationFrame(() => {
        document.getElementById("circle").remove();
        document.getElementById("clipped").getBoundingClientRect();
        document.documentElement.classList.remove("test-wait");
    });
</script>
</html>
