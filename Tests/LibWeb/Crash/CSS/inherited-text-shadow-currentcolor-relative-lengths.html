<!DOCTYPE html>
<style>
    .rem { text-shadow: 0 1rem currentColor; }
    .em { text-shadow: 0 1em currentColor, 1px 1px red; }
    .vw { text-shadow: 0 1vw 2em currentColor; }
    .calc { text-shadow: 0 calc(1px + 1rem) currentColor; }
</style>
<div class="rem"><span>rem</span></div>
<div class="em"><span>em</span></div>
<div class="vw"><span>vw</span></div>
<div class="calc"><span>calc</span></div>
