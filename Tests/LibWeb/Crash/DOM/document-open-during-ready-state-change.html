<!DOCTYPE html>
<html class="test-wait">
<iframe srcdoc=""></iframe>
<script>
    addEventListener("load", () => {
        const frameWindow = document.querySelector("iframe").contentWindow;
        const frameDocument = frameWindow.document;

        frameDocument.open();
        frameDocument.write('<body><svg><use href="#target"/><use href="#target"/></svg><svg id="target"><set attributeName="opacity" to="1"/></svg><script src="data:text/javascript,"><\/script><p></p>');
        frameDocument.close();

        const observer = new frameWindow.MutationObserver(() => {
            observer.disconnect();
            frameDocument.open();
            frameDocument.close();
            setTimeout(() => document.documentElement.classList.remove("test-wait"));
        });
        observer.observe(frameDocument, { childList: true, subtree: true });
    });
</script>
