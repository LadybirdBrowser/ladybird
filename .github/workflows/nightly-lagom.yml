name: Nightly Lagom

on:
  # Automatically run at the end of every day.
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI matrix - runs the job in build-and-test.yml with different configurations.
  Lagom:
    if: github.repository == 'LadybirdBrowser/ladybird'
    name: ${{ matrix.os_name }}, ${{ matrix.arch }}, ${{ matrix.build_preset }}, ${{ matrix.toolchain }}

    strategy:
      fail-fast: false
      matrix:
        os_name: ['Linux']
        arch: ['arm64']
        build_preset: ['Sanitizer']
        toolchain: ['Clang']
        clang_plugins: [false]
        runner_labels: ['["blacksmith-16vcpu-ubuntu-2404-arm"]']
        container: ['{"image":"ghcr.io/ladybirdbrowser/ladybird-ci:2026.10.29","options":"--ulimit core=1"}']

        include:
          - os_name: 'Windows'
            arch: 'x86_64'
            build_preset: 'Sanitizer'
            toolchain: 'ClangCL'
            clang_plugins: false
            runner_labels: '["blacksmith-16vcpu-windows-2025"]'
            container: 'null'

    secrets: inherit
    uses: ./.github/workflows/build-and-test.yml
    with:
      toolchain: ${{ matrix.toolchain }}
      os_name: ${{ matrix.os_name }}
      runner_labels: ${{ matrix.runner_labels }}
      arch: ${{ matrix.arch }}
      build_preset: ${{ matrix.build_preset }}
      clang_plugins: ${{ matrix.clang_plugins }}
      container: ${{ matrix.container }}

  Release:
    if: github.repository == 'LadybirdBrowser/ladybird'
    name: Build Release

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    uses: ./.github/workflows/build-release.yml
