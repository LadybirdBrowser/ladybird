name: Lagom Template

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      os_name:
        required: true
        type: string
      runner_labels:
        required: true
        type: string
      arch:
        required: true
        type: string
      build_preset:
        required: true
        type: string
      clang_plugins:
        required: false
        type: boolean
        default: false
      container:
        required: false
        type: string
        default: 'null'

env:
  # runner.workspace = /home/runner/work/ladybird
  # github.workspace = /home/runner/work/ladybird/ladybird
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg

  # Use the compiler version for the ccache compiler hash. Otherwise, if plugins are enabled, the plugin .so files
  # are included in the hash. This results in clean builds on every run as the .so files are rebuilt.
  #
  # Note: This only works because our plugins do not transform any code. If that becomes untrue, we must revisit this.
  CCACHE_COMPILERCHECK: "%compiler% -v"

jobs:
  CI:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    container: ${{ fromJSON(inputs.container) }}

    steps:
      # Pull requests can trail behind `master` and can cause breakage if merging before running the CI checks on an updated branch.
      # Luckily, GitHub creates and maintains a merge branch that is updated whenever the target or source branch is modified. By
      # checking this branch out, we gain a stabler `master` at the cost of reproducibility.
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Set Up Environment
        uses: ./.github/actions/setup
        id: 'setup'
        with:
          os: ${{ inputs.os_name }}
          arch: ${{ inputs.arch }}
          toolchain: ${{ inputs.toolchain }}

      # === PREPARE FOR BUILDING ===

      - name: Assign Build Parameters
        if: ${{ inputs.os_name != 'Windows' }}
        id: 'build-parameters'
        run: |
          CMAKE_OPTIONS="-DENABLE_CI_BASELINE_CPU=ON"
          if ${{ inputs.os_name == 'Linux' }} ; then
            # FIXME: https://github.com/WebAssembly/wabt/issues/2533
            #        wabt doesn't have binary releases for arm64 Linux
            if ${{ inputs.arch == 'arm64' }} ; then
              PKGCONFIG=$(which pkg-config)
              CMAKE_OPTIONS="$CMAKE_OPTIONS -DPKG_CONFIG_EXECUTABLE=$PKGCONFIG"
            fi

            if ${{ inputs.toolchain == 'Clang' }} ; then
              echo "host_cc=clang" >> "$GITHUB_OUTPUT"
              echo "host_cxx=clang++" >> "$GITHUB_OUTPUT"
            elif ${{ inputs.toolchain == 'GNU' }} ; then
              echo "host_cc=gcc" >> "$GITHUB_OUTPUT"
              echo "host_cxx=g++" >> "$GITHUB_OUTPUT"
            fi
          elif ${{ inputs.os_name == 'macOS' }} ; then
            if ${{ contains(inputs.runner_labels, 'blacksmith') }} ; then
              echo "host_cc=$(xcrun --find clang)" >> "$GITHUB_OUTPUT"
              echo "host_cxx=$(xcrun --find clang++)" >> "$GITHUB_OUTPUT"
            else
              echo "host_cc=$(brew --prefix llvm@21)/bin/clang" >> "$GITHUB_OUTPUT"
              echo "host_cxx=$(brew --prefix llvm@21)/bin/clang++" >> "$GITHUB_OUTPUT"
            fi
          fi

          if ${{ inputs.clang_plugins }} ; then
            echo "ccache_key=${{ inputs.build_preset }}-CLANG_PLUGINS" >> "$GITHUB_OUTPUT"
            CMAKE_OPTIONS="$CMAKE_OPTIONS -DENABLE_CLANG_PLUGINS=ON"
          else
            echo "ccache_key=${{ inputs.build_preset }}" >> "$GITHUB_OUTPUT"
            CMAKE_OPTIONS="$CMAKE_OPTIONS -DINCLUDE_WASM_SPEC_TESTS=ON -DWASM_SPEC_TEST_SKIP_FORMATTING=ON"
          fi

          echo "cmake_options=$CMAKE_OPTIONS" >> "$GITHUB_OUTPUT"

      - name: Restore Caches
        uses: ./.github/actions/cache-restore
        id: 'cache-restore'
        with:
          os: ${{ inputs.os_name }}
          arch: ${{ inputs.arch }}
          toolchain: ${{ inputs.toolchain }}
          cache_key_extra: ${{ inputs.os_name == 'Windows' && inputs.build_preset || steps.build-parameters.outputs.ccache_key }}
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}

      - name: Cache the WebAssembly spec test suite
        if: ${{ inputs.os_name != 'Windows' }}
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/caches/WasmSpecTests
          key: wasm-spec-test-suite | ${{ hashFiles('Meta/CMake/wasm_spec_tests.cmake') }}

      - name: Set dynamic environment variables
        if: ${{ inputs.os_name != 'Windows' }}
        run: |
          # Note: Required for vcpkg to use this compiler for its own builds.
          echo "CC=${{ steps.build-parameters.outputs.host_cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ steps.build-parameters.outputs.host_cxx }}" >> "$GITHUB_ENV"

      - name: Create Build Environment
        if: ${{ inputs.os_name != 'Windows' && inputs.build_preset != 'Fuzzers' }}
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_CACHE_SAS: ${{ github.ref == 'refs/heads/master' && secrets.VCPKG_CACHE_SAS || '' }}
          VCPKG_CACHE_MODE: ${{ github.ref == 'refs/heads/master' && 'write' || '' }}
        run: |
          cmake --preset ${{ inputs.build_preset }} -B Build \
            ${{ steps.build-parameters.outputs.cmake_options }} \
            -DPython3_EXECUTABLE=${{ env.pythonLocation }}/bin/python \
            -DCMAKE_C_COMPILER=${{ steps.build-parameters.outputs.host_cc }} \
            -DCMAKE_CXX_COMPILER=${{ steps.build-parameters.outputs.host_cxx }}

      - name: Create Build Environment (Windows)
        if: ${{ inputs.os_name == 'Windows' }}
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_CACHE_SAS: ${{ github.ref == 'refs/heads/master' && secrets.VCPKG_CACHE_SAS || '' }}
          VCPKG_CACHE_MODE: ${{ github.ref == 'refs/heads/master' && 'write' || '' }}
        run: |
          cmake --preset ${{ inputs.build_preset }} -B Build `
            -DENABLE_CI_BASELINE_CPU=ON

      - name: Create Build Environment (Fuzzers)
        if: ${{ inputs.build_preset == 'Fuzzers' }}
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_CACHE_SAS: ${{ github.ref == 'refs/heads/master' && secrets.VCPKG_CACHE_SAS || '' }}
          VCPKG_CACHE_MODE: ${{ github.ref == 'refs/heads/master' && 'write' || '' }}
        run: |
          cmake --preset ${{ inputs.build_preset }} -B Build \
            ${{ steps.build-parameters.outputs.cmake_options }} \
            -DPython3_EXECUTABLE=${{ env.pythonLocation }}/bin/python \
            -DCMAKE_C_COMPILER=${{ steps.build-parameters.outputs.host_cc }} \
            -DCMAKE_CXX_COMPILER=${{ steps.build-parameters.outputs.host_cxx }}

      # === BUILD ===

      - name: Build
        working-directory: ${{ github.workspace }}/Build
        run: |
          cmake --build .
          cmake --install . --strip --prefix "${GITHUB_WORKSPACE}/Install"

      - name: Check macOS SIP/TCC state
        if: ${{ inputs.os_name == 'macOS' }}
        run: |
          csrutil status || true
          SYSTEM_TCC=/Library/Application\ Support/com.apple.TCC/TCC.db
          if [ -f "$SYSTEM_TCC" ]; then
            sudo ls -l "$SYSTEM_TCC" || true
            echo "--- existing kTCCServiceAccessibility entries ---"
            sudo sqlite3 "$SYSTEM_TCC" \
              "SELECT service, client, client_type, auth_value FROM access WHERE service = 'kTCCServiceAccessibility';" \
              2>&1 || echo "(could not query)"
          else
            echo "(system TCC.db doesn't exist)"
          fi

      - name: Grant Accessibility to Python
        if: ${{ inputs.os_name == 'macOS' }}
        run: |
          if ! csrutil status | grep -qi "disabled"; then
            echo "::warning::SIP is enabled on this runner. Can't write to TCC.db."
            exit 0
          fi
          # Grant Accessibility by writing the system TCC database directly: tccutil is broken here and MDM/PPPC
          # profiles are off-limits, so direct SQL is the only lever. Two things are load-bearing on macOS 26:
          #
          #   1. csreq must be populated. At authorization time tccd matches the requesting process against the
          #      code-requirement blob stored in the row, and a NULL csreq matches nothing, so the grant is inert.
          #      The runner image's own osascript row is csreq=NULL and is inert for the same reason (osascript's
          #      'UI elements enabled' is false). So for each client we compile its designated requirement into a
          #      csreq blob and store it alongside the grant.
          #   2. tccd must be restarted after the write. It caches the database and watches only MDMOverrides.plist,
          #      not TCC.db, so a direct write stays invisible until the daemons are bounced. 'launchctl kickstart -k'
          #      does that reliably; 'killall tccd' does not dependably relaunch the root-owned system instance.
          #
          #   Columns: client_type=1 (path), auth_value=2 (allowed), auth_reason=4, auth_version=1, csreq=<blob>.
          #   The rest default (boot_uuid defaults to 'UNUSED'). INSERT OR REPLACE keeps it idempotent.
          SYSTEM_TCC=/Library/Application\ Support/com.apple.TCC/TCC.db
          REQ_BIN=$(mktemp "${RUNNER_TEMP:-/tmp}/tcc-csreq.XXXXXX")
          # The preflight and run_tests.sh both use the active python3, which is the actions/setup-python one and
          # is where we install PyObjC, so it needs the grant as much as the system interpreters do.
          ACTIVE_PY=$(command -v python3 || true)
          ACTIVE_PY_REAL=$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$ACTIVE_PY" 2>/dev/null || true)
          # TCC attributes an Accessibility request to the responsible process, which for a workflow step is the shell
          # running it, not the interpreter it execs. The runner image grants /bin/bash, but steps here run under
          # Homebrew's bash, so grant whichever shell is actually running.
          ACTIVE_SH=${BASH:-$(command -v bash || true)}
          ACTIVE_SH_REAL=$(/usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$ACTIVE_SH" 2>/dev/null || true)
          # TCC records the client by the path the process was launched from, which for a symlinked Homebrew bash or a
          # PATH-resolved python3 is not the same as its realpath. Grant both forms.
          for client in "$ACTIVE_PY" "$ACTIVE_PY_REAL" "$ACTIVE_SH" "$ACTIVE_SH_REAL" \
                        /bin/bash /usr/bin/python3 /Library/Developer/CommandLineTools/usr/bin/python3; do
            [ -n "$client" ] || continue
            [ -e "$client" ] || continue
            # codesign prints the designated requirement as 'designated => ...', or as a commented
            # '# designated => cdhash H"..."' for ad-hoc-signed binaries (Homebrew's bash, the downloaded Python).
            # Accept both, then compile it to the binary csreq blob that tccd stores and matches against.
            req=$(codesign -d -r- "$client" 2>/dev/null | sed -n 's/^#* *designated => //p')
            if [ -z "$req" ]; then
              echo "=== Skipping $client (no derivable code requirement) ==="
              continue
            fi
            if ! printf '%s' "$req" | /usr/bin/csreq -r- -b "$REQ_BIN"; then
              echo "=== Skipping $client (csreq compile failed) ==="
              continue
            fi
            echo "=== Granting Accessibility to $client ==="
            sudo sqlite3 "$SYSTEM_TCC" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq) VALUES ('kTCCServiceAccessibility', '$client', 1, 2, 4, 1, readfile('$REQ_BIN'));"
          done
          rm -f "$REQ_BIN"
          echo "=== Accessibility entries after grant ==="
          sudo sqlite3 "$SYSTEM_TCC" \
            "SELECT client, auth_value, CASE WHEN csreq IS NULL THEN 'NULL' ELSE 'len=' || length(csreq) END FROM access WHERE service = 'kTCCServiceAccessibility' ORDER BY client;"
          # Bounce both the system and per-user tccd so the next AX request reads these rows fresh (see note above).
          sudo launchctl kickstart -k system/com.apple.tccd.system || true
          launchctl kickstart -k "gui/$(id -u)/com.apple.tccd" || true

      # TEMPORARY DIAGNOSTIC. Every path we can name is granted and AXIsProcessTrusted still says no, so this
      # compares our rows against the ones the runner image provisioned, and probes trust from several identities.
      # Remove once it has told us which of those two things is wrong.
      - name: Diagnose Accessibility trust
        if: ${{ inputs.os_name == 'macOS' }}
        continue-on-error: true
        run: |
          SYSTEM_TCC=/Library/Application\ Support/com.apple.TCC/TCC.db
          echo "### access-table schema"
          sudo sqlite3 "$SYSTEM_TCC" '.schema access' 2>&1 | head -40 || true
          echo
          echo "### our rows vs the image's, with csreq state"
          sudo sqlite3 -header -column "$SYSTEM_TCC" \
            "SELECT client, client_type, auth_value, auth_reason, auth_version,
                    CASE WHEN csreq IS NULL THEN 'NULL' ELSE 'len=' || length(csreq) END AS csreq_state
             FROM access WHERE service = 'kTCCServiceAccessibility' ORDER BY client;" 2>&1 || true
          echo
          echo "### is tccd running?"
          pgrep -l tccd || echo "(tccd not running)"
          echo
          PROBE="from ApplicationServices import AXIsProcessTrusted as t; print('yes' if t() else 'no')"
          PY=$(command -v python3)
          echo "### A. trust under the default step shell ($BASH)"
          "$PY" -c "$PROBE" 2>&1 || true
          echo "### B. trust with /bin/bash as the responsible shell (image-granted)"
          /bin/bash -c "'$PY' -c \"$PROBE\"" 2>&1 || true
          echo "### C. AppleScript UI-elements-enabled via osascript (image-granted)"
          osascript -e 'tell application "System Events" to return UI elements enabled' 2>&1 || true
          echo "### D. same probe under /usr/bin/python3 (system interpreter)"
          /usr/bin/python3 -c "$PROBE" 2>&1 || true

      - name: Verify macOS GUI session + Accessibility (AX preflight)
        if: ${{ inputs.os_name == 'macOS' }}
        run: |
          fail=0
          session=$(launchctl managername 2>/dev/null || echo "unknown")
          echo "launchctl managername : ${session}"
          if [ "${session}" != "Aqua" ]; then
            echo "::error title=AX preflight: no GUI session::The accessibility tests need a GUI (Aqua) login session, but this runner is in the '${session}' session. Fix: Run as a LaunchAgent under an auto-logged-in user (not a root LaunchDaemon), with screen-lock and display-sleep disabled."
            fail=1
          fi
          py=""
          for candidate in python3 /usr/bin/python3 /Library/Developer/CommandLineTools/usr/bin/python3; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" -c "import ApplicationServices" >/dev/null 2>&1; then
              py="${candidate}"
              break
            fi
          done
          if [ -n "${py}" ]; then
            echo "probed interpreter    : ${py}"
            echo "responsible shell     : ${BASH:-unknown}"
            trusted=$("${py}" -c "from ApplicationServices import AXIsProcessTrusted as t; print('yes' if t() else 'no')" 2>/dev/null || echo "error")
            echo "AXIsProcessTrusted    : ${trusted}"
            if [ "${trusted}" != "yes" ]; then
            echo "::error title=AX preflight: no Accessibility access::AXIsProcessTrusted() returned '${trusted}', so every AX read is denied. Fix: Restore the Accessibility grant for Python on this runner."
              fail=1
            fi
          else
            echo "::error title=AX preflight: no PyObjC::No python3 with PyObjC found, so the accessibility tests cannot run on this runner."
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "AX preflight FAILED: this runner isn't set up to run the macOS accessibility tests (see the annotated errors above)."
            exit 1
          fi
          echo "AX preflight OK: GUI (Aqua) session and Accessibility access are both present."

      # This (accessibility tests) step can't be run after the "Build with Qt" step — because we need to run the
      # accessibility tests against the AppKit build, which the "Build with Qt" step overwrites with a Qt build.
      - name: Test - macOS AppKit accessibility
        if: ${{ inputs.os_name == 'macOS' }}
        working-directory: ${{ github.workspace }}
        run: ctest --output-on-failure --no-tests=error --test-dir Build -R AccessibilityBridgeMac --timeout 600
        env:
          ASAN_OPTIONS: 'log_path="${{ github.workspace }}/asan.log"'
          UBSAN_OPTIONS: 'log_path="${{ github.workspace }}/ubsan.log"'

      - name: Build with Qt
        if: ${{ inputs.os_name == 'macOS' && inputs.build_preset == 'Sanitizer' && contains(inputs.runner_labels, 'blacksmith') }}
        working-directory: ${{ github.workspace }}
        run: |
          cmake --preset ${{ inputs.build_preset }} -B Build -DLADYBIRD_GUI_FRAMEWORK=Qt
          cmake --build Build

      - name: Save Caches
        uses: ./.github/actions/cache-save
        with:
          arch: ${{ inputs.arch }}
          ccache_path: ${{ steps.setup.outputs.ccache_path }}
          ccache_primary_key: ${{ steps.cache-restore.outputs.ccache_primary_key }}
          vcpkg_cache_path: ${{ steps.setup.outputs.vcpkg_cache_path }}
          vcpkg_cache_primary_key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

      # === TEST ===

      - name: Start PulseAudio
        if: ${{ inputs.os_name == 'Linux' }}
        run: |
          echo "PULSE_SERVER=unix:/tmp/pulse-native" >> "$GITHUB_ENV"
          pulseaudio --system -D --exit-idle-time=1800 \
            --load="module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulse-native" \
            --load="module-null-sink sink_name=virtual_sink"

      - name: Verify StyleEngine invariants
        if: ${{ inputs.os_name == 'Linux' && (inputs.build_preset == 'Release' || inputs.build_preset == 'Sanitizer') }}
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/Build/Tests/LibWeb/test-web
        run: |
          ../../../bin/test-web --verify-style -j10 \
            -f Text/input/css/style-engine/ \
            -f Text/input/css/style-invalidation/

      - name: Check new tests for flakiness
        if: ${{ github.event_name == 'pull_request' && inputs.build_preset == 'Sanitizer' && (inputs.os_name == 'Linux' || inputs.os_name == 'macOS') && !(inputs.os_name == 'macOS' && !contains(inputs.runner_labels, 'blacksmith')) }}
        timeout-minutes: 30
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin "$(git rev-parse HEAD)"
          "${{ env.pythonLocation }}/bin/python" Meta/check-test-flakiness.py \
            --test-web-binary Build/bin/test-web \
            --base-ref HEAD^1 \
            --deadline-seconds 1200 \
            --python-executable "${{ env.pythonLocation }}/bin/python" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run WPT Smoke Tests
        if: ${{ inputs.os_name == 'Linux' && (inputs.build_preset == 'Release' || inputs.build_preset == 'Sanitizer') }}
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          export ASAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/asan.log\""
          export UBSAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/ubsan.log\""
          Meta/WPT.sh run --test-list Tests/LibWeb/WPT/ci-smoke-tests.txt
        env:
          BUILD_LADYBIRD: 'false'
          LADYBIRD_BINARY: ${{ github.workspace }}/Build/bin/Ladybird
          WEBDRIVER_BINARY: ${{ github.workspace }}/Build/bin/WebDriver
          WPT_PROCESSES: '4'

      - name: Test
        if: ${{ inputs.build_preset == 'Sanitizer' && !(inputs.os_name == 'macOS' && !contains(inputs.runner_labels, 'blacksmith')) }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          export ASAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/asan.log\""
          export UBSAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/ubsan.log\""
          ctest --preset ${{ inputs.build_preset }} --output-on-failure -E 'LibWebAccessibilityBridge|AccessibilityBridgeMac' --test-dir Build --timeout 1800
        env:
          TESTS_ONLY: 1

      - name: Test
        if: ${{ inputs.build_preset != 'Fuzzers' && inputs.build_preset != 'All_Debug' && inputs.build_preset != 'Sanitizer' && !(inputs.os_name == 'macOS' && !contains(inputs.runner_labels, 'blacksmith')) }}
        working-directory: ${{ github.workspace }}
        run: ctest --output-on-failure -E 'LibWebAccessibilityBridge|AccessibilityBridgeMac' --test-dir Build --timeout 1800
        env:
          TESTS_ONLY: 1

      # The AT-SPI2 tests need a Linux build that is neither Sanitizer nor All_Debug:
      # - Sanitizer's ASan-instrumented Qt-on-XCB hits a buffer overflow in libxkbcommon-x11.
      # - All_Debug's ENABLE_ALL_THE_DEBUG_MACROS log volume starves the Qt event loop, so AT-SPI2 registration never
      #   completes within any reasonable wait window.
      # Release builds hit neither problem — so we run these tests on the Release runner.
      - name: Test - LibWeb AT-SPI2 bridge (Release)
        if: ${{ inputs.os_name == 'Linux' && inputs.build_preset == 'Release' }}
        working-directory: ${{ github.workspace }}
        run: ctest --output-on-failure --no-tests=error --test-dir Build -R LibWebAccessibilityBridge --timeout 1800
        env:
          TESTS_ONLY: 1

      - name: Upload LibWeb Test Artifacts
        if: ${{ always() && inputs.build_preset != 'Fuzzers' && inputs.build_preset != 'All_Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: libweb-test-artifacts-${{ inputs.os_name }}-${{ inputs.arch }}-${{ inputs.build_preset }}-${{ inputs.toolchain }}-${{ inputs.clang_plugins }}
          path: |
            Build/Tests/LibWeb/test-web/test-dumps/
            Build/**/asan.log.*
            Build/**/ubsan.log.*
          retention-days: 0
          if-no-files-found: ignore

      - name: Sanitizer Output
        if: ${{ !cancelled() && inputs.os_name != 'Windows' && inputs.build_preset == 'Sanitizer' }}
        working-directory: ${{ github.workspace }}
        run: |
          log_output=$(find Build \( -name 'asan.log.*' -o -name 'ubsan.log.*' \) -exec cat {} \; )
          if [ -z "$log_output" ]; then
            echo "No sanitizer issues found."
          else
            echo "$log_output"
            echo "Sanitizer errors happened while running tests; see the Test step above."
          fi
