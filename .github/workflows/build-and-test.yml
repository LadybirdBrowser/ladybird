name: Build and Test

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      os_name:
        required: true
        type: string
      runner_labels:
        required: true
        type: string
      arch:
        required: true
        type: string
      build_preset:
        required: true
        type: string
      clang_plugins:
        required: false
        type: boolean
        default: false
      container:
        required: false
        type: string
        default: 'null'
    secrets:
      VCPKG_R2_ACCESS_KEY_ID:
        required: false
      VCPKG_R2_SECRET_ACCESS_KEY:
        required: false

jobs:
  CI:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    container: ${{ fromJSON(inputs.container) }}

    steps:
      # Pull requests can trail behind `master` and can cause breakage if merging before running the CI checks on an updated branch.
      # Luckily, GitHub creates and maintains a merge branch that is updated whenever the target or source branch is modified. By
      # checking this branch out, we gain a stabler `master` at the cost of reproducibility.
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name != 'pull_request' }}

      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Prepare vcpkg source asset staging
        id: vcpkg-assets
        if: >-
          ${{ vars.VCPKG_R2_ENDPOINT != '' && github.ref == 'refs/heads/master'
              && (github.event_name == 'push' || github.event_name == 'schedule') }}
        shell: bash
        run: |
          stage_root="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            stage_root=$(cygpath -u "$stage_root")
          fi

          stage=$(mktemp -d "$stage_root/vcpkg-assets.XXXXXX")
          if [[ "$RUNNER_OS" == Windows ]]; then
            stage=$(cygpath -m "$stage")
            uri_path="/$stage"
          else
            uri_path="$stage"
          fi

          printf 'path=%s\nurl=file://%s/\n' "$stage" "$uri_path" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: $/.github/actions/build
        env:
          VCPKG_ASSET_WRITE_URL: ${{ steps.vcpkg-assets.outputs.url }}
        with:
          os: ${{ inputs.os_name }}
          arch: ${{ inputs.arch }}
          toolchain: ${{ inputs.toolchain }}
          build_preset: ${{ inputs.build_preset }}
          clang_plugins: ${{ inputs.clang_plugins }}

      - name: Prepare to publish staged vcpkg source assets
        id: vcpkg-publish
        if: ${{ !cancelled() && steps.vcpkg-assets.outputs.path != '' }}
        shell: bash
        env:
          VCPKG_ASSET_STAGE: ${{ steps.vcpkg-assets.outputs.path }}
        run: |
          assets=("$VCPKG_ASSET_STAGE"/*)
          [[ -f "${assets[0]}" ]] || exit 0

          if [[ "$(aws --version 2>/dev/null)" != aws-cli/2.* ]]; then
            aws_version=2.42.3
            installer_dir=$(mktemp -d)

            download_aws_installer() {
              local filename=$1 expected_sha256=$2
              local checksum_command=(sha256sum)
              if [[ "$RUNNER_OS" == macOS ]]; then
                checksum_command=(shasum -a 256)
              fi

              curl -fsSL --retry 3 "https://awscli.amazonaws.com/$filename" -o "$installer_dir/$filename"
              printf '%s  %s\n' "$expected_sha256" "$installer_dir/$filename" | "${checksum_command[@]}" -c -
            }

            case "$RUNNER_OS" in
              Linux)
                arch=$(uname -m)
                case "$arch" in
                  x86_64) sha256=09a4a71458061ce4e6e8c1ddbeb5d128c219ef7c9906b7b92c3b542944c025c8 ;;
                  aarch64) sha256=7c512283f5293c6fb0832ad648198993185889b22ea8b19bcd04c153dabc8643 ;;
                  *) printf 'Unsupported AWS CLI architecture: %s\n' "$arch" >&2; exit 1 ;;
                esac
                installer="awscli-exe-linux-$arch-$aws_version.zip"
                download_aws_installer "$installer" "$sha256"
                unzip -q "$installer_dir/$installer" -d "$installer_dir"
                "$installer_dir/aws/install" --install-dir "$installer_dir/cli" --bin-dir "$installer_dir/bin"
                printf '%s\n' "$installer_dir/bin" >> "$GITHUB_PATH"
                ;;
              macOS)
                installer="AWSCLIV2-$aws_version.pkg"
                download_aws_installer "$installer" d98091b3a3d170fa7f9e24c5594a9664aff6dbf048cdd588bfe043e27b3ad239
                sudo installer -pkg "$installer_dir/$installer" -target /
                printf '%s\n' /usr/local/bin >> "$GITHUB_PATH"
                ;;
              Windows)
                installer="AWSCLIV2-$aws_version.msi"
                download_aws_installer "$installer" 68a2d5c5581f72cd9d592ed3005c7bff66613a9854e4d1d303411ccf2fd2b4a1
                MSYS2_ARG_CONV_EXCL='*' msiexec.exe /i "$(cygpath -w "$installer_dir/$installer")" /quiet /norestart
                printf '%s\n' "${PROGRAMFILES:-$ProgramFiles}\\Amazon\\AWSCLIV2" >> "$GITHUB_PATH"
                ;;
            esac
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish vcpkg source assets to R2
        if: >-
          ${{ !cancelled() && steps.vcpkg-publish.outputs.ready == 'true'
              && github.ref == 'refs/heads/master'
              && (github.event_name == 'push' || github.event_name == 'schedule') }}
        shell: bash
        env:
          VCPKG_ASSET_STAGE: ${{ steps.vcpkg-assets.outputs.path }}
          R2_ENDPOINT: ${{ vars.VCPKG_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set the VCPKG_R2_ACCESS_KEY_ID secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the VCPKG_R2_SECRET_ACCESS_KEY secret}"

          aws --endpoint-url "$R2_ENDPOINT" s3 cp "$VCPKG_ASSET_STAGE/" \
            s3://ladybird-vcpkg-assets/source-assets/ \
            --recursive --only-show-errors \
            --cache-control 'public, max-age=31536000, immutable'

      # The macOS AX tests run against this bundle on another machine (see macos-accessibility-tests.yml). So the
      # bundle has to be self-contained. To make it self-contained, this script copies the libraries in, Qt included,
      # adds the Qt platform plugin, re-signs the executables with the entitlements the build used, and tars the result.
      - name: Package the macOS app bundle for the accessibility tests
        if: ${{ inputs.os_name == 'macOS' && inputs.build_preset == 'Sanitizer' }}
        working-directory: ${{ github.workspace }}
        run: |
          "${{ env.pythonLocation }}/bin/python" Meta/package-macos-test-bundle.py \
            --build-dir Build --install-dir Install --output ladybird-app-bundle.tar.gz

      - name: Upload the macOS app bundle
        if: ${{ inputs.os_name == 'macOS' && inputs.build_preset == 'Sanitizer' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ladybird-app-bundle-${{ inputs.os_name }}-${{ inputs.arch }}-${{ inputs.build_preset }}
          path: ladybird-app-bundle.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      # === TEST ===

      - name: Start PulseAudio
        if: ${{ inputs.os_name == 'Linux' }}
        run: |
          echo "PULSE_SERVER=unix:/tmp/pulse-native" >> "$GITHUB_ENV"
          pulseaudio --system -D --exit-idle-time=1800 \
            --load="module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulse-native" \
            --load="module-null-sink sink_name=virtual_sink"

      - name: Verify StyleEngine invariants
        if: ${{ inputs.os_name == 'Linux' && (inputs.build_preset == 'Release' || inputs.build_preset == 'Sanitizer') }}
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/Build/Tests/LibWeb/test-web
        run: |
          ../../../bin/test-web --verify-style -j10 \
            -f Text/input/css/style-engine/ \
            -f Text/input/css/style-invalidation/

      - name: Check new tests for flakiness
        if: ${{ github.event_name == 'pull_request' && inputs.build_preset == 'Sanitizer' && (inputs.os_name == 'Linux' || inputs.os_name == 'macOS') }}
        timeout-minutes: 30
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git fetch --no-tags --depth=2 origin "$(git rev-parse HEAD)"
          "${{ env.pythonLocation }}/bin/python" Meta/check-test-flakiness.py \
            --test-web-binary Build/bin/test-web \
            --base-ref HEAD^1 \
            --deadline-seconds 1200 \
            --python-executable "${{ env.pythonLocation }}/bin/python" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Cloning WPT normally takes well under a minute, but now and then a clone stalls. Cut a stalled clone off and
      # start over, in a step of its own, so it can't use up the time the smoke tests have.
      - name: Clone WPT
        if: ${{ inputs.os_name == 'Linux' && (inputs.build_preset == 'Release' || inputs.build_preset == 'Sanitizer') }}
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            rm -rf Tests/LibWeb/WPT/wpt
            if timeout 180 Meta/WPT.sh update; then
              exit 0
            fi
            echo "::warning::Cloning WPT failed or stalled (attempt ${attempt} of 3)"
          done
          exit 1

      - name: Run WPT Smoke Tests
        if: ${{ inputs.os_name == 'Linux' && (inputs.build_preset == 'Release' || inputs.build_preset == 'Sanitizer') }}
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          export ASAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/asan.log\""
          export UBSAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/ubsan.log\""
          Meta/WPT.sh run --test-list Tests/LibWeb/WPT/ci-smoke-tests.txt
        env:
          BUILD_LADYBIRD: 'false'
          LADYBIRD_BINARY: ${{ github.workspace }}/Build/bin/ladybird
          WEBDRIVER_BINARY: ${{ github.workspace }}/Build/bin/ladybird-driver
          WPT_PROCESSES: '4'

      - name: Test
        if: ${{ inputs.build_preset == 'Sanitizer' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          export ASAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/asan.log\""
          export UBSAN_OPTIONS="log_path=\"${GITHUB_WORKSPACE}/Build/ubsan.log\""
          ctest --preset ${{ inputs.build_preset }} --parallel --output-on-failure -E 'LibWebAccessibilityBridge|AccessibilityBridgeMac' --test-dir Build --timeout 1800

      - name: Test
        if: ${{ inputs.build_preset != 'Fuzzers' && inputs.build_preset != 'All_Debug' && inputs.build_preset != 'Sanitizer' }}
        working-directory: ${{ github.workspace }}
        run: ctest --parallel --output-on-failure -E 'LibWebAccessibilityBridge|AccessibilityBridgeMac' --test-dir Build --timeout 1800

      # The AT-SPI2 tests need a Linux build that is neither Sanitizer nor All_Debug:
      # - Sanitizer's ASan-instrumented Qt-on-XCB hits a buffer overflow in libxkbcommon-x11.
      # - All_Debug's ENABLE_ALL_THE_DEBUG_MACROS log volume starves the Qt event loop, so AT-SPI2 registration never
      #   completes within any reasonable wait window.
      # Release builds hit neither problem — so we run these tests on the Release runner.
      - name: Test - LibWeb AT-SPI2 bridge (Release)
        if: ${{ inputs.os_name == 'Linux' && inputs.build_preset == 'Release' }}
        working-directory: ${{ github.workspace }}
        run: ctest --output-on-failure --no-tests=error --test-dir Build -R LibWebAccessibilityBridge --timeout 1800

      - name: Upload LibWeb Test Artifacts
        if: ${{ always() && inputs.build_preset != 'Fuzzers' && inputs.build_preset != 'All_Debug' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: libweb-test-artifacts-${{ inputs.os_name }}-${{ inputs.arch }}-${{ inputs.build_preset }}-${{ inputs.toolchain }}-${{ inputs.clang_plugins }}
          path: |
            Build/Tests/LibWeb/test-web/test-dumps/
            Build/**/asan.log.*
            Build/**/ubsan.log.*
          retention-days: 0
          if-no-files-found: ignore

      - name: Sanitizer Output
        if: ${{ !cancelled() && inputs.build_preset == 'Sanitizer' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          log_output=$(find Build \( -name 'asan.log.*' -o -name 'ubsan.log.*' \) -exec cat {} \; )
          if [ -z "$log_output" ]; then
            echo "No sanitizer issues found."
          else
            echo "$log_output"
            echo "Sanitizer errors happened while running tests; see the Test step above."
          fi
