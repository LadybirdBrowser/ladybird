name: Backport

# Labeling a PR to master with `backport 2026.11` cherry-picks its commits onto release/2026.11 once it is merged, or
# right away if it already is, with `git cherry-pick -x`, and opens a PR against that release branch from a branch named
# `backport/<PR>-to-<release branch>`, titled `[Backport <release branch>] <PR title>`. These PRs are opened by a bot,
# not by whoever added the label, and run CI like any other PR. A cherry-pick that conflicts still gets a PR, as a draft
# with the conflict committed; resolve it on that PR's branch. The original PR gets a comment with the outcome. The
# `no backport` label records that a PR shouldn't be backported, and removing it backports to the PR's backport labels.

on:
  pull_request_target:
    types: [closed, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: >-
      github.repository == 'LadybirdBrowser/ladybird'
      && github.event.pull_request.merged
      && github.event.pull_request.base.ref == 'master'
      && contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
      && (github.event.action == 'closed'
        || (github.event.action == 'labeled'
          && (startsWith(github.event.label.name, 'backport ') || github.event.label.name == 'no backport'))
        || (github.event.action == 'unlabeled' && github.event.label.name == 'no backport'))
    runs-on: blacksmith-2vcpu-ubuntu-2404

    permissions:
      pull-requests: write

    outputs:
      branches: ${{ steps.parse.outputs.branches }}

    steps:
      - name: 'Check who asked, and for which release branches'
        id: parse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          mapfile -t backport_labels < <(jq -r '.[] | select(startswith("backport "))' <<< "$LABELS")
          problems=()
          problem() {
            echo "::error::$*"
            problems+=("$*")
          }

          branches=()
          permission=$(gh api "repos/${REPO}/collaborators/${SENDER}/permission" --jq .permission)
          if jq -e 'index("no backport")' <<< "$LABELS" > /dev/null; then
            listed=$(printf "\`%s\`, " "${backport_labels[@]}")
            problem "This PR is labeled both \`no backport\` and ${listed%, }." \
              "Remove \`no backport\` to backport it, or the backport labels if it shouldn't be backported."
          elif ! [[ "$permission" =~ ^(admin|maintain|write)$ ]]; then
            problem "Backports need write access to this repository, which ${SENDER} doesn't have." \
              "Someone with write access can remove and re-add the backport labels."
          else
            if [ "$ACTION" = labeled ]; then
              # The release branches that the PR was already labeled for got their backports when it was merged.
              backport_labels=("$ADDED_LABEL")
            fi
            for label in "${backport_labels[@]}"; do
              version="${label#backport }"
              if ! [[ "$version" =~ ^[0-9]{4}\.([1-9]|1[0-2])$ ]]; then
                problem "\`${label}\` doesn't name a release, such as \`backport 2026.11\`." \
                  "Replace it with the label of the release to backport to."
                continue
              fi
              branch="release/${version}"
              if ! gh api "repos/${REPO}/branches/${branch}" --silent 2> /dev/null; then
                problem "\`${branch}\` doesn't exist, so there is nothing to backport to for \`${label}\`." \
                  "Remove the label."
                continue
              fi
              head="backport/${PR}-to-${branch}"
              if lookup=$(gh api "repos/${REPO}/branches/${head}" --silent 2>&1); then
                open_prs=$(gh api "repos/${REPO}/pulls?state=open&head=${REPO%%/*}:${head}&base=${branch}" --jq length)
                if [ "$open_prs" -eq 0 ]; then
                  problem "\`${head}\` is left over from a closed backport PR." \
                    "Delete that branch, then remove and re-add \`${label}\`."
                  continue
                fi
              elif [[ "$lookup" != *"(HTTP 404)"* ]]; then
                problem "Couldn't check whether \`${head}\` exists (${lookup})." \
                  "Remove and re-add \`${label}\` to try again."
                continue
              fi
              branches+=("$branch")
            done
          fi

          echo "branches=${branches[*]}" >> "$GITHUB_OUTPUT"
          if [ "${#branches[@]}" -gt 0 ]; then
            echo "Backporting #${PR} to ${branches[*]}, for ${SENDER}." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${#problems[@]}" -gt 0 ]; then
            {
              echo "Some of the backports that this PR's labels ask for can't start:"
              echo
              printf -- '- %s\n' "${problems[@]}"
            } > "${RUNNER_TEMP}/problems.md"
            gh api "repos/${REPO}/issues/${PR}/comments" -F "body=@${RUNNER_TEMP}/problems.md" --silent
            exit 1
          fi

  backport:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.branches != '' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404

    permissions: {}

    steps:
      - name: 'Create a token for the Ladybird Backport app'
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BACKPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}

      - name: 'Checkout ladybird'
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 'Create the backport PRs'
        id: backport
        uses: korthout/backport-action@v4.7.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          label_pattern: ''
          target_branches: ${{ needs.prepare.outputs.branches }}
          branch_name: backport/${pull_number}-to-${target_branch}
          pull_description: 'Backport of #${pull_number} to `${target_branch}`.'
          auto_merge_enabled: true
          auto_merge_method: rebase
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'

      - name: 'Fail if any backport failed'
        if: ${{ steps.backport.outputs.was_successful != 'true' }}
        shell: bash
        env:
          WAS_SUCCESSFUL_BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
        run: |
          failed=$(sed -n 's/=false$//p' <<< "${WAS_SUCCESSFUL_BY_TARGET}" | paste -sd ' ' -)
          echo "::error::Backporting to ${failed} failed. See the comment on the original PR."
          exit 1
