name: Backport

# Commenting `/backport release/2026.11 [release/2026.10 ...]` on a merged PR cherry-picks its commits onto each of
# those release branches with `git cherry-pick -x`, and opens a PR against each of them from a branch named
# `backport/<PR>-to-<release branch>`, titled `[Backport <release branch>] <PR title>`. These PRs are opened by a bot,
# not by the commenter, and run CI like any other PR. A cherry-pick that conflicts still gets a PR, as a draft with the
# conflict committed; resolve it on that PR's branch. The original PR gets a comment with the outcome.

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'LadybirdBrowser/ladybird'
      && github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/backport')
    runs-on: blacksmith-2vcpu-ubuntu-2404

    permissions:
      pull-requests: read

    outputs:
      branches: ${{ steps.parse.outputs.branches }}

    steps:
      - name: 'Check who asked, and for which release branches'
        id: parse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          read -r command arguments <<< "$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')" || true
          if [ "$command" != /backport ]; then
            echo "Not a /backport command."
            exit 0
          fi

          case "$(gh api "repos/${REPO}/collaborators/${COMMENTER}/permission" --jq .permission)" in
            admin|maintain|write) ;;
            *)
              echo "::error::Backports need write access to this repository, which ${COMMENTER} doesn't have."
              exit 1
              ;;
          esac
          if [ "$(gh api "repos/${REPO}/pulls/${PR}" --jq .merged)" != true ]; then
            echo "::error::#${PR} isn't merged, so there is nothing to backport yet."
            exit 1
          fi

          read -r -a requested <<< "${arguments:-}"
          branches=()
          for branch in "${requested[@]}"; do
            branch="release/${branch#release/}"
            if ! [[ "$branch" =~ ^release/[0-9]{4}\.([1-9]|1[0-2])$ ]]; then
              echo "::error::${branch} isn't a release branch, such as release/2026.11."
              exit 1
            fi
            if ! gh api "repos/${REPO}/branches/${branch}" --silent 2> /dev/null; then
              echo "::error::${branch} doesn't exist."
              exit 1
            fi
            head="backport/${PR}-to-${branch}"
            if lookup=$(gh api "repos/${REPO}/branches/${head}" --silent 2>&1); then
              open_prs=$(gh api "repos/${REPO}/pulls?state=open&head=${REPO%%/*}:${head}&base=${branch}" --jq length)
              if [ "$open_prs" -eq 0 ]; then
                echo "::error::${head} is left over from a closed backport PR. Delete it, then comment /backport again."
                exit 1
              fi
            elif [[ "$lookup" != *"(HTTP 404)"* ]]; then
              echo "::error::Couldn't check whether ${head} exists: ${lookup}"
              exit 1
            fi
            branches+=("$branch")
          done
          if [ "${#branches[@]}" -eq 0 ]; then
            echo "::error::Name the release branches to backport to, such as: /backport release/2026.11"
            exit 1
          fi
          echo "branches=${branches[*]}" >> "$GITHUB_OUTPUT"
          echo "Backporting #${PR} to ${branches[*]}, for ${COMMENTER}." >> "$GITHUB_STEP_SUMMARY"

  backport:
    needs: prepare
    if: needs.prepare.outputs.branches != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404

    permissions: {}

    steps:
      - name: 'Create a token for the Ladybird Backport app'
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.BACKPORT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}

      - name: 'Checkout ladybird'
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 'Create the backport PRs'
        id: backport
        uses: korthout/backport-action@v4.7.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          label_pattern: ''
          target_branches: ${{ needs.prepare.outputs.branches }}
          branch_name: backport/${pull_number}-to-${target_branch}
          pull_description: 'Backport of #${pull_number} to `${target_branch}`.'
          auto_merge_enabled: true
          auto_merge_method: rebase
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'

      - name: 'Fail if any backport failed'
        if: ${{ steps.backport.outputs.was_successful != 'true' }}
        shell: bash
        env:
          WAS_SUCCESSFUL_BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
        run: |
          failed=$(sed -n 's/=false$//p' <<< "${WAS_SUCCESSFUL_BY_TARGET}" | paste -sd ' ' -)
          echo "::error::Backporting to ${failed} failed. See the comment on the original PR."
          exit 1
