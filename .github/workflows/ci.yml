name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || format('{0}-{1}', github.ref, github.run_number) }}
  cancel-in-progress: true

jobs:
  Diagnostics:
    if: github.repository == 'LadybirdBrowser/ladybird'
    name: Linux, ${{ matrix.arch }}, diagnostics, ${{ matrix.environment }}
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    container: ${{ fromJSON(matrix.container) }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        arch: ['arm64', 'x86_64']
        environment: ['container', 'host']
        include:
          - arch: 'arm64'
            runner_labels: '["blacksmith-16vcpu-ubuntu-2404-arm"]'
          - arch: 'x86_64'
            runner_labels: '["blacksmith-16vcpu-ubuntu-2404"]'
          - environment: 'container'
            container: '{"image":"ghcr.io/ladybirdbrowser/ladybird-ci:2026.10.16"}'
          - environment: 'host'
            container: 'null'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: System
        run: |
          set +e -x
          uname -a
          nproc
          lscpu || cat /proc/cpuinfo
          free -m
          df -h .
          ulimit -a
          cat /proc/sys/kernel/core_pattern
          cat /proc/sys/kernel/core_pipe_limit
          cat /proc/sys/kernel/core_uses_pid
          cat /proc/sys/fs/suid_dumpable
          cat /sys/kernel/security/lsm || true
          cat /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io || true
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.stat || true

      - name: Core dump handling on the host
        if: matrix.environment == 'host'
        run: |
          set -x
          systemctl status --no-pager systemd-coredump.socket apport.service || true
          cat /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/* || true
          cat /etc/default/apport || true
          ls -la /var/crash /var/lib/systemd/coredump || true

      - name: CPU throughput
        run: |
          python3 - <<'EOF'
          import os, subprocess, sys, time
          work = "sum(i * i for i in range(20_000_000))"
          started_at = time.monotonic()
          subprocess.run([sys.executable, "-c", work], check=True)
          print(f"1 process: {time.monotonic() - started_at:.2f}s")
          started_at = time.monotonic()
          processes = [subprocess.Popen([sys.executable, "-c", work]) for _ in range(os.cpu_count())]
          for process in processes:
              process.wait()
          print(f"{os.cpu_count()} processes at once: {time.monotonic() - started_at:.2f}s")
          EOF

      - name: Time from a crash to the process exit
        run: python3 Meta/ci-crash-exit-diagnostics.py

      - name: Core dump handling on the host after the crashes
        if: matrix.environment == 'host'
        run: |
          set -x
          coredumpctl --no-pager list || true
          journalctl --no-pager -n 50 -u 'systemd-coredump@*' || true
          ls -la /var/crash /var/lib/systemd/coredump || true
