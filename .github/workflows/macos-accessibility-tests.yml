name: macOS accessibility tests

# The macOS AX tests need an unlocked GUI (Aqua) login session, and an Accessibility grant for the process tree the
# runner starts. GH-hosted machines have all that, but take a very long time to build Ladybird. Blacksmith's machines
# boot screen-locked — so don't have all that — but build Ladybird quickly. So, we re-use the Ladybird we already built
# on Blacksmith: packing it with Meta/package-macos-app-bundle.py, and uploading that to a (GH-hosted) screen-unlocked
# machine that doesn't build but instead just runs the tests (which just takes literally 2 minutes or less).
on:
  workflow_call:
    inputs:
      runner_labels:
        description: 'JSON array of the labels selecting the runner, e.g. ["macos-26"]'
        required: true
        type: string
      artifact_name:
        description: 'The artifact holding ladybird-app-bundle.tar.gz, as the build job uploaded it'
        required: true
        type: string

jobs:
  CI:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # The harness and the pip install run pull-request code, so the job's token is read-only and the checkout doesn't
    # leave it behind in .git/config for them to read.
    permissions:
      contents: read
    timeout-minutes: 30
    # The bundle is the Sanitizer build's, so a report from Ladybird or one of its helpers goes to the diagnostics
    # directory, which the last step uploads. The test step creates the directory before anything can write there.
    env:
      ASAN_OPTIONS: log_path=${{ github.workspace }}/ax-diagnostics/asan.log
      UBSAN_OPTIONS: log_path=${{ github.workspace }}/ax-diagnostics/ubsan.log

    steps:
      # The harness, its fixtures and the diagnostic probe come from the checkout; the app comes from the build job.
      # The build jobs check out the moving refs/pull/N/merge ref, for a fresher master under the code they build. This
      # job only needs the harness, so it takes the default checkout: the merge commit the run was created for, which
      # stays put while the build job runs — and still exists once a PR has picked up a conflict, when GH drops the
      # merge ref, and a checkout of it fails.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Every step below that touches the macOS Accessibility API — the session probe, the TCC grant, the preflight, the
      # harness and the diagnostic probe — does it through PyObjC from the python3 on PATH. And no python3 on a hosted
      # runner image ships PyObjC — Apple's /usr/bin/python3 included. actions/setup-python puts its interpreter first
      # on PATH, so this is the one they all find. Quartz is for the session-state probe.
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Install PyObjC
        run: pip3 install pyobjc-framework-ApplicationServices pyobjc-framework-Cocoa pyobjc-framework-Quartz

      - name: Download the packaged app bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/ladybird-app-bundle

      # run_tests.sh and diagnose.py both take the app from LADYBIRD_BINARY.
      - name: Unpack the app bundle
        working-directory: ${{ runner.temp }}/ladybird-app-bundle
        run: |
          tar -xzf ladybird-app-bundle.tar.gz
          echo "LADYBIRD_BINARY=${PWD}/Ladybird.app/Contents/MacOS/Ladybird" >> "$GITHUB_ENV"

      # Try to wake a display and clear the lock UI. And print the session state before and after — so a remedy that
      # doesn't work is visible, rather than inferred. (Blacksmith's macOS runners boot with the session screen-locked
      # and no active displays, which is what breaks the accessibility tests: macOS withholds a window's accessibility
      # representation while the session is locked — so AXFocusedWindow answers with the application element itself and
      # no AXWebArea is reachable under it. The window is real — the window server reports one on-screen — and the
      # engine renders the page fine headlessly. So, the lock is the only thing in the way.)
      - name: Wake the macOS session for the accessibility tests
        continue-on-error: true
        run: |
          py=""
          for candidate in python3 /usr/bin/python3 /Library/Developer/CommandLineTools/usr/bin/python3; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" -c "import Quartz" >/dev/null 2>&1; then
              py="${candidate}"
              break
            fi
          done
          session_state() {
            if [ -z "${py}" ]; then
              echo "  (no python3 with Quartz on this runner; cannot read session state)"
              return 0
            fi
            "${py}" - <<'SESSEOF'
          import re

          from Quartz import CGGetActiveDisplayList
          from Quartz import CGSessionCopyCurrentDictionary

          err, _displays, count = CGGetActiveDisplayList(16, None, None)
          print("  active displays : err=%s count=%s" % (err, count))
          session = CGSessionCopyCurrentDictionary() or {}
          print("  screen locked   : %s" % ("YES" if session.get("CGSSessionScreenIsLocked") else "no"))
          print("  session dict    : %s" % re.sub(r"\s+", " ", repr(dict(session)))[:300])
          SESSEOF
          }

          echo "=== session state BEFORE ==="
          session_state

          # Stop the screen saver arming again mid-job, and keep the display and machine awake for the run.
          defaults -currentHost write com.apple.screensaver idleTime -int 0 || true
          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true

          # Dismiss the lock UI if a screen saver is what put it up. A bare killall with no match exits non-zero,
          # which would abort this step under bash -e, so tolerate that.
          killall ScreenSaverEngine 2>/dev/null || true

          # Assert user activity and keep a display awake for the rest of the job. This wakes a slept display; on its
          # own it won't clear a session lock. That's why it runs alongside the steps above rather than instead of them.
          nohup caffeinate -u -d -i -t 7200 >/dev/null 2>&1 &
          caffeinate -u -t 1 || true

          sleep 3
          echo "=== session state AFTER ==="
          session_state

      # Report the GUI session state before anything depends on it. Accessibility is mediated by WindowServer. So, a
      # runner without one denies every grant — however the TCC database is written. And that's the difference between a
      # runner which can host these tests, and one that can't. This just reports; it doesn't fail: Each probe tolerates
      # a non-match — which matters under "bash -e", where a bare pgrep that finds nothing would abort the step.
      - name: Report macOS GUI session state
        continue-on-error: true
        run: |
          echo "launchctl managername : $(launchctl managername 2>/dev/null || echo unknown)"
          if pgrep -x WindowServer >/dev/null 2>&1; then
            echo "WindowServer          : running"
          else
            echo "WindowServer          : absent"
          fi
          if pgrep -x loginwindow >/dev/null 2>&1; then
            echo "loginwindow           : running"
          else
            echo "loginwindow           : absent"
          fi
          echo "console user          : $(stat -f%Su /dev/console 2>/dev/null || echo unknown)"
          # TCC attributes an Accessibility request to the responsible process — the top-level launcher that owns the
          # process tree, not the process calling the API — so this names the binary a grant must cover.
          /usr/bin/python3 - << 'RESPEOF'
          import ctypes, os, subprocess

          libc = ctypes.CDLL("/usr/lib/libSystem.B.dylib")
          try:
              fn = libc.responsibility_get_pid_responsible_for_pid
              fn.argtypes, fn.restype = [ctypes.c_int], ctypes.c_int
              responsible = fn(os.getpid())
          except AttributeError:
              responsible = -1
          if responsible <= 0:
              print("responsible process   : unavailable")
          else:
              exe = subprocess.run(["ps", "-p", str(responsible), "-o", "comm="],
                                   capture_output=True, text=True).stdout.strip()
              print("responsible process   : {} (pid {})".format(exe or "unknown", responsible))
          RESPEOF

      - name: Check macOS SIP/TCC state
        run: |
          csrutil status || true
          SYSTEM_TCC=/Library/Application\ Support/com.apple.TCC/TCC.db
          if [ -f "$SYSTEM_TCC" ]; then
            sudo ls -l "$SYSTEM_TCC" || true
            echo "--- existing kTCCServiceAccessibility entries ---"
            sudo sqlite3 "$SYSTEM_TCC" \
              "SELECT service, client, client_type, auth_value FROM access WHERE service = 'kTCCServiceAccessibility';" \
              2>&1 || echo "(could not query)"
          else
            echo "(system TCC.db doesn't exist)"
          fi

      # We only do this on non-self-hosted runners, which are fresh VMs. This rewrites the system TCC DB. And that's not
      # something we want to do on a self-hosted machine. A self-hosted machine gets its grant from whoever set it up.
      - name: Grant Accessibility to the responsible process
        if: ${{ !contains(inputs.runner_labels, 'self-hosted') }}
        run: |
          if ! csrutil status | grep -qi "disabled"; then
            echo "::warning::SIP is enabled on this runner. Can't write to TCC.db."
            exit 0
          fi
          # Grant Accessibility by writing the system TCC database directly: tccutil is broken here and MDM/PPPC
          # profiles are off-limits — so direct SQL is the only lever.
          #
          # The client that has to be granted is the *responsible* process — not the process that calls the API. TCC
          # walks up from the requesting process to the top-level launcher owning the tree — and attributes the request
          # to *that* binary. (It's the same rule that makes you grant Accessibility to your terminal app — rather than
          # to each shell script you want to run.) For a workflow step, the responsible process is whatever agent the
          # runner provider used to start the runner. So, it differs between providers — even on a byte-identical image.
          # And granting bash or python3 on its own accomplishes nothing.
          #
          # So, resolve it at run time — instead of hard-coding any provider's agent path. And grant the rest of the
          # ancestry and the interpreters alongside it — so the grant holds however the tree gets attributed.
          #
          # tccd must be restarted afterwards. It caches the database and watches only MDMOverrides.plist, not TCC.db.
          # So, a direct write stays invisible until the daemons are bounced. 'launchctl kickstart -k' does that
          # reliably; 'killall tccd' does not dependably relaunch the root-owned system instance.
          #
          # Columns: client_type=1 (path), auth_value=2 (allowed), auth_reason=4, auth_version=1, csreq=<blob>.
          # The rest default (boot_uuid defaults to 'UNUSED'). INSERT OR REPLACE keeps it idempotent.
          SYSTEM_TCC=/Library/Application\ Support/com.apple.TCC/TCC.db
          CLIENTS=$(mktemp "${RUNNER_TEMP:-/tmp}/tcc-clients.XXXXXX")
          REQ_BIN=$(mktemp "${RUNNER_TEMP:-/tmp}/tcc-csreq.XXXXXX")

          # The responsible process, then every ancestor up to launchd — so the grant covers whichever of them the
          # kernel attributes this tree to.
          /usr/bin/python3 - >> "$CLIENTS" << 'ANCESTRYEOF'
          import ctypes, os, subprocess


          def executable(pid):
              out = subprocess.run(["ps", "-p", str(pid), "-o", "comm="], capture_output=True, text=True)
              return out.stdout.strip()


          def parent(pid):
              out = subprocess.run(["ps", "-p", str(pid), "-o", "ppid="], capture_output=True, text=True)
              text = out.stdout.strip()
              return int(text) if text.isdigit() else 0


          libc = ctypes.CDLL("/usr/lib/libSystem.B.dylib")
          try:
              fn = libc.responsibility_get_pid_responsible_for_pid
              fn.argtypes, fn.restype = [ctypes.c_int], ctypes.c_int
              responsible = fn(os.getpid())
          except AttributeError:
              responsible = -1
          if responsible > 0:
              print(executable(responsible))

          pid = os.getppid()
          while pid > 1:
              print(executable(pid))
              pid = parent(pid)
          ANCESTRYEOF

          # The preflight and run_tests.sh both use the active python3, which is the actions/setup-python one, and is
          # where we install PyObjC. So, it needs the grant as much as the system interpreters do. TCC records a client
          # by the path it was launched from — which for a symlinked Homebrew bash or a PATH-resolved python3 is not the
          # same as its realpath. So, record both forms.
          for client in "$(command -v python3 || true)" "${BASH:-$(command -v bash || true)}" \
                        /bin/bash /usr/bin/python3 /Library/Developer/CommandLineTools/usr/bin/python3; do
            [ -n "$client" ] || continue
            echo "$client" >> "$CLIENTS"
            /usr/bin/python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$client" >> "$CLIENTS" 2>/dev/null || true
          done

          sort -u "$CLIENTS" -o "$CLIENTS"
          # Read the list on fd 3: sudo below would otherwise consume the loop's stdin and cut it short.
          while IFS= read -r client <&3; do
            [ -n "$client" ] || continue
            [ -e "$client" ] || continue
            # codesign prints the designated requirement as 'designated => ...', or as a commented '# designated
            # => cdhash H"..."' for ad-hoc-signed binaries (Homebrew's bash, the downloaded Python). Accept both,
            # then compile it to the binary csreq blob that tccd stores and matches against. A client with no
            # derivable requirement still gets a row, with a NULL csreq, which is what the runner image's own
            # pre-provisioned rows carry.
            req=$(codesign -d -r- "$client" 2>/dev/null | sed -n 's/^#* *designated => //p')
            csreq_sql=NULL
            csreq_note="none"
            if [ -n "$req" ] && printf '%s' "$req" | /usr/bin/csreq -r- -b "$REQ_BIN" 2>/dev/null; then
              csreq_sql="readfile('$REQ_BIN')"
              csreq_note="compiled"
            fi
            echo "=== Granting Accessibility to $client (csreq: $csreq_note) ==="
            sudo sqlite3 "$SYSTEM_TCC" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq) VALUES ('kTCCServiceAccessibility', '$client', 1, 2, 4, 1, $csreq_sql);"
          done 3< "$CLIENTS"
          rm -f "$CLIENTS" "$REQ_BIN"

          echo "=== Accessibility entries after grant ==="
          sudo sqlite3 "$SYSTEM_TCC" \
            "SELECT client, auth_value, CASE WHEN csreq IS NULL THEN 'NULL' ELSE 'len=' || length(csreq) END FROM access WHERE service = 'kTCCServiceAccessibility' ORDER BY client;"
          # Bounce both the system and per-user tccd, so the next AX request reads these rows fresh (see note above).
          sudo launchctl kickstart -k system/com.apple.tccd.system || true
          launchctl kickstart -k "gui/$(id -u)/com.apple.tccd" || true

      - name: Verify macOS GUI session + Accessibility (AX preflight)
        run: |
          fail=0
          session=$(launchctl managername 2>/dev/null || echo "unknown")
          echo "launchctl managername : ${session}"
          if [ "${session}" != "Aqua" ]; then
            echo "::error title=AX preflight: no GUI session::The accessibility tests need a GUI (Aqua) login session, but this runner is in the '${session}' session. Fix: Run as a LaunchAgent under an auto-logged-in user (not a root LaunchDaemon), with screen-lock and display-sleep disabled."
            fail=1
          fi
          # An Aqua session type is not the same as a live GUI. Accessibility is mediated by WindowServer — so a runner
          # without one denies every request, no matter how the TCC DB is written. Report that here — so a failure below
          # says which of the two is missing. Each probe tolerates a non-match: this runs under "bash -e", where a bare
          # pgrep that finds nothing would abort the step.
          if pgrep -x WindowServer >/dev/null 2>&1; then window_server=running; else window_server=absent; fi
          if pgrep -x loginwindow >/dev/null 2>&1; then login_window=running; else login_window=absent; fi
          console_user=$(stat -f%Su /dev/console 2>/dev/null || echo "unknown")
          echo "WindowServer          : ${window_server}"
          echo "loginwindow           : ${login_window}"
          echo "console user          : ${console_user}"
          py=""
          for candidate in python3 /usr/bin/python3 /Library/Developer/CommandLineTools/usr/bin/python3; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" -c "import ApplicationServices" >/dev/null 2>&1; then
              py="${candidate}"
              break
            fi
          done
          if [ -n "${py}" ]; then
            echo "probed interpreter    : ${py}"
            echo "responsible shell     : ${BASH:-unknown}"
            trusted=$("${py}" -c "from ApplicationServices import AXIsProcessTrusted as t; print('yes' if t() else 'no')" 2>/dev/null || echo "error")
            echo "AXIsProcessTrusted    : ${trusted}"
            if [ "${trusted}" != "yes" ]; then
              if [ "${window_server}" != "running" ]; then
                echo "::error title=AX preflight: no WindowServer::AXIsProcessTrusted() returned '${trusted}' and WindowServer is not running, so this runner has no live GUI session. Accessibility grants are inert without one, whatever the TCC database holds, so this is a runner property and not something the workflow can grant its way out of."
              else
                echo "::error title=AX preflight: no Accessibility access::AXIsProcessTrusted() returned '${trusted}' while WindowServer is running, so the TCC grant itself did not take. Fix: Restore the Accessibility grant for Python on this runner."
              fi
              fail=1
            fi
          else
            echo "::error title=AX preflight: no PyObjC::No python3 with PyObjC found, so the accessibility tests cannot run on this runner."
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "AX preflight FAILED: this runner isn't set up to run the macOS accessibility tests (see the annotated errors above)."
            exit 1
          fi
          echo "AX preflight OK: GUI (Aqua) session and Accessibility access are both present."

      # When Ladybird never surfaces a populated AXWebArea, every test-class run waits out its full startup timeout. At
      # the 60s default, that's 20 classes times 60s: 1200s. That's past this step's timeout. And unittest only prints
      # tracebacks in its end-of-run summary. So, the harness's diagnosis (the AX surface dump plus Ladybird's stderr)
      # would be generated but then thrown away. Thus, we cap the per-class wait — so the whole suite stays inside the
      # timeout, and that summary always prints. Once warm, the Sanitizer bundle populates the web area in about 5s, and
      # the warm-up launch in run_tests.sh eats the cold first-launch cost. So, when the tests pass, this costs nothing.
      - name: Test - macOS AppKit accessibility
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ax-diagnostics
          Tests/LibWeb/AccessibilityBridgeMac/run_tests.sh
        env:
          LADYBIRD_AX_STARTUP_TIMEOUT: 20

      # Diagnostic probe for the runner-dependent failure mode of the step above: if Ladybird stays alive but never
      # surfaces a populated AXWebArea, and its stderr stays empty. A healthy Release Ladybird also writes nothing to
      # stderr (NSLog and os_log only reach the unified log). So, the probe collects the evidence saying what the app's
      # actually doing. For details on what it collects, see the Tests/LibWeb/AccessibilityBridgeMac/diagnose.py source.
      - name: Diagnose - macOS AppKit accessibility environment
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          LADYBIRD_AX_DIAG_DIR: ${{ github.workspace }}/ax-diagnostics
          LADYBIRD_AX_DIAG_WAIT: 25
        run: |
          py=""
          for candidate in python3 /usr/bin/python3 /Library/Developer/CommandLineTools/usr/bin/python3; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" -c "import ApplicationServices" >/dev/null 2>&1; then
              py="${candidate}"
              break
            fi
          done
          if [ -z "${py}" ]; then
            echo "no python3 with PyObjC on this runner; skipping the probe"
            exit 0
          fi
          "${py}" Tests/LibWeb/AccessibilityBridgeMac/diagnose.py
          # The probe shuts its own Ladybird down; this catches anything the test step or the probe left behind.
          pkill -9 -f "${RUNNER_TEMP}/ladybird-app-bundle/" 2>/dev/null || true

      # A sanitizer report from any process the two steps above launched is in ax-diagnostics/ (the job's ASAN_OPTIONS
      # and UBSAN_OPTIONS). So, the upload below keeps it. Print it here too — as the build jobs do.
      - name: Sanitizer Output
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          log_output=$(find ax-diagnostics \( -name 'asan.log.*' -o -name 'ubsan.log.*' \) -exec cat {} \; 2>/dev/null)
          if [ -z "$log_output" ]; then
            echo "No sanitizer issues found."
          else
            echo "$log_output"
            echo "Sanitizer errors happened while running the accessibility tests; see the Test step above."
          fi

      - name: Upload macOS AX diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ax-diagnostics-${{ fromJSON(inputs.runner_labels)[0] }}
          path: ax-diagnostics/
          retention-days: 0
          if-no-files-found: ignore
