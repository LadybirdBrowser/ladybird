name: 'Label PRs with merge conflicts'
on:
  # PRs typically get conflicted after a push to the branch they target.
  push:
    branches: [master, 'release/*']

  # If a PR is (re)opened or updated, recheck all PRs for conflicts and update their labels.
  # NOTE: This runs against the target branch, not the PR branch.
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-labeler:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.repository == 'LadybirdBrowser/ladybird'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3
        with:
          commentOnDirty: >
            Your pull request has conflicts that need to be resolved before it can be reviewed and merged. Make sure to
            [rebase](https://www.youtube.com/watch?v=ElRzTuYln0M) your branch onto its target branch.
          dirtyLabel: 'conflicts'
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          retryAfter: 15
          retryMax: 3
