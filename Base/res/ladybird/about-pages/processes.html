<!doctype html>
<html>
    <head>
        <title>Task Manager</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <style>
            @media (prefers-color-scheme: dark) {
                :root {
                    --table-border: gray;
                    --table-row-odd: rgb(57, 57, 57);
                    --table-row-hover: rgb(80, 79, 79);
                }
            }

            @media (prefers-color-scheme: light) {
                :root {
                    --table-border: gray;
                    --table-row-odd: rgb(229, 229, 229);
                    --table-row-hover: rgb(199, 198, 198);
                }
            }

            html {
                color-scheme: light dark;

                font-family: Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 10pt;
            }

            header {
                display: flex;
                align-items: center;

                margin-bottom: 20px;
            }

            header img {
                width: 48px;
                height: 48px;
                margin-right: 10px;
            }

            header h1 {
                font-size: 20px;
                margin: 0;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }

            th#name {
                width: 55%;
            }

            th {
                text-align: left;
                border-bottom: 1px solid var(--table-border);
            }

            th:hover {
                background-color: var(--table-row-hover);
                cursor: pointer;
            }

            th.sorted-ascending:after {
                content: " ▲";
            }

            th.sorted-descending:after {
                content: " ▼";
            }

            td,
            th {
                padding: 4px;
                border: 1px solid var(--table-border);
            }

            tbody tr:nth-of-type(2n + 1) {
                background-color: var(--table-row-odd);
            }

            tbody tr:hover {
                background-color: var(--table-row-hover);
            }

            td.process-name {
                --process-depth: 0;
                padding-left: calc(4px + var(--process-depth) * 20px);
            }
        </style>
    </head>
    <body>
        <header>
            <picture>
                <source srcset="resource://icons/128x128/app-browser.png" media="(prefers-color-scheme: dark)" />
                <img src="resource://icons/128x128/app-browser-dark.png" />
            </picture>
            <h1>Ladybird Processes</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th id="name">Name</th>
                    <th id="pid">PID</th>
                    <th id="cpu">CPU</th>
                    <th id="memory">Memory</th>
                </tr>
            </thead>
            <tbody id="process-table"></tbody>
        </table>
        <script type="module">
            import { getByteFormatter } from "resource://ladybird/utils.js";
            const memoryFormatter = getByteFormatter(() => {
                return {
                    unitDisplay: "narrow",
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2,
                };
            });
            const cpuFormatter = new Intl.NumberFormat([], {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            });

            const Direction = Object.freeze({
                ascending: 1,
                descending: 2,
            });

            window.processes = [];
            window.sortDirection = Direction.ascending;
            window.sortKey = "pid";

            const renderSortedProcesses = () => {
                document.querySelectorAll("th").forEach(header => {
                    header.classList.remove("sorted-ascending");
                    header.classList.remove("sorted-descending");
                });

                if (window.sortDirection === Direction.ascending) {
                    document.getElementById(window.sortKey).classList.add("sorted-ascending");
                } else {
                    document.getElementById(window.sortKey).classList.add("sorted-descending");
                }

                const multiplier = window.sortDirection === Direction.ascending ? 1 : -1;

                const compareProcesses = (lhs, rhs) => {
                    const lhsValue = lhs[window.sortKey];
                    const rhsValue = rhs[window.sortKey];

                    if (typeof lhsValue === "string") {
                        return multiplier * lhsValue.localeCompare(rhsValue);
                    }

                    return multiplier * (lhsValue - rhsValue);
                };

                const processesByPID = new Map();
                window.processes.forEach(process => {
                    processesByPID.set(process.pid, process);
                });

                const childProcessesByEmbedderPID = new Map();
                const rootProcesses = [];
                window.processes.forEach(process => {
                    if (process.embedderPID !== undefined && processesByPID.has(process.embedderPID)) {
                        let childProcesses = childProcessesByEmbedderPID.get(process.embedderPID);
                        if (!childProcesses) {
                            childProcesses = [];
                            childProcessesByEmbedderPID.set(process.embedderPID, childProcesses);
                        }
                        childProcesses.push(process);
                    } else {
                        rootProcesses.push(process);
                    }
                });

                const sortedProcesses = [];
                const appendProcess = (process, depth) => {
                    sortedProcesses.push({ process, depth });

                    const childProcesses = childProcessesByEmbedderPID.get(process.pid);
                    if (!childProcesses) {
                        return;
                    }

                    childProcesses.sort(compareProcesses);
                    childProcesses.forEach(childProcess => {
                        appendProcess(childProcess, depth + 1);
                    });
                };

                rootProcesses.sort(compareProcesses);
                rootProcesses.forEach(process => {
                    appendProcess(process, 0);
                });

                const table = document.getElementById("process-table");
                const rowsByPID = new Map();
                Array.from(table.rows).forEach(row => {
                    rowsByPID.set(Number(row.dataset.pid), row);
                });

                const updateColumn = (column, value) => {
                    if (column.textContent !== value) {
                        column.textContent = value;
                    }
                };

                const sortedRows = sortedProcesses.map(({ process, depth }) => {
                    let row = rowsByPID.get(process.pid);
                    if (row) {
                        rowsByPID.delete(process.pid);
                    } else {
                        row = table.insertRow();
                        row.dataset.pid = process.pid;

                        const nameColumn = row.insertCell();
                        nameColumn.className = "process-name";
                        row.insertCell();
                        row.insertCell();
                        row.insertCell();
                    }

                    const nameColumn = row.cells[0];
                    updateColumn(nameColumn, process.name);
                    if (nameColumn.style.getPropertyValue("--process-depth") !== `${depth}`) {
                        nameColumn.style.setProperty("--process-depth", depth);
                    }
                    updateColumn(row.cells[1], `${process.pid}`);
                    updateColumn(row.cells[2], cpuFormatter.format(process.cpu));
                    updateColumn(row.cells[3], memoryFormatter.formatBytes(process.memory));

                    return row;
                });

                rowsByPID.forEach(row => row.remove());

                sortedRows.forEach((row, index) => {
                    if (table.rows[index] !== row) {
                        table.insertBefore(row, table.rows.item(index));
                    }
                });
            };

            const loadProcessStatistics = processes => {
                window.processes = processes;
                renderSortedProcesses();
            };

            document.addEventListener("WebUILoaded", () => {
                document.querySelectorAll("th").forEach(header => {
                    header.addEventListener("click", () => {
                        window.sortDirection = header.classList.contains("sorted-descending")
                            ? Direction.ascending
                            : Direction.descending;
                        window.sortKey = header.getAttribute("id");

                        renderSortedProcesses();
                    });
                });

                setInterval(() => {
                    ladybird.sendMessage("updateProcessStatistics");
                }, 1000);

                ladybird.sendMessage("updateProcessStatistics");
            });

            document.addEventListener("WebUIMessage", event => {
                if (event.detail.name === "loadProcessStatistics") {
                    loadProcessStatistics(event.detail.data);
                }
            });
        </script>
    </body>
</html>
