<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Welcome</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <link rel="stylesheet" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" href="resource://ladybird/about-pages/welcome.css" />
        <script type="module" src="resource://ladybird/about-pages/welcome.js"></script>
    </head>
    <body>
        <form id="welcome-form">
            <header>
                <svg
                    class="logomark"
                    viewBox="-11 -9.2 22 18.4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.55"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path
                        d="M0 0 L1.39 1.68 L2.76 3.29 L4.07 4.76 L5.30 6.02 L6.43 7.02 L7.43 7.70 L8.29 8.06 L8.99 8.06 L9.51 7.70 L9.85 7.02 L9.99 6.02 L9.95 4.76 L9.70 3.29 L9.27 1.68 L8.66 0 L7.88 -1.68 L6.95 -3.29 L5.88 -4.76 L4.69 -6.02 L3.42 -7.02 L2.08 -7.70 L0.70 -8.06 L-0.70 -8.06 L-2.08 -7.70 L-3.42 -7.02 L-4.69 -6.02 L-5.88 -4.76 L-6.95 -3.29 L-7.88 -1.68 L-8.66 0 L-9.27 1.68 L-9.70 3.29 L-9.95 4.76 L-9.99 6.02 L-9.85 7.02 L-9.51 7.70 L-8.99 8.06 L-8.29 8.06 L-7.43 7.70 L-6.43 7.02 L-5.30 6.02 L-4.07 4.76 L-2.76 3.29 L-1.39 1.68 L0 0 L1.39 -1.68 L2.76 -3.29 L4.07 -4.76 L5.30 -6.02 L6.43 -7.02 L7.43 -7.70 L8.29 -8.06 L8.99 -8.06 L9.51 -7.70 L9.85 -7.02 L9.99 -6.02 L9.95 -4.76 L9.70 -3.29 L9.27 -1.68 L8.66 0 L7.88 1.68 L6.95 3.29 L5.88 4.76 L4.69 6.02 L3.42 7.02 L2.08 7.70 L0.70 8.06 L-0.70 8.06 L-2.08 7.70 L-3.42 7.02 L-4.69 6.02 L-5.88 4.76 L-6.95 3.29 L-7.88 1.68 L-8.66 0 L-9.27 -1.68 L-9.70 -3.29 L-9.95 -4.76 L-9.99 -6.02 L-9.85 -7.02 L-9.51 -7.70 L-8.99 -8.06 L-8.29 -8.06 L-7.43 -7.70 L-6.43 -7.02 L-5.30 -6.02 L-4.07 -4.76 L-2.76 -3.29 L-1.39 -1.68 Z"
                    />
                </svg>
                <h1>Welcome to Ladybird</h1>
                <p class="muted">You can change any of this later in Settings.</p>
            </header>
            <fieldset id="setup-options" disabled>
                <section aria-labelledby="search-engine-title">
                    <div class="section-heading">
                        <h2 id="search-engine-title">Search engine</h2>
                        <p class="muted small">Optional</p>
                    </div>
                    <div
                        id="search-engines"
                        class="search-engines"
                        role="radiogroup"
                        aria-labelledby="search-engine-title"
                    ></div>
                    <div id="search-suggestions" class="switch-card hidden">
                        <div>
                            <span id="search-suggestions-title">Show search suggestions</span>
                            <p id="search-suggestions-description" class="muted small"></p>
                        </div>
                        <input
                            id="search-suggestions-enabled"
                            type="checkbox"
                            switch
                            aria-labelledby="search-suggestions-title"
                            aria-describedby="search-suggestions-description"
                        />
                    </div>
                </section>
                <section id="tab-mode-section" aria-labelledby="tab-mode-title">
                    <h2 id="tab-mode-title">Tabs</h2>
                    <div class="tab-options" role="radiogroup" aria-labelledby="tab-mode-title">
                        <label class="tab-option">
                            <input type="radio" name="tab-mode" value="horizontal" checked />
                            <span class="tab-preview horizontal-preview" aria-hidden="true">
                                <span class="preview-strip"><i class="active"></i><i></i><i></i></span>
                                <span class="preview-toolbar"><i></i></span>
                            </span>
                            <span class="tab-option-label">Along the top</span>
                        </label>
                        <label id="vertical-tab-option" class="tab-option">
                            <input type="radio" name="tab-mode" value="vertical" />
                            <span class="tab-preview vertical-preview" aria-hidden="true">
                                <span class="preview-sidebar"><i></i><i class="active"></i><i></i></span>
                                <span class="preview-main"
                                    ><span class="preview-toolbar"><i></i></span
                                ></span>
                            </span>
                            <span class="tab-option-label">Down the side</span>
                        </label>
                    </div>
                </section>
                <section class="switch-card" aria-labelledby="ad-blocking-title">
                    <div>
                        <h2 id="ad-blocking-title">Block ads, trackers and more</h2>
                        <p class="muted small">
                            Pages load faster. If a site breaks, turn it off for that site from the address bar.
                        </p>
                    </div>
                    <input id="enable-content-blocking" type="checkbox" switch aria-labelledby="ad-blocking-title" />
                </section>
            </fieldset>
            <footer>
                <p id="save-status" class="muted small" role="status"></p>
                <button id="start-browsing" class="primary-button" type="submit" disabled>Start browsing</button>
            </footer>
        </form>
    </body>
</html>
