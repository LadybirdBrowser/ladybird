minimum_pre_commit_version: 3.2.0
repos:
  - repo: local
    hooks:
      - id: meta-lint-ci
        name: Running Meta/lint-ci.sh to ensure changes will pass linting on CI
        entry: bash Meta/lint-ci.sh
        stages: [ pre-commit ]
        language: system
        # The Rust lints build into one shared directory, so concurrent runs over batches of the files collide.
        require_serial: true

      - id: meta-lint-commit
        name: Lint commit message to ensure it will pass the commit linting on CI
        entry: Meta/lint-commit.sh
        stages: [ commit-msg ]
        language: system
