[package]
name = "libwebview_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
allocator = ["dep:ladybird_allocator"]

# After changing dependencies, regenerate the Flatpak sources:
#   python3 Meta/CMake/flatpak/generate-cargo-sources.py
[dependencies]
ak = { path = "../../../AK/Rust" }
ladybird_allocator = { path = "../../RustAllocator", optional = true }
libcrypto_rust = { path = "../../LibCrypto/Rust" }
rustc-demangle = "0.1"

[dev-dependencies]
libcrypto_rust = { path = "../../LibCrypto/Rust", features = ["link-openssl"] }

[build-dependencies]
cbindgen = "0.29"

[lints]
workspace = true
