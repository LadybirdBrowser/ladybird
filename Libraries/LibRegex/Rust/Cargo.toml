[package]
name = "libregex_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

# After changing dependencies, regenerate the Flatpak sources:
#   python3 Meta/CMake/flatpak/generate-cargo-sources.py
[dependencies]
libunicode_rust = { path = "../../LibUnicode/Rust", default-features = false }

[features]
default = []
allocator = []

# `cargo test` links a plain Rust binary with no LibUnicode C++ behind it, so the
# unicode_* FFI callbacks the engine calls have to come from somewhere.
[dev-dependencies]
libunicode_rust = { path = "../../LibUnicode/Rust", default-features = false, features = ["ffi-stubs"] }

[build-dependencies]
cbindgen = "0.29"
