language = "C++"
header = """/*
 * Copyright (c) 2026-present, the Ladybird developers.
 *
 * SPDX-License-Identifier: BSD-2-Clause
 */"""
pragma_once = true
include_version = true
namespaces = ["IPC", "FFI"]
line_length = 120
tab_width = 4
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
includes = ["AK/Span.h", "LibIPC/RawAttachment.h"]
usize_is_size_t = true

[parse]
parse_deps = false

[export.mangle]
rename_types = "PascalCase"

# NB: The header has the interface of every platform's transport, each behind what the compiler defines for it.
[defines]
"target_vendor = apple" = "__APPLE__"
