[package]
name = "libcompositing_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
allocator = ["dep:ladybird_allocator"]

[dependencies]
ak = { path = "../../../AK/Rust" }
foldhash = "0.2"
ladybird_allocator = { path = "../../RustAllocator", optional = true }
libgfx_rust = { path = "../../LibGfx/Rust", default-features = false }
libipc_rust = { path = "../../LibIPC/Rust" }
rustc-demangle = "0.1"

[build-dependencies]
cbindgen = "0.29"

[lints]
workspace = true
