[package]
name = "liburl_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
encoding_rs = "0.8.40"
ladybird_allocator = { path = "../../RustAllocator", optional = true }
libregex_rust = { path = "../../LibRegex/Rust" }
libunicode_rust = { path = "../../LibUnicode/Rust", features = ["idna"] }

[features]
default = []
allocator = ["dep:ladybird_allocator"]
debug-validation-errors = []

[build-dependencies]
cbindgen = "0.29"
