[package]
name = "libtextcodec_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[features]
allocator = ["dep:ladybird_allocator"]

[dependencies]
encoding_rs = "0.8.40"
ladybird_allocator = { path = "../../RustAllocator", optional = true }

[build-dependencies]
cbindgen = "0.29"

[lints]
workspace = true
