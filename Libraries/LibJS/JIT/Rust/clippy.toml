# The compiler keeps its data in zones (see ak::Zone), so that all the memory of a compile can go back to the system.
# A container of the heap would leave blocks behind in the heap of the process.
disallowed-types = [
    { path = "std::vec::Vec", reason = "the compiler makes no block in the heap: use ak::ZoneVec, or a slice in a zone" },
    { path = "std::collections::VecDeque", reason = "the compiler makes no block in the heap: use ak::ZoneVec" },
    { path = "std::collections::BinaryHeap", reason = "the compiler makes no block in the heap: use ak::ZoneVec" },
    { path = "std::collections::LinkedList", reason = "the compiler makes no block in the heap: use ak::ZoneVec" },
    { path = "std::collections::HashMap", reason = "the compiler makes no block in the heap: use crate::zone_map::ZoneMap" },
    { path = "std::collections::HashSet", reason = "the compiler makes no block in the heap: use crate::zone_map::ZoneSet" },
    { path = "std::collections::BTreeMap", reason = "the compiler makes no block in the heap: use crate::zone_map::ZoneMap, or a sorted ak::ZoneVec" },
    { path = "std::collections::BTreeSet", reason = "the compiler makes no block in the heap: use crate::zone_map::ZoneSet, or a sorted ak::ZoneVec" },
    { path = "std::boxed::Box", reason = "the compiler makes no block in the heap: use Zone::alloc" },
    { path = "std::rc::Rc", reason = "the compiler makes no block in the heap: share a reference into a zone" },
    { path = "std::sync::Arc", reason = "the compiler makes no block in the heap: share a reference into a zone" },
    { path = "libjs_jit::inline_vec::InlineVec", reason = "the compiler makes no block in the heap: use ak::ZoneVec" },
    { path = "libjs_jit::fast_hash::HashMap", reason = "the compiler makes no block in the heap: use crate::zone_map::ZoneMap" },
    { path = "libjs_jit::fast_hash::HashSet", reason = "the compiler makes no block in the heap: use crate::zone_map::ZoneSet" },
]
disallowed-macros = [
    { path = "std::vec", reason = "the compiler makes no block in the heap: use a slice, or ak::ZoneVec" },
]
