[package]
name = "libjs_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["cpp-runtime"]
allocator = ["dep:ladybird_allocator"]
# The extern "C" entry points, FFI and bytecode cache through which the C++ LibJS runtime embeds the frontend.
cpp-runtime = ["dep:cbindgen"]

# After changing dependencies, regenerate the Flatpak sources:
#   python3 Meta/CMake/flatpak/generate-cargo-sources.py
[dependencies]
ak = { path = "../../../AK/Rust" }
libjs_abi = { path = "../ABI" }
libunicode_rust = { path = "../../LibUnicode/Rust", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
indexmap = "2"
foldhash = "0.1"
ladybird_allocator = { path = "../../RustAllocator", optional = true }
rustc-demangle = "0.1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "intel", "std"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
farm64 = { package = "fARM64", version = "0.0.2", features = ["alloc"] }

[build-dependencies]
cbindgen = { version = "0.29", optional = true }
flapc = { path = "../Flap" }

[lints]
workspace = true
