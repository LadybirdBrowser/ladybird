[package]
name = "libjs_runtime_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

# This crate is its own workspace so that it costs nothing when ENABLE_LIBJS_RUST_RUNTIME is off, and so that
# libjs_rust can be built here without the features LibJS enables.
[workspace]

[features]
default = []
allocator = ["dep:ladybird_allocator"]
address-sanitizer = []
thread-sanitizer = []

[dependencies]
ak = { path = "../../../../AK/Rust" }
ladybird_allocator = { path = "../../../RustAllocator", optional = true }
libjs_abi = { path = "../../ABI" }
rustc-demangle = "0.1"

[build-dependencies]
cc = "1"
flapc = { path = "../../Flap" }
libjs_abi = { path = "../../ABI" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints]
workspace = true

[workspace.lints.clippy]
all = "deny" # includes lintgroups: correctness, suspicious, style, complexity, perf
# from clippy:nursery:
redundant_clone = "deny"
# from clippy:pedantic:
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
manual_let_else = "deny"
unnecessary_wraps = "deny"
manual_assert = "deny"
ref_option = "deny"
elidable_lifetime_names = "deny"
unnested_or_patterns = "deny"
borrow_as_ptr = "deny"
explicit_iter_loop = "deny"
