[package]
name = "libgfx_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
allocator = ["dep:ladybird_allocator"]
# Links HarfBuzz, for binaries that do not get it from the libraries that link this crate, such as unit tests.
link-harfbuzz = []

[dependencies]
ak = { path = "../../../AK/Rust" }
foldhash = "0.2"
hashbrown = { version = "0.17.1", default-features = false }
libcompress_rust = { path = "../../LibCompress/Rust" }
libipc_rust = { path = "../../LibIPC/Rust" }
ladybird_allocator = { path = "../../RustAllocator", optional = true }
png = "0.18"
rustc-demangle = "0.1"
yuv = "0.8.20"

[build-dependencies]
cbindgen = "0.29"
