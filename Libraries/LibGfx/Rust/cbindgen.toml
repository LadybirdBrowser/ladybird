language = "C++"
header = """/*
 * Copyright (c) 2026-present, the Ladybird developers.
 *
 * SPDX-License-Identifier: BSD-2-Clause
 */"""
pragma_once = true
include_version = true
line_length = 120
tab_width = 4
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true
namespaces = ["Gfx", "FFI"]

# The byte layout the filter codec writes is defined by these enums, and the C++ reader that
# builds Skia filters from it decodes them from the same definitions. The OpenType MATH table
# structs are filled in by LibGfx for its Rust callers. The HarfBuzz structs are the crate's
# copies of HarfBuzz's own, which LibGfx checks against the HarfBuzz headers. The C++ shaping
# that the Rust shaping replaced reads the text layout types until it goes.
[export]
include = [
    "TextType",
    "JoiningContext",
    "FilterOperationType",
    "ChannelSelector",
    "TurbulenceType",
    "PathVerb",
    "FfiMathData",
    "FfiGlyphMetrics",
    "FfiMathGlyphVariant",
    "FfiMathGlyphPart",
    "HbGlyphInfo",
    "HbGlyphPosition",
    "HbFeature",
]

[parse]
parse_deps = false

[parse.expand]
all_features = false

[export.mangle]
rename_types = "PascalCase"
