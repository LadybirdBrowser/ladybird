[package]
name = "ladybird_webrtc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "webrtc-test"
path = "src/bin/webrtc-test.rs"
required-features = ["test-tools"]

[dependencies]
webrtc = "0.17.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
cpal = { version = "0.15", optional = true }
audiopus = { version = "0.2", optional = true }
bytes = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libipc_rust = { path = "../../LibIPC/Rust" }

[features]
default = []
# Local playback and a sine source for webrtc-test, which the WebRTCClient helper must not link.
test-tools = ["dep:cpal", "dep:audiopus"]

[lints]
workspace = true
