language = "C++"
header = """/*
 * Copyright (c) 2026-present, the Ladybird developers.
 *
 * SPDX-License-Identifier: BSD-2-Clause
 */"""
pragma_once = true
include_version = true
namespaces = ["XML", "FFI"]
line_length  = 120
tab_width = 4
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
usize_is_size_t = true

[parse]
parse_deps = false

[parse.expand]
all_features = false

[export]
# The crate's constants are its own business: the interface is what ffi.rs declares.
item_types = ["enums", "structs", "typedefs", "opaque", "functions"]
# No function takes or returns these, so they have to be asked for.
include = [
    "XmlRowKind",
    "XmlRowKindBits",
    "XmlAttributeFlag",
    "XmlValueFlag",
    "XPathKind",
    "XPathAxis",
    "XPathNodeTest",
    "XPathFunction",
]

[export.rename]
"Step" = "XPathStep"

[export.mangle]
rename_types = "PascalCase"
