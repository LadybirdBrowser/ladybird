language = "C++"
header = """/*
 * Copyright (c) 2026-present, the Ladybird developers.
 *
 * SPDX-License-Identifier: BSD-2-Clause
 */"""
pragma_once = true
include_version = true
namespaces = ["Web", "ContentBlocking", "FFI"]
line_length  = 120
tab_width = 4
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
includes = ["AK/Span.h"]
usize_is_size_t = true

[parse]
parse_deps = false

[parse.expand]
all_features = false

[export]
include = ["ContentBlockerString"]
# Opaque to C++, which names it by a void pointer (see below).
exclude = ["ContentBlockerEngine"]

[export.rename]
# An engine is opaque to C++, which holds it by pointer.
"ContentBlockerEngine" = "void"
"Span" = "AK::ReadonlySpan"

[export.mangle]
rename_types = "PascalCase"
