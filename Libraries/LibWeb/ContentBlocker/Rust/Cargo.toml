[package]
name = "libweb_content_blocker_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

# After changing dependencies, regenerate the Flatpak sources:
#   python3 Meta/CMake/flatpak/generate-cargo-sources.py
[dependencies]
adblock = "0.12.5"
ladybird_allocator = { path = "../../../RustAllocator", optional = true }
rustc-demangle = "0.1"
serde_json = "1.0"

[features]
default = []
allocator = ["dep:ladybird_allocator"]

[build-dependencies]
cbindgen = "0.29"

[lints]
workspace = true
