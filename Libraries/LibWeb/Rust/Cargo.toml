[package]
name = "libweb_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
allocator = ["dep:ladybird_allocator"]
thread-sanitizer = []

# After changing dependencies, regenerate the Flatpak sources:
#   python3 Meta/CMake/flatpak/generate-cargo-sources.py
[dependencies]
ak = { path = "../../../AK/Rust" }
chardetng = "1.0.0"
foldhash = "0.2"
hashbrown = "0.17.1"
ladybird_allocator = { path = "../../RustAllocator", optional = true }
libcompositing_rust = { path = "../../LibCompositing/Rust" }
libgfx_rust = { path = "../../LibGfx/Rust", default-features = false }
libipc_rust = { path = "../../LibIPC/Rust" }
liburl_rust = { path = "../../LibURL/Rust", default-features = false }
libweb_html_tokenizer = { path = "../HTML/Parser/Rust" }
rustc-demangle = "0.1"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
smallvec = { version = "1.16.3", features = ["const_generics"] }

[build-dependencies]
cbindgen = "0.29"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
